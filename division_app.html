<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わりざん れんしゅう</title>
<style>
  :root {
    --bg: #fff8e7;
    --primary: #ff8a3d;
    --primary-dark: #e96f1f;
    --accent: #5ec8e5;
    --accent-dark: #2da4c4;
    --text: #4a3520;
    --panel: #ffffff;
    --shadow: 0 4px 0 rgba(0,0,0,0.08);
    --error: #e94e4e;
    --ok: #4caf50;
    --muted: #b8a89a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: var(--primary-dark);
    font-size: 2rem;
    margin: 10px 0 16px;
  }
  h2 {
    text-align: center;
    color: var(--primary-dark);
    font-size: 1.2rem;
    margin: 18px 0 10px;
  }
  .container { max-width: 560px; margin: 0 auto; }

  .panel {
    background: #fff;
    border-radius: 24px;
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  .choice-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .choice {
    flex: 1;
    min-width: 90px;
    padding: 16px 10px;
    font-size: 1.1rem;
    font-weight: bold;
    border: 3px solid #eee;
    border-radius: 16px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    transition: all .15s;
  }
  .choice.selected {
    border-color: var(--primary);
    background: #fff4e8;
    color: var(--primary-dark);
  }
  .choice:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .start-btn {
    width: 100%;
    margin-top: 18px;
    padding: 18px;
    font-size: 1.3rem;
    font-weight: bold;
    border: none;
    border-radius: 16px;
    background: var(--ok);
    color: white;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .start-btn:disabled { background: #ccc; cursor: not-allowed; }
  .back-btn {
    background: none;
    border: none;
    color: var(--accent-dark);
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    padding: 4px 8px;
    margin-bottom: 10px;
  }

  .stats {
    display: flex;
    justify-content: space-around;
    font-size: 0.95rem;
    margin-bottom: 12px;
    color: #888;
  }
  .stats b { color: var(--primary-dark); font-size: 1.25rem; }

  /* ===== 暗算 ===== */
  .anzan-formula {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 2.2rem;
    font-weight: bold;
    margin: 18px 0;
    flex-wrap: wrap;
  }
  .anzan-input {
    min-width: 70px;
    padding: 6px 12px;
    background: #fff8e7;
    border: 4px solid #ddd;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    color: var(--primary-dark);
  }
  .anzan-input.active {
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255,138,61,0.25);
  }
  .anzan-input.empty::after { content:"?"; color:#ccc; }
  .anzan-input.remainder { color: var(--accent-dark); }
  .anzan-input.remainder.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(94,200,229,0.25);
  }
  .op { color: #888; }

  .result {
    text-align: center;
    font-size: 1.4rem;
    min-height: 1.8rem;
    margin: 8px 0 12px;
    font-weight: bold;
  }
  .result.ok { color: var(--ok); }
  .result.error { color: var(--error); font-size: 1.1rem; }
  .result.info { color: #888; font-size: 1.05rem; }

  /* ===== 筆算 ===== */
  .hissan-wrap {
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    background: #fffbf0;
    border-radius: 16px;
    border: 2px dashed #d8c8b0;
    overflow-x: auto;
  }
  .hissan-grid {
    display: grid;
    font-family: "Courier New", monospace;
    font-size: 1.6rem;
    font-weight: bold;
  }
  .hcell {
    width: 42px; height: 50px;
    display: flex; align-items: center; justify-content: center;
  }
  .hcell.editable {
    background: #fff;
    border: 2px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
    margin: 2px;
    width: 38px; height: 46px;
  }
  .hcell.editable.active {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(255,138,61,0.3);
  }
  .hcell.editable.quotient { color: var(--primary-dark); }
  .hcell.editable.remainder { color: var(--accent-dark); }
  .hcell.fixed { color: var(--text); }
  .hcell.divisor { font-size: 1.6rem; padding-right: 4px; }
  .hcell.bracket { font-size: 2rem; }
  .hline {
    height: 4px;
    background: var(--text);
    align-self: center;
    margin: 4px 2px;
    border-radius: 2px;
  }

  /* ===== キーパッド ===== */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 16px;
  }
  .key {
    padding: 18px 0;
    font-size: 1.5rem;
    font-weight: bold;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: white;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .key:active { transform: translateY(2px); box-shadow: none; }
  .key.fn { background: var(--primary); }
  .key.del { background: var(--muted); }
  .key.cross { background: #9c6cd8; }
  .key.calc {
    grid-column: span 3;
    background: var(--ok);
    font-size: 1.3rem;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .actions button {
    flex: 1;
    padding: 14px;
    font-size: 1rem;
    font-weight: bold;
    border: none;
    border-radius: 14px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow);
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: #888;
    margin-top: 8px;
  }
  .legend .dot {
    display: inline-block;
    width: 10px; height: 10px; border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  .hint { text-align:center; color:#888; font-size:.9rem; margin-top:8px; }
  .problem-info {
    text-align: center;
    color: var(--accent-dark);
    font-size: 0.95rem;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🐰 わりざん れんしゅう 🥕</h1>

  <!-- ========= 設定画面 ========= -->
  <div id="setup-panel" class="panel">
    <h2>① モードを えらぼう</h2>
    <div class="choice-row" id="setup-mode">
      <button class="choice" data-mode="anzan">あんざん</button>
      <button class="choice" data-mode="hissan">ひっさん</button>
    </div>

    <h2>② わる数 の けたすう</h2>
    <div class="choice-row" id="setup-divdigits">
      <button class="choice" data-d="1">1けた</button>
      <button class="choice" data-d="2">2けた</button>
    </div>

    <h2>③ わられる数 の けたすう</h2>
    <div class="choice-row" id="setup-dvddigits">
      <button class="choice" data-d="1">1けた</button>
      <button class="choice" data-d="2">2けた</button>
      <button class="choice" data-d="3">3けた</button>
      <button class="choice" data-d="4">4けた</button>
    </div>

    <button class="start-btn" id="start-btn" disabled>はじめる！</button>
  </div>

  <!-- ========= 暗算 ========= -->
  <div id="anzan-panel" class="panel" style="display:none">
    <button class="back-btn" data-back>← もどる</button>
    <div class="problem-info" id="a-info"></div>
    <div class="stats">
      <span>もんだい <b id="a-total">0</b></span>
      <span>せいかい <b id="a-correct">0</b></span>
      <span>れんぞく <b id="a-streak">0</b></span>
    </div>

    <div class="anzan-formula">
      <span id="a-dvd"></span>
      <span class="op">÷</span>
      <span id="a-dvr"></span>
      <span class="op">=</span>
      <span class="anzan-input" id="a-ans"></span>
      <span class="op">あまり</span>
      <span class="anzan-input remainder" id="a-rem"></span>
    </div>

    <div class="result" id="a-result"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--primary)"></span>こたえ</span>
      <span><span class="dot" style="background:var(--accent)"></span>あまり</span>
    </div>

    <div class="keypad">
      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key del" data-action="del">←</button>
      <button class="key" data-num="0">0</button>
      <button class="key fn" data-action="skip">パス</button>
      <button class="key calc" data-action="check">こたえあわせ</button>
    </div>
  </div>

  <!-- ========= 筆算 ========= -->
  <div id="hissan-panel" class="panel" style="display:none">
    <button class="back-btn" data-back>← もどる</button>
    <div class="problem-info" id="h-info"></div>
    <div class="hissan-wrap">
      <div id="hissan-grid" class="hissan-grid"></div>
    </div>

    <div class="result" id="h-result"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--primary)"></span>しょう</span>
      <span><span class="dot" style="background:var(--accent)"></span>あまり</span>
      <span><span class="dot" style="background:#9c6cd8"></span>×=たてられない</span>
    </div>

    <div class="keypad">
      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key del" data-action="hdel">←</button>
      <button class="key" data-num="0">0</button>
      <button class="key cross" data-action="hcross">×</button>
      <button class="key calc" data-action="hcheck">こたえあわせ</button>
    </div>

    <div class="actions">
      <button id="h-new">あたらしい もんだい</button>
      <button id="h-show">こたえを みる</button>
    </div>
    <div class="hint">マスをタップして 数字を入れてね</div>
  </div>
</div>

<script>
// ======================================================
// 共通
// ======================================================
const settings = { mode: null, divDigits: null, dvdDigits: null };

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function show(id) {
  ['setup-panel','anzan-panel','hissan-panel'].forEach(p => {
    document.getElementById(p).style.display = (p === id) ? 'block' : 'none';
  });
}

// ======================================================
// 設定画面
// ======================================================
function updateSetupValidity() {
  // わる数の桁 <= わられる数の桁 が必要
  const div = settings.divDigits;
  document.querySelectorAll('#setup-dvddigits .choice').forEach(b => {
    const d = parseInt(b.dataset.d, 10);
    b.disabled = (div != null && d < div);
    if (b.disabled && b.classList.contains('selected')) {
      b.classList.remove('selected');
      settings.dvdDigits = null;
    }
  });
  document.getElementById('start-btn').disabled =
    !(settings.mode && settings.divDigits && settings.dvdDigits);
}

function bindChoiceGroup(groupId, attr, key) {
  document.querySelectorAll(`#${groupId} .choice`).forEach(btn => {
    btn.onclick = () => {
      if (btn.disabled) return;
      document.querySelectorAll(`#${groupId} .choice`).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      settings[key] = isNaN(parseInt(btn.dataset[attr], 10))
        ? btn.dataset[attr]
        : parseInt(btn.dataset[attr], 10);
      updateSetupValidity();
    };
  });
}
bindChoiceGroup('setup-mode', 'mode', 'mode');
bindChoiceGroup('setup-divdigits', 'd', 'divDigits');
bindChoiceGroup('setup-dvddigits', 'd', 'dvdDigits');

document.getElementById('start-btn').onclick = () => {
  if (settings.mode === 'anzan') {
    show('anzan-panel');
    anzan.total = 0; anzan.correct = 0; anzan.streak = 0;
    newAnzanProblem();
  } else {
    show('hissan-panel');
    newHissanProblem();
  }
};

document.querySelectorAll('[data-back]').forEach(b => {
  b.onclick = () => show('setup-panel');
});

// ======================================================
// 問題生成（共通）
// ======================================================
function genProblem(dvdDigits, divDigits) {
  // dvd has exactly dvdDigits, divisor has exactly divDigits,
  // 商の桁数 = dvdDigits - divDigits + 1 となる (先頭ゼロなし)
  for (let attempt = 0; attempt < 200; attempt++) {
    const dMin = divDigits === 1 ? 2 : 10 ** (divDigits - 1);
    const dMax = 10 ** divDigits - 1;
    const D = randInt(dMin, dMax);
    const dvdMin = 10 ** (dvdDigits - 1) || 1;
    const dvdMax = 10 ** dvdDigits - 1;
    const dvd = randInt(dvdMin, dvdMax);
    if (dvd < D) continue;
    const Q = Math.floor(dvd / D);
    const wantQDigits = dvdDigits - divDigits + 1;
    if (String(Q).length !== wantQDigits) continue;
    return { dvd, divisor: D };
  }
  return { dvd: 12, divisor: 3 };
}

// ======================================================
// 暗算モード
// ======================================================
const anzan = {
  dividend: 0, divisor: 0,
  correctAns: 0, correctRem: 0,
  userAns: '', userRem: '',
  target: 'ans',
  total: 0, correct: 0, streak: 0,
};

function newAnzanProblem() {
  const { dvd, divisor } = genProblem(settings.dvdDigits, settings.divDigits);
  anzan.dividend = dvd;
  anzan.divisor = divisor;
  anzan.correctAns = Math.floor(dvd / divisor);
  anzan.correctRem = dvd % divisor;
  anzan.userAns = '';
  anzan.userRem = '';
  anzan.target = 'ans';
  document.getElementById('a-result').textContent = '';
  document.getElementById('a-result').className = 'result';
  document.getElementById('a-info').textContent =
    `わる数 ${settings.divDigits}けた ÷ わられる数 ${settings.dvdDigits}けた`;
  renderAnzan();
}

function renderAnzan() {
  document.getElementById('a-dvd').textContent = anzan.dividend;
  document.getElementById('a-dvr').textContent = anzan.divisor;
  const ans = document.getElementById('a-ans');
  const rem = document.getElementById('a-rem');
  ans.textContent = anzan.userAns;
  rem.textContent = anzan.userRem;
  ans.classList.toggle('empty', !anzan.userAns);
  rem.classList.toggle('empty', !anzan.userRem);
  ans.classList.toggle('active', anzan.target === 'ans');
  rem.classList.toggle('active', anzan.target === 'rem');
  document.getElementById('a-total').textContent = anzan.total;
  document.getElementById('a-correct').textContent = anzan.correct;
  document.getElementById('a-streak').textContent = anzan.streak;
}

document.getElementById('a-ans').onclick = () => { anzan.target='ans'; renderAnzan(); };
document.getElementById('a-rem').onclick = () => { anzan.target='rem'; renderAnzan(); };

document.querySelectorAll('#anzan-panel .key').forEach(key => {
  key.onclick = () => {
    const num = key.dataset.num;
    const action = key.dataset.action;
    if (num !== undefined) {
      const f = anzan.target === 'ans' ? 'userAns' : 'userRem';
      if (anzan[f].length < 4) anzan[f] += num;
    } else if (action === 'del') {
      const f = anzan.target === 'ans' ? 'userAns' : 'userRem';
      anzan[f] = anzan[f].slice(0, -1);
    } else if (action === 'skip') {
      anzan.streak = 0;
      const r = document.getElementById('a-result');
      r.className = 'result info';
      r.textContent = `こたえ: ${anzan.correctAns} あまり ${anzan.correctRem}`;
      setTimeout(newAnzanProblem, 1500);
      return;
    } else if (action === 'check') {
      checkAnzan();
      return;
    }
    renderAnzan();
  };
});

function checkAnzan() {
  if (anzan.userAns === '' || anzan.userRem === '') {
    const r = document.getElementById('a-result');
    r.className = 'result error';
    r.textContent = '🐰 こたえと あまりを いれてね（あまりが ないときは 0）';
    return;
  }
  const ua = parseInt(anzan.userAns, 10);
  const ur = parseInt(anzan.userRem, 10);
  anzan.total++;
  const r = document.getElementById('a-result');
  if (ua === anzan.correctAns && ur === anzan.correctRem) {
    anzan.correct++;
    anzan.streak++;
    r.className = 'result ok';
    const msgs = ['🎉 せいかい！','✨ すごい！','🌟 やったね！','👏 ばっちり！'];
    r.textContent = msgs[Math.floor(Math.random()*msgs.length)];
    setTimeout(newAnzanProblem, 1000);
  } else {
    anzan.streak = 0;
    r.className = 'result error';
    r.textContent = `🤔 おしい！ こたえは ${anzan.correctAns} あまり ${anzan.correctRem} だよ`;
    setTimeout(newAnzanProblem, 2200);
  }
  renderAnzan();
}

// ======================================================
// 筆算モード
// ======================================================
const hissan = {
  dividend: 0, divisor: 0, divDigits: 1,
  steps: [],
  userQuotient: [],   // 各ステップ毎の文字 ('0'-'9' or '×')
  userSub: [],        // 各ステップごとの文字列
  userDiff: [],
  target: null,       // {type:'q'|'sub'|'diff', step, pos}
};

function computeSteps(dvd, D) {
  const dvdStr = String(dvd);
  const N = dvdStr.length;
  const L = String(D).length;
  const totalSteps = N - L + 1;
  const steps = [];
  let current = parseInt(dvdStr.slice(0, L), 10);
  for (let k = 0; k < totalSteps; k++) {
    const colEnd = k + L - 1;
    const qd = Math.floor(current / D);
    const sub = qd * D;
    const diff = current - sub;
    let nextVal, diffColEnd;
    if (k < totalSteps - 1) {
      nextVal = diff * 10 + parseInt(dvdStr[colEnd + 1], 10);
      diffColEnd = colEnd + 1;
    } else {
      nextVal = diff;
      diffColEnd = colEnd;
    }
    steps.push({
      qDigit: String(qd),
      qCol: colEnd,
      subStr: String(sub),
      subColEnd: colEnd,
      diffStr: String(nextVal),
      diffColEnd,
      skip: qd === 0,    // 商が立たない (×)
    });
    if (k < totalSteps - 1) current = nextVal;
  }
  return steps;
}

function newHissanProblem() {
  const { dvd, divisor } = genProblem(settings.dvdDigits, settings.divDigits);
  hissan.dividend = dvd;
  hissan.divisor = divisor;
  hissan.divDigits = String(divisor).length;
  hissan.steps = computeSteps(dvd, divisor);
  hissan.userQuotient = hissan.steps.map(() => '');
  hissan.userSub = hissan.steps.map(() => '');
  hissan.userDiff = hissan.steps.map(() => '');
  hissan.target = { type:'q', step:0, pos:0 };
  document.getElementById('h-result').textContent = '';
  document.getElementById('h-result').className = 'result';
  document.getElementById('h-info').textContent =
    `わる数 ${settings.divDigits}けた ÷ わられる数 ${settings.dvdDigits}けた`;
  renderHissan();
}

function renderHissan() {
  const dvdStr = String(hissan.dividend);
  const N = dvdStr.length;
  const L = hissan.divDigits;
  const grid = document.getElementById('hissan-grid');
  grid.innerHTML = '';

  // 列: [divisor (幅: divDigits*28px)] [")" 24px] [digit×N (42px)]
  const divCol = L * 28 + 8;
  grid.style.gridTemplateColumns = `${divCol}px 24px repeat(${N}, 42px)`;

  function cell(col, row, content, opts = {}) {
    const c = document.createElement('div');
    c.className = 'hcell';
    if (opts.cls) opts.cls.split(' ').forEach(x => x && c.classList.add(x));
    c.style.gridColumn = col + 1;
    c.style.gridRow = row;
    c.textContent = content;
    if (opts.onclick) c.onclick = opts.onclick;
    grid.appendChild(c);
    return c;
  }

  let row = 1;

  // 商の行
  hissan.steps.forEach((step, k) => {
    const ch = hissan.userQuotient[k] || '';
    const isAct = hissan.target && hissan.target.type === 'q' && hissan.target.step === k;
    cell(2 + step.qCol, row, ch, {
      cls: 'editable quotient' + (isAct ? ' active' : ''),
      onclick: () => { hissan.target = { type:'q', step:k, pos:0 }; renderHissan(); }
    });
  });
  row++;

  // わる数 ) わられる数
  cell(0, row, String(hissan.divisor), { cls: 'fixed divisor' });
  cell(1, row, ')', { cls: 'fixed bracket' });
  for (let i = 0; i < N; i++) {
    cell(2 + i, row, dvdStr[i], { cls: 'fixed' });
  }
  row++;

  // 各ステップ
  hissan.steps.forEach((step, k) => {
    if (step.skip) return; // 商が立たないステップは sub/diff を描画しない

    const subLen = step.subStr.length;
    const subStart = 2 + step.subColEnd - subLen + 1;
    for (let j = 0; j < subLen; j++) {
      const ch = (hissan.userSub[k] || '')[j] || '';
      const isAct = hissan.target && hissan.target.type === 'sub'
                    && hissan.target.step === k && hissan.target.pos === j;
      cell(subStart + j, row, ch, {
        cls: 'editable' + (isAct ? ' active' : ''),
        onclick: () => { hissan.target = { type:'sub', step:k, pos:j }; renderHissan(); }
      });
    }
    row++;

    // 横線
    const line = document.createElement('div');
    line.className = 'hline';
    line.style.gridColumn = `${subStart} / ${2 + step.subColEnd + 2}`;
    line.style.gridRow = row;
    grid.appendChild(line);
    row++;

    // 差/おろした数
    const diffLen = step.diffStr.length;
    const diffStart = 2 + step.diffColEnd - diffLen + 1;
    const isLast = (k === hissan.steps.length - 1);
    for (let j = 0; j < diffLen; j++) {
      const ch = (hissan.userDiff[k] || '')[j] || '';
      const isAct = hissan.target && hissan.target.type === 'diff'
                    && hissan.target.step === k && hissan.target.pos === j;
      cell(diffStart + j, row, ch, {
        cls: 'editable' + (isLast ? ' remainder' : '') + (isAct ? ' active' : ''),
        onclick: () => { hissan.target = { type:'diff', step:k, pos:j }; renderHissan(); }
      });
    }
    row++;
  });
}

function setHissanCell(value) {
  const t = hissan.target;
  if (!t) return;
  if (t.type === 'q') {
    hissan.userQuotient[t.step] = value;
    if (t.step < hissan.userQuotient.length - 1) {
      hissan.target = { type:'q', step: t.step + 1, pos: 0 };
    }
  } else {
    if (value === '×') return; // ×は商以外には入れない
    const key = t.type === 'sub' ? 'userSub' : 'userDiff';
    const len = (t.type === 'sub'
                 ? hissan.steps[t.step].subStr.length
                 : hissan.steps[t.step].diffStr.length);
    const arr = (hissan[key][t.step] || '').split('');
    while (arr.length < len) arr.push('');
    arr[t.pos] = value;
    hissan[key][t.step] = arr.join('');
    if (t.pos < len - 1) {
      hissan.target = { type: t.type, step: t.step, pos: t.pos + 1 };
    }
  }
}

function delHissanCell() {
  const t = hissan.target;
  if (!t) return;
  if (t.type === 'q') {
    hissan.userQuotient[t.step] = '';
  } else {
    const cur = hissan[t.type === 'sub' ? 'userSub' : 'userDiff'][t.step] || '';
    const arr = cur.split('');
    arr[t.pos] = '';
    hissan[t.type === 'sub' ? 'userSub' : 'userDiff'][t.step] = arr.join('');
  }
}

document.querySelectorAll('#hissan-panel .key').forEach(key => {
  key.onclick = () => {
    const num = key.dataset.num;
    const action = key.dataset.action;
    if (num !== undefined) {
      setHissanCell(num);
    } else if (action === 'hdel') {
      delHissanCell();
    } else if (action === 'hcross') {
      // ×ボタン: 商のセルにのみ × を入れる
      if (hissan.target && hissan.target.type === 'q') {
        setHissanCell('×');
      }
    } else if (action === 'hcheck') {
      checkHissan();
      return;
    }
    renderHissan();
  };
});

function checkHissan() {
  const r = document.getElementById('h-result');
  const wrongs = [];

  hissan.steps.forEach((step, k) => {
    // 商
    const u = hissan.userQuotient[k] || '';
    if (step.qDigit === '0') {
      // × または 0 を許容
      if (u !== '×' && u !== '0') wrongs.push(`${k+1}番目のしょう`);
    } else {
      if (u !== step.qDigit) wrongs.push(`${k+1}番目のしょう`);
    }
    // skip ステップは sub/diff のチェック不要
    if (step.skip) return;
    if ((hissan.userSub[k] || '') !== step.subStr) wrongs.push(`${k+1}だんめのひくかず`);
    const isLast = (k === hissan.steps.length - 1);
    if ((hissan.userDiff[k] || '') !== step.diffStr) {
      wrongs.push(isLast ? 'あまり' : `${k+1}だんめのひいた数`);
    }
  });

  if (wrongs.length === 0) {
    r.className = 'result ok';
    r.textContent = '🎉 ぜんぶ せいかい！すばらしい！';
  } else if (wrongs.length <= 2) {
    r.className = 'result error';
    r.textContent = `🤔 ${wrongs.join('と ')} を みなおしてみよう`;
  } else {
    r.className = 'result error';
    r.textContent = `🤔 ちがう ところが ${wrongs.length}こ あるよ`;
  }
}

document.getElementById('h-new').onclick = newHissanProblem;
document.getElementById('h-show').onclick = () => {
  hissan.userQuotient = hissan.steps.map(s => s.skip ? '×' : s.qDigit);
  hissan.userSub = hissan.steps.map(s => s.skip ? '' : s.subStr);
  hissan.userDiff = hissan.steps.map(s => s.skip ? '' : s.diffStr);
  const r = document.getElementById('h-result');
  r.className = 'result info';
  const last = hissan.steps[hissan.steps.length - 1];
  const q = Math.floor(hissan.dividend / hissan.divisor);
  const rem = hissan.dividend % hissan.divisor;
  r.textContent = `こたえ: ${q}${rem ? ' あまり ' + rem : ''}`;
  renderHissan();
};

// 起動時は設定画面
show('setup-panel');
</script>
