<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在校時間ログ</title>
<style>
:root{--bg:#f6f1e7;--card:#fff;--navy:#1f3a5f;--ink:#2b2b2b;--sub:#6b6b6b;--line:#e3dccd;--accent:#c2703d;--r:14px;--danger:#b83b2e;--ok:#2e7d5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.6}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--navy);color:#fff}
header a{color:#fff;text-decoration:none;font-weight:600;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.14)}
header h1{font-size:1.2rem;margin:0}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h2{font-size:1.05rem;margin:0 0 10px;color:var(--navy)}
button{font:inherit;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--ink)}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
button.big{min-height:72px;font-size:1.3rem;flex:1;min-width:140px}
button.go{background:var(--ok);color:#fff;border-color:var(--ok)}
button.bye{background:var(--accent);color:#fff;border-color:var(--accent)}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:10px;min-height:44px;background:#fff;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:.85rem;color:var(--sub)}
.clock{font-size:2.6rem;font-weight:800;color:var(--navy);text-align:center;letter-spacing:.05em}
.today{text-align:center;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:12px;padding:10px 14px}
.kpi .v{font-size:1.6rem;font-weight:800;color:var(--navy)}
.kpi.warn .v{color:var(--danger)}
.meter{height:14px;background:#e9e2d3;border-radius:7px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--navy)}
.meter i.over{background:var(--danger)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{border-bottom:1px solid var(--line);padding:4px;text-align:center;font-size:.9rem}
th{background:#f3eee3}
td input[type=time]{min-height:38px;width:110px}
td input[type=number]{min-height:38px;width:70px}
tr.we td:first-child{color:var(--danger)}
tr.off{background:#faf7f0}
.ot{font-weight:700}
.ot.hi{color:var(--danger)}
svg text{font-size:10px;fill:#666}
footer{text-align:center;color:var(--sub);font-size:.85rem;padding:24px 16px}
footer a{color:var(--navy)}
@media print{header,footer,.noprint{display:none!important}body{background:#fff}main{padding:0}.card{box-shadow:none;padding:0;margin-bottom:8px}td input{border:none;appearance:none;-webkit-appearance:none}table{min-width:0}th,td{font-size:9pt;padding:1px}}
</style>
</head>
<body>
<header><a href="../index.html">← MINATO WORKS</a><h1>在校時間ログ</h1></header>
<main>
<div class="card noprint">
  <div class="clock" id="clock">--:--</div>
  <div class="today" id="todayInfo"></div>
  <div class="row"><button class="big go" id="inBtn">出勤</button><button class="big bye" id="outBtn">退勤</button></div>
  <p class="note" style="text-align:center">押した時刻がそのまま記録されます。あとから下の表で直せます。記録はこの端末の中だけに保存されます。</p>
</div>

<div class="card">
  <div class="row noprint"><button id="prevM">◀</button><h2 id="mTitle" style="margin:0"></h2><button id="nextM">▶</button><button id="thisM">今月</button><button onclick="window.print()">印刷</button><button id="csvBtn">CSV</button></div>
  <h2 class="printonly" id="mTitle2" style="display:none"></h2>
  <div class="kpis" style="margin-top:10px" id="kpis"></div>
  <div style="margin-top:12px" id="chart"></div>
</div>

<div class="card">
  <h2>日ごとの記録</h2>
  <div class="scroll"><table id="tbl"></table></div>
  <p class="note">「休」にチェックした日（土日祝・休暇）は、所定勤務時間を0として在校時間をすべて時間外に数えます。持ち帰りは参考値（在校時間には入れません）。</p>
</div>

<div class="card noprint">
  <h2>設定</h2>
  <div class="row">
    <label>勤務開始 <input type="time" id="sStart"></label>
    <label>勤務終了 <input type="time" id="sEnd"></label>
    <label>休憩（分） <input type="number" id="sBreak" style="width:80px"></label>
    <label>月の目安（時間） <input type="number" id="sLimit" style="width:80px"></label>
    <button id="saveSet">保存</button>
  </div>
  <p class="note">「公立学校の教師の勤務時間の上限に関する指針」の目安は、時間外在校等時間 月45時間・年360時間です。</p>
</div>
</main>
<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525">https://note.com/minato_smile2525</a></footer>
<script>
const K='mw_gyomu_16_';
const load=(k,d)=>{try{const v=localStorage.getItem(K+k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){alert('保存できませんでした')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const toMin=s=>{if(!s)return null;const [h,m]=s.split(':').map(Number);return h*60+m};
const fmtH=m=>{if(m==null||isNaN(m))return '－';const s=m<0?'-':'';m=Math.abs(Math.round(m));return s+Math.floor(m/60)+':'+pad(m%60)};
let set=load('set',{start:'08:15',end:'16:45',brk:45,limit:45});
let days=load('days',{});
let view=new Date();view.setDate(1);

const WD='日月火水木金土';
function isWeekend(ds){const [y,m,d]=ds.split('-').map(Number);const w=new Date(y,m-1,d).getDay();return w===0||w===6}
function rec(ds){return days[ds]||{in:'',out:'',off:isWeekend(ds),home:0}}
function stdMin(){return toMin(set.end)-toMin(set.start)-set.brk}
function calc(ds){
  const r=rec(ds);const a=toMin(r.in),b=toMin(r.out);
  if(a==null||b==null||b<=a)return {stay:null,ot:null,home:+r.home||0};
  let stay=b-a;
  // 休憩：勤務日のみ差し引き（在校が6時間を超える場合）
  if(!r.off&&stay>360)stay-=set.brk;
  const ot=r.off?stay:stay-stdMin();
  return {stay,ot:Math.max(0,ot),home:+r.home||0};
}

function tick(){const d=new Date();$('clock').textContent=hm(d)+':'+pad(d.getSeconds());}
setInterval(tick,1000);tick();
function renderToday(){
  const ds=ymd(new Date());const r=rec(ds);const c=calc(ds);
  $('todayInfo').innerHTML=`${new Date().getMonth()+1}月${new Date().getDate()}日（${WD[new Date().getDay()]}）　出勤 <b>${r.in||'－'}</b>　退勤 <b>${r.out||'－'}</b>${c.ot!=null?`　時間外 <b>${fmtH(c.ot)}</b>`:''}`;
}
$('inBtn').onclick=()=>{const ds=ymd(new Date());const r=rec(ds);if(r.in&&!confirm(`出勤は ${r.in} で記録済みです。今の時刻で上書きしますか？`))return;r.in=hm(new Date());days[ds]=r;save('days',days);renderAll()};
$('outBtn').onclick=()=>{const ds=ymd(new Date());const r=rec(ds);if(!r.in){r.in=set.start}if(r.out&&!confirm(`退勤は ${r.out} で記録済みです。今の時刻で上書きしますか？`))return;r.out=hm(new Date());days[ds]=r;save('days',days);renderAll();
  const c=calc(ds);if(c.ot!=null)alert(`おつかれさまでした。\n今日の時間外：${fmtH(c.ot)}`)};

function monthDays(){const y=view.getFullYear(),m=view.getMonth();const n=new Date(y,m+1,0).getDate();return Array.from({length:n},(_,i)=>ymd(new Date(y,m,i+1)))}
function fyTotal(){ // 年度の時間外合計（4月〜）
  const y=view.getMonth()<3?view.getFullYear()-1:view.getFullYear();const from=y+'-04-01',to=(y+1)+'-03-31';
  const endOfView=ymd(new Date(view.getFullYear(),view.getMonth()+1,0));
  let t=0;Object.keys(days).forEach(ds=>{if(ds>=from&&ds<=to&&ds<=endOfView){const c=calc(ds);if(c.ot)t+=c.ot}});return {t,y};
}
function renderMonth(skipTable){
  const title=`${view.getFullYear()}年${view.getMonth()+1}月`;$('mTitle').textContent=title;$('mTitle2').textContent=title+' 在校時間';
  const ds=monthDays();const td=ymd(new Date());
  let tot=0,stay=0,home=0,n=0,hiDays=0;
  ds.forEach(d=>{const c=calc(d);if(c.ot!=null){tot+=c.ot;stay+=c.stay;n++;if(c.ot>=180)hiDays++}home+=c.home||0});
  // 月末見込み：記録日の平均 × 残りの勤務日
  const remain=ds.filter(d=>d>td&&!rec(d).off&&!isWeekend(d)).length;
  const avg=n?tot/n:0;const proj=tot+avg*remain;
  const lim=set.limit*60;const fy=fyTotal();
  const pct=Math.min(100,tot/lim*100);
  $('kpis').innerHTML=`
   <div class="kpi ${tot>lim?'warn':''}"><div class="note">今月の時間外</div><div class="v">${fmtH(tot)}</div><div class="meter"><i class="${tot>lim?'over':''}" style="width:${pct}%"></i></div><div class="note">目安 ${set.limit}時間の ${Math.round(tot/lim*100)}%</div></div>
   <div class="kpi ${proj>lim?'warn':''}"><div class="note">このペースだと月末</div><div class="v">${fmtH(proj)}</div><div class="note">1日平均 ${fmtH(avg)}（${n}日記録）</div></div>
   <div class="kpi"><div class="note">在校時間の合計</div><div class="v">${fmtH(stay)}</div><div class="note">3時間以上の時間外：${hiDays}日</div></div>
   <div class="kpi ${fy.t>360*60?'warn':''}"><div class="note">${fy.y}年度の累計（年360h）</div><div class="v">${fmtH(fy.t)}</div><div class="meter"><i class="${fy.t>360*60?'over':''}" style="width:${Math.min(100,fy.t/(360*60)*100)}%"></i></div><div class="note">持ち帰り（今月）${fmtH(home)}</div></div>`;
  renderChart(ds);
  if(skipTable)return;
  $('tbl').innerHTML='<tr><th>日</th><th>休</th><th>出勤</th><th>退勤</th><th>在校</th><th>時間外</th><th>持ち帰り(分)</th></tr>'+ds.map(d=>{
    const r=rec(d),c=calc(d);const [y,m,dd]=d.split('-').map(Number);const w=new Date(y,m-1,dd).getDay();
    return `<tr class="${w===0||w===6?'we':''} ${r.off?'off':''}" data-d="${d}"><td>${dd}（${WD[w]}）</td><td><input type="checkbox" data-f="off" ${r.off?'checked':''} style="min-height:0;width:22px;height:22px"></td>
    <td><input type="time" data-f="in" value="${esc(r.in)}"></td><td><input type="time" data-f="out" value="${esc(r.out)}"></td>
    <td>${c.stay!=null?fmtH(c.stay):''}</td><td class="ot ${c.ot>=180?'hi':''}">${c.ot!=null?fmtH(c.ot):''}</td><td><input type="number" min="0" step="10" data-f="home" value="${r.home||''}"></td></tr>`}).join('');
}
function renderChart(ds){
  const W=Math.max(620,ds.length*24),H=190,pl=34,pb=22,ch=H-pb-10;
  const vals=ds.map(d=>calc(d).ot||0);const maxV=Math.max(240,...vals);
  const bw=(W-pl-6)/ds.length;
  const y=v=>10+ch-(v/maxV)*ch;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="日ごとの時間外">`;
  for(let h=0;h<=maxV;h+=60){s+=`<line x1="${pl}" x2="${W}" y1="${y(h)}" y2="${y(h)}" stroke="#eee"/><text x="${pl-4}" y="${y(h)+3}" text-anchor="end">${h/60}h</text>`}
  // 1日あたり目安線（月45h÷勤務日）
  const wd=ds.filter(d=>!isWeekend(d)).length||20;const per=set.limit*60/wd;
  s+=`<line x1="${pl}" x2="${W}" y1="${y(per)}" y2="${y(per)}" stroke="#c2703d" stroke-dasharray="4 3"/><text x="${W-4}" y="${y(per)-3}" text-anchor="end" style="fill:#c2703d">目安 ${fmtH(per)}/日</text>`;
  vals.forEach((v,i)=>{const x=pl+i*bw+2;const [yy,mm,dd]=ds[i].split('-').map(Number);const w=new Date(yy,mm-1,dd).getDay();
    if(v>0)s+=`<rect x="${x}" y="${y(v)}" width="${Math.max(2,bw-4)}" height="${10+ch-y(v)}" rx="3" fill="${v>=180?'#b83b2e':'#1f3a5f'}"><title>${dd}日 ${fmtH(v)}</title></rect>`;
    s+=`<text x="${x+bw/2-2}" y="${H-6}" text-anchor="middle" style="${w===0||w===6?'fill:#b83b2e':''}">${dd}</text>`});
  s+='</svg>';$('chart').innerHTML='<div class="scroll">'+s+'</div>';
}
$('tbl').addEventListener('change',e=>{const el=e.target;const tr=el.closest('tr');if(!tr)return;const d=tr.dataset.d;const r=rec(d);const f=el.dataset.f;
  r[f]=f==='off'?el.checked:(f==='home'?(+el.value||0):el.value);days[d]=r;
  if(!r.in&&!r.out&&!r.home&&r.off===isWeekend(d))delete days[d];
  save('days',days);
  const c=calc(d);const tds=tr.children;tds[4].textContent=c.stay!=null?fmtH(c.stay):'';tds[5].textContent=c.ot!=null?fmtH(c.ot):'';tds[5].classList.toggle('hi',c.ot>=180);tr.classList.toggle('off',!!r.off);
  renderToday();renderMonth(true)});
$('prevM').onclick=()=>{view.setMonth(view.getMonth()-1);renderMonth()};
$('nextM').onclick=()=>{view.setMonth(view.getMonth()+1);renderMonth()};
$('thisM').onclick=()=>{view=new Date();view.setDate(1);renderMonth()};
$('csvBtn').onclick=()=>{let c='日付,休,出勤,退勤,在校(分),時間外(分),持ち帰り(分)\n';monthDays().forEach(d=>{const r=rec(d),x=calc(d);c+=[d,r.off?'休':'',r.in,r.out,x.stay??'',x.ot??'',r.home||''].join(',')+'\n'});const b=new Blob(['﻿'+c],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`在校時間_${view.getFullYear()}-${pad(view.getMonth()+1)}.csv`;a.click()};
function renderSet(){$('sStart').value=set.start;$('sEnd').value=set.end;$('sBreak').value=set.brk;$('sLimit').value=set.limit}
$('saveSet').onclick=()=>{set={start:$('sStart').value||'08:15',end:$('sEnd').value||'16:45',brk:+$('sBreak').value||0,limit:+$('sLimit').value||45};save('set',set);renderAll();alert('保存しました（所定勤務 '+fmtH(stdMin())+'）')};
window.addEventListener('beforeprint',()=>$('mTitle2').style.display='block');
window.addEventListener('afterprint',()=>$('mTitle2').style.display='none');
function renderAll(){renderToday();renderMonth()}
renderSet();renderAll();
</script>
</body>
</html>
