<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>協議会ふせんボード</title>
<style>
:root{--bg:#f6f1e7;--card:#fff;--navy:#1f3a5f;--ink:#2b2b2b;--sub:#6b6b6b;--line:#e3dccd;--accent:#c2703d;--r:14px;--danger:#b83b2e;--ok:#2e7d5b;
--c-good:#cfe3f7;--c-issue:#f9d3d0;--c-idea:#fbeaa6;--c-q:#d4ecd9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.5}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--navy);color:#fff}
header a{color:#fff;text-decoration:none;font-weight:600;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.14)}
header h1{font-size:1.2rem;margin:0}
main{max-width:1800px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
button{font:inherit;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--ink)}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
button.del{color:var(--danger)}
button.sm{min-height:34px;padding:2px 10px;font-size:.85rem}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;min-height:44px;background:#fff;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:.85rem;color:var(--sub)}
.kinds{display:flex;gap:6px;flex-wrap:wrap}
.kinds label{display:flex;align-items:center;gap:6px;border-radius:10px;padding:6px 12px;min-height:44px;cursor:pointer;border:2px solid transparent;font-weight:600}
.kinds label:has(input:checked){border-color:var(--navy)}
.kinds input{width:18px;height:18px}
.k-good{background:var(--c-good)}.k-issue{background:var(--c-issue)}.k-idea{background:var(--c-idea)}.k-q{background:var(--c-q)}
#board{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:start}
.lane{background:#fff;border-radius:var(--r);padding:10px;min-height:200px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:2px solid transparent}
.lane.over{border-color:var(--accent);background:#fff6ee}
.lane h3{margin:0 0 8px;font-size:1rem;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:6px}
.lane h3 input{font-weight:700;border:none;border-bottom:1px dashed var(--line);border-radius:0;min-height:36px;flex:1;padding:2px;color:var(--navy)}
.lane.inbox{background:#fcfaf5;border-style:dashed;border-color:var(--line)}
.stk{border-radius:6px;padding:8px 10px;margin:6px 0;box-shadow:0 2px 4px rgba(0,0,0,.12);cursor:grab;touch-action:none;user-select:none;position:relative;font-size:1rem;word-break:break-all}
.stk .who{font-size:.75rem;color:#555}
.stk .x{position:absolute;right:2px;top:0;border:none;background:none;min-height:0;padding:2px 6px;color:#777;font-size:.9rem}
.stk.sel{outline:3px solid var(--navy)}
.stk.drag{position:fixed;z-index:99;pointer-events:none;opacity:.9;transform:rotate(2deg)}
.stk.good{background:var(--c-good)}.stk.issue{background:var(--c-issue)}.stk.idea{background:var(--c-idea)}.stk.q{background:var(--c-q)}
.moveHint{background:var(--navy);color:#fff;padding:6px 12px;border-radius:10px;display:none;margin-bottom:10px}
body.big .stk{font-size:1.5rem}
body.big .lane h3{font-size:1.4rem}
.cnt{font-size:.8rem;color:var(--sub);font-weight:400}
#summary{display:none}
#summary h2{font-size:1.2rem;margin:0 0 6px}
#summary h3{font-size:1rem;border-bottom:2px solid var(--navy);margin:10px 0 4px}
#summary ul{margin:0 0 4px;padding-left:1.3em}
footer{text-align:center;color:var(--sub);font-size:.85rem;padding:24px 16px}
footer a{color:var(--navy)}
@media print{header,footer,.noprint,#board{display:none!important}body{background:#fff}#summary{display:block!important}}
</style>
</head>
<body>
<header><a href="../index.html">← MINATO WORKS</a><h1>協議会ふせんボード</h1></header>
<main>
<div class="card noprint">
  <div class="row">
    <select id="boardSel" style="min-width:200px"></select>
    <button id="newBoard">＋ 新しいボード</button>
    <input id="boardTitle" placeholder="例）10/24 3年算数 研究授業 協議会" style="flex:1;min-width:220px">
  </div>
</div>
<div class="card noprint">
  <div class="kinds" id="kinds">
    <label class="k-good"><input type="radio" name="kind" value="good" checked>よかった点</label>
    <label class="k-issue"><input type="radio" name="kind" value="issue">課題</label>
    <label class="k-idea"><input type="radio" name="kind" value="idea">改善案</label>
    <label class="k-q"><input type="radio" name="kind" value="q">質問</label>
  </div>
  <div class="row" style="margin-top:8px">
    <input id="txt" placeholder="1枚に1つ。Enterで貼る" style="flex:3;min-width:220px">
    <input id="who" placeholder="名前（任意）" style="flex:1;min-width:110px">
    <button class="pri" id="addBtn">貼る</button>
  </div>
  <p class="note">付箋はドラッグで観点の列へ。タブレットでは付箋をタップ→行き先の列をタップでも動かせます。</p>
</div>
<div class="row noprint" style="margin-bottom:10px">
  <button id="addLane">＋ 観点の列を足す</button>
  <button id="bigBtn">テレビ用の大きな字</button>
  <button id="sortBtn">列の中を種類順にならべる</button>
  <button id="copyBtn">まとめをコピー</button>
  <button onclick="window.print()">まとめを印刷</button>
  <span id="msg" class="note"></span>
</div>
<div class="moveHint noprint" id="hint">行き先の列をタップしてください（もう一度付箋をタップで取り消し）</div>
<div id="board"></div>
<div id="summary"></div>
</main>
<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525">https://note.com/minato_smile2525</a></footer>
<script>
const K='mw_gyomu_18_';
const load=(k,d)=>{try{const v=localStorage.getItem(K+k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){alert('保存できませんでした')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const KIND={good:'よかった点',issue:'課題',idea:'改善案',q:'質問'};
const ORDER=['good','issue','idea','q'];
function newBoard(){return {id:Date.now(),title:'',lanes:[{id:'in',name:'未分類'},{id:'l1',name:'導入・めあて'},{id:'l2',name:'展開・話し合い'},{id:'l3',name:'まとめ・ふり返り'},{id:'l4',name:'子どもの姿'}],notes:[]}}
let boards=load('boards',[]);
if(!boards.length){boards.push(newBoard());save('boards',boards)}
let curId=load('cur',boards[0].id);
const B=()=>boards.find(b=>b.id===curId)||boards[0];
let selNote=null;
const persist=()=>save('boards',boards);

function renderSel(){$('boardSel').innerHTML=boards.map(b=>`<option value="${b.id}">${esc(b.title||'（無題のボード）')}</option>`).join('');$('boardSel').value=B().id;$('boardTitle').value=B().title}
function render(){
  const b=B();
  $('board').innerHTML=b.lanes.map(l=>{
    const ns=b.notes.filter(n=>n.lane===l.id);
    const cnt=ORDER.map(k=>{const c=ns.filter(n=>n.k===k).length;return c?KIND[k].slice(0,2)+c:''}).filter(Boolean).join(' ');
    return `<div class="lane ${l.id==='in'?'inbox':''}" data-lane="${l.id}"><h3>${l.id==='in'?'未分類':`<input data-lname="${l.id}" value="${esc(l.name)}">`}<span class="cnt">${cnt}</span>${l.id==='in'?'':`<button class="sm del noprint" data-rmlane="${l.id}">×</button>`}</h3>
    ${ns.map(n=>`<div class="stk ${n.k} ${selNote===String(n.id)?'sel':''}" data-id="${n.id}"><button class="x noprint" data-rm="${n.id}" aria-label="削除">×</button>${esc(n.t)}${n.w?`<div class="who">${esc(n.w)}</div>`:''}</div>`).join('')}</div>`}).join('');
  $('hint').style.display=selNote?'block':'none';
  renderSummary();
}
function add(){
  const t=$('txt').value.trim();if(!t)return;
  const k=document.querySelector('input[name=kind]:checked').value;
  B().notes.push({id:Date.now()+Math.random(),t,k,w:$('who').value.trim(),lane:'in'});
  persist();$('txt').value='';$('txt').focus();render();
}
$('addBtn').onclick=add;
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();add()}});
$('addLane').onclick=()=>{const b=B();b.lanes.push({id:'l'+Date.now(),name:'新しい観点'});persist();render()};
$('bigBtn').onclick=()=>document.body.classList.toggle('big');
$('sortBtn').onclick=()=>{const b=B();b.notes.sort((a,c)=>ORDER.indexOf(a.k)-ORDER.indexOf(c.k));persist();render()};
$('newBoard').onclick=()=>{const b=newBoard();boards.push(b);curId=b.id;save('cur',curId);persist();renderSel();render();$('boardTitle').focus()};
$('boardSel').onchange=()=>{curId=+$('boardSel').value;save('cur',curId);selNote=null;renderSel();render()};
$('boardTitle').oninput=()=>{B().title=$('boardTitle').value;persist();const o=$('boardSel').selectedOptions[0];if(o)o.textContent=B().title||'（無題のボード）';renderSummary()};

$('board').addEventListener('input',e=>{const id=e.target.dataset.lname;if(!id)return;B().lanes.find(l=>l.id===id).name=e.target.value;persist();renderSummary()});
$('board').addEventListener('click',e=>{
  const d=e.target.dataset;const b=B();
  if(d.rm){if(confirm('この付箋を削除しますか？')){b.notes=b.notes.filter(n=>String(n.id)!==d.rm);persist();render()}return}
  if(d.rmlane){const ln=b.lanes.find(l=>l.id===d.rmlane);if(!confirm(`列「${ln.name}」を消しますか？（付箋は未分類にもどります）`))return;b.notes.forEach(n=>{if(n.lane===d.rmlane)n.lane='in'});b.lanes=b.lanes.filter(l=>l.id!==d.rmlane);persist();render();return}
});

// ドラッグ（ポインター）＋タップ移動
let drag=null,tapAt=0;
$('board').addEventListener('pointerdown',e=>{
  const s=e.target.closest('.stk');if(!s||e.target.closest('button'))return;
  drag={el:s,id:s.dataset.id,x:e.clientX,y:e.clientY,moved:false,ghost:null};
  try{s.setPointerCapture(e.pointerId)}catch(err){}
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
  if(!drag.moved){drag.moved=true;const r=drag.el.getBoundingClientRect();drag.ox=e.clientX-r.left;drag.oy=e.clientY-r.top;drag.ghost=drag.el.cloneNode(true);drag.ghost.classList.add('drag');drag.ghost.style.width=r.width+'px';document.body.appendChild(drag.ghost);drag.el.style.opacity=.3}
  drag.ghost.style.left=(e.clientX-drag.ox)+'px';drag.ghost.style.top=(e.clientY-drag.oy)+'px';
  document.querySelectorAll('.lane').forEach(l=>l.classList.remove('over'));
  const lane=document.elementFromPoint(e.clientX,e.clientY);const ln=lane&&lane.closest('.lane');if(ln)ln.classList.add('over');
});
document.addEventListener('pointerup',e=>{
  if(!drag)return;const b=B();
  if(drag.moved){
    drag.ghost.remove();
    const under=document.elementFromPoint(e.clientX,e.clientY);const ln=under&&under.closest('.lane');
    const n=b.notes.find(x=>String(x.id)===drag.id);
    if(ln&&n){
      n.lane=ln.dataset.lane;
      // 並び位置：落とした場所の直後の付箋の前へ
      const target=under.closest('.stk');
      b.notes=b.notes.filter(x=>x!==n);
      if(target&&target.dataset.id!==drag.id){const i=b.notes.findIndex(x=>String(x.id)===target.dataset.id);const r=target.getBoundingClientRect();b.notes.splice(e.clientY>r.top+r.height/2?i+1:i,0,n)}else b.notes.push(n);
      persist();
    }
    drag=null;render();return;
  }
  // タップ：選択
  selNote=(selNote===drag.id)?null:drag.id;drag=null;tapAt=Date.now();render();
});
document.addEventListener('pointercancel',()=>{if(drag&&drag.ghost)drag.ghost.remove();drag=null;render()});
$('board').addEventListener('click',e=>{
  if(Date.now()-tapAt<400)return;
  if(!selNote||e.target.closest('.stk')||e.target.closest('button')||e.target.tagName==='INPUT')return;
  const ln=e.target.closest('.lane');if(!ln)return;const n=B().notes.find(x=>String(x.id)===selNote);
  if(n){n.lane=ln.dataset.lane;B().notes=B().notes.filter(x=>x!==n).concat([n]);persist()}selNote=null;render();
});

function summaryText(){
  const b=B();let t=`【${b.title||'協議会'} まとめ】\n`;
  b.lanes.forEach(l=>{const ns=b.notes.filter(n=>n.lane===l.id);if(!ns.length)return;t+=`\n■${l.id==='in'?'未分類':l.name}\n`;
    ORDER.forEach(k=>{const x=ns.filter(n=>n.k===k);if(x.length){t+=`〈${KIND[k]}〉\n`;x.forEach(n=>t+=`・${n.t}${n.w?'（'+n.w+'）':''}\n`)}})});
  return t;
}
function renderSummary(){
  const b=B();let h=`<h2>${esc(b.title||'協議会')} まとめ</h2><p class="note">付箋 ${b.notes.length}枚（${ORDER.map(k=>KIND[k]+' '+b.notes.filter(n=>n.k===k).length).join('／')}）</p>`;
  b.lanes.forEach(l=>{const ns=b.notes.filter(n=>n.lane===l.id);if(!ns.length)return;h+=`<h3>${esc(l.id==='in'?'未分類':l.name)}</h3>`;
    ORDER.forEach(k=>{const x=ns.filter(n=>n.k===k);if(x.length)h+=`<b>〈${KIND[k]}〉</b><ul>${x.map(n=>`<li>${esc(n.t)}${n.w?'（'+esc(n.w)+'）':''}</li>`).join('')}</ul>`})});
  $('summary').innerHTML=h;
}
$('copyBtn').onclick=()=>{const t=summaryText();const ok=()=>{$('msg').textContent='コピーしました';setTimeout(()=>$('msg').textContent='',2500)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>alert(t));else alert(t)};
renderSel();render();
</script>
</body>
</html>
