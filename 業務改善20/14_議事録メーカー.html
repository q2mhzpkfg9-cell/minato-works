<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>議事録メーカー</title>
<style>
:root{--bg:#f6f1e7;--card:#fff;--navy:#1f3a5f;--ink:#2b2b2b;--sub:#6b6b6b;--line:#e3dccd;--accent:#c2703d;--r:14px;--danger:#b83b2e;--ok:#2e7d5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.6}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--navy);color:#fff}
header a{color:#fff;text-decoration:none;font-weight:600;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.14)}
header h1{font-size:1.2rem;margin:0}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h2{font-size:1.05rem;margin:0 0 10px;color:var(--navy)}
button{font:inherit;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--ink)}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
button.del{color:var(--danger)}
button.sm{min-height:36px;padding:4px 10px;font-size:.88rem}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;min-height:44px;background:#fff;max-width:100%}
textarea{width:100%;min-height:64px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.grid2 label{display:flex;flex-direction:column;font-size:.85rem;color:var(--sub)}
.note{font-size:.85rem;color:var(--sub)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button.on{background:var(--navy);color:#fff}
.hidden{display:none}
.agenda{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#fcfaf5}
.agenda .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.agenda .head input{flex:1;min-width:200px;font-weight:700}
.sub{font-size:.85rem;color:var(--navy);font-weight:700;margin:8px 0 2px}
.act{display:grid;grid-template-columns:1fr 140px 150px 44px;gap:6px;margin:4px 0}
@media (max-width:600px){.act{grid-template-columns:1fr 1fr}.act input:first-child{grid-column:1/-1}}
.todo{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
.todo input[type=checkbox]{width:24px;height:24px;min-height:0}
.todo.done{opacity:.5;text-decoration:line-through}
.late{color:var(--danger);font-weight:700}
.soon{color:var(--accent);font-weight:700}
.mitem{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0;flex-wrap:wrap}
#preview{font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
#preview h3{text-align:center;margin:0 0 8px;font-size:1.3rem}
#preview table{border-collapse:collapse;width:100%;margin:6px 0}
#preview th,#preview td{border:1px solid #999;padding:4px 8px;font-size:.95rem;text-align:left;vertical-align:top}
#preview th{background:#f1ede4;width:7em}
#preview .ag{margin:10px 0;page-break-inside:avoid}
#preview .ag h4{margin:0 0 4px;border-bottom:2px solid var(--navy);font-size:1.02rem}
#preview .dec{background:#eef3f9;border-radius:6px;padding:4px 8px;margin:4px 0}
footer{text-align:center;color:var(--sub);font-size:.85rem;padding:24px 16px}
footer a{color:var(--navy)}
@media print{header,footer,.noprint,.tabs{display:none!important}body{background:#fff}main{padding:0}.card{box-shadow:none;padding:0}#tab-edit,#tab-todo,#tab-list{display:none!important}#tab-out{display:block!important}}
</style>
</head>
<body>
<header><a href="../index.html">← MINATO WORKS</a><h1>議事録メーカー</h1></header>
<main>
<div class="tabs">
  <button data-tab="edit" class="on">記録する</button>
  <button data-tab="out">できあがり</button>
  <button data-tab="todo">宿題（担当・期限）</button>
  <button data-tab="list">これまでの会議</button>
</div>

<section id="tab-edit">
  <div class="card">
    <div class="row noprint" style="margin-bottom:8px">
      <button class="pri" id="newBtn">＋ 新しい議事録</button>
      <select id="tpl"><option value="">ひな形をえらぶ…</option></select>
      <span id="saveMsg" class="note"></span>
    </div>
    <div class="grid2">
      <label>会議名<input id="f_title" placeholder="第5回 学年会"></label>
      <label>日時<input type="datetime-local" id="f_dt"></label>
      <label>場所<input id="f_place" placeholder="3年1組教室"></label>
      <label>司会／記録<input id="f_role" placeholder="司会 田中／記録 湊"></label>
    </div>
    <label class="note" style="display:block;margin-top:8px">出席者<input id="f_members" style="width:100%" placeholder="田中、佐藤、湊（欠：鈴木）"></label>
  </div>

  <div class="card">
    <h2>議題</h2>
    <div id="agendas"></div>
    <button id="addAg">＋ 議題を足す</button>
  </div>
  <div class="card">
    <h2>連絡・その他</h2>
    <textarea id="f_misc" placeholder="次回：10/6（火）15:45〜　など"></textarea>
    <p class="note">入力するたびに自動で保存されます（この端末の中だけ）。</p>
  </div>
</section>

<section id="tab-out" class="hidden">
  <div class="card">
    <div class="row noprint" style="margin-bottom:10px"><button class="pri" onclick="window.print()">印刷する</button><button id="copyTxt">テキストでコピー</button><span id="copyMsg" class="note"></span></div>
    <div id="preview"></div>
  </div>
</section>

<section id="tab-todo" class="hidden">
  <div class="card">
    <h2>まだ終わっていない宿題</h2>
    <div class="row noprint"><input id="who" placeholder="担当者でしぼる（例：湊）"><label class="row"><input type="checkbox" id="showDone">終わったものも表示</label></div>
    <div id="todos"></div>
  </div>
</section>

<section id="tab-list" class="hidden">
  <div class="card">
    <h2>これまでの会議</h2>
    <input id="q" placeholder="キーワードでさがす（会議名・決定事項）" style="width:100%">
    <div id="mlist"></div>
  </div>
</section>
</main>
<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525">https://note.com/minato_smile2525</a></footer>
<script>
const K='mw_gyomu_14_';
const load=(k,d)=>{try{const v=localStorage.getItem(K+k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){alert('保存できませんでした')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const nowLocal=()=>{const d=new Date();return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const TPL={
 '学年会':['行事の確認','学習進度','児童の様子（共有）','学年だより'],
 '職員会議':['提案事項','報告事項','連絡事項'],
 '研究部会':['研究授業の日程','指導案検討','協議会の持ち方'],
 '委員会・部会':['前回の確認','今月の活動','次回までの準備'],
 '行事の打ち合わせ':['日程・時程','役割分担','準備物','雨天時の対応']
};
let mins=load('mins',[]);
let curId=load('cur',null);

function blank(){return {id:Date.now(),title:'',dt:nowLocal(),place:'',role:'',members:'',misc:'',agendas:[{t:'',memo:'',dec:'',cont:false,acts:[]}]}}
function cur(){let m=mins.find(x=>x.id===curId);if(!m){m=blank();mins.push(m);curId=m.id;save('cur',curId);save('mins',mins)}return m}
let timer=null;
function persist(){clearTimeout(timer);timer=setTimeout(()=>{save('mins',mins);$('saveMsg').textContent='保存しました '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})},300)}

function renderEdit(){
  const m=cur();
  ['title','dt','place','role','members','misc'].forEach(f=>$('f_'+f).value=m[f]||'');
  $('agendas').innerHTML=m.agendas.map((a,i)=>`<div class="agenda" data-i="${i}">
    <div class="head"><b>${i+1}.</b><input data-f="t" value="${esc(a.t)}" placeholder="議題名"><label class="row note"><input type="checkbox" data-f="cont" ${a.cont?'checked':''}>継続審議</label>
    <button class="sm" data-mv="-1">↑</button><button class="sm" data-mv="1">↓</button><button class="sm del" data-rm>削除</button></div>
    <div class="sub">話し合いのメモ</div><textarea data-f="memo" placeholder="出た意見など">${esc(a.memo)}</textarea>
    <div class="sub">決定事項</div><textarea data-f="dec" placeholder="1行に1つ" style="min-height:48px">${esc(a.dec)}</textarea>
    <div class="sub">やること（担当・期限）</div>
    ${a.acts.map((x,j)=>`<div class="act" data-j="${j}"><input data-a="w" value="${esc(x.w)}" placeholder="何を"><input data-a="p" value="${esc(x.p)}" placeholder="担当"><input type="date" data-a="d" value="${esc(x.d)}"><button class="sm del" data-rma="${j}">×</button></div>`).join('')}
    <button class="sm" data-adda>＋ やることを足す</button>
  </div>`).join('');
}
['title','dt','place','role','members','misc'].forEach(f=>$('f_'+f).addEventListener('input',()=>{cur()[f]=$('f_'+f).value;persist()}));
$('agendas').addEventListener('input',e=>{
  const box=e.target.closest('.agenda');if(!box)return;const a=cur().agendas[box.dataset.i];
  if(e.target.dataset.f){a[e.target.dataset.f]=e.target.type==='checkbox'?e.target.checked:e.target.value}
  if(e.target.dataset.a){const j=e.target.closest('.act').dataset.j;a.acts[j][e.target.dataset.a]=e.target.value}
  persist();
});
$('agendas').addEventListener('change',e=>{if(e.target.type==='checkbox'||e.target.type==='date'){e.target.dispatchEvent(new Event('input',{bubbles:true}))}});
$('agendas').addEventListener('click',e=>{
  const box=e.target.closest('.agenda');if(!box)return;const m=cur();const i=+box.dataset.i;const a=m.agendas[i];const d=e.target.dataset;
  if('adda' in d){a.acts.push({w:'',p:'',d:'',done:false});}
  else if(d.rma!=null){a.acts.splice(+d.rma,1)}
  else if('rm' in d){if(!confirm('この議題を削除しますか？'))return;m.agendas.splice(i,1)}
  else if(d.mv){const k=i+ +d.mv;if(k<0||k>=m.agendas.length)return;[m.agendas[i],m.agendas[k]]=[m.agendas[k],m.agendas[i]]}
  else return;
  persist();renderEdit();
});
$('addAg').onclick=()=>{cur().agendas.push({t:'',memo:'',dec:'',cont:false,acts:[]});persist();renderEdit()};
$('newBtn').onclick=()=>{const m=blank();mins.push(m);curId=m.id;save('cur',curId);save('mins',mins);renderEdit();$('f_title').focus()};
$('tpl').innerHTML+=Object.keys(TPL).map(k=>`<option>${k}</option>`).join('');
$('tpl').onchange=()=>{const k=$('tpl').value;if(!k)return;const m=cur();
  const empty=m.agendas.every(a=>!a.t&&!a.memo&&!a.dec&&!a.acts.length);
  if(!empty&&!confirm('いまの議題を「'+k+'」のひな形に置きかえますか？')){$('tpl').value='';return}
  m.agendas=TPL[k].map(t=>({t,memo:'',dec:'',cont:false,acts:[]}));if(!m.title)m.title=k;persist();renderEdit();$('tpl').value=''};

function fmtDT(s){if(!s)return '';const [d,t]=s.split('T');const [y,mo,da]=d.split('-').map(Number);const w='日月火水木金土'[new Date(y,mo-1,da).getDay()];return `${y}年${mo}月${da}日（${w}）${t||''}`}
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
function renderOut(){
  const m=cur();
  let h=`<h3>${esc(m.title||'（会議名）')} 記録</h3><table><tr><th>日時</th><td>${esc(fmtDT(m.dt))}</td></tr><tr><th>場所</th><td>${esc(m.place)}</td></tr><tr><th>出席者</th><td>${esc(m.members)}</td></tr><tr><th>司会・記録</th><td>${esc(m.role)}</td></tr></table>`;
  m.agendas.forEach((a,i)=>{
    h+=`<div class="ag"><h4>${i+1}. ${esc(a.t||'（議題）')}${a.cont?'　［継続審議］':''}</h4>`;
    if(a.memo)h+=`<div>${esc(a.memo).replace(/\n/g,'<br>')}</div>`;
    const dl=lines(a.dec);if(dl.length)h+=`<div class="dec"><b>決定：</b>${dl.map(esc).join('<br>')}</div>`;
    if(a.acts.filter(x=>x.w).length)h+='<table><tr><th>やること</th><th style="width:auto">担当</th><th style="width:auto">期限</th></tr>'+a.acts.filter(x=>x.w).map(x=>`<tr><td>${esc(x.w)}</td><td>${esc(x.p)}</td><td>${esc(x.d?x.d.slice(5).replace('-','/'):'')}</td></tr>`).join('')+'</table>';
    h+='</div>';
  });
  if(m.misc)h+=`<div class="ag"><h4>連絡・その他</h4>${esc(m.misc).replace(/\n/g,'<br>')}</div>`;
  $('preview').innerHTML=h;
}
function toText(m){
  let t=`【${m.title||'会議'} 記録】\n日時：${fmtDT(m.dt)}\n場所：${m.place}\n出席：${m.members}\n${m.role}\n\n`;
  m.agendas.forEach((a,i)=>{
    t+=`■${i+1}. ${a.t}${a.cont?'［継続審議］':''}\n`;
    if(a.memo)t+=a.memo.trim()+'\n';
    lines(a.dec).forEach(d=>t+=`　→決定：${d}\n`);
    a.acts.filter(x=>x.w).forEach(x=>t+=`　☐ ${x.w}（${x.p||'担当未定'}${x.d?'／'+x.d.slice(5).replace('-','/')+'まで':''}）\n`);
    t+='\n';
  });
  if(m.misc)t+='■連絡・その他\n'+m.misc.trim()+'\n';
  return t;
}
$('copyTxt').onclick=()=>{const t=toText(cur());
  const done=()=>{$('copyMsg').textContent='コピーしました（校務メールやTeamsに貼れます）';setTimeout(()=>$('copyMsg').textContent='',3000)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallback(t,done))}else fallback(t,done)};
function fallback(t,done){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){alert('コピーできませんでした')}ta.remove()}

function renderTodo(){
  const who=$('who').value.trim(),showDone=$('showDone').checked;const td=ymd(new Date());
  const all=[];
  mins.forEach(m=>m.agendas.forEach((a,ai)=>a.acts.forEach((x,j)=>{if(x.w)all.push({m,ai,j,x})})));
  const l=all.filter(o=>(showDone||!o.x.done)&&(!who||(o.x.p||'').includes(who))).sort((a,b)=>(a.x.d||'9999')<(b.x.d||'9999')?-1:1);
  $('todos').innerHTML=l.map(o=>{
    const d=o.x.d;let cls='';if(!o.x.done&&d){if(d<td)cls='late';else{const diff=(new Date(d)-new Date(td))/864e5;if(diff<=3)cls='soon'}}
    return `<div class="todo ${o.x.done?'done':''}"><input type="checkbox" data-m="${o.m.id}" data-ai="${o.ai}" data-j="${o.j}" ${o.x.done?'checked':''}>
    <div style="flex:1;min-width:200px"><b>${esc(o.x.w)}</b><br><span class="note">${esc(o.m.title||'会議')}（${esc((o.m.dt||'').slice(5,10).replace('-','/'))}）</span></div>
    <div>${esc(o.x.p||'担当未定')}</div><div class="${cls}">${d?esc(d.slice(5).replace('-','/'))+(cls==='late'?' 期限切れ':''):'期限なし'}</div></div>`}).join('')||'<p class="note">宿題はありません。</p>';
}
$('todos').addEventListener('change',e=>{const c=e.target;const m=mins.find(x=>x.id==c.dataset.m);if(!m)return;m.agendas[c.dataset.ai].acts[c.dataset.j].done=c.checked;save('mins',mins);renderTodo()});
$('who').oninput=renderTodo;$('showDone').onchange=renderTodo;

function renderList(){
  const q=$('q').value.trim();
  const l=mins.filter(m=>!q||JSON.stringify(m).includes(q)).sort((a,b)=>(a.dt||'')<(b.dt||'')?1:-1);
  $('mlist').innerHTML=l.map(m=>{const dec=m.agendas.reduce((n,a)=>n+lines(a.dec).length,0);const open=m.agendas.reduce((n,a)=>n+a.acts.filter(x=>x.w&&!x.done).length,0);
    return `<div class="mitem"><div><b>${esc(m.title||'（無題）')}</b><br><span class="note">${esc(fmtDT(m.dt))}　決定${dec}件・未完了の宿題${open}件</span></div><div class="row"><button data-open="${m.id}">開く</button><button data-dup="${m.id}">複製</button><button class="del" data-del="${m.id}">削除</button></div></div>`}).join('')||'<p class="note">まだありません。</p>';
}
$('q').oninput=renderList;
$('mlist').addEventListener('click',e=>{const d=e.target.dataset;
  if(d.open){curId=+d.open;save('cur',curId);switchTab('edit')}
  if(d.dup){const s=mins.find(m=>m.id==d.dup);const c=JSON.parse(JSON.stringify(s));c.id=Date.now();c.dt=nowLocal();c.title=(s.title||'')+'（次回）';c.agendas.forEach(a=>{a.memo='';a.dec='';a.acts=[]});mins.push(c);curId=c.id;save('mins',mins);save('cur',curId);switchTab('edit')}
  if(d.del&&confirm('この議事録を削除しますか？')){mins=mins.filter(m=>m.id!=d.del);save('mins',mins);if(curId==d.del)curId=null;renderList()}
});

function switchTab(t){
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));
  ['edit','out','todo','list'].forEach(k=>$('tab-'+k).classList.toggle('hidden',k!==t));
  ({edit:renderEdit,out:renderOut,todo:renderTodo,list:renderList})[t]();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
window.addEventListener('beforeprint',renderOut);
renderEdit();
</script>
</body>
</html>
