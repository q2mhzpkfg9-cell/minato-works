<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>まなびクラフト</title>
<style>
:root{--ink:#3b2a1e;--cream:#f6ecd6;--cream2:#efe0c0;--hi:#fffaf0;--lo:#c4a57a;--edge:#4a3628;--wood:#c08a55;--grass:#7dbb57;--dirt:#a8744e;--red:#e2674f;--blue:#4f8fd6;--gold:#f2c14e;--ok:#6cbf5a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b2233;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;transition:opacity .6s}
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column}
.screen.on{display:flex}
.panel{background:var(--cream);border:4px solid var(--edge);box-shadow:inset 4px 4px 0 var(--hi),inset -4px -4px 0 var(--lo),0 6px 0 rgba(0,0,0,.25);border-radius:6px}
.btn{font:inherit;font-weight:800;font-size:clamp(16px,2.3vw,24px);color:#fff;background:var(--wood);border:4px solid var(--edge);box-shadow:inset 4px 4px 0 rgba(255,255,255,.35),inset -4px -4px 0 rgba(0,0,0,.2),0 5px 0 rgba(0,0,0,.3);padding:.5em 1em;cursor:pointer;text-shadow:2px 2px 0 rgba(0,0,0,.35);border-radius:6px;min-height:54px;line-height:1.25}
.btn:active{transform:translateY(3px);box-shadow:inset 4px 4px 0 rgba(255,255,255,.35),inset -4px -4px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.3)}
.btn.grass{background:linear-gradient(var(--grass) 0 30%,#6aa84a 30% 36%,var(--dirt) 36%)}
.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}.btn.gold{background:var(--gold);color:var(--ink);text-shadow:none}
.btn.cream{background:var(--cream2);color:var(--ink);text-shadow:none}
.btn.sm{font-size:clamp(14px,1.8vw,18px);min-height:44px;padding:.35em .8em}
.btn:disabled{filter:grayscale(.85);opacity:.55;cursor:default}
.btn small{display:block;font-size:.62em;opacity:.95}
h1,h2,h3{margin:0}
.px{image-rendering:pixelated;vertical-align:middle}
/* ===== タイトル ===== */
#sTitle{align-items:center;justify-content:center;padding:16px;overflow:auto}
.logo{font-size:clamp(40px,8vw,96px);font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:4px 4px 0 #a0603c,8px 8px 0 #4a3628;text-align:center;line-height:1.1}
.logo span{color:#ffe08a}
.sub{color:#fff;font-weight:800;font-size:clamp(16px,2.4vw,24px);text-shadow:2px 2px 0 #4a3628;text-align:center;margin:.4em 0 1em}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:min(900px,100%)}
.slot{padding:14px;text-align:center;cursor:pointer;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.slot:active{transform:translateY(2px)}
.slot b{font-size:22px}.slot .t{font-size:14px;color:#7a5a40}
.slot canvas{height:56px;width:auto}
.toplink{position:fixed;left:10px;top:8px;z-index:3;color:#fff;font-weight:800;text-decoration:none;text-shadow:2px 2px 0 #4a3628;font-size:14px}
.foot{color:#fff;font-size:12px;text-shadow:1px 1px 0 #4a3628;margin-top:16px;text-align:center;opacity:.95}
.foot a{color:#ffe08a}
.tchbtn{position:fixed;right:10px;top:8px;z-index:3;font-size:13px;min-height:36px;padding:.2em .7em}
.emo{font-size:1.1em;letter-spacing:2px;display:inline-block;max-width:11em;line-height:1.4}
.tt-wrap{overflow-x:auto}
.wrow{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.wq{flex:1 1 220px;margin:4px 0}
.wpad{display:flex;flex-direction:column;align-items:center;gap:8px}
#wCv{width:clamp(170px,30vh,280px);height:clamp(170px,30vh,280px);background:linear-gradient(90deg,transparent calc(50% - 1px),#ead9bb calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(transparent calc(50% - 1px),#ead9bb calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),#fff;border:4px solid var(--edge);border-radius:6px;touch-action:none;cursor:crosshair}
.wbtns{display:flex;gap:10px}.wbtns .btn{min-height:48px}
.tt{width:100%;border-collapse:collapse;font-size:14px;background:#fffdf6}
.tt th,.tt td{border:2px solid var(--lo);padding:6px 8px;text-align:left;white-space:nowrap}
.tt th{background:#efe0c0}
.tt select{font:inherit;padding:2px}
.tset textarea{width:100%;min-height:120px;font:inherit;font-size:14px;border:3px solid var(--lo);border-radius:6px;padding:8px}
.tset p{line-height:1.7;margin:.4em 0}
.tabs{display:flex;gap:6px;margin:6px 0}
.tabs .btn{min-height:40px}
.cq{display:flex;gap:8px;align-items:center;border-bottom:1px dashed var(--lo);padding:6px 0;font-size:14px}
.cq span{flex:1}
/* ===== ステージ（村・バトル共通） ===== */
.stage{position:relative;flex:1 1 auto;min-height:38%;overflow:hidden}
.scene{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px;gap:8px;z-index:3;pointer-events:none}
.hud>*{pointer-events:auto}
.tag{background:rgba(59,42,30,.78);color:#fff;font-weight:800;padding:6px 12px;border-radius:6px;border:3px solid rgba(255,255,255,.25);font-size:clamp(13px,1.8vw,18px);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag .lv{color:#ffe08a}
.hearts{display:inline-flex;gap:2px;flex-wrap:wrap}
.hearts img{height:clamp(16px,2.4vw,24px)}
.dock{flex:0 0 auto;max-height:62%;overflow:auto;margin:0 6px 6px;padding:12px 14px;border-radius:8px;z-index:2}
/* ===== 村 ===== */
#hHouse{position:absolute;left:50%;transform:translateX(-50%);bottom:22%;z-index:2}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-weight:800;font-size:clamp(14px,2vw,20px)}
.bar{height:22px;background:#d9c7a3;border:3px solid var(--edge);border-radius:4px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .6s}
.bar.k i{background:repeating-linear-gradient(90deg,#4f8fd6 0 10px,#6aa6e6 10px 20px)}
.bar.s i{background:repeating-linear-gradient(90deg,#e2674f 0 10px,#f08a6e 10px 20px)}
.bar.full{box-shadow:0 0 0 3px #ffe08a}
.msg{margin:10px 0 4px;font-weight:800;text-align:center;font-size:clamp(14px,2vw,20px)}
.msg em{font-style:normal;color:#c0503c}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.btnrow .btn{flex:1 1 140px}
/* ===== ちず・サブ画面 ===== */
.sub-screen{overflow:auto;padding:58px 12px 20px}
.sub-screen>.areas,.sub-screen>.grid,.sub-screen>.note,.sub-screen>.set{width:100%;flex:0 0 auto}
.topbar{position:fixed;left:0;right:0;top:0;z-index:4;display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(59,42,30,.85);color:#fff}
.topbar h2{font-size:clamp(18px,2.6vw,26px);flex:1}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;max-width:1200px;margin:0 auto}
.area{padding:0;overflow:hidden;position:relative}
.area .pv{position:relative;height:120px}
.area .nm{position:absolute;left:8px;bottom:6px;color:#fff;font-weight:900;font-size:20px;text-shadow:2px 2px 0 #4a3628,-1px -1px 0 #4a3628}
.area .body{padding:10px}
.stg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bossNeed .btn{display:block;margin:6px auto 0}
.bossNeed{margin-top:8px;font-size:14px;font-weight:700;line-height:1.5;text-align:center;background:#fff6e0;border-radius:8px;padding:6px}
.stg .btn{padding:.3em .2em;font-size:16px;min-height:58px}
.stg .st{display:block;font-size:13px;color:#ffe08a;letter-spacing:-1px}
.lock{position:absolute;inset:0;background:rgba(43,34,51,.72);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;padding:12px;gap:6px;font-size:17px;z-index:2}
.lock b{font-size:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:1100px;margin:0 auto}
.card{padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800}
.card canvas{height:70px;width:auto;margin:6px 0}
.card .t{font-size:13px;color:#7a5a40}
.note{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}
.note .panel{padding:12px 14px}
.row{display:grid;grid-template-columns:7.4em minmax(60px,1fr) 3.6em 5.4em;gap:8px;align-items:center;margin:8px 0;font-weight:700}
.row .btn{min-height:40px;padding:.2em .4em;font-size:15px}
.row .lk{text-align:center;color:#9a8a7a;font-size:13px}
.trainTop{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.kise{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px;max-width:1100px;margin:0 auto;width:100%;flex:0 0 auto}
@media(max-width:700px){.kise{grid-template-columns:1fr}}
.kprev{padding:14px;text-align:center;align-self:start;position:sticky;top:0}
.kprev canvas{height:190px;width:auto;margin:6px auto 10px}
.kopts{display:flex;flex-direction:column;gap:12px}
.kopts .panel{padding:10px 12px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opt{font:inherit;font-weight:800;font-size:13px;background:#fff8ea;border:3px solid var(--lo);border-radius:6px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:74px;color:var(--ink);position:relative}
.opt canvas{height:48px;width:auto}
.opt.on,.sw.on{border-color:var(--edge);box-shadow:0 0 0 3px #ffe08a}
.opt:disabled{opacity:.5;cursor:default}
.opt .lk{position:absolute;top:2px;right:4px;font-size:11px;background:#3b2a1e;color:#fff;border-radius:4px;padding:0 4px}
.sw{width:44px;height:44px;border:3px solid var(--lo);border-radius:6px;cursor:pointer}
.charas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.chara{padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:14px}
.chara canvas{height:80px!important;width:auto;margin:0!important}
@media(max-width:480px){.charas{grid-template-columns:repeat(2,1fr)}}
.row .bar{height:16px}
.row .bar i{background:var(--ok)}
.set{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.set .panel{padding:14px}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chk label{background:#fff8ea;border:3px solid var(--lo);border-radius:6px;padding:8px 10px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
.chk input{width:20px;height:20px}
/* ===== バトル ===== */
.ent{position:absolute;bottom:22%;z-index:2}
.ent canvas{animation:bob 1.6s ease-in-out infinite;transform-origin:50% 100%}
#entPl{left:12%}
#entEn{right:10%}
.plate{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center}
.plate .tag{justify-content:center}
.hpbar{width:clamp(120px,18vw,220px);height:14px;background:#3b2a1e;border:3px solid #fff;border-radius:3px;margin:4px auto 0;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(#9be27a,#5fae46);transition:width .4s}
.weak{font-size:13px;margin-top:3px}
.shield-ken canvas{filter:drop-shadow(0 0 6px #ff5a3c) drop-shadow(0 0 2px #ff5a3c)}
.shield-maho canvas{filter:drop-shadow(0 0 6px #4f8fff) drop-shadow(0 0 2px #4f8fff)}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes atkR{0%,100%{transform:none}45%{transform:translateX(40%)}}
@keyframes atkL{0%,100%{transform:none}45%{transform:translateX(-40%)}}
@keyframes hurt{0%,100%{transform:none;filter:none}20%{transform:translateX(-8%);filter:brightness(1.8) sepia(1) hue-rotate(-40deg) saturate(4)}40%{transform:translateX(7%)}60%{transform:translateX(-5%)}80%{transform:translateX(3%)}}
@keyframes die{to{transform:translateY(15%) scale(.4);opacity:0}}
@keyframes appear{from{transform:translateY(-30%);opacity:0}to{transform:none;opacity:1}}
.a-atkR{animation:atkR .45s}.a-atkL{animation:atkL .45s}.a-hurt{animation:hurt .5s}.a-die{animation:die .6s forwards}.a-appear{animation:appear .45s}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.dmg{position:absolute;font-weight:900;font-size:clamp(26px,4vw,44px);color:#fff;text-shadow:3px 3px 0 #b94a37,-2px -2px 0 #b94a37,2px -2px 0 #b94a37,-2px 2px 0 #b94a37;animation:dmg 1s forwards;transform:translateX(-50%)}
.dmg.blue{text-shadow:3px 3px 0 #2c5a9a,-2px -2px 0 #2c5a9a,2px -2px 0 #2c5a9a,-2px 2px 0 #2c5a9a}
.dmg small{display:block;font-size:.45em;text-align:center}
@keyframes dmg{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-60px}}
.pt{position:absolute;width:var(--s);height:var(--s);background:var(--c);animation:pt .7s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.slash{position:absolute;width:clamp(80px,14vw,160px);height:12px;background:linear-gradient(90deg,transparent,#fff,#ffe08a,transparent);transform:translate(-50%,-50%) rotate(-35deg);animation:slash .35s forwards}
@keyframes slash{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0);opacity:.2}}
.cmdinfo{text-align:center;font-weight:800;font-size:clamp(15px,2.2vw,22px);margin-bottom:10px}
.cmdinfo .w{display:inline-block;background:#fff3d6;border:3px solid var(--lo);border-radius:6px;padding:2px 10px;margin:2px}
.cmdrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmdrow .btn{font-size:clamp(20px,3.2vw,32px);min-height:82px;position:relative}
#cStar{grid-column:1/-1}
.rec{position:absolute;top:-12px;right:-6px;background:#ffe08a;color:var(--ink);font-size:13px;padding:2px 8px;border:3px solid var(--edge);border-radius:20px;text-shadow:none;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.charge{text-align:center;margin-top:10px;font-weight:800;font-size:14px}
.charge i{display:inline-block;width:22px;height:16px;border:3px solid var(--edge);margin:0 2px;vertical-align:middle;background:#d9c7a3}
.charge i.on{background:linear-gradient(90deg,#4f8fd6 50%,#e2674f 50%)}
.badge{display:inline-block;color:#fff;font-weight:800;padding:3px 12px;border-radius:20px;font-size:14px;border:3px solid var(--edge)}
.badge.k{background:var(--blue)}.badge.s{background:var(--red)}
.qtext{font-size:clamp(20px,3.2vw,34px);font-weight:800;text-align:center;line-height:1.6;margin:8px 0 12px}
.qtext u{text-decoration:none;border-bottom:4px solid var(--red);padding:0 2px;background:#fff3d6}
.qtext .box{display:inline-block;border:3px dashed var(--blue);border-radius:6px;padding:0 8px;background:#eef5ff}
.qtext .big{font-size:1.5em;letter-spacing:.05em}
.qtext .s2{font-size:.72em;display:block;color:#6a4a32}
.hs{margin:0 auto;font-size:1.4em;border-collapse:collapse;font-family:"Menlo","Consolas",monospace}
.hs td{padding:0 .2em;text-align:right;letter-spacing:.25em}
.hs tr.ln td{border-top:4px solid var(--ink)}
.clk{width:clamp(110px,16vw,160px);height:auto;display:block;margin:4px auto}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices .btn{font-size:clamp(20px,3.2vw,34px);min-height:70px}
.choices .btn:disabled{filter:none;opacity:.55}
.choices .btn.okk,.choices .btn.ngg{opacity:1}
.choices .btn.okk{background:var(--ok);color:#fff}
.choices .btn.ngg{background:#9a8a7a;color:#fff}
.fb{text-align:center;font-weight:800;font-size:clamp(18px,2.8vw,28px)}
.fb .ans{display:inline-block;margin:8px;padding:6px 18px;background:#fff;border:4px solid var(--ok);border-radius:8px;font-size:1.2em}
.fb .ex{font-size:.75em;color:#6a4a32;margin:6px 0 12px}
#flee{font-size:13px;min-height:36px;padding:.2em .7em}
/* ===== オーバーレイ ===== */
#ov{position:fixed;inset:0;background:rgba(30,20,30,.55);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
#ov .box{max-width:560px;width:100%;padding:20px;text-align:center;max-height:92vh;overflow:auto;animation:appear .3s}
#ov h2{font-size:clamp(24px,4vw,40px);margin-bottom:8px}
#ov p{font-size:clamp(15px,2.2vw,20px);font-weight:700;line-height:1.7;margin:.5em 0}
#ov input{font:inherit;font-size:24px;padding:10px;width:100%;border:4px solid var(--edge);border-radius:6px;text-align:center;background:#fff}
.lvup{font-size:clamp(40px,8vw,72px)!important;color:#ffe08a;text-shadow:4px 4px 0 #a0603c,-2px -2px 0 #4a3628,2px -2px 0 #4a3628,-2px 2px 0 #4a3628}
#ov canvas{height:110px;width:auto;margin:8px auto}
.stars{font-size:44px;color:#f2c14e;text-shadow:3px 3px 0 #a0603c;letter-spacing:6px}
.stars .off{color:#d6c6a8;text-shadow:none}
.gain{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.gain span{background:#fff8ea;border:3px solid var(--lo);border-radius:6px;padding:6px 12px;font-weight:800}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:30;background:#fff8ea;border:4px solid var(--edge);border-radius:8px;padding:10px 18px;font-weight:800;font-size:clamp(15px,2.2vw,22px);box-shadow:0 5px 0 rgba(0,0,0,.25);display:none;text-align:center;max-width:92vw}
#toast.on{display:block;animation:appear .3s}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- タイトル -->
<section id="sTitle" class="screen">
  <a class="toplink" href="index.html">← MINATO WORKS</a>
  <button class="btn sm cream tchbtn" onclick="openTeacherGate()">🔑 せんせいよう</button>
  <div class="logo">まなび<span>クラフト</span></div>
  <div class="sub">こくご と さんすう で そだつ ぼうけん</div>
  <div class="slots" id="slots"></div>
  <div class="foot">きろくは この たんまつの なかだけに ほぞんされます。</div>
</section>

<!-- むら -->
<section id="sHome" class="screen">
  <div class="stage" id="hStage">
    <canvas class="scene" id="hScene"></canvas>
    <canvas id="hHouse"></canvas>
    <div class="hud"><div class="tag" id="hName"></div><div class="tag" id="hGem"></div></div>
  </div>
  <div class="dock panel">
    <div class="meter">
      <span>✦ こくご</span><div class="bar k" id="mK"><i></i></div><span id="mKt"></span>
      <span>⚔ さんすう</span><div class="bar s" id="mS"><i></i></div><span id="mSt"></span>
    </div>
    <div class="msg" id="hMsg"></div>
    <div class="btnrow">
      <button class="btn grass" onclick="openMap()">ぼうけんへ</button>
      <button class="btn cream" onclick="openShop()">おみせ</button>
      <button class="btn cream" onclick="openZukan()">ずかん</button>
      <button class="btn cream" onclick="openNote()" id="hTrain">とっくん</button>
      <button class="btn cream" onclick="openKise()">きせかえ</button>
      <button class="btn cream sm" onclick="openSet()">せってい</button>
    </div>
  </div>
</section>

<!-- ちず -->
<section id="sMap" class="screen sub-screen">
  <div class="topbar"><button class="btn sm cream" onclick="goHome()">← むら</button><h2>せかいの ちず</h2><span class="tag" id="mapLv"></span></div>
  <div class="areas" id="areas"></div>
</section>

<!-- バトル -->
<section id="sBattle" class="screen">
  <div class="stage" id="bStage">
    <canvas class="scene" id="bScene"></canvas>
    <div class="hud">
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">
        <div class="tag"><span class="hearts" id="bHearts"></span></div>

function hex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function todNow(){const h=new Date().getHours();return h>=5&&h<9?'morning':h>=9&&h<16?'day':h>=16&&h<19?'evening':'night'}
const scenes=new Set();

class Scene{
  constructor(cv,o={}){this.cv=cv;this.c=cv.getContext('2d');this.ground=o.ground||.78;this.biome='grass';this.tod=null;this.seed=7;this.t=0;this.always=!!o.always;this.w=0;this.h=0;scenes.add(this)}
  set(biome,tod,seed){this.biome=biome;this.tod=tod||null;if(seed!=null)this.seed=seed;this.w=0;this.resize()}
  resize(){const r=this.cv.getBoundingClientRect();if(!r.width||!r.height)return;const px=Math.max(3,Math.round(Math.max(r.width,r.height*1.4)/210));
    const w=Math.ceil(r.width/px),h=Math.ceil(r.height/px);if(w===this.w&&h===this.h)return;this.w=w;this.h=h;this.cv.width=w;this.cv.height=h;this.build();this.frame()}
  build(){const B=BIO[this.biome],tod=timeSky()?todNow():(this.tod||B.tod),w=this.w,h=this.h,g=Math.round(h*this.ground),R=rng(this.seed*977+w);this.g=g;this.todU=tod;
    const skyC=timeSky()||(this.tod&&this.biome==='grass')||!B.sky?SKY[tod]:B.sky;
    // そら
    const sky=oc(w,h),s=sky.getContext('2d'),bands=10;
    for(let i=0;i<bands;i++){const t=i/(bands-1),col=t<.5?mix(skyC[0],skyC[1],t*2):mix(skyC[1],skyC[2],(t-.5)*2);s.fillStyle=col;s.fillRect(0,Math.floor(i*g/bands),w,Math.ceil(g/bands)+1)}

    // くも・ほし
    this.clouds=Array.from({length:B.sea||B.pyramid?3:5},()=>({x:R()*w,y:3+R()*g*.35,l:8+Math.floor(R()*14),v:.03+R()*.05}));
    this.stars=tod==='night'?Array.from({length:Math.floor(w*h/180)},()=>({x:Math.floor(R()*w),y:Math.floor(R()*g*.7),p:R()*6})):[];
    // ちけい
    const land=oc(w,h),c=land.getContext('2d');this.land=land;
    const ridge=(minY,maxY,step,gap)=>{const pts=[];for(let x=-gap;x<=w+gap*2;x+=gap)pts.push([x,minY+R()*(maxY-minY)]);const ys=[];
      for(let x=0;x<w;x++){const i=Math.floor((x+gap)/gap),a=pts[i],b=pts[i+1];const t=(x-a[0])/(b[0]-a[0]),tt=t*t*(3-2*t);ys.push(Math.round((a[1]+(b[1]-a[1])*tt)/step)*step)}return ys};
    if(B.mountains){const peaks=Array.from({length:4},(_,i)=>({cx:(i+.3+R()*.5)*w/4,H:h*(.28+R()*.18)}));
      for(let x=0;x<w;x++){let y=g;peaks.forEach(p=>{y=Math.min(y,g-p.H+Math.abs(x-p.cx)*1.1)});y=Math.round(y/2)*2;
        const top=Math.min(...peaks.map(p=>g-p.H));c.fillStyle=B.far2;c.fillRect(x,y,1,g-y);
        peaks.forEach(p=>{const py=g-p.H+Math.abs(x-p.cx)*1.1;if(Math.abs(py-y)<1&&y<g-p.H*.6){c.fillStyle=B.cap||'#ffffff';c.fillRect(x,y,1,Math.max(2,Math.round(g-p.H*.6-y)))}})}}
    else{const r1=ridge(g-h*.3,g-h*.12,2,18);c.fillStyle=B.far;r1.forEach((y,x)=>c.fillRect(x,y,1,g-y))}
    if(B.pyramid){const cx=Math.floor(w*.7),bw=Math.floor(h*.55);for(let i=0;i<bw/4;i++){const y=g-h*.06-i*2,ww=bw-i*4;c.fillStyle='#dcae6a';c.fillRect(cx-ww/2,y,ww/2,2);c.fillStyle='#c9995a';c.fillRect(cx,y,ww/2,2)}}
    if(B.castle){const cx=Math.floor(w*.7),base=g-Math.floor(h*.05),cw=Math.floor(h*.36),ch=Math.floor(h*.24),col='#3d3a63';c.fillStyle=col;
      c.fillRect(cx-cw/2,base-ch,cw,ch);[-1,1].forEach(sd=>{const tx=cx+sd*cw/2-3;c.fillRect(tx,base-ch-8,6,ch+8);for(let k=0;k<3;k++)c.fillRect(tx+k*2,base-ch-10,1,2)});
      c.fillRect(cx-3,base-ch-14,6,14);c.fillStyle='#e2674f';c.fillRect(cx,base-ch-20,4,3);c.fillStyle='#3d3a63';c.fillRect(cx,base-ch-20,1,6);
      for(let k=0;k<cw/2-4;k+=3)c.fillRect(cx-cw/2+k*2,base-ch-2,3,2);
      c.fillStyle='#ffd77a';for(let k=0;k<5;k++){c.fillRect(cx-cw/2+4+k*Math.floor(cw/5),base-ch+5,2,3)}c.fillRect(cx-1,base-8,3,8)}
    if(B.sea){const top=g-Math.floor(h*.16);c.fillStyle='#5d93c4';c.fillRect(0,top,w,g-top);c.fillStyle='#78aad4';c.fillRect(0,top,w,2);this.seaTop=top}
    else{const r2=ridge(g-h*.15,g-h*.04,2,12);c.fillStyle=B.far2;r2.forEach((y,x)=>c.fillRect(x,y,1,g-y));
      if(B.back){for(let x=2;x<w;x+=5+Math.floor(R()*4))this.oak(c,x,r2[Math.min(w-1,x)]+1,R,'#3f7a44','#4d8a4c',.6)}}
    // じめん（ブロック）
    const img=c.getImageData(0,0,w,h),d=img.data,BS=Math.max(5,Math.round(h/15));
    const put=(x,y,hx,dk)=>{const v=hex(hx),i=(y*w+x)*4;d[i]=v[0]-dk;d[i+1]=v[1]-dk;d[i+2]=v[2]-dk;d[i+3]=255};
    const drip=Array.from({length:w},()=>R()<.45?1:0);
    for(let x=0;x<w;x++)for(let y=g;y<h;y++){const yy=y-g,edge=(x%BS===0||yy%BS===0)?10:0;
      if(yy<2+drip[x])put(x,y,R()<.18?B.top2:B.top,edge);else put(x,y,R()<.3?B.dirt2:B.dirt,edge)}
    c.putImageData(img,0,0);
    // き・かざり
    const xs=[];for(let i=0;i<B.n*3&&xs.length<B.n;i++){const x=Math.floor(4+R()*(w-8));if(x>w*.4&&x<w*.6)continue;if(xs.some(v=>Math.abs(v-x)<9))continue;xs.push(x)}
    xs.forEach(x=>{if(B.tree==='oak')this.oak(c,x,g,R,B.leaf,B.leaf2,1);else if(B.tree==='spruce')this.spruce(c,x,g,R);else if(B.tree==='cactus')this.cactus(c,x,g,R);else this.palm(c,x,g,R)});
    if(B.deco==='flower'){for(let i=0;i<w/7;i++){const x=Math.floor(R()*w);c.fillStyle='#4f9a3a';c.fillRect(x,g-1,1,1);c.fillStyle=pick(['#f3a6c0','#ffe27a','#ffffff','#f08a6e']);c.fillRect(x,g-2,1,1)}}
    if(B.deco==='mush'){for(let i=0;i<w/16;i++){const x=Math.floor(R()*w);c.fillStyle='#f3e2c4';c.fillRect(x+1,g-1,1,1);c.fillStyle='#e2674f';c.fillRect(x,g-2,3,1)}}
    if(tod==='night'&&(this.biome==='grass'||timeSky())){c.globalCompositeOperation='source-atop';c.fillStyle='rgba(30,30,90,.45)';c.fillRect(0,0,w,h);c.globalCompositeOperation='source-over'}
    if(tod==='evening'&&(this.biome==='grass'||timeSky())){c.globalCompositeOperation='source-atop';c.fillStyle='rgba(240,120,60,.18)';c.fillRect(0,0,w,h);c.globalCompositeOperation='source-over'}
  }
  oak(c,x,g,R,l1,l2,sc){const th=Math.round((5+R()*4)*sc);c.fillStyle='#8a5a3b';c.fillRect(x,g-th,2,th);const lw=Math.round(10*sc),lh=Math.round(7*sc),lx=x+1-Math.floor(lw/2),ly=g-th-lh+2;
    c.fillStyle=l1;c.fillRect(lx,ly,lw,lh);c.fillRect(lx+1,ly-1,lw-2,1);c.clearRect(lx,ly,1,1);c.clearRect(lx+lw-1,ly,1,1);c.fillStyle=l2;for(let i=0;i<lw*lh/6;i++)c.fillRect(lx+Math.floor(R()*lw),ly+Math.floor(R()*(lh-1)),1,1);
    if(sc===1&&R()<.4){c.fillStyle='#e2674f';c.fillRect(lx+2+Math.floor(R()*(lw-4)),ly+2+Math.floor(R()*3),1,1)}}
  spruce(c,x,g,R){c.fillStyle='#6a4a32';c.fillRect(x,g-3,2,3);const L=[11,9,9,7,5,3,1];L.forEach((ww,i)=>{const y=g-5-i*2;c.fillStyle=i%2?'#2f6150':'#3b6e5a';c.fillRect(x+1-Math.floor(ww/2),y,ww,2);c.fillStyle='#ffffff';c.fillRect(x+1-Math.floor(ww/2),y,Math.max(1,Math.floor(ww/3)),1)})}
  cactus(c,x,g,R){const hh=8+Math.floor(R()*6);c.fillStyle='#5c9c4c';c.fillRect(x,g-hh,3,hh);c.fillRect(x-3,g-hh+4,3,2);c.fillRect(x-3,g-hh+1,2,4);c.fillRect(x+3,g-hh+6,3,2);c.fillRect(x+4,g-hh+3,2,4);c.fillStyle='#4a8a3c';for(let y=g-hh;y<g;y+=2)c.fillRect(x+1,y,1,1)}
  palm(c,x,g,R){for(let i=0;i<14;i++){c.fillStyle=i%2?'#9a6b42':'#b07c4e';c.fillRect(x+Math.round(i*i/45),g-i-1,2,1)}const tx=x+4,ty=g-15;c.fillStyle='#4f9a48';
    [[-1,0],[1,0],[-1,1],[1,1]].forEach(([dx,dd])=>{for(let k=0;k<7;k++)c.fillRect(tx+dx*k,ty+Math.floor(k*k/(dd?6:12)),1+(k<3?1:0),1)});c.fillStyle='#7a4a2a';c.fillRect(tx,ty+1,2,2)}
  frame(){if(!this.w)return;const c=this.c,w=this.w,h=this.h,g=this.g,tod=this.todU;this.t++;c.drawImage(this.sky,0,0);

    if(tod==='night'){this.stars.forEach(s=>{const a=.5+.5*Math.sin(this.t*.08+s.p);c.fillStyle=`rgba(255,250,220,${a})`;c.fillRect(s.x,s.y,1,1)});sx=w*.82;sy=h*.1;col='#f4f0d8'}

}

function mkQ(subj,cat,text,ans,opts,ex){const set=[...new Set([String(ans),...opts.map(String)])].slice(0,4);return{subj,cat,text,ans:String(ans),choices:shuffle(set),ex:ex||''}}
function numOpts(ans,extra=[]){const c=new Set([ans]);extra.forEach(v=>{if(v>=0&&c.size<4)c.add(v)});
  const offs=shuffle([1,-1,2,-2,10,-10,ans>=100?100:9,ans>=100?-100:11]);for(const o of offs){if(c.size>=4)break;const v=ans+o;if(v>=0)c.add(v)}let k=3;while(c.size<4)c.add(ans+k++);return[...c]}

function clockSVG(h,m){let s='<svg class="clk" viewBox="-70 -70 140 140"><circle r="64" fill="#fffaf0" stroke="#4a3628" stroke-width="6"/>';
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?58:53;s+=`<line x1="${Math.sin(a)*r1}" y1="${-Math.cos(a)*r1}" x2="${Math.sin(a)*60}" y2="${-Math.cos(a)*60}" stroke="#4a3628" stroke-width="${i%5?1.5:3}"/>`}
  for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;s+=`<text x="${Math.sin(a)*44}" y="${-Math.cos(a)*44+6}" text-anchor="middle" font-size="16" font-weight="800" fill="#3b2a1e">${i}</text>`}
  const ha=((h%12)+m/60)*30*Math.PI/180,ma=m*6*Math.PI/180;
  s+=`<line x1="0" y1="0" x2="${Math.sin(ha)*30}" y2="${-Math.cos(ha)*30}" stroke="#c0503c" stroke-width="7" stroke-linecap="round"/><line x1="0" y1="0" x2="${Math.sin(ma)*50}" y2="${-Math.cos(ma)*50}" stroke="#2c5a9a" stroke-width="4.5" stroke-linecap="round"/><circle r="5" fill="#3b2a1e"/></svg>`;return s}

function simMask(a,b){const da=dil(a,1),db=dil(b,1);let A=0,B=0,ab=0,ba=0;for(let i=0;i<a.length;i++){if(a[i]){A++;if(db[i])ab++}if(b[i]){B++;if(da[i])ba++}}
  const rc=A?ab/A:0,pr=B?ba/B:0;return rc+pr?2*rc*pr/(rc+pr):0}
// 書いた字が、その学年の漢字ぜんぶの中で target に「上位K位以内」に近ければ OK
function judgeKanji(cv,target,cands){const bb=bboxOf(cv);if(!bb)return{ok:false,empty:true};const m=normMask(cv,bb);
  const list=[...new Set(cands.concat(target))];const sc=list.map(k=>[k,simMask(glyphMask(k),m)]).sort((a,b)=>b[1]-a[1]);
  const rank=sc.findIndex(x=>x[0]===target),K=Math.max(3,Math.round(list.length*.02));return{ok:rank<K&&sc[rank][1]>.5&&sc[rank][1]>=sc[0][1]-.08,rank,score:sc[rank][1],top:sc[0][0]}}

let WR=null;
function renderWrite(q,tag,onDone){const dock=$('#bDock');
  dock.innerHTML=`<div style="text-align:center"><span class="badge k">✦ こくご・${q.cat}</span>${tag?` <span class="badge" style="background:#f2c14e;color:#3b2a1e">${tag}</span>`:''}</div>
   <div class="wrow"><div class="qtext wq">${q.text}</div><div class="wpad"><canvas id="wCv" width="300" height="300"></canvas><div class="wbtns"><button class="btn cream" id="wClr">けす</button><button class="btn grass" id="wOk">かけた！</button></div></div></div>`;
  setTimeout(()=>kanjiWords().forEach(x=>glyphMask(x.k)),50);const cv=$('#wCv'),c=cv.getContext('2d');c.lineCap='round';c.lineJoin='round';WR={strokes:[],tries:0};let drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;last=pos(e);c.strokeStyle='#3b2a1e';c.lineWidth=17;c.beginPath();c.arc(last[0],last[1],8,0,7);c.fillStyle='#3b2a1e';c.fill()};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);c.beginPath();c.moveTo(last[0],last[1]);c.lineTo(p[0],p[1]);c.stroke();last=p};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
  $('#wClr').onclick=()=>{SFX.tap();c.clearRect(0,0,300,300)};
  $('#wOk').onclick=async()=>{const r=judgeKanji(cv,q.write,kanjiWords().map(x=>x.k));
    if(r.empty){toast('かんじを かいてね');return}
    if(!r.ok&&WR.tries===0){WR.tries++;SFX.ng();toast('おしい！ もういちど ていねいに かいて みよう',2200);c.clearRect(0,0,300,300);return}
    $('#wOk').disabled=$('#wClr').disabled=true;cv.onpointerdown=null;
    c.save();c.globalAlpha=.35;c.fillStyle=r.ok?'#3cae5a':'#e2674f';c.font=`700 240px ${KFONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText(q.write,150,158);c.restore();
    await sleep(700);onDone(r.ok)}}

function genQ(subj,ai){const A=pack().areas[ai];const cur=A[subj];const all=[...new Set(pack().areas.slice(0,ai+1).flatMap(a=>a[subj]))];
  const cs=customs(subj);if(cs.length&&!isOff(CUSTOM)&&Math.random()<(S.customRate||.3))return genCat(CUSTOM,subj,ai);
  const ok=c=>!isOff(c);let pool=Math.random()<.6?cur.filter(ok):all.filter(ok);if(!pool.length)pool=all.filter(ok);
  if(!pool.length)pool=catsOf(subj).filter(c=>ok(c)&&c!==CUSTOM);if(!pool.length)pool=[cur[0]];
  return genCat(pick(pool),subj,ai)}

function rec(cat,ok){const p=P();p.last=Date.now();const r=p.rec[cat]||[0,0];r[1]++;if(ok)r[0]++;p.rec[cat]=r}
function addExp(subj,n){const p=P(),hi=cum(p.lv+1),before=p[subj];p[subj]+=n;B.gain[subj]+=n;const nl=lvOf(p.k,p.s);
  if(nl>p.lv){const old=p.lv;p.lv=nl;save();return old}
  const o=subj==='k'?'s':'k';if(p.lv<MAXLV&&before<hi&&p[subj]>=hi&&p[o]<hi)toast(`${subj==='k'?'✦ こくご':'⚔ さんすう'}の ちからが たまった！<br>${o==='k'?'こくご':'さんすう'}も がんばると レベルアップ！`,2600);
  save();return 0}

function particles(x,y,cols,n=14){const fx=$('#fx');for(let i=0;i<n;i++){const d=document.createElement('div');d.className='pt';const a=Math.random()*Math.PI*2,v=40+Math.random()*70;

const maxArea=p=>{let m=0;AREAS.forEach((a,i)=>{if(areaOpen(p,i))m=i});return m};
function availCats(){const p=P(),m=maxArea(p);const s=new Set(pack().areas.slice(0,m+1).flatMap(a=>a.s.concat(a.k)).filter(c=>!isOff(c)));if(!isOff(CUSTOM)){if(customs('s').length||customs('k').length)s.add(CUSTOM)}return s}
function weakest(){const p=P(),av=[...availCats()];if(!av.length)return null;
  const sc=c=>{const[a,t]=p.rec[c]||[0,0];return t<3?.7+Math.random()*.1:a/t};return av.sort((x,y)=>sc(x)-sc(y))[0]}
function weakestOf(subj){const p=P(),av=[...availCats()].filter(c=>c!==CUSTOM&&subjOfCat(c)===subj);if(!av.length)return null;
  const sc=c=>{const[a,t]=p.rec[c]||[0,0];return t<3?.7:a/t};return av.sort((x,y)=>sc(x)-sc(y))[0]}

  const w=weakest();
  $('#noteBody').innerHTML=`<div class="panel trainTop"><div style="font-weight:800;line-height:1.6">🎯 <b>とっくんコーナー</b><br><span style="font-weight:700;font-size:15px">1つの ところを 10もん れんしゅう。まちがえた もんだいは さいごに もういちど でるよ。</span></div>${w?`<button class="btn gold" onclick="startTrain('${w}')">にがて おまかせ とっくん<small>いまは「${w}」</small></button>`:''}</div>`
   +(w?`<div class="panel trainTop"><div style="font-weight:800;line-height:1.6">📅 <b>きょうの とっくん</b><br><span style="font-weight:700;font-size:15px">${dailyDone()?`きょうは できたね！ ${p.dstreak||1}にち れんぞく。また あした！`:`1にち 1かい。おわると 💎5こ。7にち つづけると さらに 💎10こ！${p.dstreak?`（いま ${p.dstreak}にち れんぞく）`:''}`}</span></div>${dailyDone()?'':`<button class="btn red" onclick="startDaily('${w}')">きょうの とっくん<small>「${w}」</small></button>`}</div>`:'')
   +part('✦ こくご',catsOf('k').filter(c=>c!==CUSTOM),'#2c5a9a')+part('⚔ さんすう',catsOf('s').filter(c=>c!==CUSTOM),'#c0503c')+(av.has(CUSTOM)?part('🔑 せんせいの もんだい',[CUSTOM],'#6b4a2b'):'')+`<div class="panel" style="grid-column:1/-1;font-weight:700;line-height:1.7">オレンジの バーは せいかいりつ 60% より ひくい ところ。<br>🔒の ところは、ぼうけんで あたらしい エリアに いくと とっくん できるように なるよ。</div>`}
function openSet(){show('sSet');bgScene.set('grass',todNow(),9);const box=$('#setBody');
  box.innerHTML=`<div class="panel"><h3>おと</h3><div class="chk"><label><input type="checkbox" id="snd" ${S.sound?'checked':''}>こうかおんを ならす</label></div></div>
   <div class="panel"><h3>けしき</h3><div class="chk"><label><input type="checkbox" id="skyT" ${timeSky()?'checked':''}>そらの いろを いまの じかんに あわせる（けしきは ランダム）</label></div><p style="margin:.4em 0;font-size:14px">あさ・ひる・ゆうがた・よるで そらの いろが かわるよ。チェックを はずすと エリアごとの けしきに なるよ。</p></div>
   <div class="panel"><h3>ほかの セーブ</h3><div class="btnrow" style="justify-content:flex-start"><button class="btn sm cream" onclick="openTitle()">タイトルへ もどる</button></div></div>
   <div class="panel"><h3>せんせいよう</h3><p style="margin:.4em 0">がくねん・もんだいの せってい、きろくの いちらんは せんせいが かくにんします。</p><div class="btnrow" style="justify-content:flex-start"><button class="btn sm cream" onclick="openTeacherGate()">🔑 せんせいよう がめん</button></div></div>`;
  $('#snd').onchange=e=>{S.sound=e.target.checked;save()};
  $('#skyT').onchange=e=>{S.sky=e.target.checked?'time':'area';save();scenes.forEach(s=>{if(s.w){s.w=0;s.resize()}})}}

/* ---------- 先生用 管理画面 ---------- */
async function openTeacherGate(){
  if(!S.pin){const v=await askText('<h2>先生用の暗証番号</h2><p>はじめに、先生用画面に入るための<br>4けた以上の番号を決めてください。</p>','password','決める');if(!v)return;if(!/^\d{4,}$/.test(v)){toast('4けた以上の数字にしてください');return}S.pin=v;save();openTeacher();return}
  const v=await askText('<h2>先生用</h2><p>暗証番号を入れてください</p>','password','入る');if(v==null)return;if(v===S.pin)openTeacher();else toast('番号が ちがいます')}
function askText(html,type,ok){return new Promise(res=>{$('#ovBox').innerHTML=html+`<input id="atIn" type="${type}" inputmode="numeric" autocomplete="off"><div class="btnrow"><button class="btn cream" id="atNo">やめる</button><button class="btn grass" id="atOk">${ok}</button></div>`;
  $('#ov').classList.add('on');const inp=$('#atIn');setTimeout(()=>inp.focus(),50);
  $('#atOk').onclick=()=>{$('#ov').classList.remove('on');res(inp.value.trim())};$('#atNo').onclick=()=>{$('#ov').classList.remove('on');res(null)};inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)$('#atOk').click()}})}
function leaveTeacher(){if(P())goHome();else openTitle()}
let tGrade=2;
const pct=(a,t)=>t?Math.round(a/t*100)+'%':'−';
function sumRec(p,subj){let a=0,t=0;const g=p.grade||2;Object.entries(p.rec).forEach(([c,r])=>{const s=c===CUSTOM?null:(catsOf('s',g).includes(c)?'s':'k');if(s===subj){a+=r[0];t+=r[1]}});return[a,t]}
function weakOf(p){return Object.entries(p.rec).filter(([c,r])=>r[1]>=3).map(([c,r])=>[c,r[0]/r[1]]).filter(x=>x[1]<.7).sort((a,b)=>a[1]-b[1]).slice(0,2).map(x=>`${x[0]}(${Math.round(x[1]*100)}%)`).join('、')||'−'}
const fmtDate=t=>t?new Date(t).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}):'−';
function openTeacher(){show('sTeacher');bgScene.set('grass',todNow(),12);renderTeacher()}
function renderTeacher(){const rows=S.slots.map((p,i)=>{if(!p)return`<tr><td>${i+1}</td><td colspan="9" style="color:#9a8a7a">（空き）</td></tr>`;const[ka,kt]=sumRec(p,'k'),[sa,st]=sumRec(p,'s');
    return`<tr><td>${i+1}</td><td><b>${esc(p.name)}</b></td><td><select data-g="${i}">${[1,2,3,4,5,6].map(g=>`<option value="${g}" ${(p.grade||2)===g?'selected':''}>${g}年</option>`).join('')}</select></td><td>Lv${p.lv}</td>
    <td>${pct(ka,kt)} <small>(${ka}/${kt})</small></td><td>${pct(sa,st)} <small>(${sa}/${st})</small></td><td>${weakOf(p)}</td><td>${fmtDate(p.last)}</td>
    <td><button class="btn sm cream" data-reset="${i}">記録リセット</button> <button class="btn sm red" data-del="${i}">消す</button></td></tr>`}).join('');
  const chk=(cats,g)=>cats.filter(c=>c!==CUSTOM).map(c=>`<label><input type="checkbox" data-c="${c}" ${isOff(c,g)?'':'checked'}>${c}</label>`).join('');
  const cl=(S.custom||[]).map((c,i)=>`<div class="cq"><span><b>${c.subj==='k'?'国語':'算数'}</b>・${c.g?c.g+'年':'全学年'}：${esc(c.q)} → <b>${esc(c.a)}</b>（${c.w.map(esc).join('／')}）</span><button class="btn sm cream" data-cdel="${i}">削除</button></div>`).join('')||'<p style="color:#9a8a7a">まだ ありません</p>';
  $('#tBody').innerHTML=`
  <div class="panel"><h3>記録の一覧（この端末）</h3><p>正答率70%未満で3問以上解いた単元を「苦手」に表示します。学年を変えると、その学年の問題が出るようになります。</p>
   <div class="tt-wrap"><table class="tt"><tr><th>#</th><th>名前</th><th>学年</th><th>レベル</th><th>国語 正答率</th><th>算数 正答率</th><th>苦手な単元</th><th>最終</th><th>操作</th></tr>${rows}</table></div>
   <div class="btnrow" style="justify-content:flex-start"><button class="btn sm grass" onclick="exportCSV()">記録をCSVで書き出す（Excel用）</button></div>
   <p style="font-size:14px">※ 記録は各端末のブラウザに保存されています。クラス全体を集めるときは、端末ごとにCSVを書き出して1つのExcelにまとめてください。</p></div>
  <div class="panel"><h3>出題する単元</h3><p>まだ習っていない単元はチェックを外してください。学年ごとに設定できます（この端末の全員に共通）。</p>
   <div class="tabs">${[1,2,3,4,5,6].map(g=>`<button class="btn sm ${g===tGrade?'gold':'cream'}" data-tg="${g}">${g}年</button>`).join('')}</div>
   <b style="color:#2c5a9a">国語</b><div class="chk">${chk(catsOf('k',tGrade),tGrade)}</div><br><b style="color:#c0503c">算数</b><div class="chk">${chk(catsOf('s',tGrade),tGrade)}</div></div>
  <div class="panel"><h3>先生オリジナル問題</h3><p>1行に1問。<b>教科, 問題文, 正解, まちがい1, まちがい2, まちがい3</b> の順に、カンマかタブ（Excelからコピー）で区切って貼り付けます。まちがいは1〜3個。</p>
   <p style="font-size:14px;background:#fff8ea;padding:6px 10px;border-radius:6px">例）国語, 「うみ」を漢字で書くと？, 海, 毎, 悔<br>例）算数, 1日は何時間？, 24, 12, 60, 100</p>
   <textarea id="cqIn" placeholder="国語, 問題文, 正解, まちがい1, まちがい2"></textarea>
   <div class="btnrow" style="justify-content:flex-start;align-items:center">対象：<select id="cqG"><option value="0">全学年</option>${[1,2,3,4,5,6].map(g=>`<option value="${g}">${g}年</option>`).join('')}</select>
    出る割合：<select id="cqR">${[[.15,'少なめ'],[.3,'ふつう'],[.5,'多め']].map(([v,n])=>`<option value="${v}" ${(S.customRate||.3)==v?'selected':''}>${n}</option>`).join('')}</select>
    <button class="btn sm grass" id="cqAdd">追加する</button></div>
   <div style="margin-top:8px">${cl}</div>${S.custom.length?'<div class="btnrow" style="justify-content:flex-start"><button class="btn sm red" id="cqClr">オリジナル問題を全部消す</button></div>':''}</div>
  <div class="panel"><h3>その他</h3><div class="btnrow" style="justify-content:flex-start"><button class="btn sm cream" id="pinCh">暗証番号を変える</button></div>
   <p><b>しくみ</b><br>・けん＝算数、まほう＝国語の問題に正解すると攻撃。国語と算数の経験値は別々に貯まり、<b>両方</b>が基準に届くとレベルアップします（最高Lv.50。Lv.19以降は1レベル＝各教科30問）。<br>・エリアは10こ（ステージ数：1〜2＝3、3〜5＝5、6〜7＝7、8〜10＝10）。各ボスに挑むには決まったレベル（Lv.3/5/7/9/11/13/15/17/19/20）が必要で、ステージやとっくんでレベルを上げてから挑みます。エリア7〜10はそれまでの単元のまとめです。<br>・「きょうのとっくん」は1日1回、にがてな単元を10問。終わると宝石5こ、7日連続でさらに10こ。ボスは赤／青のバリアで両教科が必要です。<br>・とっくんコーナーでは、1つの単元を10問練習できます（誤答は最後に再出題）。<br>・学年パック：1〜6年。漢字は各学年の配当漢字（1年80・2年160・3年200・4年202・5年193・6年191字）から出題します。<br>・「かんじを かく」は指で書いた字を自動判定します（その学年の漢字すべての中で形が近いかで判定。とめ・はね・書き順までは見ません）。1回目に合わなければ書き直しができます。</p></div>`;
  const B_=$('#tBody');
  B_.querySelectorAll('[data-g]').forEach(s=>s.onchange=()=>{S.slots[+s.dataset.g].grade=+s.value;save();toast('学年を変えました');renderTeacher()});
  B_.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{tGrade=+b.dataset.tg;renderTeacher()});
  B_.querySelectorAll('[data-c]').forEach(i=>i.onchange=()=>{const k=offK(i.dataset.c,tGrade);if(i.checked)delete S.off[k];else S.off[k]=true;save()});
  B_.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.del;const v=await modal(`<h2>本当に消しますか？</h2><p>「${esc(S.slots[i].name)}」のセーブをすべて消します。元に戻せません。</p>`,[['やめる','cream',0],['消す','red',1]]);if(v){S.slots[i]=null;if(S.cur===i)S.cur=-1;save();renderTeacher()}});
  B_.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.reset;const v=await modal(`<h2>正答の記録をリセット</h2><p>「${esc(S.slots[i].name)}」の単元ごとの正答記録だけを消します（レベル・きせかえは残ります）。</p>`,[['やめる','cream',0],['リセット','red',1]]);if(v){S.slots[i].rec={};save();renderTeacher()}});
  B_.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{S.custom.splice(+b.dataset.cdel,1);save();renderTeacher()});
  $('#cqR').onchange=e=>{S.customRate=+e.target.value;save()};
  $('#cqAdd').onclick=()=>{const g=+$('#cqG').value;let n=0,bad=0;$('#cqIn').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{const f=l.split(/\t|,|，/).map(x=>x.trim()).filter(x=>x!=='');
      const subj=/^(国語|こくご|国|k)$/i.test(f[0])?'k':/^(算数|さんすう|算|s)$/i.test(f[0])?'s':null;if(!subj||f.length<4){bad++;return}
      S.custom.push({subj,g,q:f[1],a:f[2],w:[...new Set(f.slice(3,6))].filter(x=>x!==f[2])});n++});
    save();toast(`${n}問 追加しました${bad?`（${bad}行は形が合わず追加できませんでした）`:''}`,3000);renderTeacher()};
  if($('#cqClr'))$('#cqClr').onclick=async()=>{const v=await modal('<h2>オリジナル問題を全部消す？</h2>',[['やめる','cream',0],['消す','red',1]]);if(v){S.custom=[];save();renderTeacher()}};
  $('#pinCh').onclick=async()=>{const v=await askText('<h2>新しい暗証番号</h2><p>4けた以上の数字</p>','password','変える');if(v&&/^\d{4,}$/.test(v)){S.pin=v;save();toast('変えました')}else if(v)toast('4けた以上の数字にしてください')}}
function exportCSV(){const q=s=>`"${String(s).replace(/"/g,'""')}"`;const L=[['名前','学年','レベル','教科','単元','正解数','問題数','正答率(%)','最終プレイ'].map(q).join(',')];
  S.slots.forEach(p=>{if(!p)return;const g=p.grade||2;Object.entries(p.rec).forEach(([c,r])=>{const s=c===CUSTOM?'先生問題':catsOf('s',g).includes(c)?'算数':'国語';
    L.push([p.name,g,p.lv,s,c,r[0],r[1],r[1]?Math.round(r[0]/r[1]*100):'',p.last?new Date(p.last).toLocaleString('ja-JP'):''].map(q).join(','))})});
  const blob=new Blob(['﻿'+L.join('\r\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`まなびクラフト_記録_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ---------- きせかえ ---------- */
function unlockItems(old,lv){const it=[...WEARS,...ACCS].filter(x=>x.lv>old&&x.lv<=lv);return it.length?`<p>👕 きせかえ「${it.map(x=>x.n).join('・')}」が つかえるように なった！</p>`:''}
function openKise(){show('sKise');bgScene.set('grass',todNow(),6);renderKise()}
function renderKise(){const p=P(),l=lookOf(p);drawPlayer($('#kCv'),p);$('#kName').textContent=p.name;
  const parts=(title,list,key)=>`<div class="panel"><h3>${title}</h3><div class="opts">${list.map(it=>{const lock=it.lv&&p.lv<it.lv;
    return`<button class="opt ${l[key]===it.id?'on':''}" data-k="${key}" data-v="${it.id}" ${lock?'disabled':''}><canvas></canvas>${it.n}${lock?`<span class="lk">Lv${it.lv}</span>`:''}</button>`}).join('')}</div></div>`;
  const cols=(title,key)=>`<div class="panel"><h3>${title}</h3><div class="opts">${COLORS[key].map(c=>`<button class="sw ${l[key]===c?'on':''}" data-k="${key}" data-v="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div></div>`;
  $('#kOpts').innerHTML=parts('かみがた',HAIRS,'hair')+cols('かみの いろ','hc')+cols('はだの いろ','skin')+parts('ふく',WEARS,'wear')+cols('ふくの いろ','cc')+cols('ズボンの いろ','pc')+parts('アクセサリー',ACCS,'acc')+cols('アクセサリーの いろ','xc');
  $('#kOpts').querySelectorAll('.opt').forEach(b=>{const tmp={lv:p.lv,look:Object.assign({},l,{[b.dataset.k]:b.dataset.v})};drawPlayer(b.querySelector('canvas'),tmp)});
  $('#kOpts').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{l[b.dataset.k]=b.dataset.v;save();SFX.tap();renderKise()});layoutKise()}
function layoutKise(){}
function randomLook(){const p=P(),l=lookOf(p),ok=a=>a.filter(x=>!x.lv||p.lv>=x.lv);
  Object.assign(l,{hair:pick(HAIRS).id,wear:pick(ok(WEARS)).id,acc:pick(ok(ACCS)).id,hc:pick(COLORS.hc),skin:pick(COLORS.skin),cc:pick(COLORS.cc),pc:pick(COLORS.pc),xc:pick(COLORS.xc)});save();SFX.tap();renderKise()}

/* ===================== はじめる ===================== */
function init(){load();ICON.heart=iconURL(SPR.heart,{r:'#e2564a',w:'#ffb3a8'});ICON.heart0=iconURL(SPR.heart,{r:'#6b5a50',w:'#8a7a70'});ICON.gem=iconURL(SPR.gem,{a:'#1f7a5a',b:'#3cc48a',w:'#c8ffe6'});
  bgScene=new Scene($('#bg'),{always:true,ground:.82});homeScene=new Scene($('#hScene'));battleScene=new Scene($('#bScene'));
  window.addEventListener('resize',()=>{scenes.forEach(s=>s.resize());layout()});requestAnimationFrame(loop);
  if(S.cur>=0&&P())goHome();else openTitle()}
init();
</script>
