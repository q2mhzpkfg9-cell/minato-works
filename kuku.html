<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>くくれんしゅう</title>
<style>
  :root{
    --bg:#fff7e6; --card:#ffffff; --primary:#ff8a3d; --primary-d:#e96b1f;
    --accent:#3db9ff; --ok:#4caf50; --ng:#e53935; --text:#333;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  body{display:flex;align-items:center;justify-content:center;padding:12px}
  .app{width:100%;max-width:480px;background:var(--card);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:20px;}
  h1{margin:4px 0 16px;text-align:center;color:var(--primary-d);font-size:1.6rem}
  .screen{display:none}
  .screen.active{display:block}
  button{font-family:inherit;cursor:pointer;border:none}
  .menu-btn{display:block;width:100%;padding:18px;margin:10px 0;font-size:1.25rem;border-radius:18px;background:var(--primary);color:#fff;font-weight:700;box-shadow:0 4px 0 var(--primary-d);transition:transform .05s}
  .menu-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--primary-d)}
  .menu-btn.sub{background:var(--accent);box-shadow:0 4px 0 #2a8ec9}
  .menu-btn.sub:active{box-shadow:0 2px 0 #2a8ec9}
  .dan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
  .dan-btn{padding:18px 0;font-size:1.4rem;border-radius:16px;background:#fff;border:3px solid var(--primary);color:var(--primary-d);font-weight:700}
  .dan-btn:active{background:var(--primary);color:#fff}
  .top-bar{display:flex;justify-content:space-between;align-items:center;font-size:1rem;margin-bottom:10px;color:#666}
  .back{background:#eee;border-radius:12px;padding:6px 12px;font-size:.9rem}
  .question{text-align:center;font-size:3rem;font-weight:800;margin:20px 0 10px;color:#222;letter-spacing:.05em}
  .answer-box{text-align:center;font-size:2.4rem;font-weight:700;background:#f5f5f5;border-radius:16px;padding:14px;min-height:64px;letter-spacing:.1em}
  .answer-box.ok{background:#dff5e1;color:var(--ok)}
  .answer-box.ng{background:#ffe1e0;color:var(--ng)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .pad button{padding:18px 0;font-size:1.6rem;font-weight:700;border-radius:14px;background:#fff;border:2px solid #ddd}
  .pad button:active{background:#ffe6cc}
  .pad .ctrl{background:#eee}
  .pad .go{background:var(--primary);color:#fff;border-color:var(--primary-d)}
  .stats{display:flex;justify-content:space-around;margin-top:8px;font-size:1rem;color:#555}
  .result{text-align:center;padding:20px}
  .result h2{color:var(--primary-d);font-size:1.6rem;margin:6px 0}
  .big{font-size:3rem;font-weight:800;color:var(--accent);margin:10px 0}
  .timer{font-weight:800;color:var(--ng)}
  .float-msg{height:28px;text-align:center;font-weight:800;font-size:1.2rem;margin-top:6px;color:var(--primary-d);transition:opacity .3s;opacity:0}
  .float-msg.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <h1>くくれんしゅう</h1>

  <!-- メニュー -->
  <div id="screen-menu" class="screen active">
    <button class="menu-btn" data-mode="dan">だんべつ れんしゅう</button>
    <button class="menu-btn sub" data-mode="random">ランダム しゅつだい</button>
    <button class="menu-btn sub" data-mode="time">タイムアタック(60びょう)</button>
  </div>

  <!-- 段選択 -->
  <div id="screen-dan" class="screen">
    <div class="top-bar"><button class="back" data-back>← もどる</button><span>どの だん?</span><span></span></div>
    <div class="dan-grid" id="danGrid"></div>
  </div>

  <!-- 出題順選択 -->
  <div id="screen-danOrder" class="screen">
    <div class="top-bar"><button class="back" data-back>← もどる</button><span id="danOrderTitle"></span><span></span></div>
    <button class="menu-btn" data-order="seq">じゅんばん (1→9)</button>
    <button class="menu-btn sub" data-order="rand">ランダム</button>
  </div>

  <!-- 問題 -->
  <div id="screen-quiz" class="screen">
    <div class="top-bar">
      <button class="back" data-back>← やめる</button>
      <span id="progress"></span>
      <span id="timer" class="timer"></span>
    </div>
    <div class="question" id="question">- × - = ?</div>
    <div class="answer-box" id="answerBox">　</div>
    <div class="pad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button class="ctrl" data-act="clear">C</button>
      <button>0</button>
      <button class="go" data-act="go">OK</button>
    </div>
    <div class="stats">
      <span>○ <span id="okCount">0</span></span>
      <span>× <span id="ngCount">0</span></span>
      <span>🔥 <span id="comboCount">0</span></span>
      <span>⭐ <span id="pointCount">0</span></span>
    </div>
    <div id="floatMsg" class="float-msg"></div>
  </div>

  <!-- 結果 -->
  <div id="screen-result" class="screen">
    <div class="result">
      <h2 id="resultTitle">けっか</h2>
      <div class="big" id="resultBig"></div>
      <div id="resultSub"></div>
      <button class="menu-btn" data-back style="margin-top:20px">メニューに もどる</button>
    </div>
  </div>
</div>

<script>
(()=>{
  const $ = s => document.querySelector(s);
  const screens = document.querySelectorAll('.screen');
  const show = id => screens.forEach(s => s.classList.toggle('active', s.id===id));

  let mode = null;        // 'dan' | 'random' | 'time'
  let dan = null;
  let queue = [];         // 段別/ランダム用
  let idx = 0;
  let total = 10;
  let ok = 0, ng = 0, points = 0, combo = 0, maxCombo = 0;
  let cur = null;         // {a,b}
  let typed = '';
  let timerId = null, timeLeft = 0;
  let locked = false;

  // メニュー
  document.querySelectorAll('[data-mode]').forEach(b=>{
    b.onclick = () => {
      mode = b.dataset.mode;
      if(mode==='dan'){ buildDanGrid(); show('screen-dan'); }
      else if(mode==='random'){ startRandom(); }
      else if(mode==='time'){ startTime(); }
    };
  });

  // 出題順
  document.querySelectorAll('[data-order]').forEach(b=>{
    b.onclick = () => startDan(b.dataset.order);
  });

  // もどる
  document.querySelectorAll('[data-back]').forEach(b=>{
    b.onclick = () => { stopTimer(); show('screen-menu'); };
  });

  function buildDanGrid(){
    const g = $('#danGrid'); g.innerHTML='';
    for(let i=1;i<=9;i++){
      const b=document.createElement('button');
      b.className='dan-btn'; b.textContent=i+' の だん';
      b.onclick=()=>{ dan=i; $('#danOrderTitle').textContent=dan+' の だん'; show('screen-danOrder'); };
      g.appendChild(b);
    }
  }

  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

  function startDan(order){
    const list = [1,2,3,4,5,6,7,8,9].map(b=>({a:dan,b}));
    queue = order==='seq' ? list : shuffle(list);
    total = 9; idx=0; ok=0; ng=0; points=0; combo=0; maxCombo=0;
    $('#timer').textContent='';
    beginQuiz();
  }
  function startRandom(){
    queue = [];
    for(let i=0;i<10;i++){ queue.push({a:1+((Math.random()*9)|0), b:1+((Math.random()*9)|0)}); }
    total = 10; idx=0; ok=0; ng=0; points=0; combo=0; maxCombo=0;
    $('#timer').textContent='';
    beginQuiz();
  }
  function startTime(){
    queue = null; total = Infinity; idx=0; ok=0; ng=0; points=0; combo=0; maxCombo=0;
    timeLeft = 60;
    $('#timer').textContent = timeLeft+'びょう';
    timerId = setInterval(()=>{
      timeLeft--;
      $('#timer').textContent = timeLeft+'びょう';
      if(timeLeft<=0){ stopTimer(); endQuiz(); }
    },1000);
    beginQuiz();
  }
  function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

  function beginQuiz(){
    show('screen-quiz');
    nextQ();
  }

  function nextQ(){
    locked = false;
    typed='';
    updateAnswer();
    if(mode==='time'){
      cur = { a:1+((Math.random()*9)|0), b:1+((Math.random()*9)|0) };
      $('#progress').textContent = (idx+1)+'もんめ';
    } else {
      if(idx>=queue.length){ endQuiz(); return; }
      cur = queue[idx];
      $('#progress').textContent = (idx+1)+' / '+total;
    }
    $('#question').textContent = `${cur.a} × ${cur.b} = ?`;
    $('#answerBox').className='answer-box';
    updateStats();
  }

  function updateStats(){
    $('#okCount').textContent=ok;
    $('#ngCount').textContent=ng;
    $('#comboCount').textContent=combo;
    $('#pointCount').textContent=points;
  }

  function flash(msg, color){
    const el = $('#floatMsg');
    el.textContent = msg;
    el.style.color = color || 'var(--primary-d)';
    el.classList.add('show');
    clearTimeout(flash._t);
    flash._t = setTimeout(()=>el.classList.remove('show'), 900);
  }

  function updateAnswer(){
    $('#answerBox').textContent = typed===''? '　' : typed;
  }

  // パッド
  document.querySelectorAll('.pad button').forEach(b=>{
    b.onclick = () => {
      if(locked) return;
      const act=b.dataset.act;
      if(act==='clear'){ typed=''; updateAnswer(); return; }
      if(act==='go'){ submit(); return; }
      if(typed.length>=3) return;
      typed += b.textContent;
      updateAnswer();
    };
  });

  // キーボード
  document.addEventListener('keydown', e=>{
    if(!$('#screen-quiz').classList.contains('active')) return;
    if(locked) return;
    if(/^[0-9]$/.test(e.key)){ if(typed.length<3){ typed+=e.key; updateAnswer(); } }
    else if(e.key==='Backspace'){ typed=typed.slice(0,-1); updateAnswer(); }
    else if(e.key==='Enter'){ submit(); }
    else if(e.key==='Escape'){ typed=''; updateAnswer(); }
  });

  function submit(){
    if(typed==='') return;
    locked = true;
    const ans = parseInt(typed,10);
    const correct = cur.a*cur.b;
    const box = $('#answerBox');
    if(ans===correct){
      ok++; combo++; if(combo>maxCombo) maxCombo=combo;
      let gain = 5;
      let bonus = 0;
      if(combo>=10) bonus = 20;
      else if(combo>=5) bonus = 10;
      else if(combo>=3) bonus = 5;
      gain += bonus;
      points += gain;
      box.classList.add('ok'); box.textContent = typed+' ○';
      if(bonus>0) flash(`🔥${combo}コンボ! +${gain}pt`, 'var(--primary-d)');
      else flash(`+${gain}pt`, 'var(--ok)');
    } else {
      ng++; combo=0;
      points = Math.max(0, points-2);
      box.classList.add('ng'); box.textContent = typed+' × せいかい:'+correct;
      flash('-2pt', 'var(--ng)');
    }
    updateStats();
    setTimeout(()=>{
      idx++;
      if(mode!=='time' && idx>=queue.length){ endQuiz(); }
      else { nextQ(); }
    }, ans===correct? 600 : 1400);
  }

  function endQuiz(){
    stopTimer();
    show('screen-result');
    const answered = ok+ng;
    if(mode==='time'){
      $('#resultTitle').textContent='タイムアタック しゅうりょう!';
      $('#resultBig').textContent = '⭐ '+points+' pt';
      $('#resultSub').innerHTML = `せいかい ${ok} / まちがい ${ng}<br>さいこうコンボ 🔥${maxCombo}`;
    } else {
      const rate = answered? Math.round(ok/answered*100):0;
      $('#resultTitle').textContent= rate===100? 'すごい!ぜんもん せいかい!':'おつかれさま!';
      $('#resultBig').textContent = '⭐ '+points+' pt';
      $('#resultSub').innerHTML = `${ok} / ${answered} もん せいかい (${rate}てん)<br>さいこうコンボ 🔥${maxCombo}`;
    }
  }
})();
</script>
