<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グループわけメーカー 🧩</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",-apple-system,"Segoe UI",sans-serif;
    background: linear-gradient(160deg,#dff1ff 0%,#f5f0ff 55%,#ffeef5 100%);
    background-attachment: fixed;
    color: #333;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header { text-align: center; margin-bottom: 14px; }
  h1 { font-size: clamp(28px, 4.5vw, 46px); color: #3d4370; }
  .card {
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    padding: 24px;
    width: 100%;
    max-width: 1050px;
    margin-bottom: 18px;
  }
  .section-title { font-size: clamp(18px, 2.4vw, 24px); color: #3d4370; font-weight: bold; margin-bottom: 10px; }
  .hint { font-size: clamp(14px, 1.8vw, 17px); color: #888; margin-top: 6px; }

  textarea {
    width: 100%;
    min-height: 140px;
    font-family: inherit;
    font-size: clamp(17px, 2vw, 20px);
    border: 3px solid #cdd5f7;
    border-radius: 16px;
    padding: 12px;
    resize: vertical;
    line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: #5b6ef5; }

  .way-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
  .way-btn {
    font-family: inherit;
    font-size: clamp(17px, 2.2vw, 22px);
    font-weight: bold;
    padding: 12px 26px;
    border-radius: 999px;
    border: 3px solid #5b6ef5;
    background: #fff;
    color: #5b6ef5;
    cursor: pointer;
  }
  .way-btn.active { background: #5b6ef5; color: #fff; }
  .num-row { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .num-row label { font-size: clamp(18px, 2.2vw, 22px); font-weight: bold; color: #3d4370; }
  .num-row input {
    font-family: inherit;
    width: 100px;
    font-size: clamp(24px, 3vw, 30px);
    text-align: center;
    padding: 8px;
    border: 3px solid #cdd5f7;
    border-radius: 14px;
    color: #3d4370;
    font-weight: bold;
  }
  .num-row input:focus { outline: none; border-color: #5b6ef5; }

  .pair-list { display: flex; flex-direction: column; gap: 10px; }
  .pair-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pair-row select {
    font-family: inherit;
    font-size: clamp(16px, 2vw, 20px);
    padding: 10px 14px;
    border: 3px solid #f3c1cd;
    border-radius: 14px;
    color: #3d4370;
    background: #fff;
    font-weight: bold;
    max-width: 45%;
  }
  .pair-row select:focus { outline: none; border-color: #e58fa1; }
  .pair-x { font-size: clamp(18px, 2.4vw, 24px); color: #d4526b; font-weight: bold; }
  .pair-del {
    font-family: inherit;
    border: none;
    background: #ffe3e9;
    color: #a53752;
    font-size: clamp(15px, 1.8vw, 18px);
    font-weight: bold;
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
  }
  #addPairBtn {
    font-family: inherit;
    border: none;
    background: #eef1ff;
    color: #3d4370;
    font-size: clamp(16px, 2vw, 20px);
    font-weight: bold;
    border-radius: 999px;
    padding: 10px 24px;
    cursor: pointer;
    box-shadow: 0 3px 0 #d5dbf5;
    margin-top: 10px;
  }
  #addPairBtn:disabled { opacity: .4; cursor: not-allowed; }

  .btn-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  .big-btn {
    font-family: inherit;
    font-size: clamp(22px, 3vw, 30px);
    font-weight: bold;
    padding: 16px 44px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    transition: transform .1s;
  }
  .big-btn:active { transform: scale(.94); }
  .big-btn:disabled { opacity: .45; cursor: not-allowed; }
  #goBtn { background: #5b6ef5; color: #fff; box-shadow: 0 5px 0 #3f51c9; }
  #againBtn { background: #ffd66e; color: #6b5210; box-shadow: 0 5px 0 #e0b64e; display: none; }

  #msg { text-align: center; font-size: clamp(16px, 2.2vw, 22px); color: #d4526b; font-weight: bold; min-height: 1.6em; margin-top: 10px; }

  #groupArea {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
    margin-top: 14px;
  }
  .group-card {
    border-radius: 20px;
    padding: 16px;
    opacity: 0;
    transform: translateY(16px) scale(.95);
    animation: appear .45s forwards;
    border: 3px solid rgba(0,0,0,.06);
  }
  @keyframes appear { to { opacity: 1; transform: translateY(0) scale(1); } }
  .group-card h2 {
    font-size: clamp(20px, 2.6vw, 26px);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-card ul { list-style: none; }
  .group-card li {
    background: rgba(255,255,255,.75);
    border-radius: 999px;
    padding: 8px 16px;
    margin-bottom: 8px;
    font-size: clamp(17px, 2.2vw, 22px);
    font-weight: bold;
    color: #3d4370;
    text-align: center;
    word-break: break-all;
  }
</style>
</head>
<body>
<header>
  <h1>🧩 グループわけメーカー</h1>
</header>

<div class="card">
  <div class="section-title">📝 なまえリスト（1行に1人）</div>
  <textarea id="nameArea" placeholder="たとえば：&#10;さとう&#10;すずき&#10;たなか"></textarea>
  <div class="hint">じどうでほぞんされます（ルーレット・せきがえと共通のリストだよ）。</div>
</div>

<div class="card">
  <div class="section-title">✂️ わけかた</div>
  <div class="way-row">
    <button type="button" class="way-btn active" id="wayGroups">グループの数できめる</button>
    <button type="button" class="way-btn" id="waySize">1グループの人数できめる</button>
  </div>
  <div class="num-row">
    <label id="numLabel" for="numIn">グループの数：</label>
    <input type="number" id="numIn" min="1" max="40" value="4" inputmode="numeric">
  </div>
</div>

<div class="card">
  <div class="section-title">🙅 この2人はおなじ班にしない（さいだい5組）</div>
  <div class="pair-list" id="pairList"></div>
  <button type="button" id="addPairBtn">＋ ペアをついか</button>
</div>

<div class="card">
  <div class="btn-row">
    <button type="button" class="big-btn" id="goBtn">🎲 グループわけスタート！</button>
    <button type="button" class="big-btn" id="againBtn">🔁 もういちどシャッフル</button>
  </div>
  <div id="msg"></div>
  <div id="groupArea"></div>
</div>

<script>
(function () {
  "use strict";
  var LS_NAMES = "sensei25_names";
  var LS_SETTING = "sensei25_group_setting";

  var nameArea = document.getElementById("nameArea");
  var wayGroups = document.getElementById("wayGroups");
  var waySize = document.getElementById("waySize");
  var numLabel = document.getElementById("numLabel");
  var numIn = document.getElementById("numIn");
  var pairList = document.getElementById("pairList");
  var addPairBtn = document.getElementById("addPairBtn");
  var goBtn = document.getElementById("goBtn");
  var againBtn = document.getElementById("againBtn");
  var msg = document.getElementById("msg");
  var groupArea = document.getElementById("groupArea");

  var way = "groups"; // "groups" | "size"
  var busy = false;
  var MAX_PAIRS = 5;

  var COLORS = [
    { bg: "#e3f2ff", name: "あお",     icon: "🔵" },
    { bg: "#ffe9e3", name: "オレンジ", icon: "🟠" },
    { bg: "#e6f9e9", name: "みどり",   icon: "🟢" },
    { bg: "#fff6d9", name: "きいろ",   icon: "🟡" },
    { bg: "#f3e8ff", name: "むらさき", icon: "🟣" },
    { bg: "#ffe3ee", name: "ピンク",   icon: "🩷" },
    { bg: "#e8f7f7", name: "みずいろ", icon: "🩵" },
    { bg: "#f0ede4", name: "ちゃいろ", icon: "🟤" }
  ];

  // ---- Web Audio ----
  var audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, vol, type) {
    var ctx = getCtx();
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctx.currentTime + start);
    g.gain.linearRampToValueAtTime(vol, ctx.currentTime + start + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur + 0.05);
  }
  function pip() { tone(1000, 0, 0.05, 0.12, "square"); }
  function fanfare() {
    var notes = [523.25, 659.25, 783.99, 1046.5];
    for (var i = 0; i < notes.length; i++) tone(notes[i], i * 0.12, 0.35, 0.2, "triangle");
    tone(1318.5, 0.5, 0.55, 0.2, "triangle");
  }

  // ---- names ----
  function getNames() {
    return nameArea.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function shuffleArr(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ---- ペアUI ----
  function makeOption(v, label) {
    var o = document.createElement("option");
    o.value = v; o.textContent = label;
    return o;
  }
  function addPairRow(a, b) {
    if (pairList.children.length >= MAX_PAIRS) return;
    var row = document.createElement("div");
    row.className = "pair-row";
    var s1 = document.createElement("select");
    var x = document.createElement("span");
    x.className = "pair-x";
    x.textContent = "×";
    var s2 = document.createElement("select");
    var del = document.createElement("button");
    del.type = "button";
    del.className = "pair-del";
    del.textContent = "けす";
    del.addEventListener("click", function () {
      row.remove();
      updateAddBtn();
      saveSetting();
    });
    s1.addEventListener("change", saveSetting);
    s2.addEventListener("change", saveSetting);
    row.appendChild(s1); row.appendChild(x); row.appendChild(s2); row.appendChild(del);
    pairList.appendChild(row);
    fillPairSelects(row, a, b);
    updateAddBtn();
  }
  function fillPairSelects(row, a, b) {
    var names = getNames();
    var sels = row.querySelectorAll("select");
    [a, b].forEach(function (want, idx) {
      var sel = sels[idx];
      var cur = want !== undefined ? want : sel.value;
      sel.innerHTML = "";
      sel.appendChild(makeOption("", "（えらぶ）"));
      names.forEach(function (n) { sel.appendChild(makeOption(n, n)); });
      if (cur && names.indexOf(cur) !== -1) sel.value = cur; else sel.value = "";
    });
  }
  function refreshAllPairSelects() {
    Array.prototype.forEach.call(pairList.children, function (row) {
      fillPairSelects(row);
    });
  }
  function updateAddBtn() {
    addPairBtn.disabled = pairList.children.length >= MAX_PAIRS;
    addPairBtn.textContent = addPairBtn.disabled ? "ペアは5組までだよ" : "＋ ペアをついか";
  }
  function getPairs() {
    var pairs = [];
    Array.prototype.forEach.call(pairList.children, function (row) {
      var sels = row.querySelectorAll("select");
      var a = sels[0].value, b = sels[1].value;
      if (a && b && a !== b) pairs.push([a, b]);
    });
    return pairs;
  }

  // ---- 保存 ----
  function saveSetting() {
    var pairs = [];
    Array.prototype.forEach.call(pairList.children, function (row) {
      var sels = row.querySelectorAll("select");
      pairs.push([sels[0].value, sels[1].value]);
    });
    try {
      localStorage.setItem(LS_NAMES, nameArea.value);
      localStorage.setItem(LS_SETTING, JSON.stringify({
        way: way, num: numIn.value, pairs: pairs
      }));
    } catch (e) {}
  }

  // ---- グループわけ本体 ----
  function computeGroups() {
    var names = shuffleArr(getNames());
    var n = names.length;
    var v = parseInt(numIn.value, 10);
    if (isNaN(v) || v < 1) v = 1;

    var gCount;
    if (way === "groups") {
      gCount = Math.min(v, n);
    } else {
      gCount = Math.ceil(n / v);
    }
    if (gCount < 1) gCount = 1;

    var pairs = getPairs();

    for (var attempt = 0; attempt < 600; attempt++) {
      var order = shuffleArr(names);
      var groups = [];
      for (var g = 0; g < gCount; g++) groups.push([]);
      for (var i = 0; i < order.length; i++) groups[i % gCount].push(order[i]);

      var ok = true;
      for (var p = 0; p < pairs.length; p++) {
        for (var g2 = 0; g2 < groups.length; g2++) {
          if (groups[g2].indexOf(pairs[p][0]) !== -1 && groups[g2].indexOf(pairs[p][1]) !== -1) {
            ok = false; break;
          }
        }
        if (!ok) break;
      }
      if (ok) return groups;
    }
    return null;
  }

  function renderGroups(groups) {
    groupArea.innerHTML = "";
    groups.forEach(function (members, i) {
      var col = COLORS[i % COLORS.length];
      var card = document.createElement("div");
      card.className = "group-card";
      card.style.background = col.bg;
      card.style.animationDelay = (i * 0.15) + "s";
      var h2 = document.createElement("h2");
      h2.textContent = col.icon + " " + (i + 1) + "はん（" + members.length + "人）";
      card.appendChild(h2);
      var ul = document.createElement("ul");
      members.forEach(function (m) {
        var li = document.createElement("li");
        li.textContent = m;
        ul.appendChild(li);
      });
      card.appendChild(ul);
      groupArea.appendChild(card);
    });
  }

  function go() {
    if (busy) return;
    getCtx();
    msg.textContent = "";
    var names = getNames();
    if (names.length === 0) { msg.textContent = "なまえリストを入れてね"; return; }
    var v = parseInt(numIn.value, 10);
    if (isNaN(v) || v < 1) { msg.textContent = "数を1いじょうにしてね"; return; }

    var result = computeGroups();
    if (!result) {
      msg.textContent = "そのペアじょうけんだと分けられなかったよ…。グループ数やペアを見なおしてね";
      return;
    }

    // シャッフル演出：数回ダミー表示 → 確定
    busy = true;
    goBtn.disabled = true;
    againBtn.disabled = true;
    var flick = 0;
    var iv = setInterval(function () {
      var dummy = computeGroupsDummy(result.length, names);
      renderGroupsFast(dummy);
      pip();
      flick++;
      if (flick >= 5) {
        clearInterval(iv);
        renderGroups(result);
        fanfare();
        msg.style.color = "#3f9e63";
        msg.textContent = "グループわけ、かんせい！🎉";
        setTimeout(function () { msg.style.color = "#d4526b"; if (msg.textContent.indexOf("かんせい") !== -1) msg.textContent = ""; }, 3000);
        againBtn.style.display = "inline-block";
        busy = false;
        goBtn.disabled = false;
        againBtn.disabled = false;
      }
    }, 260);
  }

  function computeGroupsDummy(gCount, names) {
    var order = shuffleArr(names);
    var groups = [];
    for (var g = 0; g < gCount; g++) groups.push([]);
    for (var i = 0; i < order.length; i++) groups[i % gCount].push(order[i]);
    return groups;
  }
  function renderGroupsFast(groups) {
    groupArea.innerHTML = "";
    groups.forEach(function (members, i) {
      var col = COLORS[i % COLORS.length];
      var card = document.createElement("div");
      card.className = "group-card";
      card.style.background = col.bg;
      card.style.animation = "none";
      card.style.opacity = "1";
      card.style.transform = "none";
      var h2 = document.createElement("h2");
      h2.textContent = col.icon + " " + (i + 1) + "はん";
      card.appendChild(h2);
      var ul = document.createElement("ul");
      members.forEach(function (m) {
        var li = document.createElement("li");
        li.textContent = m;
        ul.appendChild(li);
      });
      card.appendChild(ul);
      groupArea.appendChild(card);
    });
  }

  // ---- イベント ----
  function setWay(w) {
    way = w;
    wayGroups.classList.toggle("active", w === "groups");
    waySize.classList.toggle("active", w === "size");
    numLabel.textContent = w === "groups" ? "グループの数：" : "1グループの人数：";
    saveSetting();
  }
  wayGroups.addEventListener("click", function () { getCtx(); setWay("groups"); });
  waySize.addEventListener("click", function () { getCtx(); setWay("size"); });
  numIn.addEventListener("input", saveSetting);
  nameArea.addEventListener("input", function () {
    refreshAllPairSelects();
    saveSetting();
  });
  addPairBtn.addEventListener("click", function () { getCtx(); addPairRow(); saveSetting(); });
  goBtn.addEventListener("click", go);
  againBtn.addEventListener("click", go);

  // ---- 復元 ----
  try {
    var n = localStorage.getItem(LS_NAMES);
    if (n) nameArea.value = n;
    var st = JSON.parse(localStorage.getItem(LS_SETTING) || "null");
    if (st) {
      if (st.way === "size") setWay("size"); else setWay("groups");
      if (st.num) numIn.value = st.num;
      if (Array.isArray(st.pairs)) {
        st.pairs.slice(0, MAX_PAIRS).forEach(function (p) {
          if (Array.isArray(p)) addPairRow(p[0], p[1]);
        });
      }
    }
  } catch (e) {}
  updateAddBtn();
})();
</script>
