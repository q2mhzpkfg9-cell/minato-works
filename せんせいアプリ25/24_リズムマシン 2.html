<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リズムマシン</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;color:#333;
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(160deg,#dff1ff 0%,#f5f0ff 55%,#ffeef5 100%);
  background-attachment:fixed;
}
header{text-align:center;padding:18px 10px 6px}
h1{margin:0;font-size:clamp(1.6rem,4vw,2.6rem);color:#5b6ef5;letter-spacing:.06em}
.sub{color:#7a86a8;font-size:1.05rem;margin-top:4px}
main{max-width:980px;margin:0 auto;padding:12px 16px 40px}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:24px;margin-bottom:20px}
.btn{
  border:none;border-radius:999px;background:#5b6ef5;color:#fff;cursor:pointer;
  font-family:inherit;font-size:1.3rem;padding:15px 32px;margin:7px;
  box-shadow:0 4px 12px rgba(91,110,245,.35);transition:transform .1s;
}
.btn:active{transform:scale(.95)}
.btn.ghost{background:#eef1ff;color:#5b6ef5;box-shadow:none}
.btn.big{font-size:1.7rem;padding:20px 48px}
.btn.sel{outline:5px solid #ffd83d}
.btn.stop{background:#f56b8d;box-shadow:0 4px 12px rgba(245,107,141,.35)}
.center{text-align:center}
.tabbar{text-align:center;margin-bottom:6px}
.screen{display:none}
.screen.show{display:block}
h2{color:#5b6ef5;font-size:1.35rem;margin:4px 0 10px}
.bpm-big{font-size:clamp(3rem,10vw,5rem);font-weight:bold;color:#2f3a68;text-align:center;line-height:1}
.bpm-label{text-align:center;color:#7a86a8;font-size:1.1rem}
.slider-row{display:flex;align-items:center;justify-content:center;gap:14px;font-size:1.6rem;margin:12px 0;flex-wrap:wrap}
input[type=range]{width:min(440px,72%);height:40px;accent-color:#5b6ef5}
/* 振り子 */
.pend-stage{position:relative;height:min(46vw,300px);overflow:hidden}
.pend-arm{
  position:absolute;left:50%;bottom:10px;width:10px;height:82%;
  background:#5b6ef5;border-radius:8px;transform-origin:50% 100%;
  transform:translateX(-50%) rotate(0deg);
}
.pend-bob{
  position:absolute;left:50%;top:-14px;width:56px;height:56px;margin-left:-28px;
  background:#ffd83d;border-radius:50%;box-shadow:0 4px 10px rgba(0,0,0,.25);
}
.pend-base{position:absolute;left:50%;bottom:0;width:120px;height:14px;margin-left:-60px;background:#c9d2f5;border-radius:8px}
.beat-dots{display:flex;justify-content:center;gap:16px;margin-top:10px}
.beat-dot{width:34px;height:34px;border-radius:50%;background:#e3e8ff;transition:background .05s,transform .05s}
.beat-dot.on{background:#5b6ef5;transform:scale(1.25)}
.beat-dot.accent.on{background:#f5a55b}
/* シーケンサー */
.seq-wrap{overflow-x:auto;padding-bottom:6px}
.seq-table{border-collapse:separate;border-spacing:5px;margin:0 auto}
.seq-table td.tname{font-size:1.25rem;font-weight:bold;color:#2f3a68;white-space:nowrap;padding-right:8px}
.step{
  width:44px;height:44px;border-radius:12px;background:#e9edff;border:none;cursor:pointer;
  transition:transform .05s;padding:0;
}
.step.on{background:#5b6ef5;box-shadow:0 3px 8px rgba(91,110,245,.4)}
.step.beat-head{outline:2px solid #c3cbf7}
.step.playing{transform:scale(1.2);background:#ffd83d}
.step.on.playing{background:#f5a55b}
footer{text-align:center;color:#9aa4c4;font-size:.95rem;padding-bottom:24px}
.tap-hint{color:#a5aecb;font-size:1.05rem;text-align:center}
@media(max-width:600px){ .step{width:30px;height:30px;border-radius:9px} }
</style>
</head>
<body>
<header>
  <h1>🥁 リズムマシン</h1>
  <div class="sub">メトロノームと リズムパッドで えんそうしよう！</div>
</header>
<main>

<div class="tabbar">
  <button class="btn sel" id="tab-metro" onclick="switchTab('metro')">🕰 メトロノーム</button>
  <button class="btn ghost" id="tab-pad" onclick="switchTab('pad')">🎛 リズムパッド</button>
</div>

<!-- メトロノーム -->
<section id="scr-metro" class="screen show">
  <div class="card">
    <div class="pend-stage">
      <div class="pend-arm" id="pend-arm"><div class="pend-bob"></div></div>
      <div class="pend-base"></div>
    </div>
    <div class="beat-dots" id="beat-dots"></div>
    <div class="bpm-big" id="bpm-val">100</div>
    <div class="bpm-label">テンポ（BPM）</div>
    <div class="slider-row">
      🐢 <input type="range" id="bpm-slider" min="40" max="200" value="100"> 🐇
    </div>
    <div class="center">
      <span style="font-size:1.2rem;color:#7a86a8">ひょうし：</span>
      <button class="btn ghost meter-btn" data-m="2" onclick="setMeter(2,this)">2びょうし</button>
      <button class="btn ghost meter-btn" data-m="3" onclick="setMeter(3,this)">3びょうし</button>
      <button class="btn ghost meter-btn sel" data-m="4" onclick="setMeter(4,this)">4びょうし</button>
    </div>
    <div class="center">
      <button class="btn big" id="metro-btn" onclick="toggleMetro()">▶ スタート</button>
    </div>
    <div class="tap-hint">1ぱくめは「ピン！」と たかいおとが なるよ</div>
  </div>
</section>

<!-- リズムパッド -->
<section id="scr-pad" class="screen">
  <div class="card">
    <h2 class="center">🎛 16ステップ リズムパッド（8ぶんおんぷ × 16 ＝ 2しょうせつ）</h2>
    <div class="seq-wrap">
      <table class="seq-table"><tbody id="seq-body"></tbody></table>
    </div>
    <div class="slider-row">
      🐢 <input type="range" id="pad-bpm" min="40" max="200" value="100"> 🐇
      <span style="font-size:1.3rem;font-weight:bold;color:#2f3a68">BPM <span id="pad-bpm-val">100</span></span>
    </div>
    <div class="center">
      <button class="btn big" id="pad-btn" onclick="togglePad()">▶ さいせい</button>
      <button class="btn ghost" onclick="clearGrid()">🗑 ぜんぶけす</button>
    </div>
    <div class="center">
      <span style="font-size:1.2rem;color:#7a86a8">プリセット：</span>
      <button class="btn ghost" onclick="loadPreset(0)">① タン・タン・タタ・タン</button>
      <button class="btn ghost" onclick="loadPreset(1)">② てびょうし８ビート</button>
      <button class="btn ghost" onclick="loadPreset(2)">③ おまつりリズム</button>
    </div>
    <div class="tap-hint">マスを タップして リズムを つくろう！ 4マスで 1ぱく（8ぶんおんぷ2つ）だよ</div>
  </div>
</section>

</main>
<footer>せんせいアプリ25 ／ リズムマシン</footer>

<script>
"use strict";
let actx=null;
function ac(){ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==="suspended") actx.resume(); return actx; }

/* ===== 合成音 ===== */
function clickSound(time, accent){
  const c=ac(), o=c.createOscillator(), g=c.createGain();
  o.type="square"; o.frequency.value = accent ? 1568 : 1046;
  g.gain.setValueAtTime(accent?0.35:0.22, time);
  g.gain.exponentialRampToValueAtTime(0.0001, time+0.08);
  o.connect(g); g.connect(c.destination); o.start(time); o.stop(time+0.1);
}
function noiseBuffer(){
  const c=ac(), len=c.sampleRate*0.3, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return buf;
}
let nBuf=null;
function clapSound(time){ /* 手拍子：ノイズ＋バンドパス */
  const c=ac(); if(!nBuf) nBuf=noiseBuffer();
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=nBuf; f.type="bandpass"; f.frequency.value=1600; f.Q.value=1.2;
  g.gain.setValueAtTime(0.9,time);
  g.gain.exponentialRampToValueAtTime(0.0001,time+0.12);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(time); s.stop(time+0.15);
}
function taikoSound(time){ /* 太鼓：低いサイン波ピッチダウン */
  const c=ac(), o=c.createOscillator(), g=c.createGain();
  o.type="sine";
  o.frequency.setValueAtTime(150,time);
  o.frequency.exponentialRampToValueAtTime(55,time+0.25);
  g.gain.setValueAtTime(0.9,time);
  g.gain.exponentialRampToValueAtTime(0.0001,time+0.3);
  o.connect(g); g.connect(c.destination); o.start(time); o.stop(time+0.35);
}
function tambSound(time){ /* タンバリン：高いノイズ＋リング */
  const c=ac(); if(!nBuf) nBuf=noiseBuffer();
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=nBuf; f.type="highpass"; f.frequency.value=5000;
  g.gain.setValueAtTime(0.5,time);
  g.gain.exponentialRampToValueAtTime(0.0001,time+0.18);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(time); s.stop(time+0.2);
  const o=c.createOscillator(), g2=c.createGain();
  o.type="triangle"; o.frequency.value=6200;
  g2.gain.setValueAtTime(0.15,time);
  g2.gain.exponentialRampToValueAtTime(0.0001,time+0.12);
  o.connect(g2); g2.connect(c.destination); o.start(time); o.stop(time+0.15);
}

/* ===== タブ ===== */
function switchTab(t){
  stopMetro(); stopPad();
  document.getElementById("scr-metro").classList.toggle("show", t==="metro");
  document.getElementById("scr-pad").classList.toggle("show", t==="pad");
  document.getElementById("tab-metro").className = "btn" + (t==="metro"?" sel":" ghost");
  document.getElementById("tab-pad").className = "btn" + (t==="pad"?" sel":" ghost");
}

/* ===== メトロノーム ===== */
let mRunning=false, mTimer=null, mNextTime=0, mBeat=0, meter=4;
let mBeatTimes=[]; /* {time, beat} 表示用 */
let mStartTime=0;

function setMeter(m, btn){
  meter=m;
  document.querySelectorAll(".meter-btn").forEach(b=>b.className="btn ghost meter-btn");
  btn.classList.add("sel");
  buildDots();
}
function buildDots(){
  const box=document.getElementById("beat-dots");
  box.innerHTML="";
  for(let i=0;i<meter;i++){
    const d=document.createElement("div");
    d.className="beat-dot"+(i===0?" accent":"");
    box.appendChild(d);
  }
}
function bpm(){ return parseInt(document.getElementById("bpm-slider").value,10); }
document.getElementById("bpm-slider").addEventListener("input",function(){
  document.getElementById("bpm-val").textContent=this.value;
});
function toggleMetro(){ mRunning ? stopMetro() : startMetro(); }
function startMetro(){
  ac();
  mRunning=true; mBeat=0; mBeatTimes=[];
  mNextTime=actx.currentTime+0.1;
  mStartTime=mNextTime;
  document.getElementById("metro-btn").textContent="⏹ ストップ";
  document.getElementById("metro-btn").classList.add("stop");
  mTimer=setInterval(schedMetro,25);
  requestAnimationFrame(metroFrame);
}
function stopMetro(){
  mRunning=false;
  if(mTimer){ clearInterval(mTimer); mTimer=null; }
  const b=document.getElementById("metro-btn");
  b.textContent="▶ スタート"; b.classList.remove("stop");
  document.getElementById("pend-arm").style.transform="translateX(-50%) rotate(0deg)";
  document.querySelectorAll(".beat-dot").forEach(d=>d.classList.remove("on"));
}
function schedMetro(){
  const spb=60/bpm();
  while(mNextTime < actx.currentTime+0.12){
    const beatInBar = mBeat % meter;
    clickSound(mNextTime, beatInBar===0);
    mBeatTimes.push({time:mNextTime, beat:beatInBar});
    mNextTime += spb; mBeat++;
  }
}
function metroFrame(){
  if(!mRunning) return;
  const now=actx.currentTime, spb=60/bpm();
  /* 振り子：1拍で片側→反対側 */
  const phase=(now-mStartTime)/spb;
  const angle=28*Math.sin(Math.PI*phase);
  document.getElementById("pend-arm").style.transform="translateX(-50%) rotate("+angle.toFixed(2)+"deg)";
  /* 拍ドット */
  while(mBeatTimes.length && mBeatTimes[0].time<=now){
    const e=mBeatTimes.shift();
    const dots=document.querySelectorAll(".beat-dot");
    dots.forEach(d=>d.classList.remove("on"));
    if(dots[e.beat]) dots[e.beat].classList.add("on");
  }
  requestAnimationFrame(metroFrame);
}

/* ===== リズムパッド ===== */
const TRACKS=[
{name:"👏 てびょうし", play:clapSound},
{name:"🥁 たいこ", play:taikoSound},
{name:"🔔 タンバリン", play:tambSound}
];
const STEPS=16;
let grid=TRACKS.map(()=>new Array(STEPS).fill(false));
let pRunning=false, pTimer=null, pNextTime=0, pStep=0;
let pDrawQueue=[]; /* {time, step} */

function buildGrid(){
  const body=document.getElementById("seq-body");
  body.innerHTML="";
  TRACKS.forEach((tr,ti)=>{
    const row=document.createElement("tr");
    const nameCell=document.createElement("td");
    nameCell.className="tname"; nameCell.textContent=tr.name;
    row.appendChild(nameCell);
    for(let s=0;s<STEPS;s++){
      const td=document.createElement("td");
      const b=document.createElement("button");
      b.className="step"+(s%4===0?" beat-head":"");
      b.dataset.t=ti; b.dataset.s=s;
      b.onclick=()=>{
        grid[ti][s]=!grid[ti][s];
        b.classList.toggle("on",grid[ti][s]);
        if(grid[ti][s]){ ac(); tr.play(actx.currentTime); }
      };
      td.appendChild(b); row.appendChild(td);
    }
    body.appendChild(row);
  });
}
function refreshGrid(){
  document.querySelectorAll(".step").forEach(b=>{
    b.classList.toggle("on", grid[b.dataset.t][b.dataset.s]);
  });
}
function clearGrid(){
  grid=TRACKS.map(()=>new Array(STEPS).fill(false));
  refreshGrid();
}
/* プリセット（16ステップ=8分音符2小節） */
const PRESETS=[
/* ① タン・タン・タタ・タン（たいこ、4分・4分・8分8分・4分 ×2小節） */
{clap:[], taiko:[0,2,4,5,6, 8,10,12,13,14], tamb:[]},
/* ② てびょうし８ビート */
{clap:[0,2,4,6,8,10,12,14], taiko:[0,8], tamb:[4,12]},
/* ③ おまつりリズム（タタ・タン・タタ・タン） */
{clap:[0,1,2, 4,5,6, 8,9,10, 12,13,14], taiko:[0,4,8,12], tamb:[6,14]}
];
function loadPreset(i){
  const p=PRESETS[i];
  grid=TRACKS.map(()=>new Array(STEPS).fill(false));
  p.clap.forEach(s=>grid[0][s]=true);
  p.taiko.forEach(s=>grid[1][s]=true);
  p.tamb.forEach(s=>grid[2][s]=true);
  refreshGrid();
}
function padBpm(){ return parseInt(document.getElementById("pad-bpm").value,10); }
document.getElementById("pad-bpm").addEventListener("input",function(){
  document.getElementById("pad-bpm-val").textContent=this.value;
});
function togglePad(){ pRunning ? stopPad() : startPad(); }
function startPad(){
  ac();
  pRunning=true; pStep=0; pDrawQueue=[];
  pNextTime=actx.currentTime+0.1;
  const b=document.getElementById("pad-btn");
  b.textContent="⏹ ストップ"; b.classList.add("stop");
  pTimer=setInterval(schedPad,25);
  requestAnimationFrame(padFrame);
}
function stopPad(){
  pRunning=false;
  if(pTimer){ clearInterval(pTimer); pTimer=null; }
  const b=document.getElementById("pad-btn");
  if(b){ b.textContent="▶ さいせい"; b.classList.remove("stop"); }
  document.querySelectorAll(".step").forEach(s=>s.classList.remove("playing"));
}
function schedPad(){
  const stepDur=60/padBpm()/2; /* 8分音符 */
  while(pNextTime < actx.currentTime+0.12){
    TRACKS.forEach((tr,ti)=>{ if(grid[ti][pStep]) tr.play(pNextTime); });
    pDrawQueue.push({time:pNextTime, step:pStep});
    pNextTime+=stepDur;
    pStep=(pStep+1)%STEPS;
  }
}
function padFrame(){
  if(!pRunning) return;
  const now=actx.currentTime;
  let cur=-1;
  while(pDrawQueue.length && pDrawQueue[0].time<=now){ cur=pDrawQueue.shift().step; }
  if(cur>=0){
    document.querySelectorAll(".step").forEach(b=>{
      b.classList.toggle("playing", parseInt(b.dataset.s,10)===cur);
    });
  }
  requestAnimationFrame(padFrame);
}

buildDots();
buildGrid();
loadPreset(0);
</script>
