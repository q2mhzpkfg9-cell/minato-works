<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>せきがえメーカー 🪑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",-apple-system,"Segoe UI",sans-serif;
    background: linear-gradient(160deg,#dff1ff 0%,#f5f0ff 55%,#ffeef5 100%);
    background-attachment: fixed;
    color: #333;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header { text-align: center; margin-bottom: 14px; }
  h1 { font-size: clamp(28px, 4.5vw, 46px); color: #3d4370; }
  .card {
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    padding: 24px;
    width: 100%;
    max-width: 1100px;
    margin-bottom: 18px;
  }
  .section-title { font-size: clamp(18px, 2.4vw, 24px); color: #3d4370; font-weight: bold; margin-bottom: 10px; }
  .hint { font-size: clamp(14px, 1.8vw, 17px); color: #888; margin-top: 6px; line-height: 1.6; }

  .setting-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px) { .setting-grid { grid-template-columns: 1fr; } }

  textarea {
    width: 100%;
    min-height: 140px;
    font-family: inherit;
    font-size: clamp(17px, 2vw, 20px);
    border: 3px solid #cdd5f7;
    border-radius: 16px;
    padding: 12px;
    resize: vertical;
    line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: #5b6ef5; }
  #frontArea { min-height: 90px; border-color: #ffd0a8; }
  #frontArea:focus { border-color: #f5913f; }

  .size-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .size-row label { font-size: clamp(18px, 2.2vw, 22px); font-weight: bold; color: #3d4370; }
  .size-row input {
    font-family: inherit;
    width: 90px;
    font-size: clamp(22px, 2.8vw, 28px);
    text-align: center;
    padding: 8px;
    border: 3px solid #cdd5f7;
    border-radius: 14px;
    color: #3d4370;
    font-weight: bold;
  }
  .size-row input:focus { outline: none; border-color: #5b6ef5; }

  .btn {
    font-family: inherit;
    font-weight: bold;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .1s;
  }
  .btn:active { transform: scale(.94); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-main { background: #5b6ef5; color: #fff; box-shadow: 0 5px 0 #3f51c9; font-size: clamp(22px, 3vw, 30px); padding: 16px 42px; }
  .btn-sub  { background: #eef1ff; color: #3d4370; box-shadow: 0 3px 0 #d5dbf5; font-size: clamp(16px, 2.2vw, 21px); padding: 12px 26px; }
  .btn-warn { background: #ffb3c1; color: #7a2338; box-shadow: 0 3px 0 #e58fa1; font-size: clamp(16px, 2.2vw, 21px); padding: 12px 26px; }
  .btn-toggle-on { background: #6ecb8e; color: #fff; box-shadow: 0 3px 0 #4da96d; }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }

  .board {
    background: #2e6b46;
    color: #fff;
    text-align: center;
    font-size: clamp(20px, 2.6vw, 28px);
    font-weight: bold;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 18px;
    letter-spacing: 8px;
    border: 6px solid #8a5a2b;
  }
  #seatGrid {
    display: grid;
    gap: 10px;
    justify-content: center;
  }
  .seat {
    min-height: clamp(64px, 9vw, 100px);
    border-radius: 16px;
    background: #f4f6ff;
    border: 3px solid #cdd5f7;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: clamp(15px, 2.2vw, 24px);
    font-weight: bold;
    color: #3d4370;
    cursor: pointer;
    padding: 6px;
    word-break: break-all;
    line-height: 1.25;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .12s, background .15s, border-color .15s;
  }
  .seat.empty { color: #b6bdd8; font-weight: normal; }
  .seat.disabled {
    background: repeating-linear-gradient(45deg, #e8e8e8 0 10px, #dcdcdc 10px 20px);
    border-color: #ccc;
    color: #aaa;
  }
  .seat.selected { background: #ffe9a8; border-color: #f5b73f; transform: scale(1.06); }
  .seat.front-kid { background: #ffe4d0; border-color: #f5913f; }
  .seat.dragover { border-color: #5b6ef5; background: #e3e8ff; }
  .seat.landed { animation: land .35s ease; }
  @keyframes land { 0% { transform: scale(.6); opacity: .2; } 100% { transform: scale(1); opacity: 1; } }

  #statusMsg { text-align: center; font-size: clamp(16px, 2.2vw, 22px); color: #5b6ef5; font-weight: bold; min-height: 1.6em; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1>🪑 せきがえメーカー</h1>
</header>

<div class="card">
  <div class="setting-grid">
    <div>
      <div class="section-title">📝 なまえリスト（1行に1人）</div>
      <textarea id="nameArea" placeholder="たとえば：&#10;さとう&#10;すずき&#10;たなか"></textarea>
      <div class="hint">じどうでほぞんされます。</div>
    </div>
    <div>
      <div class="section-title">🧡 前の方がいい子（1行に1人）</div>
      <textarea id="frontArea" placeholder="前の1〜2列にすわらせたい子のなまえ"></textarea>
      <div class="hint">なまえリストとおなじ書き方で入れてね。シャッフルのとき前の1〜2列にゆうせんしてすわるよ。</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="section-title">🧩 ざせきのかたち</div>
  <div class="size-row">
    <label for="colsIn">よこ（列）</label>
    <input type="number" id="colsIn" min="1" max="12" value="6" inputmode="numeric">
    <label for="rowsIn">たて（行）</label>
    <input type="number" id="rowsIn" min="1" max="10" value="5" inputmode="numeric">
    <button type="button" class="btn btn-sub" id="buildBtn">グリッドをつくる</button>
    <button type="button" class="btn btn-sub" id="editSeatBtn">🚫 つかわない席をえらぶ</button>
  </div>
  <div class="hint" id="modeHint">せきをタップ2回（またはドラッグ）で入れかえできます。</div>
</div>

<div class="card">
  <div class="board">こくばん</div>
  <div id="seatGrid"></div>
  <div id="statusMsg"></div>
  <div class="btn-row">
    <button type="button" class="btn btn-main" id="shuffleBtn">🎲 シャッフル！</button>
    <button type="button" class="btn btn-warn" id="clearBtn">せきを空にする</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var LS_NAMES = "sensei25_names";
  var LS_FRONT = "sensei25_seat_front";
  var LS_STATE = "sensei25_seat_state";

  var nameArea = document.getElementById("nameArea");
  var frontArea = document.getElementById("frontArea");
  var colsIn = document.getElementById("colsIn");
  var rowsIn = document.getElementById("rowsIn");
  var buildBtn = document.getElementById("buildBtn");
  var editSeatBtn = document.getElementById("editSeatBtn");
  var seatGrid = document.getElementById("seatGrid");
  var shuffleBtn = document.getElementById("shuffleBtn");
  var clearBtn = document.getElementById("clearBtn");
  var statusMsg = document.getElementById("statusMsg");
  var modeHint = document.getElementById("modeHint");

  var cols = 6, rows = 5;
  var disabledSet = {};   // "r-c" -> true
  var assign = {};        // "r-c" -> name
  var editMode = false;
  var selectedKey = null;
  var shuffling = false;

  // ---- Web Audio ----
  var audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, vol, type) {
    var ctx = getCtx();
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctx.currentTime + start);
    g.gain.linearRampToValueAtTime(vol, ctx.currentTime + start + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur + 0.05);
  }
  function pip() { tone(900, 0, 0.06, 0.14, "square"); }
  function fanfare() {
    var notes = [523.25, 659.25, 783.99, 1046.5];
    for (var i = 0; i < notes.length; i++) tone(notes[i], i * 0.12, 0.35, 0.2, "triangle");
  }

  // ---- util ----
  function key(r, c) { return r + "-" + c; }
  function getNames() {
    return nameArea.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function getFrontKids() {
    return frontArea.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function shuffleArr(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function save() {
    try {
      localStorage.setItem(LS_NAMES, nameArea.value);
      localStorage.setItem(LS_FRONT, frontArea.value);
      localStorage.setItem(LS_STATE, JSON.stringify({
        cols: cols, rows: rows, disabled: disabledSet, assign: assign
      }));
    } catch (e) {}
  }

  // ---- 描画 ----
  function render() {
    seatGrid.innerHTML = "";
    seatGrid.style.gridTemplateColumns = "repeat(" + cols + ", minmax(70px, 150px))";
    var frontKids = getFrontKids();
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        (function (r, c) {
          var k = key(r, c);
          var div = document.createElement("div");
          div.className = "seat";
          div.dataset.key = k;
          if (disabledSet[k]) {
            div.classList.add("disabled");
            div.textContent = "×";
          } else if (assign[k]) {
            div.textContent = assign[k];
            if (frontKids.indexOf(assign[k]) !== -1) div.classList.add("front-kid");
            div.draggable = true;
          } else {
            div.classList.add("empty");
            div.textContent = "（あき）";
          }
          if (selectedKey === k) div.classList.add("selected");

          div.addEventListener("click", function () { onSeatTap(k); });

          // ドラッグ入れかえ
          div.addEventListener("dragstart", function (ev) {
            if (editMode || disabledSet[k] || !assign[k]) { ev.preventDefault(); return; }
            ev.dataTransfer.setData("text/plain", k);
            ev.dataTransfer.effectAllowed = "move";
          });
          div.addEventListener("dragover", function (ev) {
            if (editMode || disabledSet[k]) return;
            ev.preventDefault();
            div.classList.add("dragover");
          });
          div.addEventListener("dragleave", function () { div.classList.remove("dragover"); });
          div.addEventListener("drop", function (ev) {
            ev.preventDefault();
            div.classList.remove("dragover");
            if (editMode || disabledSet[k]) return;
            var from = ev.dataTransfer.getData("text/plain");
            if (from && from !== k) swapSeats(from, k);
          });

          seatGrid.appendChild(div);
        })(r, c);
      }
    }
  }

  function onSeatTap(k) {
    if (shuffling) return;
    getCtx();
    if (editMode) {
      if (assign[k]) delete assign[k];
      disabledSet[k] ? delete disabledSet[k] : (disabledSet[k] = true);
      pip();
      save();
      render();
      return;
    }
    if (disabledSet[k]) return;
    if (selectedKey === null) {
      if (!assign[k]) return; // 空席から選択は開始しない
      selectedKey = k;
      pip();
      render();
      statusMsg.textContent = "「" + assign[k] + "」をえらんだよ。入れかえたい席をタップ！";
    } else if (selectedKey === k) {
      selectedKey = null;
      render();
      statusMsg.textContent = "";
    } else {
      swapSeats(selectedKey, k);
      selectedKey = null;
    }
  }

  function swapSeats(a, b) {
    var t = assign[a];
    if (assign[b] !== undefined) { assign[a] = assign[b]; } else { delete assign[a]; }
    if (t !== undefined) { assign[b] = t; } else { delete assign[b]; }
    tone(660, 0, 0.1, 0.16, "triangle");
    tone(880, 0.1, 0.12, 0.16, "triangle");
    save();
    render();
    statusMsg.textContent = "入れかえたよ！";
  }

  // ---- シャッフル ----
  function doShuffle() {
    if (shuffling) return;
    getCtx();
    var names = getNames();
    if (names.length === 0) { statusMsg.textContent = "なまえリストを入れてね"; return; }

    var seats = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      if (!disabledSet[key(r, c)]) seats.push({ r: r, c: c, k: key(r, c) });
    }
    if (seats.length < names.length) {
      statusMsg.textContent = "せきが " + (names.length - seats.length) + " こたりないよ！グリッドを大きくしてね";
      return;
    }

    var frontKids = getFrontKids().filter(function (n) { return names.indexOf(n) !== -1; });
    var others = names.filter(function (n) { return frontKids.indexOf(n) === -1; });

    // 前方1〜2列（行0,1）の使える席
    var frontSeats = shuffleArr(seats.filter(function (s) { return s.r <= 1; }));
    var result = {};
    var usedKeys = {};

    var fk = shuffleArr(frontKids);
    for (var i = 0; i < fk.length; i++) {
      if (i < frontSeats.length) {
        result[frontSeats[i].k] = fk[i];
        usedKeys[frontSeats[i].k] = true;
      } else {
        others.push(fk[i]); // 前方が足りなければ通常枠へ
      }
    }
    var restSeats = shuffleArr(seats.filter(function (s) { return !usedKeys[s.k]; }));
    var ro = shuffleArr(others);
    for (var j = 0; j < ro.length; j++) {
      result[restSeats[j].k] = ro[j];
    }

    // シャッフル演出：ランダム配置を数回見せてから確定
    shuffling = true;
    shuffleBtn.disabled = true;
    selectedKey = null;
    var flick = 0;
    var iv = setInterval(function () {
      var tmpNames = shuffleArr(names);
      var tmpSeats = shuffleArr(seats);
      assign = {};
      for (var i = 0; i < tmpNames.length; i++) assign[tmpSeats[i].k] = tmpNames[i];
      render();
      pip();
      flick++;
      if (flick >= 7) {
        clearInterval(iv);
        assign = result;
        save();
        render();
        // 着席アニメ
        var els = seatGrid.querySelectorAll(".seat:not(.disabled):not(.empty)");
        els.forEach(function (el, idx) {
          el.style.animationDelay = (idx * 0.03) + "s";
          el.classList.add("landed");
        });
        fanfare();
        statusMsg.textContent = "せきがえ、かんせい！🎉";
        shuffling = false;
        shuffleBtn.disabled = false;
      }
    }, 220);
  }

  // ---- グリッド作成・編集 ----
  function build() {
    var c = parseInt(colsIn.value, 10);
    var r = parseInt(rowsIn.value, 10);
    if (isNaN(c) || c < 1) c = 1; if (c > 12) c = 12;
    if (isNaN(r) || r < 1) r = 1; if (r > 10) r = 10;
    colsIn.value = String(c); rowsIn.value = String(r);
    cols = c; rows = r;
    // 範囲外の割当・無効を除去
    var na = {}, nd = {};
    Object.keys(assign).forEach(function (k) {
      var p = k.split("-");
      if (+p[0] < rows && +p[1] < cols) na[k] = assign[k];
    });
    Object.keys(disabledSet).forEach(function (k) {
      var p = k.split("-");
      if (+p[0] < rows && +p[1] < cols) nd[k] = true;
    });
    assign = na; disabledSet = nd;
    selectedKey = null;
    save();
    render();
    statusMsg.textContent = "グリッドをつくったよ（よこ" + cols + "×たて" + rows + "）";
  }

  function toggleEdit() {
    editMode = !editMode;
    selectedKey = null;
    editSeatBtn.classList.toggle("btn-toggle-on", editMode);
    editSeatBtn.textContent = editMode ? "✅ えらびおわった" : "🚫 つかわない席をえらぶ";
    modeHint.textContent = editMode
      ? "タップした席が「つかわない席」になります。もういちどタップでもどるよ。"
      : "せきをタップ2回（またはドラッグ）で入れかえできます。";
    render();
  }

  // ---- イベント ----
  buildBtn.addEventListener("click", function () { getCtx(); build(); });
  editSeatBtn.addEventListener("click", function () { getCtx(); toggleEdit(); });
  shuffleBtn.addEventListener("click", doShuffle);
  clearBtn.addEventListener("click", function () {
    getCtx();
    assign = {};
    selectedKey = null;
    save();
    render();
    statusMsg.textContent = "せきを空にしたよ";
  });
  nameArea.addEventListener("input", save);
  frontArea.addEventListener("input", function () { save(); render(); });

  // ---- 復元 ----
  try {
    var n = localStorage.getItem(LS_NAMES);
    if (n) nameArea.value = n;
    var f = localStorage.getItem(LS_FRONT);
    if (f) frontArea.value = f;
    var st = JSON.parse(localStorage.getItem(LS_STATE) || "null");
    if (st && st.cols && st.rows) {
      cols = Math.min(12, Math.max(1, st.cols));
      rows = Math.min(10, Math.max(1, st.rows));
      colsIn.value = String(cols);
      rowsIn.value = String(rows);
      disabledSet = st.disabled || {};
      assign = st.assign || {};
    }
  } catch (e) {}
  render();
})();
</script>
