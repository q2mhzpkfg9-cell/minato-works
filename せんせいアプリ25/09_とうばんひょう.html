<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>とうばんひょう</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",-apple-system,"Segoe UI",sans-serif;
    background: linear-gradient(160deg,#dff1ff 0%,#f5f0ff 55%,#ffeef5 100%);
    min-height: 100vh;
    padding: 16px;
    color: #333;
  }
  header { text-align: center; margin-bottom: 8px; display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: clamp(26px, 3.6vw, 42px); color: #5b6ef5; text-shadow: 0 2px 0 #fff; }
  .today-date {
    text-align: center; color: #7a86b8;
    font-size: clamp(18px, 2.4vw, 28px);
    font-weight: bold; margin-bottom: 16px;
  }
  button {
    font-family: inherit; border: none; cursor: pointer;
    border-radius: 999px; font-weight: bold;
    font-size: clamp(16px, 2vw, 22px);
    padding: 10px 24px;
    background: #fff; color: #5b6ef5;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
    transition: transform .12s;
  }
  button:active { transform: scale(.94); }
  .btn-main { background: #5b6ef5; color: #fff; }
  .btn-danger { background: #ff7a9c; color: #fff; }
  #dutyList {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    max-width: 1400px; margin: 0 auto;
  }
  .duty-card {
    background: #fff; border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    padding: 20px;
    text-align: center;
    border-top: 12px solid var(--dc, #5b6ef5);
    position: relative;
  }
  .duty-title {
    font-size: clamp(22px, 2.8vw, 34px);
    font-weight: bold; color: var(--dc, #5b6ef5);
    margin-bottom: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .now-label { font-size: clamp(15px, 1.8vw, 20px); color: #999; font-weight: bold; }
  .current-name {
    font-size: clamp(44px, 6.5vw, 88px);
    font-weight: bold; color: #333;
    line-height: 1.2;
    min-height: 1.3em;
    margin: 6px 0 10px;
    overflow-wrap: anywhere;
    transition: transform .2s;
  }
  .current-name.flip { animation: flip .5s ease; }
  @keyframes flip {
    0% { transform: rotateX(90deg); opacity: 0; }
    100% { transform: rotateX(0); opacity: 1; }
  }
  .next-preview { font-size: clamp(16px, 2vw, 22px); color: #aab; margin-bottom: 12px; min-height: 1.4em; }
  .card-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn-next {
    background: var(--dc, #5b6ef5); color: #fff;
    font-size: clamp(20px, 2.6vw, 30px);
    padding: 14px 36px;
  }
  .btn-edit { background: #f0f2fb; color: #778; font-size: clamp(15px, 1.8vw, 19px); }
  .btn-del {
    position: absolute; top: 10px; right: 10px;
    background: #ffe9ef; color: #ff7a9c;
    font-size: 16px; padding: 6px 12px; box-shadow: none;
  }
  .empty-hint {
    text-align: center; color: #99a;
    font-size: clamp(20px, 3vw, 32px);
    background: #fff; border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    padding: 60px 20px;
    max-width: 800px; margin: 0 auto;
  }
  /* editor dialog */
  #editDialog {
    position: fixed; inset: 0; background: rgba(60,70,120,.45);
    display: none; align-items: center; justify-content: center;
    z-index: 50; padding: 16px;
  }
  #editDialog.show { display: flex; }
  .dialog-card {
    background: #fff; border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
    padding: 28px; width: min(560px, 100%);
    max-height: 90vh; overflow-y: auto;
  }
  .dialog-card h2 { color: #5b6ef5; font-size: 26px; margin-bottom: 16px; text-align: center; }
  .dialog-card label { display: block; font-weight: bold; color: #666; margin: 14px 0 6px; font-size: 18px; }
  .dialog-card input[type=text], .dialog-card textarea {
    font-family: inherit; width: 100%;
    font-size: 20px; padding: 12px 14px;
    border: 3px solid #d6dcff; border-radius: 14px; outline: none;
  }
  .dialog-card textarea { min-height: 150px; resize: vertical; }
  .dialog-card input:focus, .dialog-card textarea:focus { border-color: #5b6ef5; }
  .dialog-card .hint { font-size: 14px; color: #999; margin-top: 4px; }
  .color-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .color-row span {
    width: 42px; height: 42px; border-radius: 50%;
    cursor: pointer; display: block;
    border: 4px solid transparent;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  .color-row span.sel { border-color: #333; }
  .dialog-btns { display: flex; gap: 12px; justify-content: center; margin-top: 22px; }
  footer { text-align: center; margin-top: 20px; color: #888; font-size: 15px; }
</style>
</head>
<body>
<header>
  <h1>🧹 とうばんひょう</h1>
  <button class="btn-main" id="btnAdd">➕ とうばんをふやす</button>
</header>
<div class="today-date" id="todayDate"></div>

<div id="dutyList"></div>

<footer>「つぎへ ▶」をおすと、とうばんが 1つ すすむよ。データはこの きき のなかに ほぞんされるよ。</footer>

<div id="editDialog">
  <div class="dialog-card">
    <h2 id="dialogTitle">とうばんを つくる</h2>
    <label for="dutyName">とうばんのなまえ</label>
    <input type="text" id="dutyName" maxlength="14" placeholder="れい：にっちょく／きゅうしょく／そうじ">
    <label>カードのいろ</label>
    <div class="color-row" id="colorRow"></div>
    <label for="memberList">なまえ・グループのリスト（じゅんばんどおりに）</label>
    <textarea id="memberList" placeholder="1ぎょうに 1つ かいてね&#10;れい：&#10;たろう・はなこ&#10;けんた・ゆい&#10;1ぱん&#10;2はん"></textarea>
    <div class="hint">※うえから じゅんばんに まわるよ。「、」くぎりでもOK</div>
    <div class="dialog-btns">
      <button class="btn-main" id="btnSave">ほぞんする</button>
      <button id="btnCancel">やめる</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var STORE_KEY = 'sensei25_touban';
  var COLORS = ['#5b6ef5','#ff7a9c','#3dbf7a','#f5a623','#8e5bf5','#38b6d9'];
  var EMOJIS = { 'にっちょく':'☀️', 'きゅうしょく':'🍚', 'そうじ':'🧹', 'いきもの':'🐹', 'ほん':'📚', 'くばり':'📨' };
  var WEEK = ['にち','げつ','か','すい','もく','きん','ど'];

  var state = load();

  function load(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.duties)) return s;
      }
    } catch(e){}
    // starter example so the screen isn't empty on first launch
    return {
      duties: [
        { id: 1, name: 'にっちょく', color: '#5b6ef5', members: ['1ばん・2ばん','3ばん・4ばん','5ばん・6ばん'], index: 0 }
      ]
    };
  }
  function save(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
  }

  /* ---- audio ---- */
  var actx = null;
  function audio(){
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, start, dur, type, vol){
    var ctx = audio(); if (!ctx) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctx.currentTime + start);
    g.gain.exponentialRampToValueAtTime(vol || .25, ctx.currentTime + start + .02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(ctx.currentTime + start); o.stop(ctx.currentTime + start + dur + .05);
  }
  function soundNext(){ tone(587, 0, .12, 'triangle', .28); tone(784, .1, .2, 'triangle', .3); }

  function emojiFor(name){
    for (var key in EMOJIS) if (name.indexOf(key) !== -1) return EMOJIS[key];
    return '🎯';
  }

  function renderToday(){
    var d = new Date();
    document.getElementById('todayDate').textContent =
      'きょうは ' + (d.getMonth()+1) + 'がつ ' + d.getDate() + 'にち（' + WEEK[d.getDay()] + 'ようび）';
  }

  var dutyList = document.getElementById('dutyList');

  function render(){
    renderToday();
    dutyList.innerHTML = '';
    if (state.duties.length === 0) {
      var hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.innerHTML = 'まだ とうばんがないよ。<br>「➕ とうばんをふやす」で つくってね！';
      dutyList.parentNode.insertBefore(hint, dutyList);
      hint.id = 'emptyHint';
      return;
    }
    var old = document.getElementById('emptyHint');
    if (old) old.remove();

    state.duties.forEach(function(duty){
      var card = document.createElement('div');
      card.className = 'duty-card';
      card.style.setProperty('--dc', duty.color);

      var del = document.createElement('button');
      del.className = 'btn-del';
      del.textContent = '✕';
      del.title = 'けす';
      del.addEventListener('click', function(){
        if (!confirm('「' + duty.name + '」の とうばんを けしてもいい？')) return;
        state.duties = state.duties.filter(function(d){ return d.id !== duty.id; });
        save(); render();
      });
      card.appendChild(del);

      var title = document.createElement('div');
      title.className = 'duty-title';
      title.textContent = emojiFor(duty.name) + ' ' + duty.name;
      card.appendChild(title);

      var lbl = document.createElement('div');
      lbl.className = 'now-label';
      lbl.textContent = 'きょうの とうばん';
      card.appendChild(lbl);

      var cur = document.createElement('div');
      cur.className = 'current-name';
      cur.textContent = duty.members.length ? duty.members[duty.index % duty.members.length] : '（だれもいないよ）';
      card.appendChild(cur);

      var next = document.createElement('div');
      next.className = 'next-preview';
      if (duty.members.length > 1) {
        next.textContent = 'つぎ： ' + duty.members[(duty.index + 1) % duty.members.length];
      } else {
        next.textContent = '';
      }
      card.appendChild(next);

      var btns = document.createElement('div');
      btns.className = 'card-btns';

      var bNext = document.createElement('button');
      bNext.className = 'btn-next';
      bNext.textContent = 'つぎへ ▶';
      bNext.addEventListener('click', function(){
        if (duty.members.length === 0) return;
        duty.index = (duty.index + 1) % duty.members.length;
        save();
        cur.textContent = duty.members[duty.index];
        cur.classList.remove('flip');
        void cur.offsetWidth; // restart animation
        cur.classList.add('flip');
        if (duty.members.length > 1) {
          next.textContent = 'つぎ： ' + duty.members[(duty.index + 1) % duty.members.length];
        }
        soundNext();
      });
      btns.appendChild(bNext);

      var bBack = document.createElement('button');
      bBack.className = 'btn-edit';
      bBack.textContent = '◀ もどす';
      bBack.addEventListener('click', function(){
        if (duty.members.length === 0) return;
        duty.index = (duty.index - 1 + duty.members.length) % duty.members.length;
        save(); render();
      });
      btns.appendChild(bBack);

      var bEdit = document.createElement('button');
      bEdit.className = 'btn-edit';
      bEdit.textContent = '✏️ へんしゅう';
      bEdit.addEventListener('click', function(){ openDialog(duty); });
      btns.appendChild(bEdit);

      card.appendChild(btns);
      dutyList.appendChild(card);
    });
  }

  /* ---- dialog ---- */
  var dialog = document.getElementById('editDialog');
  var dutyName = document.getElementById('dutyName');
  var memberList = document.getElementById('memberList');
  var colorRow = document.getElementById('colorRow');
  var dialogTitle = document.getElementById('dialogTitle');
  var editingId = null;
  var chosenColor = COLORS[0];

  COLORS.forEach(function(c){
    var sw = document.createElement('span');
    sw.style.background = c;
    sw.dataset.color = c;
    sw.addEventListener('click', function(){
      chosenColor = c;
      updateColorSel();
    });
    colorRow.appendChild(sw);
  });
  function updateColorSel(){
    Array.prototype.forEach.call(colorRow.children, function(sw){
      sw.classList.toggle('sel', sw.dataset.color === chosenColor);
    });
  }

  function openDialog(duty){
    if (duty) {
      editingId = duty.id;
      dialogTitle.textContent = 'とうばんを へんしゅう';
      dutyName.value = duty.name;
      memberList.value = duty.members.join('\n');
      chosenColor = duty.color;
    } else {
      editingId = null;
      dialogTitle.textContent = 'とうばんを つくる';
      dutyName.value = '';
      memberList.value = '';
      chosenColor = COLORS[state.duties.length % COLORS.length];
    }
    updateColorSel();
    dialog.classList.add('show');
    dutyName.focus();
  }

  document.getElementById('btnAdd').addEventListener('click', function(){ openDialog(null); });
  document.getElementById('btnCancel').addEventListener('click', function(){ dialog.classList.remove('show'); });
  dialog.addEventListener('click', function(e){ if (e.target === dialog) dialog.classList.remove('show'); });

  document.getElementById('btnSave').addEventListener('click', function(){
    var name = dutyName.value.trim();
    if (!name) { alert('とうばんのなまえを かいてね'); return; }
    var members = memberList.value.split(/[\n、,，]/).map(function(m){ return m.trim(); }).filter(function(m){ return m.length > 0; });
    if (members.length === 0) { alert('なまえのリストを かいてね'); return; }
    if (editingId != null) {
      state.duties.forEach(function(d){
        if (d.id === editingId) {
          d.name = name; d.members = members; d.color = chosenColor;
          if (d.index >= members.length) d.index = 0;
        }
      });
    } else {
      state.duties.push({ id: Date.now(), name: name, color: chosenColor, members: members, index: 0 });
    }
    save();
    dialog.classList.remove('show');
    render();
  });

  // keep date fresh for always-on classroom display
  setInterval(renderToday, 60000);

  render();
})();
</script>
