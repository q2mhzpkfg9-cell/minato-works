<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイピングれんしゅう</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",-apple-system,"Segoe UI",sans-serif;
    background: linear-gradient(160deg,#dff1ff 0%,#f5f0ff 55%,#ffeef5 100%);
    min-height: 100vh;
    color: #3a3f5c;
    padding: 16px;
  }
  header { text-align: center; margin-bottom: 12px; }
  h1 { font-size: clamp(1.6rem, 4.5vw, 2.6rem); color: #5b6ef5; }
  .sub { font-size: 1.05rem; color: #7a80a8; margin-top: 4px; }
  .card {
    background: #fff; border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    padding: clamp(16px, 3vw, 30px);
    max-width: 1060px; margin: 0 auto 18px;
  }
  .btn {
    font-family: inherit; border: none; border-radius: 999px;
    background: #5b6ef5; color: #fff;
    font-size: clamp(1.1rem, 2.4vw, 1.4rem); font-weight: bold;
    padding: 14px 32px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(91,110,245,.35);
    transition: transform .1s;
  }
  .btn:active { transform: scale(.95); }
  .btn.ghost { background: #eef0ff; color: #5b6ef5; box-shadow: none; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; margin: 12px 0; }
  .hide { display: none !important; }

  .lvbtn {
    font-family: inherit; border: 4px solid #d9defc; border-radius: 22px;
    background: #fff; color: #3a3f5c;
    font-size: clamp(1.2rem, 2.8vw, 1.55rem); font-weight: bold;
    padding: 24px 30px; min-width: 260px; cursor: pointer; text-align: center;
  }
  .lvbtn small { display: block; font-weight: normal; font-size: .95rem; color: #7a80a8; margin-top: 6px; }
  .lvbtn .best { display: block; font-size: .95rem; color: #ff8a3d; margin-top: 6px; font-weight: bold; }
  .lvbtn:active { transform: scale(.97); }

  .statusbar { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; font-size: 1.15rem; margin-bottom: 8px; }
  .statusbar b { color: #5b6ef5; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .wordbox { text-align: center; margin: 10px 0 6px; }
  .kana { font-size: clamp(2rem, 6vw, 3.4rem); font-weight: bold; letter-spacing: .08em; min-height: 1.3em; }
  .kana .kdone { color: #b9c3f5; }
  .kana .know { color: #ff8a3d; }
  .roma {
    font-size: clamp(1.5rem, 4.5vw, 2.4rem);
    font-family: "Courier New", monospace, "Hiragino Maru Gothic ProN";
    font-weight: bold; letter-spacing: .12em; margin-top: 6px; min-height: 1.3em;
  }
  .roma .done { color: #23a35b; }
  .roma .rest { color: #9aa1c9; }
  .progress { text-align: center; color: #7a80a8; font-size: 1.1rem; margin-bottom: 4px; }

  /* キーボード */
  .kb { max-width: 860px; margin: 14px auto 0; user-select: none; }
  .kbrow { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }
  .kbrow.r2 { padding-left: 24px; }
  .kbrow.r3 { padding-left: 48px; }
  .kbkey {
    font-family: inherit;
    width: clamp(30px, 7.4vw, 64px); height: clamp(38px, 7.4vw, 60px);
    border-radius: 12px; border: none;
    background: #eef0ff; color: #3a3f5c;
    font-size: clamp(1rem, 2.6vw, 1.5rem); font-weight: bold;
    cursor: pointer; box-shadow: 0 3px 0 #ccd3f8;
    text-transform: uppercase;
    position: relative;
  }
  .kbkey:active { transform: translateY(2px); box-shadow: none; }
  .kbkey.next { background: #ffb648; color: #fff; box-shadow: 0 3px 0 #e09a2b; animation: pulse .8s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .kbkey.missflash { background: #ff8fa5; color: #fff; }
  .kbkey.home::after {
    content: ""; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 40%; height: 3px; border-radius: 2px; background: currentColor; opacity: .5;
  }
  .fingerhint { text-align: center; color: #7a80a8; font-size: .95rem; margin-top: 6px; }

  .resultcard { text-align: center; }
  .resultcard h2 { color: #5b6ef5; font-size: 2rem; margin-bottom: 12px; }
  .bigstats { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin: 14px 0; }
  .stat { background: #f4f6ff; border-radius: 18px; padding: 18px 30px; }
  .stat .v { font-size: clamp(2rem, 6vw, 3rem); font-weight: bold; color: #ff8a3d; }
  .stat .k { font-size: 1.05rem; color: #7a80a8; }
  .newrec { color: #e5486a; font-weight: bold; font-size: 1.3rem; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
</style>
</head>
<body>

<header>
  <h1>⌨️ タイピングれんしゅう</h1>
  <div class="sub">ローマじで うちかたを おぼえよう（3ねんせいから）</div>
</header>

<!-- ===== レベルせんたく ===== -->
<div id="scr-menu" class="card">
  <div class="row" style="margin-top:4px;">
    <button class="lvbtn" onclick="startRun(1)">🌱 レベル1<br>ホームポジション<small>ゆびの きほんの いちで うつ</small><span class="best" id="best1"></span></button>
    <button class="lvbtn" onclick="startRun(2)">🌼 レベル2<br>ことば<small>みぢかな ことば 50ご いじょう</small><span class="best" id="best2"></span></button>
    <button class="lvbtn" onclick="startRun(3)">🌳 レベル3<br>みじかい ぶん<small>ぶんしょうに ちょうせん</small><span class="best" id="best3"></span></button>
  </div>
  <div class="fingerhint">
    「し」は shi / si、「ふ」は fu / hu など、どちらの うちかたでも せいかいだよ。<br>
    キーボードが ない ときは がめんの キーを タップしても OK！
  </div>
</div>

<!-- ===== プレイ ===== -->
<div id="scr-play" class="card hide">
  <div class="statusbar">
    <div>⏱ <b id="st-time">0.0</b> びょう</div>
    <div>はやさ <b id="st-wpm">0</b> WPM</div>
    <div>せいかくりつ <b id="st-acc">100</b>%</div>
  </div>
  <div class="progress" id="progress"></div>
  <div class="wordbox">
    <div class="kana" id="kanaline"></div>
    <div class="roma" id="romaline"></div>
  </div>
  <div class="kb" id="kb"></div>
  <div class="fingerhint">オレンジの キーを おそう！　FとJの キーには でっぱりが あるよ</div>
  <div class="row" style="margin-top:10px;">
    <button class="btn ghost" onclick="backMenu()">← やめる</button>
  </div>
</div>

<!-- ===== けっか ===== -->
<div id="scr-result" class="card resultcard hide">
  <h2 id="r-title">できたね！🎉</h2>
  <div class="bigstats">
    <div class="stat"><div class="v" id="r-wpm">0</div><div class="k">はやさ（WPM）</div></div>
    <div class="stat"><div class="v" id="r-acc">0%</div><div class="k">せいかくりつ</div></div>
    <div class="stat"><div class="v" id="r-time">0</div><div class="k">かかった じかん（びょう）</div></div>
  </div>
  <div class="newrec hide" id="r-newrec">🏆 じこベスト こうしん！</div>
  <div style="color:#7a80a8; margin-top:8px;" id="r-best"></div>
  <div class="row" style="margin-top:16px;">
    <button class="btn" onclick="startRun(curLevel)">もういちど</button>
    <button class="btn ghost" onclick="backMenu()">レベルせんたくへ</button>
  </div>
</div>

<script>
"use strict";
const LSKEY = "sensei25_typing_best";

/* ================= ことばデータ ================= */
const WORDS1 = ["あさ", "あか", "かさ", "さか", "あさひ", "かお", "しか", "すし", "はし", "あし", "ふじ", "あじ", "かじ", "だし", "ひがし", "かき", "さいふ", "はこ"];
const WORDS2 = [
  "ねこ", "いぬ", "さくら", "がっこう", "せんせい", "ともだち", "えんぴつ", "けしごむ", "きゅうしょく", "としょかん",
  "たいいく", "おんがく", "ずこう", "りか", "しゃかい", "さんすう", "こくご", "しゅくだい", "うんどうかい", "えんそく",
  "ろうか", "こうてい", "たいふう", "にじ", "ゆき", "かみなり", "はれ", "くもり", "あめ", "かぜ",
  "やま", "かわ", "うみ", "そら", "ほし", "つき", "たいよう", "はな", "くさ", "むし",
  "とり", "さかな", "かぶとむし", "ちょう", "せみ", "とんぼ", "おにぎり", "みそしる", "ぎゅうにゅう", "やさい",
  "くだもの", "りんご", "ばなな", "みかん", "ぶどう", "いちご", "でんしゃ", "じてんしゃ", "ひこうき", "ふね"
];
const SENTS = [
  "きょうはいいてんきです",
  "あしたはえんそくです",
  "ほんをよむのがすきです",
  "きゅうしょくがたのしみです",
  "ともだちとあそびます",
  "うんどうかいがんばるぞ",
  "はやねはやおきをしよう",
  "てをあらってうがいをしよう",
  "こくごのべんきょうをします",
  "みんななかよくあそぼう"
];

/* ================= ローマ字マップ ================= */
const KMAP = {
  "あ": ["a"], "い": ["i", "yi"], "う": ["u", "wu"], "え": ["e"], "お": ["o"],
  "か": ["ka", "ca"], "き": ["ki"], "く": ["ku", "cu", "qu"], "け": ["ke"], "こ": ["ko", "co"],
  "さ": ["sa"], "し": ["si", "shi", "ci"], "す": ["su"], "せ": ["se", "ce"], "そ": ["so"],
  "た": ["ta"], "ち": ["ti", "chi"], "つ": ["tu", "tsu"], "て": ["te"], "と": ["to"],
  "な": ["na"], "に": ["ni"], "ぬ": ["nu"], "ね": ["ne"], "の": ["no"],
  "は": ["ha"], "ひ": ["hi"], "ふ": ["fu", "hu"], "へ": ["he"], "ほ": ["ho"],
  "ま": ["ma"], "み": ["mi"], "む": ["mu"], "め": ["me"], "も": ["mo"],
  "や": ["ya"], "ゆ": ["yu"], "よ": ["yo"],
  "ら": ["ra"], "り": ["ri"], "る": ["ru"], "れ": ["re"], "ろ": ["ro"],
  "わ": ["wa"], "を": ["wo"], "ん": ["nn", "xn"],
  "が": ["ga"], "ぎ": ["gi"], "ぐ": ["gu"], "げ": ["ge"], "ご": ["go"],
  "ざ": ["za"], "じ": ["zi", "ji"], "ず": ["zu"], "ぜ": ["ze"], "ぞ": ["zo"],
  "だ": ["da"], "ぢ": ["di"], "づ": ["du"], "で": ["de"], "ど": ["do"],
  "ば": ["ba"], "び": ["bi"], "ぶ": ["bu"], "べ": ["be"], "ぼ": ["bo"],
  "ぱ": ["pa"], "ぴ": ["pi"], "ぷ": ["pu"], "ぺ": ["pe"], "ぽ": ["po"],
  "ぁ": ["xa", "la"], "ぃ": ["xi", "li"], "ぅ": ["xu", "lu"], "ぇ": ["xe", "le"], "ぉ": ["xo", "lo"],
  "ゃ": ["xya", "lya"], "ゅ": ["xyu", "lyu"], "ょ": ["xyo", "lyo"],
  "きゃ": ["kya"], "きゅ": ["kyu"], "きょ": ["kyo"],
  "しゃ": ["sya", "sha"], "しゅ": ["syu", "shu"], "しょ": ["syo", "sho"],
  "ちゃ": ["tya", "cha"], "ちゅ": ["tyu", "chu"], "ちょ": ["tyo", "cho"],
  "にゃ": ["nya"], "にゅ": ["nyu"], "にょ": ["nyo"],
  "ひゃ": ["hya"], "ひゅ": ["hyu"], "ひょ": ["hyo"],
  "みゃ": ["mya"], "みゅ": ["myu"], "みょ": ["myo"],
  "りゃ": ["rya"], "りゅ": ["ryu"], "りょ": ["ryo"],
  "ぎゃ": ["gya"], "ぎゅ": ["gyu"], "ぎょ": ["gyo"],
  "じゃ": ["zya", "ja", "jya"], "じゅ": ["zyu", "ju", "jyu"], "じょ": ["zyo", "jo", "jyo"],
  "びゃ": ["bya"], "びゅ": ["byu"], "びょ": ["byo"],
  "ぴゃ": ["pya"], "ぴゅ": ["pyu"], "ぴょ": ["pyo"],
  "ふぁ": ["fa"], "ふぃ": ["fi"], "ふぇ": ["fe"], "ふぉ": ["fo"],
  "ー": ["-"], "、": [","], "。": ["."]
};
const VOWELISH = "aiueon";

function takeUnit(str, i) {
  const two = str.substr(i, 2);
  if (two.length === 2 && KMAP[two]) return { kana: two, roms: KMAP[two].slice(), len: 2 };
  const one = str[i];
  if (KMAP[one]) return { kana: one, roms: KMAP[one].slice(), len: 1 };
  return { kana: one, roms: [one], len: 1 };
}
function parseWord(hira) {
  const units = [];
  let i = 0;
  while (i < hira.length) {
    if (hira[i] === "っ") {
      if (i + 1 < hira.length && hira[i + 1] !== "っ") {
        const nx = takeUnit(hira, i + 1);
        const roms = [];
        nx.roms.forEach(r => { if (!VOWELISH.includes(r[0])) roms.push(r[0] + r); });
        nx.roms.forEach(r => { roms.push("xtu" + r); roms.push("ltu" + r); });
        units.push({ kana: "っ" + nx.kana, roms });
        i += 1 + nx.len;
      } else {
        units.push({ kana: "っ", roms: ["xtu", "ltu"] });
        i++;
      }
      continue;
    }
    const u = takeUnit(hira, i);
    units.push({ kana: u.kana, roms: u.roms });
    i += u.len;
  }
  // 「ん」の n 1回打ち（次が母音・な行・や行でないとき）
  for (let k = 0; k < units.length; k++) {
    if (units[k].kana === "ん" && k + 1 < units.length) {
      const nxt = units[k + 1];
      const ok = nxt.roms.every(r => !"aiueony".includes(r[0]));
      if (ok) { units[k] = { kana: "ん", roms: units[k].roms.concat(["n"]), single: true }; }
    }
  }
  return units;
}

/* ================= サウンド ================= */
let actx = null;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function beep(freq, dur, delay, type, vol) {
  try {
    const ctx = audio();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    const t = ctx.currentTime + (delay || 0);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function sndKey() { beep(1400, 0.03, 0, "square", 0.04); }
function sndMiss() { beep(200, 0.15, 0, "sawtooth", 0.1); }
function sndWord() { beep(784, 0.1, 0); beep(1047, 0.2, 0.09); }
function sndFinish() { beep(523, 0.15, 0); beep(659, 0.15, 0.13); beep(784, 0.15, 0.26); beep(1047, 0.45, 0.39); }

/* ================= キーボードUI ================= */
const KB_ROWS = [
  ["q", "w", "e", "r", "t", "y", "u", "i", "o", "p"],
  ["a", "s", "d", "f", "g", "h", "j", "k", "l", "-"],
  ["z", "x", "c", "v", "b", "n", "m", ",", "."]
];
const HOMEKEYS = ["f", "j"];
function buildKB() {
  const kb = document.getElementById("kb");
  kb.innerHTML = "";
  KB_ROWS.forEach((r, ri) => {
    const div = document.createElement("div");
    div.className = "kbrow r" + (ri + 1);
    r.forEach(k => {
      const b = document.createElement("button");
      b.className = "kbkey" + (HOMEKEYS.includes(k) ? " home" : "");
      b.id = "key-" + k;
      b.textContent = k;
      b.addEventListener("pointerdown", (e) => { e.preventDefault(); handleKey(k); });
      div.appendChild(b);
    });
    kb.appendChild(div);
  });
}
function highlightKey(ch) {
  document.querySelectorAll(".kbkey.next").forEach(b => b.classList.remove("next"));
  if (!ch) return;
  const el = document.getElementById("key-" + ch);
  if (el) el.classList.add("next");
}
function flashMiss(ch) {
  const el = document.getElementById("key-" + ch);
  if (!el) return;
  el.classList.add("missflash");
  setTimeout(() => el.classList.remove("missflash"), 250);
}

/* ================= ゲーム状態 ================= */
let curLevel = 1;
let runList = [];      // このランで打つ ことば（ひらがな）
let wordIdx = 0;
let units = [], uIdx = 0, buf = "", doneStr = "";
let totalKeys = 0, missKeys = 0;
let startTime = 0, tickId = null, running = false;

function pickRandom(arr, n) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}
function loadBest() {
  try { return JSON.parse(localStorage.getItem(LSKEY) || "{}"); } catch (e) { return {}; }
}
function renderMenuBest() {
  const b = loadBest();
  [1, 2, 3].forEach(l => {
    const el = document.getElementById("best" + l);
    el.textContent = b[l] ? "じこベスト " + b[l].wpm + " WPM / " + b[l].acc + "%" : "きろくは まだ ないよ";
  });
}
function startRun(level) {
  curLevel = level;
  if (level === 1) runList = pickRandom(WORDS1, 8);
  else if (level === 2) runList = pickRandom(WORDS2, 10);
  else runList = pickRandom(SENTS, 3);
  wordIdx = 0;
  totalKeys = 0; missKeys = 0;
  startTime = 0; running = true;
  document.getElementById("scr-menu").classList.add("hide");
  document.getElementById("scr-result").classList.add("hide");
  document.getElementById("scr-play").classList.remove("hide");
  loadWord();
  updateStats();
  if (tickId) clearInterval(tickId);
  tickId = setInterval(updateStats, 200);
}
function loadWord() {
  units = parseWord(runList[wordIdx]);
  uIdx = 0; buf = ""; doneStr = "";
  renderWord();
}

/* ================= 描画 ================= */
function expectedChar() {
  if (uIdx >= units.length) return null;
  const u = units[uIdx];
  const cands = u.roms.filter(r => r.startsWith(buf) && r.length > buf.length);
  if (cands.length === 0) {
    // 「ん」で buf="n" のとき：次のことばの先頭 or n
    if (u.kana === "ん" && buf === "n") return "n";
    return null;
  }
  return cands[0][buf.length];
}
function remainingRoma() {
  if (uIdx >= units.length) return "";
  const u = units[uIdx];
  const cands = u.roms.filter(r => r.startsWith(buf));
  let s = cands.length ? cands[0].slice(buf.length) : "";
  for (let k = uIdx + 1; k < units.length; k++) s += units[k].roms[0];
  return s;
}
function renderWord() {
  // かなの表示（打ちおわった部分をうすく）
  let kh = "";
  units.forEach((u, i) => {
    const cls = i < uIdx ? "kdone" : (i === uIdx ? "know" : "");
    kh += "<span class='" + cls + "'>" + u.kana + "</span>";
  });
  document.getElementById("kanaline").innerHTML = kh;
  document.getElementById("romaline").innerHTML =
    "<span class='done'>" + doneStr + buf + "</span><span class='rest'>" + remainingRoma() + "</span>";
  document.getElementById("progress").textContent =
    (wordIdx + 1) + " / " + runList.length + " もんめ";
  highlightKey(expectedChar());
}
function updateStats() {
  const sec = startTime ? (performance.now() - startTime) / 1000 : 0;
  document.getElementById("st-time").textContent = sec.toFixed(1);
  const correct = totalKeys - missKeys;
  const wpm = sec > 1 ? Math.round((correct / 5) / (sec / 60)) : 0;
  document.getElementById("st-wpm").textContent = wpm;
  document.getElementById("st-acc").textContent = totalKeys ? Math.round(correct / totalKeys * 100) : 100;
}

/* ================= 入力処理 ================= */
function handleKey(k) {
  if (!running || uIdx >= units.length) return;
  if (!/^[a-z,.\-]$/.test(k)) return;
  if (!startTime) startTime = performance.now();
  totalKeys++;
  const u = units[uIdx];

  // 「ん」の n 1回打ち（buf="n" のときの次のキー）
  if (u.kana === "ん" && buf === "n") {
    if (k === "n") { sndKey(); doneStr += "nn"; buf = ""; advanceUnit(); return; }
    if (u.single) {
      const nxt = units[uIdx + 1];
      if (nxt && nxt.roms.some(r => r.startsWith(k))) {
        doneStr += "n";
        buf = "";
        uIdx++;
        // このキーを次のユニットに適用
        buf = k;
        sndKey();
        checkUnitComplete();
        renderWord();
        return;
      }
    }
    miss(k);
    return;
  }

  const cands = u.roms.filter(r => r.startsWith(buf + k));
  if (cands.length > 0) {
    buf += k;
    sndKey();
    checkUnitComplete();
    renderWord();
  } else {
    miss(k);
  }
}
function checkUnitComplete() {
  const u = units[uIdx];
  if (u.kana === "ん" && buf === "n" && u.roms.includes("nn")) return; // 保留（nn か 次の子音待ち）
  if (u.roms.includes(buf)) {
    doneStr += buf;
    buf = "";
    advanceUnit();
  }
}
function advanceUnit() {
  uIdx++;
  if (uIdx >= units.length) {
    // ことば完成
    sndWord();
    wordIdx++;
    if (wordIdx >= runList.length) { finishRun(); return; }
    setTimeout(loadWord, 120);
    renderWord();
    return;
  }
  renderWord();
}
function miss(k) {
  missKeys++;
  sndMiss();
  flashMiss(k);
  updateStats();
}
document.addEventListener("keydown", (e) => {
  if (document.getElementById("scr-play").classList.contains("hide")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (/^[a-z,.\-]$/.test(k)) { handleKey(k); e.preventDefault(); }
  else if (e.key === "Escape") backMenu();
});

/* ================= 終了・記録 ================= */
function finishRun() {
  running = false;
  if (tickId) clearInterval(tickId);
  const sec = (performance.now() - startTime) / 1000;
  const correct = totalKeys - missKeys;
  const wpm = sec > 0 ? Math.round((correct / 5) / (sec / 60)) : 0;
  const acc = totalKeys ? Math.round(correct / totalKeys * 100) : 100;
  document.getElementById("scr-play").classList.add("hide");
  document.getElementById("scr-result").classList.remove("hide");
  document.getElementById("r-wpm").textContent = wpm;
  document.getElementById("r-acc").textContent = acc + "%";
  document.getElementById("r-time").textContent = sec.toFixed(1);
  const best = loadBest();
  let newRec = false;
  if (!best[curLevel] || wpm > best[curLevel].wpm) {
    best[curLevel] = { wpm, acc };
    localStorage.setItem(LSKEY, JSON.stringify(best));
    newRec = true;
  }
  document.getElementById("r-newrec").classList.toggle("hide", !newRec);
  document.getElementById("r-best").textContent =
    "レベル" + curLevel + " の じこベスト：" + best[curLevel].wpm + " WPM / " + best[curLevel].acc + "%";
  document.getElementById("r-title").textContent =
    acc >= 95 ? "パーフェクトきゅう！🎉" : acc >= 85 ? "よくできました！💮" : "さいごまで がんばったね！🌟";
  sndFinish();
}
function backMenu() {
  running = false;
  if (tickId) clearInterval(tickId);
  document.getElementById("scr-play").classList.add("hide");
  document.getElementById("scr-result").classList.add("hide");
  document.getElementById("scr-menu").classList.remove("hide");
  renderMenuBest();
}

buildKB();
renderMenuBest();
</script>
