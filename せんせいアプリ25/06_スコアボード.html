<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スコアボード</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",-apple-system,"Segoe UI",sans-serif;
    background: linear-gradient(160deg,#dff1ff 0%,#f5f0ff 55%,#ffeef5 100%);
    min-height: 100vh;
    padding: 16px;
    color: #333;
  }
  header { text-align: center; margin-bottom: 14px; }
  h1 { font-size: clamp(28px, 4vw, 44px); color: #5b6ef5; text-shadow: 0 2px 0 #fff; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px;
  }
  button {
    font-family: inherit;
    border: none; cursor: pointer;
    border-radius: 999px;
    font-size: clamp(18px, 2.2vw, 24px);
    padding: 12px 26px;
    background: #fff; color: #5b6ef5;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
    transition: transform .12s, box-shadow .12s;
    font-weight: bold;
  }
  button:active { transform: scale(.94); }
  .btn-main { background: #5b6ef5; color: #fff; }
  .btn-danger { background: #ff7a9c; color: #fff; }
  .btn-ghost { background: rgba(255,255,255,.7); }
  #board {
    display: grid;
    gap: 18px;
    max-width: 1400px;
    margin: 0 auto;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  }
  .team-card {
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    padding: 20px 16px 24px;
    text-align: center;
    position: relative;
    border-top: 14px solid var(--tc, #5b6ef5);
    overflow: hidden;
  }
  .crown {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    font-size: clamp(34px, 4vw, 52px);
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.25));
    animation: crownbob 1.4s ease-in-out infinite;
    pointer-events: none;
    z-index: 3;
  }
  @keyframes crownbob {
    0%,100% { transform: translateX(-50%) translateY(0) rotate(-6deg); }
    50% { transform: translateX(-50%) translateY(-8px) rotate(6deg); }
  }
  .team-name {
    font-size: clamp(24px, 3vw, 38px);
    font-weight: bold;
    color: var(--tc, #5b6ef5);
    margin: 26px 0 4px;
    border: none;
    background: transparent;
    text-align: center;
    width: 100%;
    font-family: inherit;
    outline: none;
    border-radius: 12px;
  }
  .team-name:focus { background: #f0f3ff; }
  .score {
    font-size: clamp(80px, 11vw, 160px);
    font-weight: bold;
    line-height: 1.05;
    color: #333;
    font-variant-numeric: tabular-nums;
    transition: transform .15s;
    user-select: none;
  }
  .score.pop { animation: pop .45s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    35% { transform: scale(1.35); color: var(--tc, #5b6ef5); }
    100% { transform: scale(1); }
  }
  .score.pop-down { animation: popdown .35s ease; }
  @keyframes popdown {
    0% { transform: scale(1); }
    40% { transform: scale(.8); color: #999; }
    100% { transform: scale(1); }
  }
  .score-btns { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .score-btns button {
    font-size: clamp(22px, 2.6vw, 32px);
    padding: 14px 26px;
    min-width: 92px;
  }
  .b-p1 { background: var(--tc, #5b6ef5); color: #fff; }
  .b-p5 { background: var(--tc, #5b6ef5); color: #fff; opacity: .88; }
  .b-m1 { background: #eee; color: #666; }
  .color-dot {
    position: absolute; top: 14px; right: 14px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    cursor: pointer;
    background: var(--tc, #5b6ef5);
  }
  .color-pop {
    position: absolute; top: 54px; right: 10px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,.25);
    padding: 10px; display: none;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px; z-index: 10;
  }
  .color-pop.show { display: grid; }
  .color-pop span {
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; display: block;
    border: 3px solid #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,.2);
  }
  .burst {
    position: absolute;
    font-size: 30px;
    pointer-events: none;
    animation: burst 0.8s ease-out forwards;
    z-index: 5;
  }
  @keyframes burst {
    0% { opacity: 1; transform: translate(0,0) scale(.6); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4); }
  }
  footer { text-align: center; margin-top: 22px; color: #888; font-size: 16px; }
</style>
</head>
<body>
<header>
  <h1>🏆 スコアボード</h1>
</header>

<div class="toolbar">
  <button class="btn-main" id="btnAdd">➕ チームをふやす</button>
  <button class="btn-ghost" id="btnRemove">➖ チームをへらす</button>
  <button class="btn-ghost" id="btnUndo">↩️ もどす</button>
  <button class="btn-danger" id="btnReset">🔄 リセット</button>
</div>

<div id="board"></div>

<footer>チームのなまえをタップするとかえられるよ。まるいいろをタップするといろがかわるよ。</footer>

<script>
(function(){
  'use strict';
  var STORE_KEY = 'sensei25_scoreboard';
  var PALETTE = ['#5b6ef5','#ff7a9c','#3dbf7a','#f5a623','#8e5bf5','#38b6d9','#e5533d','#7a8899'];
  var MAX_TEAMS = 6, MIN_TEAMS = 2;

  var state = load();
  var history = []; // undo stack: snapshots of scores

  function defaultState(){
    return {
      teams: [
        { name: 'あかぐみ', color: '#ff7a9c', score: 0 },
        { name: 'あおぐみ', color: '#5b6ef5', score: 0 }
      ]
    };
  }
  function load(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.teams) && s.teams.length >= MIN_TEAMS) return s;
      }
    } catch(e){}
    return defaultState();
  }
  function save(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
  }
  function snapshot(){
    history.push(JSON.stringify(state));
    if (history.length > 100) history.shift();
  }

  /* ---- Web Audio ---- */
  var actx = null;
  function audio(){
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, start, dur, type, vol){
    var ctx = audio(); if (!ctx) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctx.currentTime + start);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, ctx.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(ctx.currentTime + start);
    o.stop(ctx.currentTime + start + dur + 0.05);
  }
  function soundPlus(){ tone(660, 0, .15, 'triangle', .3); tone(880, .08, .2, 'triangle', .3); }
  function soundBig(){ tone(523, 0, .12, 'triangle', .3); tone(659, .09, .12, 'triangle', .3); tone(784, .18, .12, 'triangle', .3); tone(1047, .27, .3, 'triangle', .35); }
  function soundMinus(){ tone(330, 0, .18, 'sine', .25); tone(247, .1, .22, 'sine', .25); }
  function soundReset(){ tone(392, 0, .15, 'sine', .2); tone(330, .12, .15, 'sine', .2); tone(262, .24, .3, 'sine', .2); }

  /* ---- rendering ---- */
  var board = document.getElementById('board');

  function topScore(){
    var m = -Infinity;
    state.teams.forEach(function(t){ if (t.score > m) m = t.score; });
    return m;
  }

  function render(){
    board.innerHTML = '';
    var top = topScore();
    var showCrown = top > 0;
    state.teams.forEach(function(team, i){
      var card = document.createElement('div');
      card.className = 'team-card';
      card.style.setProperty('--tc', team.color);

      if (showCrown && team.score === top) {
        var crown = document.createElement('div');
        crown.className = 'crown';
        crown.textContent = '👑';
        card.appendChild(crown);
      }

      var dot = document.createElement('div');
      dot.className = 'color-dot';
      dot.title = 'いろをかえる';
      card.appendChild(dot);

      var pop = document.createElement('div');
      pop.className = 'color-pop';
      PALETTE.forEach(function(c){
        var sw = document.createElement('span');
        sw.style.background = c;
        sw.addEventListener('click', function(ev){
          ev.stopPropagation();
          team.color = c; save(); render();
        });
        pop.appendChild(sw);
      });
      card.appendChild(pop);
      dot.addEventListener('click', function(ev){
        ev.stopPropagation();
        document.querySelectorAll('.color-pop.show').forEach(function(p){ if (p!==pop) p.classList.remove('show'); });
        pop.classList.toggle('show');
      });

      var nameInput = document.createElement('input');
      nameInput.className = 'team-name';
      nameInput.value = team.name;
      nameInput.maxLength = 12;
      nameInput.addEventListener('change', function(){
        team.name = nameInput.value || ('チーム' + (i+1));
        save(); render();
      });
      card.appendChild(nameInput);

      var scoreEl = document.createElement('div');
      scoreEl.className = 'score';
      scoreEl.textContent = team.score;
      card.appendChild(scoreEl);

      var btns = document.createElement('div');
      btns.className = 'score-btns';
      [['＋1',1,'b-p1'],['＋5',5,'b-p5'],['−1',-1,'b-m1']].forEach(function(def){
        var b = document.createElement('button');
        b.textContent = def[0];
        b.className = def[2];
        b.addEventListener('click', function(){
          snapshot();
          team.score = Math.max(0, team.score + def[1]);
          save();
          render();
          var newCard = board.children[i];
          if (newCard) {
            var ns = newCard.querySelector('.score');
            if (def[1] > 0) {
              ns.classList.add('pop');
              emitBurst(newCard, def[1] >= 5 ? 10 : 5, team.color);
              if (def[1] >= 5) soundBig(); else soundPlus();
            } else {
              ns.classList.add('pop-down');
              soundMinus();
            }
          }
        });
        btns.appendChild(b);
      });
      card.appendChild(btns);
      board.appendChild(card);
    });
  }

  function emitBurst(card, n, color){
    var emojis = ['⭐','✨','🎉','💮'];
    var rect = card.getBoundingClientRect();
    for (var k = 0; k < n; k++){
      var s = document.createElement('div');
      s.className = 'burst';
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = (rect.width/2 - 15) + 'px';
      s.style.top = (rect.height/2 - 15) + 'px';
      var ang = Math.random() * Math.PI * 2;
      var dist = 60 + Math.random() * 110;
      s.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
      card.appendChild(s);
      (function(el){ setTimeout(function(){ el.remove(); }, 900); })(s);
    }
  }

  document.addEventListener('click', function(){
    document.querySelectorAll('.color-pop.show').forEach(function(p){ p.classList.remove('show'); });
  });

  document.getElementById('btnAdd').addEventListener('click', function(){
    if (state.teams.length >= MAX_TEAMS) { alert('チームは ' + MAX_TEAMS + 'つ までだよ'); return; }
    snapshot();
    var names = ['あかぐみ','あおぐみ','きいろぐみ','みどりぐみ','むらさきぐみ','みずいろぐみ'];
    var idx = state.teams.length;
    state.teams.push({
      name: names[idx] || ('チーム' + (idx+1)),
      color: PALETTE[idx % PALETTE.length],
      score: 0
    });
    save(); render();
  });

  document.getElementById('btnRemove').addEventListener('click', function(){
    if (state.teams.length <= MIN_TEAMS) { alert('チームは ' + MIN_TEAMS + 'つ よりへらせないよ'); return; }
    if (!confirm('さいごのチームをけしてもいい？')) return;
    snapshot();
    state.teams.pop();
    save(); render();
  });

  document.getElementById('btnUndo').addEventListener('click', function(){
    if (history.length === 0) return;
    try { state = JSON.parse(history.pop()); } catch(e){ return; }
    save(); render();
    soundMinus();
  });

  document.getElementById('btnReset').addEventListener('click', function(){
    if (!confirm('ぜんぶ 0てん にもどしてもいい？')) return;
    snapshot();
    state.teams.forEach(function(t){ t.score = 0; });
    save(); render();
    soundReset();
  });

  render();
})();
</script>
