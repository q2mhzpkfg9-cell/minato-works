<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぶんすうピザ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",-apple-system,"Segoe UI",sans-serif;
    background: linear-gradient(160deg,#dff1ff 0%,#f5f0ff 55%,#ffeef5 100%);
    min-height: 100vh;
    color: #3a3f5c;
    padding: 16px;
  }
  header { text-align: center; margin-bottom: 12px; }
  h1 { font-size: clamp(1.6rem, 4.5vw, 2.6rem); color: #5b6ef5; }
  .sub { font-size: 1.05rem; color: #7a80a8; margin-top: 4px; }
  .card {
    background: #fff; border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    padding: clamp(16px, 3vw, 30px);
    max-width: 1080px; margin: 0 auto 18px;
  }
  .btn {
    font-family: inherit; border: none; border-radius: 999px;
    background: #5b6ef5; color: #fff;
    font-size: clamp(1.1rem, 2.4vw, 1.4rem); font-weight: bold;
    padding: 14px 30px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(91,110,245,.35);
    transition: transform .1s;
  }
  .btn:active { transform: scale(.95); }
  .btn.ghost { background: #eef0ff; color: #5b6ef5; box-shadow: none; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; margin: 12px 0; }
  .tabbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; }
  .tab {
    font-family: inherit; border: 4px solid #d9defc; border-radius: 999px;
    background: #fff; color: #3a3f5c;
    font-size: clamp(1.05rem, 2.4vw, 1.35rem); font-weight: bold;
    padding: 14px 26px; cursor: pointer;
  }
  .tab.sel { border-color: #5b6ef5; background: #eef0ff; color: #5b6ef5; }
  .chip {
    font-family: inherit; border: 3px solid #d9defc; border-radius: 999px;
    background: #fff; color: #3a3f5c;
    font-size: clamp(1.1rem, 2.6vw, 1.4rem); font-weight: bold;
    min-width: 58px; padding: 10px 14px; cursor: pointer;
  }
  .chip.sel { border-color: #ff8a3d; background: #fff3e6; color: #ff8a3d; }
  .hide { display: none !important; }
  .label { font-size: 1.2rem; font-weight: bold; color: #5b6ef5; text-align: center; }
  .center { text-align: center; }

  .pizzastage { display: flex; flex-wrap: wrap; gap: 26px; justify-content: center; align-items: center; }
  .pizza-svg { display: block; }
  .pizza-svg path.slice { cursor: pointer; transition: fill .15s; }

  .fracbox { text-align: center; min-width: 220px; }
  .frac {
    display: inline-flex; flex-direction: column; align-items: center;
    font-weight: bold; line-height: 1.1;
    font-size: clamp(2.6rem, 7vw, 4.2rem); color: #3a3f5c;
    vertical-align: middle;
  }
  .frac .bar { width: 100%; height: 7px; background: #3a3f5c; border-radius: 4px; margin: 6px 0; }
  .frac.small { font-size: clamp(1.6rem, 4vw, 2.4rem); }
  .frac.small .bar { height: 5px; }
  .frac.accent { color: #ff8a3d; }
  .frac.accent .bar { background: #ff8a3d; }
  .eq { font-size: clamp(2rem, 5vw, 3rem); font-weight: bold; margin: 0 10px; vertical-align: middle; }
  .reading { font-size: 1.3rem; color: #7a80a8; margin-top: 12px; }

  .cmpwrap { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: center; }
  .cmpcol { text-align: center; }
  .cmpbtns { display: flex; gap: 16px; justify-content: center; margin-top: 18px; }
  .cmpbtn {
    font-family: inherit; border: none; border-radius: 999px;
    background: #eef0ff; color: #3a3f5c;
    font-size: clamp(2rem, 5vw, 2.8rem); font-weight: bold;
    width: clamp(84px, 16vw, 120px); height: clamp(70px, 12vw, 92px);
    cursor: pointer; box-shadow: 0 4px 0 #ccd3f8;
  }
  .cmpbtn:active { transform: translateY(3px); box-shadow: none; }
  .cmpbtn.ok { background: #dcf7e3; color: #23a35b; box-shadow: 0 4px 0 #b5e6c5; }
  .cmpbtn.ng { background: #ffd7dd; color: #e5486a; box-shadow: 0 4px 0 #f6c1d2; }

  .pickgrid { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin-top: 14px; }
  .pick {
    background: #f7f8ff; border: 4px solid #d9defc; border-radius: 22px;
    padding: 14px; cursor: pointer; text-align: center;
    transition: transform .12s, border-color .15s, background .15s;
  }
  .pick:active { transform: scale(.96); }
  .pick.ok { border-color: #23a35b; background: #dcf7e3; }
  .pick.ng { border-color: #e5486a; background: #ffd7dd; }

  .feedback { text-align: center; font-size: clamp(1.4rem, 3.5vw, 2rem); font-weight: bold; min-height: 2.4rem; margin-top: 14px; }
  .feedback.good { color: #23a35b; }
  .feedback.bad { color: #e5486a; }
  .statusbar { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; font-size: 1.15rem; margin-bottom: 8px; }
  .statusbar b { color: #ff8a3d; font-size: 1.4rem; }
</style>
</head>
<body>

<header>
  <h1>🍕 ぶんすうピザ</h1>
  <div class="sub">ピザで ぶんすうが よく わかる！</div>
</header>

<div class="card">
  <div class="tabbar">
    <button class="tab sel" id="tab-paint" onclick="setTab('paint')">🎨 ぬってみよう</button>
    <button class="tab" id="tab-compare" onclick="setTab('compare')">⚖️ どっちが おおきい？</button>
    <button class="tab" id="tab-equal" onclick="setTab('equal')">🔍 おなじ おおきさは？</button>
  </div>

  <!-- ===== ぬってみよう ===== -->
  <div id="pane-paint">
    <div class="label">なんとうぶんに する？（ぶんぼ）</div>
    <div class="row" id="denomrow"></div>
    <div class="pizzastage">
      <div id="paintPizza"></div>
      <div class="fracbox">
        <div id="paintFrac"></div>
        <div class="reading" id="paintRead"></div>
        <div class="row">
          <button class="btn ghost" onclick="paintAll()">ぜんぶ ぬる</button>
          <button class="btn ghost" onclick="paintNone()">ぜんぶ けす</button>
        </div>
      </div>
    </div>
    <div class="center" style="margin-top:8px; color:#7a80a8; font-size:1.05rem;">
      ピザを タップすると いろが ぬれるよ
    </div>
  </div>

  <!-- ===== くらべる ===== -->
  <div id="pane-compare" class="hide">
    <div class="statusbar">
      <div>せいかい <b id="cmpScore">0</b> もん</div>
      <div>れんぞく <b id="cmpStreak">0</b> かい</div>
    </div>
    <div class="label">ひろい（おおきい）のは どっち？ まんなかの きごうを えらぼう</div>
    <div class="cmpwrap" style="margin-top:14px;">
      <div class="cmpcol">
        <div id="cmpPizzaA"></div>
        <div id="cmpFracA" style="margin-top:8px;"></div>
      </div>
      <div style="font-size:3rem; font-weight:bold; color:#b9c3f5;" id="cmpMark">？</div>
      <div class="cmpcol">
        <div id="cmpPizzaB"></div>
        <div id="cmpFracB" style="margin-top:8px;"></div>
      </div>
    </div>
    <div class="cmpbtns">
      <button class="cmpbtn" data-s="<" onclick="answerCmp('<')">＜</button>
      <button class="cmpbtn" data-s="=" onclick="answerCmp('=')">＝</button>
      <button class="cmpbtn" data-s=">" onclick="answerCmp('>')">＞</button>
    </div>
    <div class="feedback" id="cmpFb"></div>
    <div class="row"><button class="btn hide" id="cmpNext" onclick="newCompare()">つぎの もんだい ▶</button></div>
  </div>

  <!-- ===== おなじさがし ===== -->
  <div id="pane-equal" class="hide">
    <div class="statusbar">
      <div>せいかい <b id="eqScore">0</b> もん</div>
      <div>れんぞく <b id="eqStreak">0</b> かい</div>
    </div>
    <div class="center">
      <span class="label">この ピザと おなじ おおきさ（ひろさ）の ピザは どれ？</span>
      <div class="pizzastage" style="margin-top:10px;">
        <div id="eqTarget"></div>
        <div id="eqTargetFrac"></div>
      </div>
    </div>
    <div class="pickgrid" id="eqChoices"></div>
    <div class="feedback" id="eqFb"></div>
    <div class="row"><button class="btn hide" id="eqNext" onclick="newEqual()">つぎの もんだい ▶</button></div>
  </div>
</div>

<script>
"use strict";
/* ------- サウンド ------- */
let actx = null;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function beep(freq, dur, delay, type, vol) {
  try {
    const ctx = audio();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    const t = ctx.currentTime + (delay || 0);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol || 0.2, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function sndOK() { beep(784, 0.12, 0); beep(1047, 0.28, 0.1); }
function sndNG() { beep(220, 0.28, 0, "sawtooth", 0.1); }
function sndTap() { beep(660, 0.06, 0, "square", 0.06); }

/* ------- ユーティリティ ------- */
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function fracHTML(n, d, cls) {
  return "<span class='frac " + (cls || "") + "'><span>" + n + "</span><span class='bar'></span><span>" + d + "</span></span>";
}

/* ------- ピザSVG ------- */
function slicePath(cx, cy, r, a0, a1) {
  const x0 = cx + r * Math.sin(a0), y0 = cy - r * Math.cos(a0);
  const x1 = cx + r * Math.sin(a1), y1 = cy - r * Math.cos(a1);
  const large = (a1 - a0) > Math.PI ? 1 : 0;
  return "M" + cx + " " + cy + " L" + x0 + " " + y0 + " A" + r + " " + r + " 0 " + large + " 1 " + x1 + " " + y1 + " Z";
}
/**
 * ピザSVGを作る
 * d: 分母（等分数） filledFn: (i)=>boolean  size: px  interactive: クリック可か
 */
function pizzaSVG(d, filledFn, size, interactive) {
  const cx = 130, cy = 130;
  let s = "<svg class='pizza-svg' width='" + size + "' height='" + size + "' viewBox='0 0 260 260' xmlns='http://www.w3.org/2000/svg'>";
  s += "<circle cx='130' cy='130' r='126' fill='#e8a94f'/>";       // みみ
  s += "<circle cx='130' cy='130' r='112' fill='#ffe9b3'/>";       // チーズ
  if (d === 1) {
    const on = filledFn(0);
    s += "<circle class='slice' data-i='0' cx='130' cy='130' r='112' fill='" + (on ? "#ff7b54" : "#ffe9b3") + "'" +
      (interactive ? " style='cursor:pointer'" : "") + "/>";
  } else {
    for (let i = 0; i < d; i++) {
      const a0 = (i / d) * 2 * Math.PI, a1 = ((i + 1) / d) * 2 * Math.PI;
      const on = filledFn(i);
      s += "<path class='slice' data-i='" + i + "' d='" + slicePath(cx, cy, 112, a0, a1) +
        "' fill='" + (on ? "#ff7b54" : "#ffe9b3") + "' stroke='#c9862e' stroke-width='3' stroke-linejoin='round'/>";
    }
  }
  s += "<circle cx='130' cy='130' r='112' fill='none' stroke='#c9862e' stroke-width='3'/>";
  s += "<circle cx='130' cy='130' r='126' fill='none' stroke='#c9862e' stroke-width='4'/>";
  s += "</svg>";
  return s;
}

/* ------- タブ ------- */
function setTab(t) {
  ["paint", "compare", "equal"].forEach(k => {
    document.getElementById("tab-" + k).classList.toggle("sel", k === t);
    document.getElementById("pane-" + k).classList.toggle("hide", k !== t);
  });
  if (t === "compare" && !cmpInit) { cmpInit = true; newCompare(); }
  if (t === "equal" && !eqInit) { eqInit = true; newEqual(); }
}

/* ================= ぬってみよう ================= */
let denom = 8;
let filled = new Set([0, 1, 2]);
function buildDenomRow() {
  const row = document.getElementById("denomrow");
  row.innerHTML = "";
  for (let d = 2; d <= 12; d++) {
    const b = document.createElement("button");
    b.className = "chip" + (d === denom ? " sel" : "");
    b.textContent = d;
    b.onclick = () => { denom = d; filled = new Set(); buildDenomRow(); renderPaint(); sndTap(); };
    row.appendChild(b);
  }
}
function renderPaint() {
  const size = Math.min(420, Math.max(260, Math.floor(window.innerWidth * 0.42)));
  const box = document.getElementById("paintPizza");
  box.innerHTML = pizzaSVG(denom, i => filled.has(i), size, true);
  box.querySelectorAll(".slice").forEach(p => {
    p.addEventListener("click", () => {
      const i = +p.dataset.i;
      if (filled.has(i)) filled.delete(i); else filled.add(i);
      sndTap();
      renderPaint();
    });
  });
  const n = filled.size;
  let h = fracHTML(n, denom, "accent");
  const g = gcd(n || denom, denom);
  if (n > 0 && g > 1) {
    h += "<span class='eq'>=</span>" + fracHTML(n / g, denom / g, "small");
  }
  document.getElementById("paintFrac").innerHTML = h;
  let read = "「" + denom + "ぶんの " + n + "」";
  if (n > 0 && g > 1) read += "　やくぶんすると「" + (denom / g) + "ぶんの " + (n / g) + "」";
  if (n === denom) read += "　＝ まるごと 1まい！";
  document.getElementById("paintRead").textContent = read;
}
function paintAll() { filled = new Set(Array.from({ length: denom }, (_, i) => i)); renderPaint(); sndTap(); }
function paintNone() { filled = new Set(); renderPaint(); sndTap(); }

/* ================= くらべる ================= */
let cmpInit = false, cmpA = null, cmpB = null, cmpLock = false;
let cmpScore = 0, cmpStreak = 0;
function randFrac() {
  const d = 2 + Math.floor(Math.random() * 11); // 2..12
  const n = 1 + Math.floor(Math.random() * d);  // 1..d
  return { n, d };
}
function newCompare() {
  cmpLock = false;
  document.getElementById("cmpFb").textContent = "";
  document.getElementById("cmpFb").className = "feedback";
  document.getElementById("cmpNext").classList.add("hide");
  document.getElementById("cmpMark").textContent = "？";
  document.querySelectorAll(".cmpbtn").forEach(b => b.classList.remove("ok", "ng"));
  if (Math.random() < 0.3) {
    // 等しいペア
    const q = 2 + Math.floor(Math.random() * 5); // 2..6
    let p = 1 + Math.floor(Math.random() * (q - 1));
    const g = gcd(p, q); p = p / g;
    const qq = q / g;
    const ks = [];
    for (let k = 1; k * qq <= 12; k++) ks.push(k);
    const k1 = ks[Math.floor(Math.random() * ks.length)];
    let k2 = ks[Math.floor(Math.random() * ks.length)];
    if (ks.length > 1) { while (k2 === k1) k2 = ks[Math.floor(Math.random() * ks.length)]; }
    cmpA = { n: p * k1, d: qq * k1 };
    cmpB = { n: p * k2, d: qq * k2 };
  } else {
    cmpA = randFrac();
    cmpB = randFrac();
  }
  const size = Math.min(300, Math.max(190, Math.floor(window.innerWidth * 0.3)));
  document.getElementById("cmpPizzaA").innerHTML = pizzaSVG(cmpA.d, i => i < cmpA.n, size, false);
  document.getElementById("cmpPizzaB").innerHTML = pizzaSVG(cmpB.d, i => i < cmpB.n, size, false);
  document.getElementById("cmpFracA").innerHTML = fracHTML(cmpA.n, cmpA.d, "small");
  document.getElementById("cmpFracB").innerHTML = fracHTML(cmpB.n, cmpB.d, "small");
}
function answerCmp(s) {
  if (cmpLock || !cmpA) return;
  cmpLock = true;
  const va = cmpA.n / cmpA.d, vb = cmpB.n / cmpB.d;
  const correct = Math.abs(va - vb) < 1e-9 ? "=" : (va < vb ? "<" : ">");
  const zenkaku = { "<": "＜", "=": "＝", ">": "＞" };
  document.getElementById("cmpMark").textContent = zenkaku[correct];
  const fb = document.getElementById("cmpFb");
  document.querySelectorAll(".cmpbtn").forEach(b => {
    if (b.dataset.s === correct) b.classList.add("ok");
    else if (b.dataset.s === s) b.classList.add("ng");
  });
  if (s === correct) {
    cmpScore++; cmpStreak++;
    fb.textContent = "せいかい！ " + cmpA.n + "/" + cmpA.d + " " + zenkaku[correct] + " " + cmpB.n + "/" + cmpB.d;
    fb.classList.add("good");
    sndOK();
  } else {
    cmpStreak = 0;
    fb.textContent = "ざんねん… こたえは " + zenkaku[correct] + " 。ピザの あかい ひろさを くらべてみよう";
    fb.classList.add("bad");
    sndNG();
  }
  document.getElementById("cmpScore").textContent = cmpScore;
  document.getElementById("cmpStreak").textContent = cmpStreak;
  document.getElementById("cmpNext").classList.remove("hide");
}

/* ================= おなじさがし ================= */
let eqInit = false, eqLock = false;
let eqScore = 0, eqStreak = 0, eqAnswer = null;
function newEqual() {
  eqLock = false;
  document.getElementById("eqFb").textContent = "";
  document.getElementById("eqFb").className = "feedback";
  document.getElementById("eqNext").classList.add("hide");
  // もとになる きやくぶんすう p/q
  const bases = [[1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [1, 5], [2, 5], [1, 6]];
  const [p, q] = bases[Math.floor(Math.random() * bases.length)];
  // ターゲット
  const ksAll = [];
  for (let k = 1; k * q <= 12; k++) ksAll.push(k);
  const kt = ksAll[Math.floor(Math.random() * ksAll.length)];
  const target = { n: p * kt, d: q * kt };
  // 正解（ターゲットと分母がちがう等しい分数）
  const ksOther = ksAll.filter(k => k !== kt);
  const kc = ksOther.length ? ksOther[Math.floor(Math.random() * ksOther.length)] : kt;
  const correct = { n: p * kc, d: q * kc };
  // まちがい選択肢3つ（値がちがうもの）
  const wrongs = [];
  let guard = 0;
  while (wrongs.length < 3 && guard < 200) {
    guard++;
    const f = randFrac();
    if (Math.abs(f.n / f.d - p / q) < 1e-9) continue;
    if (wrongs.some(w => w.n === f.n && w.d === f.d)) continue;
    if (f.n === f.d && p !== q) { if (Math.random() < 0.7) continue; }
    wrongs.push(f);
  }
  const choices = wrongs.concat([correct]);
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }
  eqAnswer = correct;
  const tsize = Math.min(280, Math.max(180, Math.floor(window.innerWidth * 0.28)));
  document.getElementById("eqTarget").innerHTML = pizzaSVG(target.d, i => i < target.n, tsize, false);
  document.getElementById("eqTargetFrac").innerHTML = fracHTML(target.n, target.d, "accent");
  const grid = document.getElementById("eqChoices");
  grid.innerHTML = "";
  const csize = Math.min(190, Math.max(130, Math.floor(window.innerWidth * 0.19)));
  choices.forEach(f => {
    const div = document.createElement("div");
    div.className = "pick";
    div.innerHTML = pizzaSVG(f.d, i => i < f.n, csize, false) +
      "<div style='margin-top:6px;'>" + fracHTML(f.n, f.d, "small") + "</div>";
    div.onclick = () => pickEqual(f, div);
    grid.appendChild(div);
  });
}
function pickEqual(f, div) {
  if (eqLock) return;
  eqLock = true;
  const good = (f.n === eqAnswer.n && f.d === eqAnswer.d);
  const fb = document.getElementById("eqFb");
  if (good) {
    div.classList.add("ok");
    eqScore++; eqStreak++;
    fb.textContent = "せいかい！ おなじ ひろさだね 🎉";
    fb.classList.add("good");
    sndOK();
  } else {
    div.classList.add("ng");
    eqStreak = 0;
    // 正解をハイライト
    const picks = document.querySelectorAll("#eqChoices .pick");
    picks.forEach(pk => {
      const fr = pk.querySelector(".frac");
      if (fr && fr.children[0].textContent == eqAnswer.n && fr.children[2].textContent == eqAnswer.d) {
        pk.classList.add("ok");
      }
    });
    fb.textContent = "ざんねん… あかい ひろさが おなじ ものを さがそう";
    fb.classList.add("bad");
    sndNG();
  }
  document.getElementById("eqScore").textContent = eqScore;
  document.getElementById("eqStreak").textContent = eqStreak;
  document.getElementById("eqNext").classList.remove("hide");
}

buildDenomRow();
renderPaint();
window.addEventListener("resize", () => {
  renderPaint();
});
</script>
