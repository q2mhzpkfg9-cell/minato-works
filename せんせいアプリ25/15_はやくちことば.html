<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はやくちことば</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",-apple-system,"Segoe UI",sans-serif;
    background:linear-gradient(160deg,#dff1ff 0%,#f5f0ff 55%,#ffeef5 100%);
    min-height:100vh; color:#333; padding:16px;
  }
  header { text-align:center; margin-bottom:14px; }
  h1 { font-size:clamp(28px,4.5vw,44px); color:#5b6ef5; letter-spacing:.05em; }
  .sub { font-size:clamp(15px,2vw,20px); color:#777; margin-top:4px; }
  .card {
    background:#fff; border-radius:22px; box-shadow:0 8px 30px rgba(0,0,0,.18);
    padding:22px; max-width:1000px; margin:0 auto 18px; text-align:center;
  }
  .card h2 { font-size:clamp(19px,2.6vw,26px); color:#5b6ef5; margin-bottom:12px; }
  .btn {
    border:none; cursor:pointer; font-family:inherit; font-weight:bold;
    font-size:clamp(18px,2.4vw,24px); padding:15px 34px; border-radius:999px;
    background:#5b6ef5; color:#fff; box-shadow:0 4px 14px rgba(91,110,245,.35);
    transition:transform .12s; margin:4px;
  }
  .btn:active { transform:scale(.95); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.gray { background:#9aa0b5; box-shadow:0 4px 14px rgba(0,0,0,.15); }
  .btn.orange { background:#ff9c55; box-shadow:0 4px 14px rgba(255,156,85,.4); }
  .btn.green { background:#4caf7d; box-shadow:0 4px 14px rgba(76,175,125,.35); }
  .btn.big { font-size:clamp(22px,3.4vw,34px); padding:18px 50px; }

  .level-row { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .level-btn {
    border:3px solid #dfe3ff; background:#f7f8ff; color:#5b6ef5; cursor:pointer; font-family:inherit;
    font-size:clamp(17px,2.4vw,24px); font-weight:bold; padding:14px 26px; border-radius:999px;
    transition:transform .12s;
  }
  .level-btn:active { transform:scale(.94); }
  .level-btn.active { background:#5b6ef5; color:#fff; border-color:#5b6ef5; }

  .word-stage {
    margin:16px auto 8px; min-height:200px;
    background:#f7f8ff; border:4px dashed #b9c4ff; border-radius:22px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:26px 18px; gap:10px;
  }
  .word-stage.rolling { border-color:#ffd34d; background:#fffbea; }
  .word-yomi { font-size:clamp(18px,2.8vw,30px); color:#888; line-height:1.5; min-height:1.4em; }
  .word-main { font-size:clamp(30px,5.6vw,62px); font-weight:bold; line-height:1.45; }
  .word-stars { font-size:clamp(20px,3vw,30px); color:#ffb020; min-height:1.2em; }
  .placeholder { font-size:clamp(20px,3vw,30px); color:#aab; }

  .sw-display {
    font-size:clamp(48px,9vw,96px); font-weight:bold; color:#5b6ef5;
    font-variant-numeric:tabular-nums; line-height:1.1; margin:6px 0;
  }
  .sw-display.counting { color:#ff9c55; }
  .sw-note { font-size:clamp(15px,2.2vw,22px); color:#777; margin-bottom:8px; }
  .challenge-count { font-size:clamp(18px,2.8vw,28px); font-weight:bold; margin-top:8px; min-height:1.4em; }
  .challenge-count .done-mark { color:#4caf7d; }
  .laps { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:8px; }
  .lap-chip {
    background:#f0fbf0; border:3px solid #8fd18f; border-radius:999px;
    padding:8px 20px; font-size:clamp(16px,2.4vw,24px); font-weight:bold; color:#2c7a4e;
    font-variant-numeric:tabular-nums;
  }
</style>
</head>
<body>
<header>
  <h1>👅 はやくちことば</h1>
  <div class="sub">ルーレットで でた ことばを 3かい いえるかな？</div>
</header>

<section class="card">
  <h2>① むずかしさを えらぶ</h2>
  <div class="level-row">
    <button class="level-btn active" data-level="0" onclick="setLevel(0)">ぜんぶ</button>
    <button class="level-btn" data-level="1" onclick="setLevel(1)">★ かんたん</button>
    <button class="level-btn" data-level="2" onclick="setLevel(2)">★★ ふつう</button>
    <button class="level-btn" data-level="3" onclick="setLevel(3)">★★★ むずかしい</button>
  </div>

  <h2 style="margin-top:20px;">② ルーレットで しゅつだい！</h2>
  <div class="word-stage" id="wordStage">
    <div class="placeholder" id="placeholderText">🎡 ボタンを おして ルーレット スタート！</div>
    <div class="word-yomi" id="wordYomi" style="display:none;"></div>
    <div class="word-main" id="wordMain" style="display:none;"></div>
    <div class="word-stars" id="wordStars" style="display:none;"></div>
  </div>
  <button class="btn big orange" id="rouletteBtn" onclick="startRoulette()">🎡 ルーレットをまわす</button>
</section>

<section class="card">
  <h2>③ 3かいチャレンジ！（ストップウォッチ）</h2>
  <p class="sw-note">スタートすると「3・2・1」の あいずの あとに はかりはじめるよ。<br>1かい いえたら「いえた！」を おして、3かい めざそう！</p>
  <div class="sw-display" id="swDisplay">0.00</div>
  <div>
    <button class="btn big green" id="swStartBtn" onclick="startChallenge()">▶ スタート</button>
    <button class="btn big" id="swLapBtn" onclick="lap()" disabled>🗣 いえた！</button>
    <button class="btn gray" id="swResetBtn" onclick="resetChallenge()">リセット</button>
  </div>
  <div class="challenge-count" id="challengeCount"></div>
  <div class="laps" id="lapsArea"></div>
</section>

<script>
"use strict";
/* ことばリスト（text: ひょうじ / yomi: よみがな / level: ★1〜3） */
var WORDS = [
  { text:"生麦 生米 生卵", yomi:"なまむぎ なまごめ なまたまご", level:1 },
  { text:"すもももももももものうち", yomi:"すももも ももも もものうち", level:1 },
  { text:"隣の客はよく柿食う客だ", yomi:"となりの きゃくは よく かきくう きゃくだ", level:1 },
  { text:"庭には二羽にわとりがいる", yomi:"にわには にわ にわとりが いる", level:1 },
  { text:"青い家の青い雨戸", yomi:"あおい いえの あおい あまど", level:1 },
  { text:"赤あめ 青あめ 黄あめ", yomi:"あかあめ あおあめ きあめ", level:1 },
  { text:"パンダの パン屋の パンまつり", yomi:"ぱんだの ぱんやの ぱんまつり", level:1 },
  { text:"きつねの きって きっちり きって", yomi:"きつねの きって きっちり きって", level:1 },
  { text:"たこたこ たかく あがれ たこ", yomi:"たこたこ たかく あがれ たこ", level:1 },
  { text:"ねこが こねこを ねかせて ねた", yomi:"ねこが こねこを ねかせて ねた", level:1 },
  { text:"かめが かがみを かかえて きた", yomi:"かめが かがみを かかえて きた", level:1 },
  { text:"バス ガス ばくはつ", yomi:"ばす がす ばくはつ", level:2 },
  { text:"赤巻紙 青巻紙 黄巻紙", yomi:"あかまきがみ あおまきがみ きまきがみ", level:2 },
  { text:"坊主が屏風に上手に坊主の絵を描いた", yomi:"ぼうずが びょうぶに じょうずに ぼうずの えを かいた", level:2 },
  { text:"赤パジャマ 青パジャマ 黄パジャマ", yomi:"あかぱじゃま あおぱじゃま きぱじゃま", level:2 },
  { text:"シカもカモシカもシカの仲間", yomi:"しかも かもしかも しかの なかま", level:2 },
  { text:"この釘は引き抜きにくい釘だ", yomi:"このくぎは ひきぬきにくい くぎだ", level:2 },
  { text:"汽車の記者が汽車で帰社した", yomi:"きしゃの きしゃが きしゃで きしゃした", level:2 },
  { text:"隣の竹垣に竹立てかけた", yomi:"となりの たけがきに たけ たてかけた", level:2 },
  { text:"肩たたき機で肩たたき", yomi:"かたたたききで かたたたき", level:2 },
  { text:"ラクダが らくらく らくがきした", yomi:"らくだが らくらく らくがきした", level:2 },
  { text:"すずめが すずしい すなばで すもう", yomi:"すずめが すずしい すなばで すもう", level:2 },
  { text:"きゃべつを きちんと きざむ コックさん", yomi:"きゃべつを きちんと きざむ こっくさん", level:2 },
  { text:"ブタが ぶどうを ぶらさげた", yomi:"ぶたが ぶどうを ぶらさげた", level:2 },
  { text:"世界一 短い 短歌の 大会", yomi:"せかいいち みじかい たんかの たいかい", level:2 },
  { text:"東京特許許可局", yomi:"とうきょう とっきょ きょかきょく", level:3 },
  { text:"カエルぴょこぴょこ三ぴょこぴょこ 合わせてぴょこぴょこ六ぴょこぴょこ", yomi:"かえる ぴょこぴょこ みぴょこぴょこ あわせて ぴょこぴょこ むぴょこぴょこ", level:3 },
  { text:"裏庭には二羽 庭には二羽 にわとりがいる", yomi:"うらにわには にわ にわには にわ にわとりが いる", level:3 },
  { text:"あぶりカルビ あぶりカルビ あぶりカルビ", yomi:"あぶりかるび あぶりかるび あぶりかるび", level:3 },
  { text:"新春シャンソンショー", yomi:"しんしゅん しゃんそんしょー", level:3 },
  { text:"骨粗しょう症 訴訟勝訴", yomi:"こつそしょうしょう そしょう しょうそ", level:3 },
  { text:"バナナの謎はまだ謎なのだぞ", yomi:"ばななの なぞは まだ なぞなのだぞ", level:3 },
  { text:"除雪車 除雪作業中", yomi:"じょせつしゃ じょせつ さぎょうちゅう", level:3 },
  { text:"老若男女 老若男女 老若男女", yomi:"ろうにゃくなんにょ ろうにゃくなんにょ ろうにゃくなんにょ", level:3 },
  { text:"隣の客はよく柿食う客だと隣の客が言う", yomi:"となりの きゃくは よく かきくう きゃくだと となりの きゃくが いう", level:3 }
];

var level = 0; /* 0 = ぜんぶ */
var currentWord = null;
var rolling = false;
var rollTimer = null;
var audioCtx = null;

/* ストップウォッチ */
var swState = "idle"; /* idle | counting | running | done */
var swStart = 0;
var swTimer = null;
var countTimer = null;
var laps = [];

function ensureAudio(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function beep(freq, dur, delay, vol, type){
  try {
    ensureAudio();
    var t = audioCtx.currentTime + (delay || 0);
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch(e){}
}

function setLevel(lv){
  level = lv;
  var btns = document.querySelectorAll(".level-btn");
  for (var i=0;i<btns.length;i++){
    btns[i].classList.toggle("active", Number(btns[i].getAttribute("data-level")) === lv);
  }
}
function filteredWords(){
  if (level === 0) return WORDS;
  return WORDS.filter(function(w){ return w.level === level; });
}
function stars(n){
  var s = "";
  for (var i=0;i<n;i++) s += "★";
  return s;
}

function showWord(w, small){
  document.getElementById("placeholderText").style.display = "none";
  var yomiEl = document.getElementById("wordYomi");
  var mainEl = document.getElementById("wordMain");
  var starEl = document.getElementById("wordStars");
  yomiEl.style.display = "block";
  mainEl.style.display = "block";
  starEl.style.display = "block";
  yomiEl.textContent = w.yomi;
  mainEl.textContent = w.text;
  starEl.textContent = small ? "" : stars(w.level) + "　むずかしさ " + w.level;
}

function startRoulette(){
  if (rolling) return;
  var list = filteredWords();
  if (list.length === 0){ alert("ことばが ありません"); return; }
  ensureAudio();
  rolling = true;
  document.getElementById("rouletteBtn").disabled = true;
  document.getElementById("wordStage").classList.add("rolling");
  var ticks = 0;
  var maxTicks = 18 + Math.floor(Math.random() * 6);
  var delay = 60;

  function tickFn(){
    ticks++;
    var w = list[Math.floor(Math.random() * list.length)];
    showWord(w, true);
    beep(440 + (ticks % 4) * 60, 0.05, 0, 0.08, "square");
    if (ticks >= maxTicks){
      /* さいごの1つを けってい */
      var final;
      if (list.length === 1){
        final = list[0];
      } else {
        do { final = list[Math.floor(Math.random() * list.length)]; } while (final === currentWord);
      }
      currentWord = final;
      showWord(final, false);
      document.getElementById("wordStage").classList.remove("rolling");
      document.getElementById("rouletteBtn").disabled = false;
      document.getElementById("rouletteBtn").textContent = "🎡 べつのことば";
      beep(523, 0.15, 0, 0.2);
      beep(784, 0.3, 0.15, 0.2);
      rolling = false;
      resetChallenge();
      return;
    }
    delay = ticks > maxTicks - 6 ? delay + 40 : delay;
    rollTimer = setTimeout(tickFn, delay);
  }
  tickFn();
}

/* ===== 3かいチャレンジ ===== */
function fmt(sec){
  return sec.toFixed(2);
}
function startChallenge(){
  if (swState === "counting" || swState === "running") return;
  ensureAudio();
  resetChallenge();
  swState = "counting";
  var disp = document.getElementById("swDisplay");
  disp.classList.add("counting");
  document.getElementById("swStartBtn").disabled = true;
  var count = 3;
  disp.textContent = "3";
  beep(660, 0.15, 0, 0.25);
  countTimer = setInterval(function(){
    count--;
    if (count > 0){
      disp.textContent = String(count);
      beep(660, 0.15, 0, 0.25);
    } else {
      clearInterval(countTimer);
      countTimer = null;
      beep(990, 0.4, 0, 0.3); /* スタートの音 */
      disp.classList.remove("counting");
      swState = "running";
      swStart = Date.now();
      document.getElementById("swLapBtn").disabled = false;
      updateChallengeCount();
      swTimer = setInterval(function(){
        disp.textContent = fmt((Date.now() - swStart) / 1000);
      }, 50);
    }
  }, 1000);
}
function lap(){
  if (swState !== "running") return;
  var t = (Date.now() - swStart) / 1000;
  laps.push(t);
  beep(880, 0.12, 0, 0.2);
  renderLaps();
  if (laps.length >= 3){
    clearInterval(swTimer);
    swTimer = null;
    swState = "done";
    document.getElementById("swDisplay").textContent = fmt(t);
    document.getElementById("swLapBtn").disabled = true;
    document.getElementById("swStartBtn").disabled = false;
    document.getElementById("challengeCount").innerHTML =
      '<span class="done-mark">🎉 3かい クリア！ タイムは ' + fmt(t) + " びょう！</span>";
    beep(523, 0.18, 0.1, 0.25);
    beep(659, 0.18, 0.3, 0.25);
    beep(784, 0.18, 0.5, 0.25);
    beep(1046, 0.5, 0.7, 0.25);
  } else {
    updateChallengeCount();
  }
}
function updateChallengeCount(){
  var marks = "";
  for (var i=0;i<3;i++) marks += i < laps.length ? "🟢" : "⚪";
  document.getElementById("challengeCount").textContent = marks + "　あと " + (3 - laps.length) + " かい！";
}
function renderLaps(){
  var area = document.getElementById("lapsArea");
  area.innerHTML = "";
  for (var i=0;i<laps.length;i++){
    var chip = document.createElement("div");
    chip.className = "lap-chip";
    chip.textContent = (i+1) + "かいめ " + fmt(laps[i]) + "びょう";
    area.appendChild(chip);
  }
}
function resetChallenge(){
  if (swTimer){ clearInterval(swTimer); swTimer = null; }
  if (countTimer){ clearInterval(countTimer); countTimer = null; }
  swState = "idle";
  laps = [];
  var disp = document.getElementById("swDisplay");
  disp.textContent = "0.00";
  disp.classList.remove("counting");
  document.getElementById("swStartBtn").disabled = false;
  document.getElementById("swLapBtn").disabled = true;
  document.getElementById("challengeCount").textContent = "";
  document.getElementById("lapsArea").innerHTML = "";
}
</script>
