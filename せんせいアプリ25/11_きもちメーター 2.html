<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>きもちメーター</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",-apple-system,"Segoe UI",sans-serif;
    background:linear-gradient(160deg,#dff1ff 0%,#f5f0ff 55%,#ffeef5 100%);
    min-height:100vh;
    color:#333;
    padding:16px;
  }
  header { text-align:center; margin-bottom:14px; }
  h1 { font-size:clamp(28px,4.5vw,44px); color:#5b6ef5; letter-spacing:.05em; }
  .date-label { font-size:clamp(16px,2.2vw,22px); color:#666; margin-top:4px; }
  .tabs { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .tab-btn {
    border:none; cursor:pointer; font-family:inherit;
    font-size:clamp(17px,2.4vw,24px); font-weight:bold;
    padding:14px 28px; border-radius:999px;
    background:#fff; color:#5b6ef5; box-shadow:0 4px 14px rgba(0,0,0,.12);
    transition:transform .15s;
  }
  .tab-btn:active { transform:scale(.95); }
  .tab-btn.active { background:#5b6ef5; color:#fff; }
  .card {
    background:#fff; border-radius:22px; box-shadow:0 8px 30px rgba(0,0,0,.18);
    padding:22px; max-width:1100px; margin:0 auto 18px;
  }
  .card h2 { font-size:clamp(20px,2.8vw,28px); color:#5b6ef5; margin-bottom:14px; }
  .hidden { display:none !important; }

  /* こども画面：なまえグリッド */
  .name-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .name-btn {
    border:3px solid #dfe3ff; background:#f7f8ff; cursor:pointer; font-family:inherit;
    border-radius:18px; padding:16px 8px; font-size:clamp(18px,2.6vw,26px); font-weight:bold;
    transition:transform .12s; color:#333;
  }
  .name-btn:active { transform:scale(.94); }
  .name-btn .mark { display:block; font-size:clamp(26px,3.6vw,38px); margin-top:4px; min-height:1.2em; }
  .name-btn.done { border-color:#8fd18f; background:#f0fbf0; }

  /* きもちえらび モーダル */
  .overlay {
    position:fixed; inset:0; background:rgba(60,60,110,.45); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .mood-modal {
    background:#fff; border-radius:22px; box-shadow:0 8px 30px rgba(0,0,0,.3);
    padding:28px; width:min(760px,96vw); text-align:center;
  }
  .mood-modal .who { font-size:clamp(24px,3.6vw,38px); font-weight:bold; margin-bottom:6px; }
  .mood-modal .ask { font-size:clamp(18px,2.6vw,26px); color:#666; margin-bottom:18px; }
  .mood-list { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .mood-btn {
    border:3px solid #eee; background:#fafaff; cursor:pointer; font-family:inherit;
    border-radius:18px; padding:14px 10px; width:120px;
    transition:transform .12s;
  }
  .mood-btn:active { transform:scale(.92); }
  .mood-btn .emo { font-size:clamp(36px,5vw,54px); display:block; }
  .mood-btn .lbl { font-size:clamp(14px,1.8vw,18px); font-weight:bold; display:block; margin-top:6px; }
  .close-btn {
    margin-top:20px; border:none; cursor:pointer; font-family:inherit;
    background:#eee; color:#555; font-size:clamp(16px,2vw,20px); font-weight:bold;
    padding:12px 32px; border-radius:999px;
  }

  /* しゅうけい */
  .graph-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .graph-head { width:110px; text-align:center; flex-shrink:0; }
  .graph-head .emo { font-size:clamp(30px,4vw,44px); }
  .graph-head .lbl { font-size:clamp(13px,1.6vw,16px); font-weight:bold; color:#666; }
  .graph-bar { flex:1; font-size:clamp(26px,3.4vw,38px); line-height:1.2; word-break:break-all; min-height:1.2em; }
  .graph-count { width:90px; text-align:right; font-size:clamp(20px,2.8vw,30px); font-weight:bold; color:#5b6ef5; flex-shrink:0; }
  .summary-note { font-size:clamp(16px,2.2vw,22px); color:#666; margin-top:8px; }

  /* せんせいよう */
  .alert-list { display:flex; flex-wrap:wrap; gap:12px; }
  .alert-chip {
    background:#fff4f4; border:3px solid #ffb8c0; border-radius:18px;
    padding:14px 22px; font-size:clamp(20px,3vw,30px); font-weight:bold;
  }
  .ok-msg { font-size:clamp(20px,3vw,30px); color:#4caf7d; font-weight:bold; }
  .unanswered { font-size:clamp(16px,2.2vw,22px); color:#888; margin-top:14px; line-height:1.7; }

  /* きろく */
  .rec-day { border-bottom:2px dashed #e5e5f5; padding:12px 0; }
  .rec-day .d { font-size:clamp(18px,2.4vw,24px); font-weight:bold; color:#5b6ef5; }
  .rec-day .r { font-size:clamp(16px,2.2vw,22px); margin-top:4px; line-height:1.8; }

  /* なまえとうろく */
  .add-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .add-row input {
    flex:1; min-width:200px; font-family:inherit; font-size:clamp(18px,2.4vw,24px);
    padding:14px 18px; border:3px solid #dfe3ff; border-radius:16px; outline:none;
  }
  .add-row input:focus { border-color:#5b6ef5; }
  .btn {
    border:none; cursor:pointer; font-family:inherit; font-weight:bold;
    font-size:clamp(17px,2.2vw,22px); padding:14px 30px; border-radius:999px;
    background:#5b6ef5; color:#fff; box-shadow:0 4px 14px rgba(91,110,245,.35);
    transition:transform .12s;
  }
  .btn:active { transform:scale(.95); }
  .btn.gray { background:#9aa0b5; box-shadow:0 4px 14px rgba(0,0,0,.15); }
  .btn.red { background:#f56b7f; box-shadow:0 4px 14px rgba(245,107,127,.35); }
  .reg-list { display:flex; flex-wrap:wrap; gap:10px; }
  .reg-chip {
    background:#f2f4ff; border-radius:999px; padding:10px 16px;
    font-size:clamp(16px,2.2vw,22px); font-weight:bold; display:flex; align-items:center; gap:8px;
  }
  .reg-chip button {
    border:none; background:#ffd7dd; color:#c33; cursor:pointer; font-family:inherit;
    border-radius:50%; width:34px; height:34px; font-size:18px; font-weight:bold;
  }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  @media (max-width:600px){
    .name-grid { grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); }
    .mood-btn { width:100px; }
  }
</style>
</head>
<body>
<header>
  <h1>🌈 きもちメーター</h1>
  <div class="date-label" id="dateLabel"></div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="check" onclick="showTab('check')">😊 きもちをえらぶ</button>
  <button class="tab-btn" data-tab="summary" onclick="showTab('summary')">📊 みんなのきもち</button>
  <button class="tab-btn" data-tab="teacher" onclick="showTab('teacher')">👀 せんせいよう</button>
  <button class="tab-btn" data-tab="setting" onclick="showTab('setting')">⚙️ なまえとうろく</button>
</nav>

<!-- きもちをえらぶ -->
<section id="tab-check" class="card">
  <h2>じぶんの なまえを タップしてね</h2>
  <div class="name-grid" id="nameGrid"></div>
  <p class="summary-note" id="noNameNote" style="display:none;">まだ なまえが とうろくされていないよ。「⚙️ なまえとうろく」から とうろくしてね。</p>
</section>

<!-- しゅうけい -->
<section id="tab-summary" class="card hidden">
  <h2>きょうの みんなの きもち</h2>
  <div id="graphArea"></div>
  <p class="summary-note" id="summaryNote"></p>
</section>

<!-- せんせいよう -->
<section id="tab-teacher" class="card hidden">
  <h2>💡 きょう しんどそうな子（🌧️・⚡）</h2>
  <div id="alertArea"></div>
  <div class="unanswered" id="unansweredArea"></div>
  <div class="toolbar">
    <button class="btn red" onclick="resetToday()">🔄 きょうのきろくをリセット</button>
  </div>
  <h2 style="margin-top:26px;">📅 これまでのきろく</h2>
  <div id="historyArea"></div>
</section>

<!-- なまえとうろく -->
<section id="tab-setting" class="card hidden">
  <h2>なまえの とうろく</h2>
  <div class="add-row">
    <input type="text" id="nameInput" placeholder="なまえを いれてね（1人ずつ）" maxlength="12">
    <button class="btn" onclick="addName()">＋ ついか</button>
  </div>
  <div class="reg-list" id="regList"></div>
  <div class="toolbar">
    <button class="btn gray" onclick="clearAllNames()">🗑️ ぜんいんのなまえをけす</button>
  </div>
</section>

<!-- モーダル -->
<div class="overlay hidden" id="moodOverlay">
  <div class="mood-modal">
    <div class="who" id="moodWho"></div>
    <div class="ask">いまの こころの てんきは どれかな？</div>
    <div class="mood-list" id="moodList"></div>
    <button class="close-btn" onclick="closeMood()">やめる</button>
  </div>
</div>

<script>
"use strict";
var KEY_NAMES = "sensei25_kimochi_names";
var KEY_RECORDS = "sensei25_kimochi_records";

var MOODS = [
  { emo:"☀️😊", short:"☀️", label:"はれ・げんき", color:"#fff7df" },
  { emo:"⛅🙂", short:"⛅", label:"うすぐもり・まあまあ", color:"#f2f8ff" },
  { emo:"☁️😐", short:"☁️", label:"くもり・ふつう", color:"#f2f2f2" },
  { emo:"🌧️😢", short:"🌧️", label:"あめ・かなしい", color:"#e8f1ff" },
  { emo:"⚡😠", short:"⚡", label:"かみなり・イライラ", color:"#fff0e8" }
];

var names = [];
var records = {};
var currentName = null;
var audioCtx = null;

function todayKey(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function load(){
  try { names = JSON.parse(localStorage.getItem(KEY_NAMES)) || []; } catch(e){ names = []; }
  try { records = JSON.parse(localStorage.getItem(KEY_RECORDS)) || {}; } catch(e){ records = {}; }
  if (!Array.isArray(names)) names = [];
  if (!names.length){
    // 共通のなまえちょう（せってい/ルーレット等で登録済み）から引き継ぐ
    try {
      var shared = localStorage.getItem("sensei25_names") || "";
      names = shared.split("\n").map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
    } catch(e){}
  }
  if (typeof records !== "object" || records === null) records = {};
}
function saveNames(){ localStorage.setItem(KEY_NAMES, JSON.stringify(names)); }
function saveRecords(){ localStorage.setItem(KEY_RECORDS, JSON.stringify(records)); }
function todayRecord(){
  var k = todayKey();
  if (!records[k]) records[k] = {};
  return records[k];
}

function playPop(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(660, t);
    o.frequency.exponentialRampToValueAtTime(990, t + 0.12);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.3);
  } catch(e){}
}

function showTab(tab){
  var tabs = ["check","summary","teacher","setting"];
  for (var i=0;i<tabs.length;i++){
    document.getElementById("tab-" + tabs[i]).classList.toggle("hidden", tabs[i] !== tab);
  }
  var btns = document.querySelectorAll(".tab-btn");
  for (var j=0;j<btns.length;j++){
    btns[j].classList.toggle("active", btns[j].getAttribute("data-tab") === tab);
  }
  renderAll();
}

function renderNameGrid(){
  var grid = document.getElementById("nameGrid");
  var note = document.getElementById("noNameNote");
  grid.innerHTML = "";
  note.style.display = names.length ? "none" : "block";
  var rec = todayRecord();
  for (var i=0;i<names.length;i++){
    (function(nm){
      var b = document.createElement("button");
      b.className = "name-btn" + (rec[nm] !== undefined ? " done" : "");
      var markHtml = rec[nm] !== undefined ? MOODS[rec[nm]].emo : "❔";
      b.innerHTML = escapeHtml(nm) + '<span class="mark">' + markHtml + "</span>";
      b.onclick = function(){ openMood(nm); };
      grid.appendChild(b);
    })(names[i]);
  }
}

function openMood(nm){
  currentName = nm;
  document.getElementById("moodWho").textContent = nm + " さん";
  var list = document.getElementById("moodList");
  list.innerHTML = "";
  for (var i=0;i<MOODS.length;i++){
    (function(idx){
      var b = document.createElement("button");
      b.className = "mood-btn";
      b.style.background = MOODS[idx].color;
      b.innerHTML = '<span class="emo">' + MOODS[idx].emo + '</span><span class="lbl">' + MOODS[idx].label + "</span>";
      b.onclick = function(){ pickMood(idx); };
      list.appendChild(b);
    })(i);
  }
  document.getElementById("moodOverlay").classList.remove("hidden");
}
function closeMood(){
  currentName = null;
  document.getElementById("moodOverlay").classList.add("hidden");
}
function pickMood(idx){
  if (currentName === null) return;
  todayRecord()[currentName] = idx;
  saveRecords();
  playPop();
  closeMood();
  renderAll();
}

function renderSummary(){
  var rec = todayRecord();
  var counts = [0,0,0,0,0];
  var answered = 0;
  for (var nm in rec){
    if (rec.hasOwnProperty(nm) && names.indexOf(nm) !== -1){
      counts[rec[nm]]++; answered++;
    }
  }
  var area = document.getElementById("graphArea");
  area.innerHTML = "";
  for (var i=0;i<MOODS.length;i++){
    var row = document.createElement("div");
    row.className = "graph-row";
    var bar = "";
    for (var c=0;c<counts[i];c++) bar += MOODS[i].short;
    row.innerHTML =
      '<div class="graph-head"><div class="emo">' + MOODS[i].emo + '</div><div class="lbl">' + MOODS[i].label + "</div></div>" +
      '<div class="graph-bar">' + (bar || '<span style="color:#ddd;">－</span>') + "</div>" +
      '<div class="graph-count">' + counts[i] + "人</div>";
    area.appendChild(row);
  }
  document.getElementById("summaryNote").textContent =
    "こたえた人：" + answered + "人 ／ とうろく：" + names.length + "人";
}

function renderTeacher(){
  var rec = todayRecord();
  var alertArea = document.getElementById("alertArea");
  var hardKids = [];
  var notYet = [];
  for (var i=0;i<names.length;i++){
    var nm = names[i];
    if (rec[nm] === undefined){ notYet.push(nm); }
    else if (rec[nm] === 3 || rec[nm] === 4){ hardKids.push({ name:nm, mood:rec[nm] }); }
  }
  alertArea.innerHTML = "";
  if (hardKids.length === 0){
    alertArea.innerHTML = '<p class="ok-msg">🎉 きょうは 🌧️・⚡ の子は いません</p>';
  } else {
    var wrap = document.createElement("div");
    wrap.className = "alert-list";
    for (var j=0;j<hardKids.length;j++){
      var chip = document.createElement("div");
      chip.className = "alert-chip";
      chip.textContent = MOODS[hardKids[j].mood].emo + " " + hardKids[j].name;
      wrap.appendChild(chip);
    }
    alertArea.appendChild(wrap);
  }
  document.getElementById("unansweredArea").textContent =
    notYet.length ? "まだえらんでいない子：" + notYet.join("、") : (names.length ? "ぜんいん えらびおわりました ✅" : "");
  renderHistory();
}

function renderHistory(){
  var area = document.getElementById("historyArea");
  area.innerHTML = "";
  var keys = Object.keys(records).sort().reverse();
  var shown = 0;
  for (var i=0;i<keys.length && shown<14;i++){
    var k = keys[i];
    var rec = records[k];
    var counts = [0,0,0,0,0];
    var total = 0;
    for (var nm in rec){
      if (rec.hasOwnProperty(nm)){ counts[rec[nm]]++; total++; }
    }
    if (total === 0) continue;
    var div = document.createElement("div");
    div.className = "rec-day";
    var parts = [];
    for (var m=0;m<MOODS.length;m++){
      if (counts[m] > 0) parts.push(MOODS[m].emo + " " + counts[m] + "人");
    }
    div.innerHTML = '<div class="d">' + k + (k === todayKey() ? "（きょう）" : "") + "</div>" +
      '<div class="r">' + parts.join("　") + "</div>";
    area.appendChild(div);
    shown++;
  }
  if (shown === 0) area.innerHTML = '<p class="summary-note">まだ きろくが ありません。</p>';
}

function renderSetting(){
  var list = document.getElementById("regList");
  list.innerHTML = "";
  for (var i=0;i<names.length;i++){
    (function(idx){
      var chip = document.createElement("div");
      chip.className = "reg-chip";
      var span = document.createElement("span");
      span.textContent = (idx+1) + ". " + names[idx];
      var del = document.createElement("button");
      del.textContent = "✕";
      del.onclick = function(){
        if (confirm("「" + names[idx] + "」を けしますか？")){
          names.splice(idx,1); saveNames(); renderAll();
        }
      };
      chip.appendChild(span); chip.appendChild(del);
      list.appendChild(chip);
    })(i);
  }
}

function addName(){
  var inp = document.getElementById("nameInput");
  var v = inp.value.trim();
  if (!v) return;
  if (names.indexOf(v) !== -1){ alert("おなじ なまえが すでにあります"); return; }
  names.push(v);
  saveNames();
  inp.value = "";
  inp.focus();
  renderAll();
}
function clearAllNames(){
  if (names.length === 0) return;
  if (confirm("とうろくした なまえを ぜんぶ けしますか？")){
    names = []; saveNames(); renderAll();
  }
}
function resetToday(){
  if (confirm("きょうの きろくを リセットしますか？")){
    delete records[todayKey()];
    saveRecords();
    renderAll();
  }
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderAll(){
  renderNameGrid();
  renderSummary();
  renderTeacher();
  renderSetting();
}

document.getElementById("nameInput").addEventListener("keydown", function(e){
  if (e.key === "Enter") addName();
});

(function init(){
  var d = new Date();
  var w = ["にち","げつ","か","すい","もく","きん","ど"][d.getDay()];
  document.getElementById("dateLabel").textContent =
    d.getFullYear() + "ねん " + (d.getMonth()+1) + "がつ " + d.getDate() + "にち（" + w + "）";
  load();
  renderAll();
})();
</script>
