<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>なまえルーレット 🎯</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",-apple-system,"Segoe UI",sans-serif;
    background: linear-gradient(160deg,#dff1ff 0%,#f5f0ff 55%,#ffeef5 100%);
    background-attachment: fixed;
    color: #333;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header { text-align: center; margin-bottom: 14px; }
  h1 { font-size: clamp(28px, 4.5vw, 46px); color: #3d4370; }
  .card {
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    padding: 24px;
    width: 100%;
    max-width: 980px;
    margin-bottom: 18px;
  }
  .section-title { font-size: clamp(18px, 2.4vw, 24px); color: #3d4370; font-weight: bold; margin-bottom: 10px; }

  #nameArea {
    width: 100%;
    min-height: 130px;
    font-family: inherit;
    font-size: clamp(18px, 2.2vw, 22px);
    border: 3px solid #cdd5f7;
    border-radius: 16px;
    padding: 12px;
    resize: vertical;
    line-height: 1.6;
  }
  #nameArea:focus { outline: none; border-color: #5b6ef5; }
  .hint { font-size: clamp(14px, 1.8vw, 18px); color: #888; margin-top: 8px; }
  #countInfo { font-size: clamp(16px, 2vw, 20px); color: #5b6ef5; font-weight: bold; margin-top: 6px; }

  .display-box {
    background: #f4f6ff;
    border: 4px dashed #cdd5f7;
    border-radius: 22px;
    min-height: clamp(150px, 26vh, 260px);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    padding: 16px;
    overflow: hidden;
  }
  #bigName {
    font-size: clamp(44px, 9vw, 96px);
    font-weight: bold;
    color: #3d4370;
    text-align: center;
    word-break: break-all;
    line-height: 1.2;
  }
  .display-box.spinning { border-color: #5b6ef5; }
  .display-box.decided { background: #fff6d9; border: 4px solid #ffd66e; }
  .display-box.decided #bigName { color: #e0862a; animation: winner .5s ease infinite alternate; }
  @keyframes winner { from { transform: scale(1); } to { transform: scale(1.1); } }

  .btn-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .big-btn {
    font-family: inherit;
    font-size: clamp(22px, 3vw, 30px);
    font-weight: bold;
    padding: 16px 40px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    transition: transform .1s;
  }
  .big-btn:active { transform: scale(.94); }
  .big-btn:disabled { opacity: .45; cursor: not-allowed; }
  #spinBtn { background: #5b6ef5; color: #fff; box-shadow: 0 5px 0 #3f51c9; }
  #orderBtn { background: #6ecb8e; color: #fff; box-shadow: 0 5px 0 #4da96d; }
  #resetUsedBtn { background: #ffb3c1; color: #7a2338; box-shadow: 0 4px 0 #e58fa1; font-size: clamp(16px, 2.2vw, 22px); padding: 12px 26px; }

  .toggle-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 14px 0 6px; flex-wrap: wrap; }
  .toggle-label { font-size: clamp(18px, 2.4vw, 24px); color: #3d4370; font-weight: bold; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .switch { position: relative; width: 66px; height: 36px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-ui {
    position: absolute; inset: 0;
    background: #ccc; border-radius: 999px; transition: .2s; cursor: pointer;
  }
  .slider-ui::before {
    content: ""; position: absolute; width: 28px; height: 28px; left: 4px; top: 4px;
    background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 2px 5px rgba(0,0,0,.25);
  }
  .switch input:checked + .slider-ui { background: #5b6ef5; }
  .switch input:checked + .slider-ui::before { transform: translateX(30px); }

  #usedList { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .used-chip {
    background: #eee; color: #999; font-size: clamp(14px, 1.8vw, 18px);
    padding: 6px 16px; border-radius: 999px; text-decoration: line-through;
  }
  #orderResult { display: none; margin-top: 14px; }
  #orderResult ol {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }
  #orderResult li {
    background: #f4f6ff;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: clamp(18px, 2.4vw, 24px);
    font-weight: bold;
    color: #3d4370;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise .4s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  #orderResult .num {
    background: #5b6ef5; color: #fff;
    width: 40px; height: 40px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: clamp(16px, 2vw, 20px);
    flex-shrink: 0;
  }
</style>
</head>
<body>
<header>
  <h1>🎯 なまえルーレット</h1>
</header>

<div class="card">
  <div class="section-title">📝 なまえリスト（1行に1人ずつ）</div>
  <textarea id="nameArea" placeholder="たとえば：&#10;さとう&#10;すずき&#10;たなか"></textarea>
  <div class="hint">かいた名前はじどうでほぞんされます。</div>
  <div id="countInfo">0人</div>
</div>

<div class="card">
  <div class="display-box" id="displayBox">
    <div id="bigName">だれかな？</div>
  </div>

  <div class="btn-row">
    <button type="button" class="big-btn" id="spinBtn">🎯 スタート！</button>
    <button type="button" class="big-btn" id="orderBtn">🔢 じゅんばんモード</button>
  </div>

  <div class="toggle-row">
    <label class="toggle-label" for="excludeToggle">
      <span class="switch">
        <input type="checkbox" id="excludeToggle" checked>
        <span class="slider-ui"></span>
      </span>
      いちど出た人はのぞく
    </label>
    <button type="button" class="big-btn" id="resetUsedBtn">↺ 出た人リセット</button>
  </div>

  <div id="usedList"></div>
  <div id="orderResult">
    <div class="section-title">🔢 きょうのじゅんばん</div>
    <ol id="orderList"></ol>
  </div>
</div>

<script>
(function () {
  "use strict";
  var LS_NAMES = "sensei25_names";
  var LS_USED = "sensei25_roulette_used";

  var nameArea = document.getElementById("nameArea");
  var countInfo = document.getElementById("countInfo");
  var bigName = document.getElementById("bigName");
  var displayBox = document.getElementById("displayBox");
  var spinBtn = document.getElementById("spinBtn");
  var orderBtn = document.getElementById("orderBtn");
  var excludeToggle = document.getElementById("excludeToggle");
  var resetUsedBtn = document.getElementById("resetUsedBtn");
  var usedListEl = document.getElementById("usedList");
  var orderResult = document.getElementById("orderResult");
  var orderList = document.getElementById("orderList");

  var used = [];
  var spinning = false;

  // ---- Web Audio ----
  var audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, vol, type) {
    var ctx = getCtx();
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctx.currentTime + start);
    g.gain.linearRampToValueAtTime(vol, ctx.currentTime + start + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur + 0.05);
  }
  function tick() { tone(1200, 0, 0.05, 0.12, "square"); }
  function fanfare() {
    var notes = [523.25, 659.25, 783.99, 1046.5];
    for (var i = 0; i < notes.length; i++) tone(notes[i], i * 0.12, 0.35, 0.22, "triangle");
    tone(1318.5, 0.5, 0.6, 0.22, "triangle");
  }

  // ---- 名前リスト ----
  function getNames() {
    return nameArea.value.split("\n")
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }
  function saveNames() {
    try { localStorage.setItem(LS_NAMES, nameArea.value); } catch (e) {}
    updateCount();
  }
  function updateCount() {
    var names = getNames();
    var rest = names.filter(function (n) { return used.indexOf(n) === -1; });
    countInfo.textContent = names.length + "人（まだ出ていない人：" + rest.length + "人）";
  }
  function saveUsed() {
    try { localStorage.setItem(LS_USED, JSON.stringify(used)); } catch (e) {}
    renderUsed();
    updateCount();
  }
  function renderUsed() {
    usedListEl.innerHTML = "";
    used.forEach(function (n) {
      var c = document.createElement("span");
      c.className = "used-chip";
      c.textContent = n;
      usedListEl.appendChild(c);
    });
  }

  function candidates() {
    var names = getNames();
    if (excludeToggle.checked) {
      return names.filter(function (n) { return used.indexOf(n) === -1; });
    }
    return names.slice();
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ---- ルーレット ----
  function spin() {
    if (spinning) return;
    getCtx();
    orderResult.style.display = "none";
    var pool = candidates();
    var all = getNames();
    if (all.length === 0) { bigName.textContent = "なまえを入れてね"; return; }
    if (pool.length === 0) { bigName.textContent = "ぜんいん出たよ！🎉"; return; }

    var winner = pool[Math.floor(Math.random() * pool.length)];
    spinning = true;
    spinBtn.disabled = true;
    orderBtn.disabled = true;
    displayBox.classList.remove("decided");
    displayBox.classList.add("spinning");

    var delay = 50;       // 最初は高速
    var elapsed = 0;
    var totalTime = 2600 + Math.random() * 800;

    function step() {
      if (elapsed < totalTime - 400) {
        var show = all[Math.floor(Math.random() * all.length)];
        bigName.textContent = show;
        tick();
        elapsed += delay;
        // だんだん減速
        delay = Math.min(260, delay * 1.09);
        setTimeout(step, delay);
      } else {
        bigName.textContent = winner;
        displayBox.classList.remove("spinning");
        displayBox.classList.add("decided");
        fanfare();
        if (excludeToggle.checked && used.indexOf(winner) === -1) {
          used.push(winner);
          saveUsed();
        } else {
          updateCount();
        }
        spinning = false;
        spinBtn.disabled = false;
        orderBtn.disabled = false;
      }
    }
    step();
  }

  // ---- じゅんばんモード ----
  function orderMode() {
    if (spinning) return;
    getCtx();
    var names = getNames();
    if (names.length === 0) { bigName.textContent = "なまえを入れてね"; return; }

    spinning = true;
    spinBtn.disabled = true;
    orderBtn.disabled = true;
    displayBox.classList.remove("decided");
    displayBox.classList.add("spinning");
    orderResult.style.display = "none";

    var order = shuffle(names);
    var count = 0;
    var iv = setInterval(function () {
      bigName.textContent = names[Math.floor(Math.random() * names.length)];
      tick();
      count++;
      if (count >= 16) {
        clearInterval(iv);
        bigName.textContent = "じゅんばん、きまり！";
        displayBox.classList.remove("spinning");
        displayBox.classList.add("decided");
        fanfare();
        orderList.innerHTML = "";
        order.forEach(function (n, i) {
          var li = document.createElement("li");
          li.style.animationDelay = (i * 0.12) + "s";
          var num = document.createElement("span");
          num.className = "num";
          num.textContent = String(i + 1);
          li.appendChild(num);
          li.appendChild(document.createTextNode(n));
          orderList.appendChild(li);
        });
        orderResult.style.display = "block";
        spinning = false;
        spinBtn.disabled = false;
        orderBtn.disabled = false;
      }
    }, 90);
  }

  // ---- イベント ----
  nameArea.addEventListener("input", function () {
    saveNames();
  });
  spinBtn.addEventListener("click", spin);
  orderBtn.addEventListener("click", orderMode);
  excludeToggle.addEventListener("change", updateCount);
  resetUsedBtn.addEventListener("click", function () {
    used = [];
    saveUsed();
    displayBox.classList.remove("decided");
    bigName.textContent = "だれかな？";
  });

  // ---- 復元 ----
  try {
    var savedNames = localStorage.getItem(LS_NAMES);
    if (savedNames) nameArea.value = savedNames;
    var savedUsed = JSON.parse(localStorage.getItem(LS_USED) || "[]");
    if (Array.isArray(savedUsed)) used = savedUsed.filter(function (x) { return typeof x === "string"; });
  } catch (e) { used = []; }
  renderUsed();
  updateCount();
})();
</script>

</html>
