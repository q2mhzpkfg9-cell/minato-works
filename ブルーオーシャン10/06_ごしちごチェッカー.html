<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ごしちごチェッカー</title>
<style>
  :root{
    --accent:#8E44AD;
    --accent-light:#F3E9F8;
    --green:#27AE60;
    --orange:#E67E22;
    --gray:#B0ACA5;
    --bg:#F7F5F0;
    --ink:#3A3630;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{font-size:16px;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    line-height:1.6;
    padding-bottom:48px;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;
    background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    position:sticky;top:0;z-index:10;
  }
  header h1{font-size:1.25rem;color:var(--accent);}
  header a{
    color:var(--accent);text-decoration:none;font-weight:bold;
    font-size:.95rem;padding:8px 12px;border-radius:12px;background:var(--accent-light);
  }
  main{max-width:720px;margin:0 auto;padding:16px;}
  .card{
    background:#FFF;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);
    padding:18px;margin-bottom:18px;
  }
  .card h2{font-size:1.05rem;color:var(--accent);margin-bottom:12px;}

  /* モードタブ */
  .mode-tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .mode-tabs button{
    flex:1;min-width:100px;min-height:56px;
    font-size:1rem;font-weight:bold;font-family:inherit;
    border:2px solid var(--accent-light);border-radius:14px;
    background:#fff;color:var(--ink);cursor:pointer;
  }
  .mode-tabs button.active{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }
  .mode-tabs button small{display:block;font-size:.72rem;font-weight:normal;}
  .mode-tabs button.active small{color:#EFDFF7;}

  /* 入力方法切替 */
  .input-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .input-toggle button{
    flex:1;min-height:44px;font-size:.9rem;font-family:inherit;font-weight:bold;
    border:2px solid var(--accent-light);border-radius:12px;background:#fff;
    color:var(--ink);cursor:pointer;
  }
  .input-toggle button.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);}

  /* 句の入力行 */
  .phrase-row{margin-bottom:16px;}
  .phrase-label{
    display:flex;align-items:baseline;gap:8px;margin-bottom:4px;
  }
  .phrase-label .num{
    font-size:1.2rem;font-weight:bold;color:var(--accent);
    background:var(--accent-light);border-radius:10px;padding:0 12px;
  }
  .phrase-label .sub{font-size:.8rem;color:#8a8478;}
  .phrase-row input[type="text"]{
    width:100%;font-size:1.35rem;font-family:inherit;
    padding:12px 14px;border:2px solid #E5E0D8;border-radius:12px;
    background:#FDFCFA;color:var(--ink);
  }
  .phrase-row input[type="text"]:focus{outline:none;border-color:var(--accent);}
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;min-height:18px;align-items:center;}
  .dot{
    width:16px;height:16px;border-radius:50%;
    border:2px solid #D8D3CB;background:transparent;flex:none;
  }
  .dot.on-green{background:var(--green);border-color:var(--green);}
  .dot.on-orange{background:var(--orange);border-color:var(--orange);}
  .dot.on-gray{background:var(--gray);border-color:var(--gray);}
  .dot.extra{outline:2px dashed var(--orange);outline-offset:1px;}
  .phrase-status{font-size:.9rem;font-weight:bold;margin-left:6px;white-space:nowrap;}
  .st-green{color:var(--green);} .st-orange{color:var(--orange);} .st-gray{color:#8a8478;}

  /* まとめて入力 */
  #joinedArea{display:none;}
  #joinedInput{
    width:100%;font-size:1.3rem;font-family:inherit;
    padding:12px 14px;border:2px solid #E5E0D8;border-radius:12px;
    background:#FDFCFA;color:var(--ink);
  }
  #joinedInput:focus{outline:none;border-color:var(--accent);}
  .joined-preview{
    margin-top:12px;padding:12px;border-radius:12px;background:var(--accent-light);
    font-size:1.05rem;word-break:break-all;
  }
  .joined-preview .seg-count{font-size:.8rem;color:var(--accent);font-weight:bold;}
  #applySplitBtn{
    margin-top:10px;width:100%;min-height:52px;font-size:1rem;font-weight:bold;font-family:inherit;
    border:none;border-radius:14px;background:var(--accent);color:#fff;cursor:pointer;
  }
  #applySplitBtn:disabled{background:#CCC5BC;cursor:default;}

  /* 漢字注意・合計 */
  .kanji-warn{
    display:none;margin-top:4px;padding:10px 14px;border-radius:12px;
    background:#FFF4E3;color:#A05B12;font-size:.92rem;font-weight:bold;
  }
  .kanji-warn.show{display:block;}
  .total-status{
    margin-top:8px;padding:14px;border-radius:14px;text-align:center;
    font-size:1.15rem;font-weight:bold;background:#F4F1EB;color:#8a8478;
  }
  .total-status.ok{background:#E3F7EC;color:var(--green);font-size:1.3rem;}
  .total-status.almost{background:#FDEEDD;color:var(--orange);}

  /* アクションボタン */
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .actions button{
    flex:1;min-width:140px;min-height:56px;
    font-size:1.05rem;font-weight:bold;font-family:inherit;
    border:none;border-radius:14px;cursor:pointer;
  }
  #tanzakuBtn{background:var(--accent);color:#fff;}
  #saveBtn{background:#fff;color:var(--accent);border:2px solid var(--accent);}
  .save-msg{
    display:none;margin-top:10px;text-align:center;font-weight:bold;color:var(--green);font-size:.95rem;
  }
  .save-msg.show{display:block;}

  /* たんざくオーバーレイ */
  #tanzakuOverlay{
    display:none;position:fixed;inset:0;z-index:100;
    background:rgba(58,54,48,.55);
    align-items:center;justify-content:center;padding:16px;
  }
  #tanzakuOverlay.show{display:flex;}
  .tz-wrap{
    background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.2);
    padding:18px;max-height:95vh;overflow:auto;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    max-width:100%;
  }
  .tanzaku{
    writing-mode:vertical-rl;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    background:linear-gradient(180deg,#FDFBF5 0%,#F8F2E4 100%);
    border:1px solid #E0D6BE;
    border-radius:6px;
    padding:34px 30px;
    min-height:380px;
    height:min(62vh,560px);
    display:flex;flex-direction:column;justify-content:flex-start;
    position:relative;
  }
  .tz-poem{display:flex;gap:.4em;}
  .tz-poem .tz-line{
    font-size:clamp(1.5rem,4.5vw,2.2rem);
    letter-spacing:.14em;line-height:1.3;white-space:nowrap;
  }
  .tz-name{
    position:absolute;left:14px;bottom:26px;
    font-size:clamp(.9rem,2.5vw,1.1rem);letter-spacing:.1em;
  }
  .tz-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;}
  .tz-actions input{
    flex:1;min-width:130px;font-size:1rem;font-family:inherit;
    padding:10px 12px;border:2px solid #E5E0D8;border-radius:12px;
  }
  .tz-actions input:focus{outline:none;border-color:var(--accent);}
  .tz-actions button{
    min-height:50px;padding:0 18px;font-size:1rem;font-weight:bold;font-family:inherit;
    border:none;border-radius:12px;cursor:pointer;
  }
  #printBtn{background:var(--accent);color:#fff;}
  #closeTzBtn{background:#EEEAE3;color:var(--ink);}

  /* コレクション */
  .col-item{
    display:flex;align-items:center;gap:10px;
    padding:12px;border:2px solid #F0ECE5;border-radius:12px;margin-bottom:10px;
  }
  .col-item .col-text{flex:1;font-size:1.02rem;word-break:break-all;}
  .col-item .col-meta{font-size:.75rem;color:#9b958a;}
  .col-item button{
    min-height:44px;padding:0 12px;font-size:.85rem;font-weight:bold;font-family:inherit;
    border-radius:10px;cursor:pointer;flex:none;
  }
  .col-load{border:2px solid var(--accent);background:#fff;color:var(--accent);}
  .col-del{border:2px solid #E9C4C4;background:#fff;color:#C0392B;}
  .col-del.confirm{background:#C0392B;border-color:#C0392B;color:#fff;}
  .col-empty{color:#9b958a;font-size:.95rem;text-align:center;padding:8px 0;}

  /* 季語 */
  .kigo-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .kigo-tabs button{
    flex:1;min-height:48px;font-size:1rem;font-weight:bold;font-family:inherit;
    border:2px solid transparent;border-radius:12px;cursor:pointer;background:#F4F1EB;color:var(--ink);
  }
  .kigo-tabs button.active{color:#fff;}
  .kigo-tabs button[data-season="はる"].active{background:#E88BA8;}
  .kigo-tabs button[data-season="なつ"].active{background:#3E9ED0;}
  .kigo-tabs button[data-season="あき"].active{background:#D07A2E;}
  .kigo-tabs button[data-season="ふゆ"].active{background:#7387C6;}
  .kigo-list{display:flex;flex-wrap:wrap;gap:8px;}
  .kigo-chip{
    padding:9px 14px;border-radius:999px;background:var(--accent-light);
    color:var(--accent);font-size:1rem;font-weight:bold;font-family:inherit;
    border:none;cursor:pointer;
  }
  .kigo-chip:active{background:var(--accent);color:#fff;}
  .kigo-note{font-size:.82rem;color:#8a8478;margin-top:10px;}

  @media (max-width:480px){
    header h1{font-size:1.05rem;}
    .phrase-row input[type="text"]{font-size:1.2rem;}
  }

  /* 印刷：たんざくだけ */
  @media print{
    body{background:#fff;padding:0;}
    header,main{display:none !important;}
    #tanzakuOverlay{display:flex !important;position:static;background:none;padding:0;}
    .tz-wrap{box-shadow:none;border-radius:0;max-height:none;padding:0;}
    .tz-actions{display:none !important;}
    .tanzaku{height:24cm;min-height:24cm;}
  }
</style>
</head>
<body>
<header>
  <h1>🖌️ ごしちごチェッカー</h1>
  <a href="index.html">← いちらん</a>
</header>
<main>

  <!-- モード -->
  <section class="card">
    <h2>どれをつくる？</h2>
    <div class="mode-tabs" id="modeTabs">
      <button type="button" data-mode="haiku" class="active">はいく<small>５・７・５</small></button>
      <button type="button" data-mode="tanka">たんか<small>５・７・５・７・７</small></button>
      <button type="button" data-mode="free">じゆう<small>おとをかぞえるだけ</small></button>
    </div>
  </section>

  <!-- 入力 -->
  <section class="card">
    <h2>くをつくろう</h2>
    <div class="input-toggle" id="inputToggle">
      <button type="button" data-imode="sep" class="active">くごとに いれる</button>
      <button type="button" data-imode="joined">まとめて いれる</button>
    </div>

    <div id="sepArea"></div>

    <div id="joinedArea">
      <input type="text" id="joinedInput" placeholder="ぜんぶ つづけて いれてね" autocomplete="off">
      <div class="joined-preview" id="joinedPreview">くぎりの ていあんが ここに でるよ</div>
      <button type="button" id="applySplitBtn" disabled>この くぎりで わける</button>
    </div>

    <div class="kanji-warn" id="kanjiWarn">
      🈁 かんじが はいっているよ。おとのかずが ただしく かぞえられないから、よみがな（ひらがな）で にゅうりょくしてね。いまは かりの かずを だしているよ。
    </div>

    <div class="total-status" id="totalStatus">ここに けっかが でるよ</div>

    <div class="actions">
      <button type="button" id="tanzakuBtn">🎋 たんざくに する</button>
      <button type="button" id="saveBtn">💾 ほぞんする</button>
    </div>
    <div class="save-msg" id="saveMsg">✅ ほぞんしたよ！</div>
  </section>

  <!-- コレクション -->
  <section class="card">
    <h2>📚 ほぞんした く</h2>
    <div id="collectionList"></div>
  </section>

  <!-- 季語ヒント -->
  <section class="card">
    <h2>🌸 きごの ヒント</h2>
    <div class="kigo-tabs" id="kigoTabs">
      <button type="button" data-season="はる" class="active">はる</button>
      <button type="button" data-season="なつ">なつ</button>
      <button type="button" data-season="あき">あき</button>
      <button type="button" data-season="ふゆ">ふゆ</button>
    </div>
    <div class="kigo-list" id="kigoList"></div>
    <div class="kigo-note">タップすると、あいている くの さいしょに はいるよ。</div>
  </section>

</main>

<!-- たんざく -->
<div id="tanzakuOverlay">
  <div class="tz-wrap">
    <div class="tanzaku">
      <div class="tz-poem" id="tzPoem"></div>
      <div class="tz-name" id="tzName"></div>
    </div>
    <div class="tz-actions">
      <input type="text" id="nameInput" placeholder="なまえ（かかなくてもOK）" autocomplete="off">
      <button type="button" id="printBtn">🖨️ いんさつ</button>
      <button type="button" id="closeTzBtn">とじる</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){

  /* ========== 音数（モーラ）カウント ========== */
  // 小書き文字：直前の文字とあわせて1音（カウントしない）
  var SMALL_KANA = "ぁぃぅぇぉゃゅょゎァィゥェォャュョヮ";

  function isSmallKana(ch){ return SMALL_KANA.indexOf(ch) !== -1; }

  function isKana(ch){
    var c = ch.codePointAt(0);
    if (c >= 0x3041 && c <= 0x3096) return true;           // ひらがな
    if (c >= 0x30A1 && c <= 0x30FA) return true;           // カタカナ
    if (ch === "ー" || ch === "ゝ" || ch === "ゞ" || ch === "ヽ" || ch === "ヾ") return true; // 長音・くりかえし
    return false;
  }

  function isUncertain(ch){
    var c = ch.codePointAt(0);
    if (c >= 0x4E00 && c <= 0x9FFF) return true;   // 漢字
    if (c >= 0x3400 && c <= 0x4DBF) return true;   // 漢字（拡張A）
    if (ch === "々" || ch === "〆" || ch === "ヵ" || ch === "ヶ") return true;
    if (/[A-Za-z0-9Ａ-Ｚａ-ｚ０-９]/.test(ch)) return true; // 英数字
    return false;
  }

  // 文字列の音数を数える。{mora, uncertain}
  function countMora(str){
    var mora = 0, uncertain = false;
    var chars = Array.from(str);
    for (var i = 0; i < chars.length; i++){
      var ch = chars[i];
      if (isSmallKana(ch)) continue;          // 拗音・小書きは0音
      if (isKana(ch)) { mora++; continue; }   // かな1文字=1音（っ・ー・ん も1音）
      if (isUncertain(ch)) { uncertain = true; mora++; continue; } // 漢字等は仮に1音
      // 空白・句読点・記号は0音
    }
    return { mora: mora, uncertain: uncertain };
  }

  // 1行のテキストを目標音数の配列で区切る（小書き文字は前の文字にくっつける）
  function splitByMora(str, targets){
    var chars = Array.from(str.replace(/[\s　]/g, ""));
    var segs = [];
    var cur = "";
    var curMora = 0;
    var ti = 0;
    for (var i = 0; i < chars.length; i++){
      var ch = chars[i];
      cur += ch;
      if (!isSmallKana(ch) && (isKana(ch) || isUncertain(ch))) curMora++;
      if (ti < targets.length - 1 && curMora >= targets[ti]){
        // 次の文字が小書きなら まだ切らない
        var next = chars[i + 1];
        if (next !== undefined && isSmallKana(next)) continue;
        segs.push(cur);
        cur = "";
        curMora = 0;
        ti++;
      }
    }
    if (cur !== "") segs.push(cur);
    while (segs.length < targets.length) segs.push("");
    return segs;
  }

  /* ========== 状態 ========== */
  var MODES = {
    haiku: { label: "はいく", targets: [5, 7, 5],       names: ["かみのく", "なかのく", "しものく"] },
    tanka: { label: "たんか", targets: [5, 7, 5, 7, 7], names: ["１くめ", "２くめ", "３くめ", "４くめ", "５くめ"] },
    free:  { label: "じゆう", targets: null,            names: [] }
  };
  var LS_COLLECTION = "bo10_575_collection";
  var LS_NAME = "bo10_575_name";

  var state = {
    mode: "haiku",
    inputMode: "sep",          // "sep" | "joined"
    phrases: { haiku: ["", "", ""], tanka: ["", "", "", "", ""], free: [""] },
    joined: "",
    kigoSeason: "はる",
    pendingDeleteId: null
  };

  /* ========== 要素 ========== */
  var $ = function(id){ return document.getElementById(id); };
  var modeTabs = $("modeTabs");
  var inputToggle = $("inputToggle");
  var sepArea = $("sepArea");
  var joinedArea = $("joinedArea");
  var joinedInput = $("joinedInput");
  var joinedPreview = $("joinedPreview");
  var applySplitBtn = $("applySplitBtn");
  var kanjiWarn = $("kanjiWarn");
  var totalStatus = $("totalStatus");
  var saveMsg = $("saveMsg");
  var saveMsgTimer = null;

  /* ========== 句ごと入力欄の生成 ========== */
  function buildSepArea(){
    var m = MODES[state.mode];
    sepArea.innerHTML = "";
    var count = (state.mode === "free") ? 1 : m.targets.length;
    for (var i = 0; i < count; i++){
      var row = document.createElement("div");
      row.className = "phrase-row";

      var label = document.createElement("div");
      label.className = "phrase-label";
      var num = document.createElement("span");
      num.className = "num";
      var sub = document.createElement("span");
      sub.className = "sub";
      if (state.mode === "free"){
        num.textContent = "？おん";
        sub.textContent = "すきなように かいてみよう";
      } else {
        num.textContent = m.targets[i] + "おん";
        sub.textContent = m.names[i];
      }
      label.appendChild(num);
      label.appendChild(sub);

      var input = document.createElement("input");
      input.type = "text";
      input.autocomplete = "off";
      input.placeholder = "ひらがなで いれてね";
      input.value = state.phrases[state.mode][i] || "";
      input.dataset.index = String(i);
      input.addEventListener("input", onPhraseInput);

      var dots = document.createElement("div");
      dots.className = "dots";
      dots.id = "dots-" + i;

      row.appendChild(label);
      row.appendChild(input);
      row.appendChild(dots);
      sepArea.appendChild(row);
    }
  }

  function onPhraseInput(e){
    var i = Number(e.target.dataset.index);
    state.phrases[state.mode][i] = e.target.value;
    update();
  }

  /* ========== 丸の表示 ========== */
  function renderDots(container, mora, target){
    container.innerHTML = "";
    var colorClass, statusText, statusClass;

    if (target === null){ // 自由モード
      colorClass = "on-green";
      statusText = (mora > 0) ? mora + " おん" : "";
      statusClass = "st-green";
    } else if (mora === 0){
      colorClass = "on-gray"; statusText = ""; statusClass = "st-gray";
    } else if (mora === target){
      colorClass = "on-green"; statusText = "ぴったり！"; statusClass = "st-green";
    } else if (mora === target + 1){
      colorClass = "on-orange"; statusText = "じあまり（＋１）もOK"; statusClass = "st-orange";
    } else if (mora > target + 1){
      colorClass = "on-orange"; statusText = "＋" + (mora - target) + " おおいよ"; statusClass = "st-orange";
    } else {
      colorClass = "on-gray"; statusText = "あと " + (target - mora) + " おん"; statusClass = "st-gray";
    }

    var totalDots = (target === null) ? mora : Math.max(target, mora);
    for (var d = 0; d < totalDots; d++){
      var dot = document.createElement("span");
      dot.className = "dot";
      if (d < mora){
        dot.classList.add(colorClass);
        if (target !== null && d >= target) dot.classList.add("extra");
      }
      container.appendChild(dot);
    }
    if (statusText){
      var st = document.createElement("span");
      st.className = "phrase-status " + statusClass;
      st.textContent = statusText;
      container.appendChild(st);
    }
  }

  /* ========== 全体更新 ========== */
  function update(){
    var m = MODES[state.mode];
    var phrases = state.phrases[state.mode];
    var anyUncertain = false;

    if (state.inputMode === "sep" || state.mode === "free"){
      var count = (state.mode === "free") ? 1 : m.targets.length;
      var results = [];
      for (var i = 0; i < count; i++){
        var r = countMora(phrases[i] || "");
        results.push(r);
        if (r.uncertain) anyUncertain = true;
        var dotsEl = $("dots-" + i);
        if (dotsEl) renderDots(dotsEl, r.mora, (state.mode === "free") ? null : m.targets[i]);
      }
      renderTotal(results, anyUncertain);
    } else {
      // まとめて入力
      var jr = countMora(state.joined);
      anyUncertain = jr.uncertain;
      renderJoinedPreview(jr);
      kanjiWarn.classList.toggle("show", anyUncertain);
      totalStatus.className = "total-status";
      totalStatus.textContent = "ぜんぶで " + jr.mora + " おん（めやす：" + m.targets.reduce(function(a,b){return a+b;},0) + " おん）";
    }
  }

  function renderTotal(results, anyUncertain){
    kanjiWarn.classList.toggle("show", anyUncertain);
    var m = MODES[state.mode];

    if (state.mode === "free"){
      var mora = results[0] ? results[0].mora : 0;
      totalStatus.className = "total-status";
      totalStatus.textContent = (mora > 0) ? "ぜんぶで " + mora + " おん" : "ここに けっかが でるよ";
      return;
    }

    var filled = 0, exact = 0, okAmari = 0;
    for (var i = 0; i < m.targets.length; i++){
      var r = results[i];
      if (r.mora > 0) filled++;
      if (r.mora === m.targets[i]) exact++;
      else if (r.mora === m.targets[i] + 1) okAmari++;
    }

    if (filled === 0){
      totalStatus.className = "total-status";
      totalStatus.textContent = "ここに けっかが でるよ";
    } else if (exact === m.targets.length){
      totalStatus.className = "total-status ok";
      totalStatus.textContent = (state.mode === "haiku")
        ? "🎉 ご・しち・ご ぴったり！すごい！"
        : "🎉 ご・しち・ご・しち・しち ぴったり！すごい！";
    } else if (exact + okAmari === m.targets.length){
      totalStatus.className = "total-status almost";
      totalStatus.textContent = "じあまりも あるけど OK！いいかんじ！";
    } else {
      totalStatus.className = "total-status";
      totalStatus.textContent = "まるの いろを みながら ととのえてみよう";
    }
  }

  /* ========== まとめて入力 ========== */
  function renderJoinedPreview(jr){
    var m = MODES[state.mode];
    if (state.joined.trim() === ""){
      joinedPreview.textContent = "くぎりの ていあんが ここに でるよ";
      applySplitBtn.disabled = true;
      return;
    }
    var segs = splitByMora(state.joined, m.targets);
    joinedPreview.innerHTML = "";
    for (var i = 0; i < segs.length; i++){
      if (i > 0){
        var sep = document.createElement("span");
        sep.textContent = "／";
        sep.style.color = "#8E44AD";
        sep.style.fontWeight = "bold";
        joinedPreview.appendChild(sep);
      }
      var span = document.createElement("span");
      span.textContent = segs[i] || "＿";
      joinedPreview.appendChild(span);
      var c = document.createElement("span");
      c.className = "seg-count";
      c.textContent = "(" + countMora(segs[i]).mora + ")";
      joinedPreview.appendChild(c);
    }
    applySplitBtn.disabled = false;
  }

  applySplitBtn.addEventListener("click", function(){
    var m = MODES[state.mode];
    var segs = splitByMora(state.joined, m.targets);
    for (var i = 0; i < m.targets.length; i++){
      state.phrases[state.mode][i] = segs[i] || "";
    }
    setInputMode("sep");
  });

  joinedInput.addEventListener("input", function(){
    state.joined = joinedInput.value;
    update();
  });

  /* ========== モード・入力方法切替 ========== */
  modeTabs.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    state.mode = btn.dataset.mode;
    Array.prototype.forEach.call(modeTabs.querySelectorAll("button"), function(b){
      b.classList.toggle("active", b === btn);
    });
    inputToggle.style.display = (state.mode === "free") ? "none" : "flex";
    if (state.mode === "free") state.inputMode = "sep";
    setInputMode(state.inputMode);
  });

  inputToggle.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-imode]");
    if (!btn) return;
    setInputMode(btn.dataset.imode);
  });

  function setInputMode(imode){
    state.inputMode = imode;
    Array.prototype.forEach.call(inputToggle.querySelectorAll("button"), function(b){
      b.classList.toggle("active", b.dataset.imode === imode);
    });
    var joined = (imode === "joined" && state.mode !== "free");
    joinedArea.style.display = joined ? "block" : "none";
    sepArea.style.display = joined ? "none" : "block";
    if (!joined) buildSepArea();
    update();
  }

  /* ========== たんざく ========== */
  var tanzakuOverlay = $("tanzakuOverlay");
  var tzPoem = $("tzPoem");
  var tzName = $("tzName");
  var nameInput = $("nameInput");

  function currentLines(){
    if (state.inputMode === "joined" && state.mode !== "free"){
      return splitByMora(state.joined, MODES[state.mode].targets).filter(function(s){ return s !== ""; });
    }
    return state.phrases[state.mode].filter(function(s){ return s.trim() !== ""; });
  }

  $("tanzakuBtn").addEventListener("click", function(){
    var lines = currentLines();
    if (lines.length === 0){
      totalStatus.className = "total-status almost";
      totalStatus.textContent = "さきに くを いれてね";
      return;
    }
    tzPoem.innerHTML = "";
    for (var i = 0; i < lines.length; i++){
      var div = document.createElement("div");
      div.className = "tz-line";
      div.textContent = lines[i];
      div.style.paddingTop = (i * 1.4) + "em"; // ずらし書き
      tzPoem.appendChild(div);
    }
    tzName.textContent = nameInput.value.trim();
    tanzakuOverlay.classList.add("show");
  });

  nameInput.addEventListener("input", function(){
    tzName.textContent = nameInput.value.trim();
    try { localStorage.setItem(LS_NAME, nameInput.value); } catch(err){}
  });

  $("printBtn").addEventListener("click", function(){ window.print(); });
  $("closeTzBtn").addEventListener("click", function(){ tanzakuOverlay.classList.remove("show"); });
  tanzakuOverlay.addEventListener("click", function(e){
    if (e.target === tanzakuOverlay) tanzakuOverlay.classList.remove("show");
  });

  /* ========== 保存（コレクション） ========== */
  var collectionList = $("collectionList");

  function loadCollection(){
    try {
      var raw = localStorage.getItem(LS_COLLECTION);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch(err){ return []; }
  }
  function saveCollection(arr){
    try { localStorage.setItem(LS_COLLECTION, JSON.stringify(arr)); } catch(err){}
  }

  $("saveBtn").addEventListener("click", function(){
    var lines = currentLines();
    if (lines.length === 0){
      totalStatus.className = "total-status almost";
      totalStatus.textContent = "さきに くを いれてね";
      return;
    }
    var arr = loadCollection();
    arr.unshift({
      id: Date.now(),
      mode: state.mode,
      lines: lines,
      date: new Date().toLocaleDateString("ja-JP")
    });
    saveCollection(arr);
    state.pendingDeleteId = null;
    renderCollection();
    saveMsg.classList.add("show");
    if (saveMsgTimer) clearTimeout(saveMsgTimer);
    saveMsgTimer = setTimeout(function(){ saveMsg.classList.remove("show"); }, 2000);
  });

  function renderCollection(){
    var arr = loadCollection();
    collectionList.innerHTML = "";
    if (arr.length === 0){
      var empty = document.createElement("div");
      empty.className = "col-empty";
      empty.textContent = "まだ ほぞんした くは ないよ";
      collectionList.appendChild(empty);
      return;
    }
    arr.forEach(function(item){
      var row = document.createElement("div");
      row.className = "col-item";

      var textWrap = document.createElement("div");
      textWrap.className = "col-text";
      textWrap.textContent = item.lines.join("　");
      var meta = document.createElement("div");
      meta.className = "col-meta";
      meta.textContent = (MODES[item.mode] ? MODES[item.mode].label : "") + "・" + (item.date || "");
      textWrap.appendChild(meta);

      var loadBtn = document.createElement("button");
      loadBtn.type = "button";
      loadBtn.className = "col-load";
      loadBtn.textContent = "よみこむ";
      loadBtn.addEventListener("click", function(){
        var mode = MODES[item.mode] ? item.mode : "free";
        state.mode = mode;
        Array.prototype.forEach.call(modeTabs.querySelectorAll("button"), function(b){
          b.classList.toggle("active", b.dataset.mode === mode);
        });
        inputToggle.style.display = (mode === "free") ? "none" : "flex";
        var count = (mode === "free") ? 1 : MODES[mode].targets.length;
        for (var i = 0; i < count; i++){
          state.phrases[mode][i] = item.lines[i] || "";
        }
        if (mode === "free") state.phrases.free[0] = item.lines.join("");
        setInputMode("sep");
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      var delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "col-del";
      if (state.pendingDeleteId === item.id){
        delBtn.classList.add("confirm");
        delBtn.textContent = "ほんとに けす？";
      } else {
        delBtn.textContent = "けす";
      }
      delBtn.addEventListener("click", function(){
        if (state.pendingDeleteId === item.id){
          var next = loadCollection().filter(function(x){ return x.id !== item.id; });
          saveCollection(next);
          state.pendingDeleteId = null;
        } else {
          state.pendingDeleteId = item.id;
        }
        renderCollection();
      });

      row.appendChild(textWrap);
      row.appendChild(loadBtn);
      row.appendChild(delBtn);
      collectionList.appendChild(row);
    });
  }

  /* ========== 季語ヒント ========== */
  var KIGO = {
    "はる": ["さくら","うぐいす","つばめ","たんぽぽ","チューリップ","ひなまつり","いちご","かえる","なのはな","はるかぜ","しゃぼんだま","にゅうがくしき","ふきのとう","ちょうちょ","すみれ"],
    "なつ": ["ひまわり","せみ","かぶとむし","すいか","うみ","はなび","かきごおり","あさがお","ほたる","つゆ","プール","あめんぼ","にじ","ラムネ","せんぷうき"],
    "あき": ["もみじ","いちょう","コスモス","あかとんぼ","すずむし","つきみ","かき","くり","どんぐり","うんどうかい","いわしぐも","こおろぎ","ぶどう","かかし","いねかり"],
    "ふゆ": ["ゆき","こたつ","ゆきだるま","みかん","マフラー","たきび","しもばしら","つらら","はくちょう","おでん","てぶくろ","ゆず","きたかぜ","ふゆやすみ","かまくら"]
  };
  var kigoTabs = $("kigoTabs");
  var kigoList = $("kigoList");

  kigoTabs.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-season]");
    if (!btn) return;
    state.kigoSeason = btn.dataset.season;
    Array.prototype.forEach.call(kigoTabs.querySelectorAll("button"), function(b){
      b.classList.toggle("active", b === btn);
    });
    renderKigo();
  });

  function renderKigo(){
    kigoList.innerHTML = "";
    KIGO[state.kigoSeason].forEach(function(word){
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "kigo-chip";
      chip.textContent = word;
      chip.addEventListener("click", function(){ insertKigo(word); });
      kigoList.appendChild(chip);
    });
  }

  function insertKigo(word){
    if (state.inputMode === "joined" && state.mode !== "free"){
      state.joined += word;
      joinedInput.value = state.joined;
    } else {
      var inputs = sepArea.querySelectorAll("input[type=text]");
      var target = null;
      for (var i = 0; i < inputs.length; i++){
        if (inputs[i].value.trim() === ""){ target = inputs[i]; break; }
      }
      if (!target && inputs.length > 0) target = inputs[0];
      if (target){
        target.value += word;
        state.phrases[state.mode][Number(target.dataset.index)] = target.value;
      }
    }
    update();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ========== 初期化 ========== */
  try {
    var savedName = localStorage.getItem(LS_NAME);
    if (savedName) nameInput.value = savedName;
  } catch(err){}

  setInputMode("sep");
  renderCollection();
  renderKigo();

})();
</script>
