<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>タスク管理</h1>

    <form id="task-form" class="task-form">
      <input type="text" id="task-input" placeholder="新しいタスクを入力..." required>
      <button type="submit">追加</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="active">未完了</button>
      <button class="filter-btn" data-filter="done">完了</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-msg" class="empty-msg">タスクはありません</p>
  </main>
  <script src="app.js"></script>

</body>
</html>
