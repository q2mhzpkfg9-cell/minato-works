<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>まなびクイズバトル</title>
<style>
:root{--ink:#3b2a1e;--cream:#f6ecd6;--cream2:#efe0c0;--hi:#fffaf0;--lo:#c4a57a;--edge:#4a3628;--wood:#c08a55;--grass:#7dbb57;--dirt:#a8744e;--red:#e2674f;--blue:#4f8fd6;--gold:#f2c14e;--ok:#6cbf5a;
  --u:min(1vw,1.7778vh)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{background:#2b2233;background-image:
  radial-gradient(circle at 20% 30%,rgba(255,224,138,.10) 0 2px,transparent 3px),
  radial-gradient(circle at 70% 60%,rgba(255,255,255,.08) 0 2px,transparent 3px),
  linear-gradient(45deg,rgba(255,255,255,.025) 25%,transparent 25% 75%,rgba(255,255,255,.025) 75%),
  linear-gradient(45deg,rgba(255,255,255,.025) 25%,transparent 25% 75%,rgba(255,255,255,.025) 75%);
  background-size:180px 180px,240px 240px,48px 48px,48px 48px;background-position:0 0,0 0,0 0,24px 24px}
button,input{font:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.panel{background:var(--cream);border:4px solid var(--edge);box-shadow:inset 4px 4px 0 var(--hi),inset -4px -4px 0 var(--lo),0 6px 0 rgba(0,0,0,.25);border-radius:6px}
.btn{font-weight:800;font-size:clamp(14px,calc(var(--u)*2),26px);color:#fff;background:var(--wood);border:4px solid var(--edge);box-shadow:inset 4px 4px 0 rgba(255,255,255,.35),inset -4px -4px 0 rgba(0,0,0,.2),0 5px 0 rgba(0,0,0,.3);padding:.45em 1em;cursor:pointer;text-shadow:2px 2px 0 rgba(0,0,0,.35);border-radius:6px;line-height:1.2;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:inset 4px 4px 0 rgba(255,255,255,.35),inset -4px -4px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.3)}
.btn.grass{background:linear-gradient(var(--grass) 0 30%,#6aa84a 30% 36%,var(--dirt) 36%)}
.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}.btn.gold{background:var(--gold);color:var(--ink);text-shadow:none}
.btn.cream{background:var(--cream2);color:var(--ink);text-shadow:none}
.btn:disabled{filter:grayscale(.85);opacity:.5;cursor:default}
.btn kbd{font:inherit;font-size:.62em;opacity:.85;margin-left:.4em;border:2px solid currentColor;border-radius:4px;padding:0 .3em}
.logo{font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:4px 4px 0 #a0603c,8px 8px 0 #4a3628;text-align:center;line-height:1.1}
.logo span{color:#ffe08a}

/* ===== せってい ===== */
#sSet{overflow:auto;align-items:center;padding:18px 16px 40px}
#sSet .logo{font-size:clamp(34px,5.4vw,72px);margin-top:4px}
#sSet .sub{color:#fff;font-weight:800;font-size:clamp(14px,1.6vw,20px);text-shadow:2px 2px 0 #4a3628;margin:.5em 0 .9em;text-align:center}
.setp{width:min(1300px,100%);padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:6px 28px;font-size:clamp(14px,1.25vw,24px)}
.row{padding:10px 0;border-bottom:2px dashed var(--lo)}
.row.wide{grid-column:1/-1}
.row h3{font-size:1em;margin:0 0 6px;display:flex;align-items:center;gap:.5em}
.row h3 small{font-weight:600;color:#6a4a32;font-size:.82em}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-weight:800;font-size:1em;background:var(--cream2);color:var(--ink);border:3px solid var(--edge);border-radius:6px;padding:.3em .8em;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.seg button.on{background:var(--gold);box-shadow:inset 3px 3px 0 rgba(255,255,255,.45),0 3px 0 rgba(0,0,0,.25)}
.rulebox button{text-align:left;white-space:normal;line-height:1.35}
.rulebox button small{display:block;font-weight:600;font-size:.8em;color:#6a4a32}
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.tin{display:flex;align-items:center;border:3px solid var(--edge);border-radius:6px;overflow:hidden;background:#fff}
.tin i{width:1.6em;align-self:stretch;flex:none}
.tin input{border:0;outline:0;width:100%;padding:.35em .4em;font-weight:800;font-size:1em;color:var(--ink);background:#fff}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper b{min-width:2.2em;text-align:center;font-size:1.3em}
.cats{display:flex;flex-wrap:wrap;gap:6px;max-height:min(260px,26vh);overflow:auto;padding:2px}
.cats label{display:flex;align-items:center;gap:.25em;background:#fff;border:2px solid var(--lo);border-radius:20px;padding:.15em .7em .15em .4em;cursor:pointer;font-weight:700;font-size:.92em}
.cats label.on{background:#fff3c9;border-color:var(--edge)}
.cats label.k{box-shadow:inset 4px 0 0 var(--red)}.cats label.s{box-shadow:inset 4px 0 0 var(--blue)}
.cats input{margin:0}
.linkbtn{background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-weight:700;font-size:.85em;padding:0}
.chk{display:flex;align-items:center;gap:.5em;font-weight:800;cursor:pointer}
.chk input{width:1.3em;height:1.3em}
#goBtn{font-size:clamp(22px,3vw,36px);margin-top:14px;padding:.4em 2em;position:sticky;bottom:10px;z-index:5}

/* ===== しゅつだい ===== */
#sGame{padding:calc(var(--u)*1) calc(var(--u)*1.5) calc(var(--u)*2.2);gap:calc(var(--u)*1)}
.top{display:flex;align-items:center;gap:calc(var(--u)*1.2);height:calc(var(--u)*6);flex:none}
.qno{font-size:calc(var(--u)*3);font-weight:900;color:#fff;text-shadow:3px 3px 0 #4a3628;white-space:nowrap}
.qno b{font-size:1.35em;color:#ffe08a}
.qno small{font-size:.7em}
.badge{display:inline-block;font-weight:900;font-size:calc(var(--u)*2.2);padding:.2em .7em;border:3px solid var(--edge);border-radius:999px;background:var(--cream);white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
.badge.k{background:#ffd9cf}.badge.s{background:#d6e8ff}
.bonus{background:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#fff3b0}}
.top .sp{flex:1}
.tbtn{font-size:calc(var(--u)*1.5);padding:.3em .7em;border-width:3px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr calc(var(--u)*28);gap:calc(var(--u)*1.4)}
.left{display:flex;flex-direction:column;gap:calc(var(--u)*1);min-height:0;min-width:0}
.qpanel{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding:calc(var(--u)*1.2) calc(var(--u)*2)}
.qtext{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900;line-height:1.45;font-size:calc(var(--u)*4.6);word-break:break-word}
.qin{max-width:100%}
.qin.fig{display:flex;align-items:center;justify-content:center;gap:1em;height:100%}
.qin.fig .hs{font-size:1.4em}
.qin.fig svg{flex:none;height:auto;max-height:100%;margin:0}.qin svg{max-width:100%}
.qtext u{text-decoration:none;border-bottom:.12em solid var(--red);padding:0 2px;background:#fff3d6}
.qtext .box{display:inline-block;border:.08em dashed var(--blue);border-radius:6px;padding:0 .25em;background:#eef5ff}
.qtext .big{font-size:1.4em;letter-spacing:.05em}
.qtext .s2{font-size:.66em;display:block;color:#6a4a32}
.qtext .emo{font-size:1.15em;letter-spacing:.05em}
.qtext .clk{width:4.4em;height:auto;display:block;margin:.1em auto}
.qtext svg:not(.clk){max-height:5em;width:auto;max-width:100%}
.hs{margin:0 auto;font-size:1.05em;border-collapse:collapse;font-family:"Menlo","Consolas",monospace;line-height:1.2}
.hs td{padding:0 .2em;text-align:right;letter-spacing:.25em}
.hs tr.ln td{border-top:.12em solid var(--ink)}
.exbox{display:none;flex:none;max-height:calc(var(--u)*9);overflow:hidden;background:#fff;border:4px solid var(--ok);border-radius:8px;padding:calc(var(--u)*.6) calc(var(--u)*1.4);font-weight:800;font-size:calc(var(--u)*2.4);text-align:center;line-height:1.4;animation:appear .35s}
.exbox.on{display:block}
.left.rv .timer{display:none}
.left.rv .choices{height:calc(var(--u)*13)}
.left.rv .choices.n2,.left.rv .choices.n3{height:calc(var(--u)*9)}
.exbox .ex{display:block;font-size:.8em;color:#6a4a32;font-weight:700}
.banner{flex:1;height:100%;display:none;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--u)*2.4);color:#fff;border:3px solid var(--edge);border-radius:6px;text-shadow:2px 2px 0 rgba(0,0,0,.35);white-space:nowrap;animation:pop .35s}
.banner.on{display:flex}
.banner.on+.tbar{display:none}
.timer{flex:none;height:calc(var(--u)*3.2);display:flex;align-items:center;gap:calc(var(--u)*1)}
.tbar{flex:1;height:100%;background:#1c1622;border:3px solid var(--edge);border-radius:6px;overflow:hidden;position:relative}
.tfill{height:100%;width:100%;background:repeating-linear-gradient(90deg,var(--grass) 0 14px,#6aa84a 14px 18px);transition:width .12s linear}
.tfill.warn{background:repeating-linear-gradient(90deg,var(--red) 0 14px,#c4503c 14px 18px)}
.tnum{font-weight:900;color:#fff;font-size:calc(var(--u)*2.6);min-width:3.4em;text-align:right;text-shadow:2px 2px 0 #4a3628;white-space:nowrap}
.tnum.warn{color:#ffb3a3;animation:beat 1s infinite}
.timer.none .tbar{visibility:hidden}
.choices{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1);height:calc(var(--u)*17.5)}
.choices.n3{grid-template-columns:1fr 1fr 1fr}
.choices.n2,.choices.n3{height:calc(var(--u)*11)}
.card{position:relative;display:flex;align-items:center;gap:calc(var(--u)*1);text-align:left;color:var(--ink);background:var(--cream);border:4px solid var(--edge);border-radius:8px;padding:0 calc(var(--u)*1.2) 0 0;box-shadow:inset 4px 4px 0 var(--hi),inset -4px -4px 0 var(--lo),0 5px 0 rgba(0,0,0,.3);cursor:pointer;overflow:hidden;min-width:0;min-height:0;transition:opacity .3s,filter .3s,transform .2s}
.card .lt{flex:none;align-self:stretch;width:calc(var(--u)*6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:calc(var(--u)*4);text-shadow:3px 3px 0 rgba(0,0,0,.3);border-right:4px solid var(--edge)}
.card .ct{flex:1;min-width:0;max-height:100%;overflow:hidden;font-weight:900;font-size:calc(var(--u)*3.6);line-height:1.25;word-break:break-word;padding:.1em 0}
.card.dim{opacity:.35;filter:grayscale(.7)}
.card.okc{background:#fff6c4;transform:scale(1.03);z-index:2;animation:glow .8s ease-in-out infinite alternate}
.card.okc::after{content:"⭕";position:absolute;right:calc(var(--u)*.8);top:50%;transform:translateY(-50%);font-size:calc(var(--u)*5);opacity:.9}
.card.xc{opacity:.45;filter:grayscale(.8)}
.card.xc::after{content:"✖";position:absolute;right:calc(var(--u)*1);top:50%;transform:translateY(-50%);font-size:calc(var(--u)*5);color:var(--red)}
@keyframes glow{from{box-shadow:0 0 0 4px var(--gold),0 0 18px 6px rgba(242,193,78,.8)}to{box-shadow:0 0 0 8px var(--gold),0 0 40px 16px rgba(255,236,150,.95)}}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}

/* とくてんボード */
.board{display:flex;flex-direction:column;min-height:0;padding:calc(var(--u)*1) calc(var(--u)*1)}
.board h2{font-size:calc(var(--u)*2.3);text-align:center;margin-bottom:calc(var(--u)*.6);font-weight:900}
.brows{flex:1;position:relative;min-height:0}
.trow{position:absolute;left:0;right:0;display:grid;grid-template-columns:min(.7em,calc(var(--u)*3.4)) 1fr auto;align-items:center;line-height:1.1;column-gap:calc(var(--u)*.6);padding:0 calc(var(--u)*.8) .1em calc(var(--u)*.4);border:3px solid var(--edge);border-radius:6px;background:#fff;cursor:pointer;transition:top .7s cubic-bezier(.5,1.6,.5,1),background .2s}
.trow .rk{font-weight:900;font-size:min(.42em,calc(var(--u)*2.8));text-align:center}
.trow .nm{min-width:0;font-weight:900;font-size:min(.44em,calc(var(--u)*2.7));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.3em}
.trow .nm i{font-style:normal;font-size:.62em;color:#fff;border-radius:4px;padding:0 .3em;flex:none}
.trow .sc{font-weight:900;font-size:min(.62em,calc(var(--u)*4));min-width:1.4em;text-align:right}
.trow .bt{position:absolute;left:0;right:0;bottom:0;height:.13em;background:#eadcc0;border-radius:0 0 3px 3px;overflow:hidden}
.trow .bf{height:100%;width:0;transition:width .6s}
.trow.ok{background:#e4f7d9}
.trow.ok .nm::after{content:"⭕";font-size:.9em}
.trow.buzz{background:#fff3b0;animation:bz .5s infinite alternate}
.trow.out{opacity:.45}
.trow.out .nm::after{content:"✖";color:var(--red)}
.trow.up{animation:flash .8s}
.sc.bump{animation:bump .6s}
@keyframes bz{to{box-shadow:0 0 0 4px var(--gold)}}
@keyframes flash{0%,60%{background:#fff3b0}}
@keyframes bump{30%{transform:scale(1.5);color:#d0452c}}
.plus{position:absolute;right:1.4em;top:0;font-weight:900;font-size:calc(var(--u)*3.4);color:#e2674f;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff;pointer-events:none;animation:up 1.1s forwards;z-index:5}
@keyframes up{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(-6px) scale(1.2)}100%{opacity:0;transform:translateY(-40px) scale(1)}}

/* そうさバー */
.ctrl{flex:none;display:flex;align-items:center;gap:calc(var(--u)*1);height:calc(var(--u)*5.6)}
.ctrl .msg{flex:1;color:#fff;font-weight:800;font-size:calc(var(--u)*2);text-shadow:2px 2px 0 #4a3628;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl .btn{font-size:calc(var(--u)*2);padding:.35em .8em}
.hint{position:fixed;right:calc(var(--u)*1);bottom:calc(var(--u)*.25);color:rgba(255,255,255,.6);font-size:max(10px,calc(var(--u)*1.15));font-weight:700;pointer-events:none;z-index:9}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:var(--cream);border:4px solid var(--edge);border-radius:8px;padding:.4em 1.2em;font-weight:900;font-size:calc(var(--u)*2.4);z-index:50;display:none}
#toast.on{display:block;animation:appear .25s}

/* ===== けっか ===== */
#sRes{align-items:center;padding:calc(var(--u)*2) calc(var(--u)*3);gap:calc(var(--u)*1.2)}
#sRes .logo{font-size:calc(var(--u)*6)}
.drum{color:#fff;font-weight:900;font-size:calc(var(--u)*3.4);text-shadow:3px 3px 0 #4a3628;height:calc(var(--u)*4.5)}
.drum.go{animation:beat .5s infinite;font-size:calc(var(--u)*6);color:#ffe08a;margin-top:calc(var(--u)*12);height:auto}
.rlist{flex:1;min-height:0;width:min(100%,calc(var(--u)*78));display:flex;flex-direction:column;gap:calc(var(--u)*.8);justify-content:center}
.rrow{display:flex;align-items:center;gap:calc(var(--u)*1.5);padding:0 calc(var(--u)*2);border:4px solid var(--edge);border-radius:8px;background:var(--cream);box-shadow:inset 4px 4px 0 var(--hi),inset -4px -4px 0 var(--lo),0 5px 0 rgba(0,0,0,.3);font-weight:900;opacity:0;transform:translateX(-30px) scale(.9);transition:opacity .4s,transform .4s cubic-bezier(.5,1.8,.5,1)}
.rrow.show{opacity:1;transform:none}
.rrow .rr{width:4.2em;font-size:1.1em}
.rrow .rn{flex:1;display:flex;align-items:center;gap:.4em;white-space:nowrap;overflow:hidden}
.rrow .rn i{width:.9em;height:.9em;border:3px solid var(--edge);border-radius:4px;flex:none}
.rrow .rs{font-size:1.15em}
.rrow.first{background:linear-gradient(#fff3b0,#f6d76b);animation:glow .8s ease-in-out infinite alternate}
.rbtns{display:flex;gap:calc(var(--u)*2);visibility:hidden;height:calc(var(--u)*6.5);align-items:center}
.rbtns.on{visibility:visible}
.rbtns .btn{font-size:calc(var(--u)*2.4)}
#conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
</style>
</head>
<body>

<!-- せってい -->
<section class="screen on" id="sSet">
  <div class="logo">まなび <span>クイズバトル</span></div>
  <div class="sub">はんたいこう はやおしクイズ ― まなびクラフトの もんだいで あそぼう</div>
  <div class="panel setp">
    <div class="row"><h3>学年</h3><div class="seg" id="segGrade"></div></div>
    <div class="row"><h3>教科</h3><div class="seg" id="segSubj"></div></div>
    <div class="row wide"><h3>単元のしぼりこみ <small>チェックした単元だけ出ます（チェックなし＝ぜんぶ）</small> <button class="linkbtn" id="catClr">ぜんぶはずす</button></h3><div class="cats" id="cats"></div></div>
    <div class="row wide"><h3>班 <span class="stepper"><button class="btn cream tbtn" id="tMinus">－</button><b id="tNum">4</b><button class="btn cream tbtn" id="tPlus">＋</button></span> <small>名前はクリックして変えられます</small></h3><div class="teams" id="teams"></div></div>
    <div class="row"><h3>問題数</h3><div class="seg" id="segQn"></div></div>
    <div class="row"><h3>制限時間</h3><div class="seg" id="segTime"></div></div>
    <div class="row wide"><h3>ルール</h3><div class="seg rulebox" id="segRule"></div></div>
    <div class="row"><label class="chk"><input type="checkbox" id="cBonus">さいごの1問は ボーナス2ばい</label></div>
    <div class="row"><label class="chk"><input type="checkbox" id="cSound">こうかおん</label></div>
  </div>
  <button class="btn grass" id="goBtn">はじめる！</button>
</section>

<!-- しゅつだい -->
<section class="screen" id="sGame">
  <div class="top">
    <div class="qno" id="qno"></div>
    <span class="badge" id="qcat"></span>
    <span class="badge bonus" id="qbonus" style="display:none">ボーナス 2ばい！</span>
    <span class="sp"></span>
    <button class="btn cream tbtn" id="gSound"></button>
    <button class="btn cream tbtn" id="gFull">ぜんがめん</button>
    <button class="btn cream tbtn" id="gQuit">やめる</button>
  </div>
  <div class="main">
    <div class="left">
      <div class="panel qpanel">
        <div class="qtext" id="qtext"></div>
      </div>
      <div class="exbox" id="exbox"></div>
      <div class="timer" id="timer"><div class="banner" id="banner"></div><div class="tbar"><div class="tfill" id="tfill"></div></div><div class="tnum" id="tnum"></div></div>
      <div class="choices" id="choices"></div>
    </div>
    <div class="panel board"><h2>とくてん</h2><div class="brows" id="brows"></div></div>
  </div>
  <div class="ctrl">
    <div class="msg" id="msg"></div>
    <button class="btn cream" id="bChange">この もんだいを かえる</button>
        <button class="btn grass" id="bNext">つぎの もんだい ▶</button>
  </div>
</section>

<!-- けっか -->
<section class="screen" id="sRes">
  <div class="logo">けっか <span>はっぴょう</span></div>
  <div class="drum" id="drum"></div>
  <div class="rlist" id="rlist"></div>
  <div class="rbtns" id="rbtns"><button class="btn grass" id="rAgain">もういちど</button><button class="btn cream" id="rSet">せっていへ</button></div>
</section>

<div class="hint" id="hint">スペース/Enter：すすむ　R：こたえ　1〜8：はん　A〜D：カード　F：ぜんがめん</div>
<div id="toast"></div>
<canvas id="conf"></canvas>

<script>
/* ==== まなび問題エンジン（まなびクラフトから自動で切り出し。直接編集しない） ==== */
const $=s=>document.querySelector(s);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function mkQ(subj,cat,text,ans,opts,ex){const set=[...new Set([String(ans),...opts.map(String)])].slice(0,4);return{subj,cat,text,ans:String(ans),choices:shuffle(set),ex:ex||''}}
function numOpts(ans,extra=[]){const c=new Set([ans]);extra.forEach(v=>{if(v>=0&&c.size<4)c.add(v)});
  const offs=shuffle([1,-1,2,-2,10,-10,ans>=100?100:9,ans>=100?-100:11]);for(const o of offs){if(c.size>=4)break;const v=ans+o;if(v>=0)c.add(v)}let k=3;while(c.size<4)c.add(ans+k++);return[...c]}
const big=s=>`<span class="big">${s}</span>`;
const hissan=(a,b,op)=>`<table class="hs"><tr><td></td><td>${a}</td></tr><tr><td>${op}</td><td>${b}</td></tr><tr class="ln"><td></td><td>？</td></tr></table>`;
const fmtT=(h,m)=>m===0?`${h}じ`:`${h}じ${m}${m%10===0?'ぷん':'ふん'}`;
function clockSVG(h,m){let s='<svg class="clk" viewBox="-70 -70 140 140"><circle r="64" fill="#fffaf0" stroke="#4a3628" stroke-width="6"/>';
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?58:53;s+=`<line x1="${Math.sin(a)*r1}" y1="${-Math.cos(a)*r1}" x2="${Math.sin(a)*60}" y2="${-Math.cos(a)*60}" stroke="#4a3628" stroke-width="${i%5?1.5:3}"/>`}
  for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;s+=`<text x="${Math.sin(a)*44}" y="${-Math.cos(a)*44+6}" text-anchor="middle" font-size="16" font-weight="800" fill="#3b2a1e">${i}</text>`}
  const ha=((h%12)+m/60)*30*Math.PI/180,ma=m*6*Math.PI/180;
  s+=`<line x1="0" y1="0" x2="${Math.sin(ha)*30}" y2="${-Math.cos(ha)*30}" stroke="#c0503c" stroke-width="7" stroke-linecap="round"/><line x1="0" y1="0" x2="${Math.sin(ma)*50}" y2="${-Math.cos(ma)*50}" stroke="#2c5a9a" stroke-width="4.5" stroke-linecap="round"/><circle r="5" fill="#3b2a1e"/></svg>`;return s}

const WN=40;
function bboxOf(cv){const c=cv.getContext('2d'),{width:w,height:h}=cv,d=c.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>60){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  return x1<0?null:{x0,y0,x1:x1+1,y1:y1+1}}
function normMask(src,bb){const c=oc(WN,WN),x=c.getContext('2d');const w=bb.x1-bb.x0,h=bb.y1-bb.y0,s=WN*.82/Math.max(w,h,1),dw=Math.max(1,w*s),dh=Math.max(1,h*s);
  x.drawImage(src,bb.x0,bb.y0,w,h,(WN-dw)/2,(WN-dh)/2,dw,dh);const d=x.getImageData(0,0,WN,WN).data,m=new Uint8Array(WN*WN);for(let i=0;i<WN*WN;i++)m[i]=d[i*4+3]>50?1:0;return m}

  if(!pool.length)pool=catsOf(subj).filter(c=>ok(c)&&c!==CUSTOM);if(!pool.length)pool=[cur[0]];
  return genCat(pick(pool),subj,ai)}

/* ---- 公開API ----
 MQ.setGrade(g)        学年 1〜6
 MQ.q(subj, ai)        subj='k'(国語)/'s'(算数)、ai=0〜9（大きいほど後半の単元。省略=全部まぜ）
                       → {subj,cat,text(HTML),choices[],ans,ex}
 MQ.qAny(ai)           国語・算数どちらか
 MQ.cats(subj)         単元名の一覧
 MQ.qCat(cat,subj)     単元を指定して1問
*/
const MQ={
  setGrade(g){MQ_G=PACKS[g]?g:2},
  get grade(){return MQ_G},
  label(g){return (PACKS[g||MQ_G]||{}).label||''},
  _ok(f){for(let i=0;i<20;i++){try{const q=f();if(q&&!q.write&&q.choices&&q.choices.length>=2)return q}catch(e){}}return mkQ('s','たしざん','3 ＋ 4 ＝ ？','7',['6','8','5'],'3＋4＝7')},
  q(subj,ai){const n=pack().areas.length;ai=ai==null?n-1:Math.max(0,Math.min(n-1,ai));return MQ._ok(()=>genQ(subj,ai))},
  qAny(ai){return MQ.q(Math.random()<.5?'k':'s',ai)},
  cats(subj){return catsOf(subj).filter(c=>c!==CUSTOM)},
  qCat(cat,subj){return MQ._ok(()=>genCat(cat,subj||subjOfCat(cat),pack().areas.length-1))},
};

const clickB=(i,f)=>id(i).addEventListener('click',e=>{e.currentTarget.blur();f()});
clickB('goBtn',start);
clickB('bNext',next);clickB('bChange',changeQ);
clickB('rAgain',start);clickB('rSet',()=>{RUN++;stopConf();G=null;renderSet();show('sSet')});
clickB('gQuit',()=>{if(confirm('ゲームを やめて せってい に もどりますか？')){RUN++;tStop();G=null;renderSet();show('sSet')}});
function sndLabel(){id('gSound').textContent=C.sound?'🔊 おと':'🔇 おと'}
clickB('gSound',()=>{C.sound=!C.sound;save();sndLabel();id('cSound').checked=C.sound});
function full(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}}
clickB('gFull',full);
document.addEventListener('fullscreenchange',()=>setTimeout(fitAll,120));
document.addEventListener('keydown',e=>{const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k==='f'||k==='F'){e.preventDefault();full();return}
  if(!id('sGame').classList.contains('on'))return;
  if(k===' '||k==='Enter'){e.preventDefault();next();return}
  if(k==='r'||k==='R'){e.preventDefault();reveal();return}
  if(/^[1-8]$/.test(k)){e.preventDefault();teamKey(+k-1);return}
  const ci='abcd'.indexOf(k.toLowerCase());if(ci>=0&&G&&G.q&&ci<G.q.choices.length){e.preventDefault();choose(ci)}});

sndLabel();renderSet();show('sSet');
})();
</script>
</body>
</html>
