<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つなぎことばクイズ</title>
<style>
:root{--bg:#f6f1e7;--card:#fff;--navy:#1f3a5f;--ink:#2b2b2b;--sub:#6b665c;--line:#e3dccd;--r:14px;--ok:#2e8b57;--ng:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.7}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--navy);color:#fff}
header a{color:#fff;text-decoration:none;font-weight:bold;font-size:.95rem;padding:6px 12px;border:1px solid rgba(255,255,255,.5);border-radius:10px}
header h1{font-size:1.25rem;margin:0}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
h2{font-size:1.1rem;color:var(--navy);margin:0 0 10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button,.btn{font-family:inherit;font-size:1.05rem;font-weight:bold;min-height:52px;padding:8px 16px;border-radius:var(--r);border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.tabs button{flex:1;min-width:130px}
.tabs button.on,.btn.main{background:var(--navy);color:#fff}
.btn:disabled{opacity:.4}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:bold;color:var(--sub)}
.q{font-size:clamp(1.3rem,4vw,2.1rem);line-height:1.9;text-align:center;margin:16px 0}
.blank{display:inline-block;min-width:5.5em;border-bottom:4px solid var(--navy);color:var(--navy);font-weight:bold}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choices button{font-family:inherit;font-size:clamp(1.2rem,3.5vw,1.8rem);min-height:70px;border-radius:var(--r);border:3px solid var(--line);background:#fffdf8;cursor:pointer;color:var(--ink)}
.choices button.ok{border-color:var(--ok);background:#e5f5ec}
.choices button.ng{border-color:var(--ng);background:#fbe9e7}
.msg{min-height:3em;text-align:center;font-size:1.1rem;font-weight:bold;margin-top:12px}
.msg.ok{color:var(--ok)}.msg.ng{color:var(--ng)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.type{border:2px solid var(--line);border-radius:var(--r);padding:12px}
.type b{font-size:1.1rem}
.type .ic{font-size:1.4rem;margin-right:6px}
.type .ex{color:var(--sub);font-size:.95rem}
.result{font-size:1.8rem;text-align:center;font-weight:bold;color:var(--navy)}
footer{text-align:center;font-size:.85rem;color:var(--sub);padding:20px 12px 30px}
footer a{color:var(--navy)}
@media(max-width:480px){.choices{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a href="../index.html">← MINATO WORKS</a><h1>つなぎことばクイズ</h1></header>
<main>
  <div class="card">
    <div class="tabs" id="modes">
      <button data-m="fill" class="on">あなうめ<br><small>（　）に はいる ことばは？</small></button>
      <button data-m="kind">なかまわけ<br><small>どんな はたらき？</small></button>
      <button data-m="book">ずかん<br><small>はたらきを おぼえる</small></button>
    </div>
  </div>
  <div class="card" id="quiz">
    <div class="bar"><span id="count"></span><span id="score"></span></div>
    <div class="q" id="q"></div>
    <div class="choices" id="choices"></div>
    <div class="msg" id="msg"></div>
    <div class="row"><button class="btn main" id="next" disabled>つぎへ ▶</button></div>
  </div>
  <div class="card" id="book" hidden>
    <h2>つなぎことば（せつぞくご）の はたらき</h2>
    <p>まえの ぶんと あとの ぶんを <b>どんな かんけいで つなぐか</b>を あらわす ことばだよ。</p>
    <div class="types" id="types"></div>
  </div>
  <div class="card" id="rec"></div>
</main>
<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525" target="_blank" rel="noopener">https://note.com/minato_smile2525</a></footer>
<script>
const KEY='mw_教科_02_';
function load(k,d){try{const v=localStorage.getItem(KEY+k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
const TYPES={
 jun:{n:"そのまま つづく（順接）",ic:"➡️",d:"まえの ことが りゆう・きっかけに なって、あとの ことが おこる。",w:["だから","それで","すると","そのため","したがって"]},
 gyaku:{n:"はんたいに なる（逆接）",ic:"↩️",d:"まえの ことから おもうのと ちがう ことが あとに くる。",w:["しかし","でも","けれども","ところが","だが"]},
 ten:{n:"つけくわえる（並立・累加）",ic:"➕",d:"まえの ことに ならべたり、つけたしたり する。",w:["そして","また","それに","そのうえ","しかも","さらに"]},
 sen:{n:"くらべる・えらぶ（対比・選択）",ic:"⚖️",d:"まえと あとを くらべたり、どちらかを えらんだり する。",w:["それとも","または","あるいは","いっぽう"]},
 set:{n:"せつめい・おぎなう（説明・補足）",ic:"💬",d:"まえの ことを いいかえたり、りゆうや れいを くわえたり する。",w:["なぜなら","つまり","たとえば","すなわち"]},
 kan:{n:"わだいを かえる（転換）",ic:"🔄",d:"まえの はなしから べつの はなしに うつる。",w:["ところで","さて","では"]}
};
// [まえ, あと, こたえ, ちがう選択肢x3, 種類]
const FILL=[
 ["雨がふってきた。","かさをさした。","だから",["しかし","それとも","たとえば"],"jun"],
 ["いっしょうけんめい走った。","バスに間に合わなかった。","しかし",["だから","そして","つまり"],"gyaku"],
 ["朝ごはんを食べた。","歯をみがいた。","そして",["しかし","それとも","なぜなら"],"ten"],
 ["お茶にしますか。","ジュースにしますか。","それとも",["だから","しかし","さて"],"sen"],
 ["きょうは学校を休んだ。","熱が出たからだ。","なぜなら",["だから","そして","それとも"],"set"],
 ["わたしはくだものが好きだ。","りんごやみかんだ。","たとえば",["しかし","それとも","だから"],"set"],
 ["宿題が終わった。","遊びに行った。","それで",["けれども","または","たとえば"],"jun"],
 ["天気予報では晴れだった。","午後から雨になった。","ところが",["すると","そして","つまり"],"gyaku"],
 ["ボタンをおした。","ドアが開いた。","すると",["しかし","それとも","なぜなら"],"jun"],
 ["今日の勉強はここまでです。","明日の持ち物をたしかめましょう。","さて",["だから","しかし","たとえば"],"kan"],
 ["この本はおもしろい。","絵もきれいだ。","それに",["しかし","それとも","なぜなら"],"ten"],
 ["兄は野球がとくいだ。","水泳もとくいだ。","また",["しかし","だから","それとも"],"ten"],
 ["えんぴつ、","ボールペンで書いてください。","または",["だから","しかし","すると"],"sen"],
 ["あの人は母の兄だ。","わたしのおじさんだ。","つまり",["しかし","それとも","すると"],"set"],
 ["たくさん練習した。","試合には負けてしまった。","けれども",["だから","それに","たとえば"],"gyaku"],
 ["風が強くなった。","雨もふりだした。","そのうえ",["しかし","それとも","つまり"],"ten"],
 ["運動会、楽しかったね。","宿題はもう終わった？","ところで",["だから","それとも","つまり"],"kan"],
 ["この道はせまい。","急な坂道だ。","しかも",["だから","それとも","つまり"],"ten"],
 ["目ざまし時計が鳴らなかった。","学校におくれた。","そのため",["しかし","または","たとえば"],"jun"],
 ["まどを開けた。","すずしい風が入ってきた。","すると",["けれども","それとも","つまり"],"jun"],
 ["兄は外で遊ぶのが好きだ。","弟は家で本を読むのが好きだ。","いっぽう",["だから","すると","なぜなら"],"sen"],
 ["夏休みに海へ行った。","雨でおよげなかった。","でも",["だから","それとも","たとえば"],"gyaku"],
 ["テストで百点をとった。","母にほめられた。","それで",["しかし","それとも","たとえば"],"jun"],
 ["かぜをひいて声が出ない。","今日の発表は明日にしてもらった。","だから",["ところが","たとえば","それとも"],"jun"]
];
let mode='fill',qs=[],qi=0,score=0,answered=false;
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function buildKindQs(){const list=[];for(const k in TYPES)TYPES[k].w.forEach(w=>list.push([w,k]));return shuffle(list).slice(0,10)}
function start(){
  qi=0;score=0;
  $('quiz').hidden=mode==='book';$('book').hidden=mode!=='book';
  if(mode==='book'){renderBook();return}
  qs=mode==='fill'?shuffle(FILL).slice(0,10):buildKindQs();show();
}
function show(){
  answered=false;$('next').disabled=true;$('msg').textContent='';$('msg').className='msg';
  $('count').textContent=(qi+1)+' / '+qs.length+'もん';$('score').textContent='せいかい '+score;
  const c=$('choices');c.innerHTML='';
  if(mode==='fill'){
    const [a,b,ans,wr]=qs[qi];
    $('q').innerHTML=a+'<br>（<span class="blank" id="bl">　？　</span>）'+b;
    shuffle([ans,...wr]).forEach(w=>{const bt=document.createElement('button');bt.textContent=w;bt.onclick=()=>judge(bt,w===ans,w);c.appendChild(bt)});
  }else{
    const [w,k]=qs[qi];
    $('q').innerHTML='「<b>'+w+'</b>」は どんな はたらき？';
    Object.keys(TYPES).forEach(t=>{const bt=document.createElement('button');bt.style.fontSize='1.1rem';bt.innerHTML=TYPES[t].ic+' '+TYPES[t].n;bt.dataset.t=t;bt.onclick=()=>judge(bt,t===k,t);c.appendChild(bt)});
  }
}
function judge(bt,ok,val){
  if(answered)return;
  if(ok){
    answered=true;bt.classList.add('ok');
    if(!bt.dataset.miss&&!$('choices').dataset.miss)score++;
    $('score').textContent='せいかい '+score;
    const k=mode==='fill'?qs[qi][4]:qs[qi][1];
    if(mode==='fill')$('bl').textContent=qs[qi][2];
    $('msg').className='msg ok';$('msg').innerHTML='せいかい！ '+TYPES[k].ic+' <b>'+TYPES[k].n+'</b><br><small>'+TYPES[k].d+'</small>';
    $('next').disabled=false;delete $('choices').dataset.miss;
  }else{
    bt.classList.add('ng');$('choices').dataset.miss=1;
    $('msg').className='msg ng';
    $('msg').textContent=mode==='fill'?'「'+val+'」だと つながりが へんだね。もういちど よんでみよう。':'ちがうよ。ずかんで たしかめてみよう。';
  }
}
$('next').onclick=()=>{qi++;if(qi<qs.length)show();else finish()};
function finish(){
  const rec=load('rec',{});if(!rec[mode]||score>rec[mode])rec[mode]=score;save('rec',rec);
  $('q').innerHTML='<div class="result">'+qs.length+'もんちゅう '+score+'もん いっぱつ せいかい！</div>';
  $('choices').innerHTML='';const r=document.createElement('button');r.textContent='もういちど';r.onclick=start;$('choices').appendChild(r);
  $('msg').textContent='';$('next').disabled=true;showRec();
}
function renderBook(){$('types').innerHTML=Object.values(TYPES).map(t=>'<div class="type"><div><span class="ic">'+t.ic+'</span><b>'+t.n+'</b></div><div>'+t.d+'</div><div class="ex">れい：'+t.w.join('・')+'</div></div>').join('')}
function showRec(){const r=load('rec',{});$('rec').innerHTML='<h2>さいこう きろく</h2>あなうめ '+(r.fill??'-')+'もん　／　なかまわけ '+(r.kind??'-')+'もん<br><small>（このたんまつの なかだけに ほぞんされます）</small>'}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;start()});
start();showRec();
</script>
</body>
</html>
