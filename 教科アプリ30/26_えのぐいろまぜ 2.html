<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>えのぐ いろまぜ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f6f1e7;color:#1f2a37;font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","BIZ UDPGothic","Meiryo",sans-serif;font-size:19px;line-height:1.6}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#1f3a5f;color:#fff}
header a.back{color:#fff;text-decoration:none;font-size:15px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:14px}
header h1{margin:0;font-size:clamp(20px,3.4vw,30px);letter-spacing:.05em}
main{max-width:1180px;margin:0 auto;padding:14px 16px 30px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(31,58,95,.08);margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab,.btn{border:2px solid #1f3a5f;background:#fff;color:#1f3a5f;border-radius:14px;padding:8px 16px;font-size:18px;font-family:inherit;cursor:pointer;min-height:48px}
.tab.on,.btn.on{background:#1f3a5f;color:#fff}
.btn.main{background:#e0a526;border-color:#e0a526;color:#fff;font-weight:bold}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.tubes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tube{border:none;border-radius:14px;padding:10px 4px;font-family:inherit;font-size:17px;cursor:pointer;background:#fbf7ee;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:110px}
.tube .blob{width:56px;height:56px;border-radius:50% 50% 46% 54%/55% 45% 55% 45%;box-shadow:inset -6px -6px 0 rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.15)}
.tube .cnt{font-size:14px;color:#6b7280}
.tube:active{transform:scale(.95)}
.well{width:min(260px,70vw);height:min(260px,70vw);border-radius:50%;margin:10px auto;border:10px solid #eef2f7;box-shadow:inset 0 4px 10px rgba(0,0,0,.15);transition:background .3s}
.pair{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.pair .well{width:min(200px,40vw);height:min(200px,40vw)}
.cap{text-align:center;font-weight:bold;color:#1f3a5f}
.recipe{text-align:center;min-height:1.6em;font-size:18px}
.dots span{display:inline-block;width:16px;height:16px;border-radius:50%;margin:1px;border:1px solid rgba(0,0,0,.2)}
.msg{font-size:24px;font-weight:bold;text-align:center;min-height:1.5em}
.meter{height:24px;border-radius:12px;background:#eef2f7;overflow:hidden;margin:6px 0}
.meter div{height:100%;background:#2e8b57;transition:width .3s}
.saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.sw{border-radius:14px;padding:8px;background:#fbf7ee;text-align:center;font-size:15px;cursor:pointer}
.sw div{height:60px;border-radius:10px;margin-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:6px 0}
.tip{background:#fbf7ee;border-radius:14px;padding:10px 14px;font-size:16px}
.hide{display:none}
footer{text-align:center;font-size:13px;color:#6b7280;padding:16px}
footer a{color:#1f3a5f}
</style>
</head>
<body>
<header><a class="back" href="../index.html">← MINATO WORKS</a><h1>🎨 えのぐ いろまぜ</h1></header>
<main>
  <div class="tabs">
    <button class="tab on" data-t="free">じゆうに まぜる</button>
    <button class="tab" data-t="odai">おだいの いろを つくろう</button>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="cap">えのぐを タップして パレットに 1てき いれよう</div>
      <div class="tubes" id="tubes" style="margin-top:8px"></div>
      <div class="row"><button class="btn" id="undo">ひとつ もどす</button><button class="btn" id="wash">パレットを あらう</button></div>
      <div class="tip"><b>ヒント</b>：赤＋黄＝だいだい、黄＋青＝みどり、赤＋青＝むらさき。白を まぜると あかるく やさしい 色に、黒を まぜると くらい 色に なるよ。黒は すこしずつ！</div>
    </div>
    <div class="card">
      <div id="freeView">
        <div class="well" id="well"></div>
        <div class="recipe" id="recipe"></div>
        <div class="row"><button class="btn main" id="keep">この色を とっておく</button></div>
      </div>
      <div id="odaiView" class="hide">
        <div class="pair">
          <div><div class="cap">おだい</div><div class="well" id="target"></div></div>
          <div><div class="cap">つくった色</div><div class="well" id="well2"></div></div>
        </div>
        <div class="recipe" id="recipe2"></div>
        <div class="cap">にている度</div>
        <div class="meter"><div id="bar" style="width:0"></div></div>
        <div class="msg" id="msg"></div>
        <div class="row"><button class="btn" id="hint">ヒントを見る</button><button class="btn main" id="nextOdai">つぎの おだい</button></div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="cap">とっておいた 色（タップで けす）</div>
    <div class="saved" id="saved" style="margin-top:8px"></div>
  </div>
</main>
<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525">https://note.com/minato_smile2525</a></footer>

<script>
(function(){
const $=id=>document.getElementById(id);
const KEY='mw_教科_26_saved';
// えのぐ（ふつうの 12色セットに ちかい 色）
const PAINTS=[
 {id:'red',n:'赤',hex:'#d7262e'},{id:'yellow',n:'黄',hex:'#f7d117'},{id:'blue',n:'青',hex:'#1d5fb8'},
 {id:'white',n:'白',hex:'#fbfbf7'},{id:'black',n:'黒',hex:'#1c1c1c'},
 {id:'yg',n:'黄みどり',hex:'#8cc63f'},{id:'brown',n:'茶',hex:'#7b4a26'},{id:'ultra',n:'あい',hex:'#1f2f7a'}
];
const toLin=c=>{c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)};
const toS=c=>{c=c<=0.0031308?c*12.92:1.055*Math.pow(c,1/2.4)-0.055;return Math.round(Math.min(1,Math.max(0,c))*255)};
function hexRgb(h){return[1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function rgbHex(a){return'#'+a.map(v=>v.toString(16).padStart(2,'0')).join('')}
// えのぐ（ひく まぜかた）：反射率の 重みつき 幾何平均で 近似
function mix(drops){
  const tot=Object.values(drops).reduce((a,b)=>a+b,0);
  if(!tot)return null;
  const acc=[0,0,0];
  for(const p of PAINTS){const n=drops[p.id]||0;if(!n)continue;
    const rgb=hexRgb(p.hex).map(toLin).map(v=>Math.max(v,0.005));
    for(let i=0;i<3;i++)acc[i]+=n/tot*Math.log(rgb[i]);}
  return rgbHex(acc.map(v=>toS(Math.exp(v))));
}
function dist(a,b){ // 見た目の ちがい（かんたんな Lab 距離）
  const lab=h=>{const [r,g,b]=hexRgb(h).map(toLin);
    let x=(r*0.4124+g*0.3576+b*0.1805)/0.9505,y=r*0.2126+g*0.7152+b*0.0722,z=(r*0.0193+g*0.1192+b*0.9505)/1.089;
    const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;[x,y,z]=[f(x),f(y),f(z)];return[116*y-16,500*(x-y),200*(y-z)]};
  const A=lab(a),B=lab(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]);
}
function nameOf(drops){
  const k=Object.keys(drops).filter(x=>drops[x]>0);
  const has=id=>drops[id]>0;
  if(k.length===0)return'';
  if(k.length===1)return PAINTS.find(p=>p.id===k[0]).n;
  if(k.length===2){
    if(has('red')&&has('yellow'))return drops.red>drops.yellow?'赤っぽい だいだい':drops.red<drops.yellow?'黄っぽい だいだい':'だいだい（オレンジ）';
    if(has('yellow')&&has('blue'))return drops.blue>drops.yellow?'青っぽい みどり':drops.blue<drops.yellow?'黄みどり':'みどり';
    if(has('red')&&has('blue'))return drops.red>drops.blue?'赤むらさき':drops.red<drops.blue?'青むらさき':'むらさき';
    if(has('white')&&has('red'))return'ピンク（もも色）';
    if(has('white')&&has('blue'))return'水色';
    if(has('white')&&has('black'))return'はい色';
    if(has('white'))return'あかるい '+PAINTS.find(p=>p.id===k.find(x=>x!=='white')).n;
    if(has('black'))return'くらい '+PAINTS.find(p=>p.id===k.find(x=>x!=='black')).n;
  }
  return'オリジナルの 色';
}
let drops={},hist=[],mode='free';
let saved=[];try{saved=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}

function drawTubes(){
  $('tubes').innerHTML=PAINTS.map(p=>`<button class="tube" data-id="${p.id}"><span class="blob" style="background:${p.hex}"></span>${p.n}<span class="cnt">${drops[p.id]?drops[p.id]+'てき':''}</span></button>`).join('');
  $('tubes').querySelectorAll('.tube').forEach(b=>b.onclick=()=>{const id=b.dataset.id;const tot=Object.values(drops).reduce((a,c)=>a+c,0);if(tot>=30)return;drops[id]=(drops[id]||0)+1;hist.push(id);update()});
}
function recipeHTML(d){
  const parts=PAINTS.filter(p=>d[p.id]).map(p=>`${p.n}${d[p.id]}`);
  return parts.length?parts.join(' ＋ '):'<span style="color:#6b7280">まだ なにも はいっていないよ</span>';
}
function update(){
  const c=mix(drops)||'#ffffff';
  drawTubes();
  $('well').style.background=c;$('well2').style.background=c;
  const nm=nameOf(drops);
  $('recipe').innerHTML=recipeHTML(drops)+(nm?`<br><b>${nm}</b>`:'');
  $('recipe2').innerHTML=recipeHTML(drops);
  if(mode==='odai')judge(c);
}
$('undo').onclick=()=>{const id=hist.pop();if(id){drops[id]--;if(!drops[id])delete drops[id];update()}};
$('wash').onclick=()=>{drops={};hist=[];update()};
$('keep').onclick=()=>{const c=mix(drops);if(!c)return;saved.unshift({c,d:{...drops},n:nameOf(drops)});saved=saved.slice(0,24);persist();drawSaved()};
function drawSaved(){
  $('saved').innerHTML=saved.map((s,i)=>`<div class="sw" data-i="${i}"><div style="background:${s.c}"></div>${s.n}<br><span style="color:#6b7280;font-size:13px">${PAINTS.filter(p=>s.d[p.id]).map(p=>p.n+s.d[p.id]).join('+')}</span></div>`).join('')||'<div style="color:#6b7280;grid-column:1/-1">「この色を とっておく」で ここに ならぶよ</div>';
  $('saved').querySelectorAll('.sw').forEach(el=>el.onclick=()=>{if(confirm('この色を けしますか？')){saved.splice(+el.dataset.i,1);persist();drawSaved()}});
}

// おだい
const ODAI=[
 {n:'だいだい（オレンジ）',d:{red:1,yellow:1}},{n:'みどり',d:{yellow:1,blue:1}},{n:'むらさき',d:{red:1,blue:1}},
 {n:'ピンク',d:{red:1,white:3}},{n:'水色',d:{blue:1,white:4}},{n:'黄みどり',d:{yellow:3,blue:1}},
 {n:'赤むらさき',d:{red:2,blue:1}},{n:'はい色',d:{white:4,black:1}},{n:'こい みどり',d:{yellow:2,blue:2,black:1}},
 {n:'はだいろに ちかい 色',d:{white:4,red:1,yellow:1}},{n:'レモン色',d:{yellow:3,white:1}},{n:'こげ茶',d:{brown:3,black:1}},
 {n:'空の 色',d:{blue:1,white:2}},{n:'わかば色',d:{yg:2,white:1}},{n:'くり色',d:{red:1,yellow:1,blue:1,brown:1}}
];
let od=null,best=0;
function newOdai(){od=ODAI[Math.floor(Math.random()*ODAI.length)];best=0;$('target').style.background=mix(od.d);drops={};hist=[];$('msg').textContent='おだい：'+od.n;$('msg').style.color='#1f3a5f';update()}
function judge(c){
  if(!Object.keys(drops).length){$('bar').style.width='0';return}
  const d=dist(c,mix(od.d));const sc=Math.max(0,Math.round(100-d*2));
  $('bar').style.width=sc+'%';$('bar').style.background=sc>=90?'#2e8b57':sc>=70?'#e0a526':'#c8553d';
  $('msg').textContent=sc>=92?'🎉 ぴったり！ 色づくりの 名人！':sc>=80?'✨ おしい！ あと すこし':sc>=60?'いい かんじ。もう すこし まぜてみよう':'ちがう 色も ためしてみよう';
  $('msg').style.color=sc>=80?'#2e8b57':'#1f3a5f';
}
$('hint').onclick=()=>{const k=PAINTS.filter(p=>od.d[p.id]).map(p=>p.n);alert('つかう えのぐ：'+k.join('・')+'\n（どれを おおく するかは じぶんで ためしてね）')};
$('nextOdai').onclick=newOdai;

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  mode=t.dataset.t;$('freeView').classList.toggle('hide',mode!=='free');$('odaiView').classList.toggle('hide',mode!=='odai');
  if(mode==='odai')newOdai();else update();
}));
update();drawSaved();
})();
</script>
</body>
</html>
