<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はやさ ずかん</title>
<style>
:root{--bg:#f6f1e7;--navy:#1f3a5f;--ink:#2b2b2b;--sub:#6b6358;--line:#e3dccd;--acc:#e07a3f;--ok:#2e8b57;--ng:#c0392b;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:system-ui,"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.6}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
header a.back{color:var(--navy);text-decoration:none;font-weight:700;font-size:.9rem;padding:8px 12px;border-radius:var(--r);background:#eef2f7}
header h1{font-size:1.35rem;color:var(--navy)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
button{font-family:inherit;font-size:1.05rem;min-height:48px;padding:8px 14px;border-radius:var(--r);border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;cursor:pointer}
button.pri{background:var(--navy);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs button.on{background:var(--navy);color:#fff}
.lbl{font-size:.9rem;color:var(--sub);font-weight:700;margin-right:4px}
footer{text-align:center;color:var(--sub);font-size:.8rem;padding:24px 16px}
footer a{color:var(--navy)}
svg{width:100%;height:auto;display:block}
#prob{font-size:clamp(1.2rem,3vw,1.7rem);font-weight:700;line-height:1.7;margin-bottom:10px}
.ansRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:1.3rem;font-weight:700}
input.ans{font-size:1.8rem;width:6em;padding:6px 10px;border-radius:12px;border:3px solid var(--line);font-family:inherit;font-weight:800;text-align:right}
#fb{font-size:1.15rem;font-weight:700;min-height:2.4em;margin-top:10px}
.formula{background:#f3efe6;border-radius:12px;padding:10px 14px;font-size:1.05rem;margin-top:10px}
.cmpBtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.cmpBtns button{font-size:1.3rem;min-height:64px}
.hide{display:none!important}
.stat{font-size:.9rem;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<header><a class="back" href="../index.html">← MINATO WORKS</a><h1>はやさ ずかん</h1></header>
<main>
  <div class="card">
    <div class="row" style="margin-bottom:8px"><span class="lbl">あそびかた</span>
      <span class="tabs row" id="modeTabs"><button data-m="calc" class="on">ずで とく</button><button data-m="race">どっちが はやい？</button></span></div>
    <div class="row" id="typeRow"><span class="lbl">もとめるもの</span>
      <span class="tabs row" id="typeTabs"><button data-t="mix" class="on">まぜる</button><button data-t="v">はやさ</button><button data-t="d">みちのり</button><button data-t="t">じかん</button></span></div>
  </div>
  <div class="card">
    <div id="prob"></div>
    <svg id="svg" viewBox="0 0 1000 330"></svg>
    <div class="row" style="justify-content:center;margin-top:6px"><button id="playBtn">▶ うごかして みる</button></div>
    <div id="calcBox"><div class="ansRow"><span id="ansPre"></span><input class="ans" id="ans" inputmode="decimal" autocomplete="off"><span id="ansUnit"></span><button class="pri" id="okBtn">こたえる</button></div></div>
    <div id="raceBox" class="hide"><div class="cmpBtns"><button data-c="A">🐇 Aが はやい</button><button data-c="=">おなじ</button><button data-c="B">🐢 Bが はやい</button></div></div>
    <div id="fb"></div>
    <div id="formula" class="formula hide"></div>
    <div class="row" style="margin-top:10px"><button id="nextBtn">つぎの もんだい</button></div>
    <div class="stat" id="stat"></div>
  </div>
  <div class="card" style="font-size:.95rem;color:var(--sub)">
    <b style="color:var(--navy)">ずの 見かた</b>　上の せんが みちのり、下の せんが じかん。1めもり（1じかん・1ぷん・1びょう）ごとに すすむ みちのりが <b>はやさ</b>。はやさ ＝ 1めもり分の みちのり、みちのり ＝ はやさ × じかん。「はじき」を おぼえるより、ずで「1めもりで どれだけ？」と かんがえよう。
  </div>
</main>
<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525">https://note.com/minato_smile2525</a></footer>
<script>
const KEY='mw_教科_17_stat';
let stat={ok:0,all:0};try{const s=JSON.parse(localStorage.getItem(KEY));if(s)stat=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(stat));}catch(e){}}
const $=id=>document.getElementById(id);
const S={mode:'calc',type:'mix'};
let Q=null,answered=false,anim=null;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function num(x){return String(Math.round(x*1000)/1000);}
const KINDS=[
  {who:'🚗 じどうしゃ',dU:'km',tU:'じかん',tS:'時間',vU:'時速',vs:[40,45,50,60,70,80]},
  {who:'🚲 じてんしゃ',dU:'m',tU:'ふん',tS:'分',vU:'分速',vs:[150,180,200,240,250,300]},
  {who:'🏃 はしる 人',dU:'m',tU:'ふん',tS:'分',vU:'分速',vs:[120,150,160,180,200]},
  {who:'🐆 チーター',dU:'m',tU:'びょう',tS:'秒',vU:'秒速',vs:[20,25,28,30]},
  {who:'🚄 しんかんせん',dU:'km',tU:'じかん',tS:'時間',vU:'時速',vs:[200,240,250,270,300]},
];
function vText(k,v){return `${k.vU}${v}${k.dU}`;}
function genCalc(){
  const type=S.type==='mix'?pick(['v','d','t']):S.type;
  const k=pick(KINDS),v=pick(k.vs),t=rnd(2,6),d=v*t;
  let text,ans,pre,unit;
  if(type==='v'){text=`${k.who}が ${d}${k.dU} を ${t}${k.tS} で すすみました。<br>はやさは ${k.vU} 何${k.dU}ですか。`;ans=v;pre=k.vU;unit=k.dU;}
  else if(type==='d'){text=`${k.who}が ${vText(k,v)} で ${t}${k.tS} すすみました。<br>みちのりは 何${k.dU}ですか。`;ans=d;pre='';unit=k.dU;}
  else{text=`${k.who}が ${vText(k,v)} で ${d}${k.dU} すすみます。<br>何${k.tS} かかりますか。`;ans=t;pre='';unit=k.tS;}
  return {kind:'calc',type,k,v,t,d,text,ans,pre,unit};
}
function genRace(){
  // two runners, compare speed per unit (same unit)
  let a,b;
  const base=pick([[100,20],[150,30],[120,24],[200,40],[90,15],[180,36],[240,48]]);
  const vA=base[0]/base[1];
  // B: same or different speed
  const r=pick([1,1,0.8,0.9,1.2,1.25,0.75]);
  let vB=vA*r,tB=pick([10,12,15,20,25,30,40]),dB=vB*tB;
  if(Math.abs(dB-Math.round(dB))>1e-9){tB=base[1];dB=vB*tB;if(Math.abs(dB-Math.round(dB))>1e-9){vB=vA;dB=vA*tB;}}
  dB=Math.round(dB);vB=dB/tB;
  a={d:base[0],t:base[1],v:vA};b={d:dB,t:tB,v:vB};
  if(a.d===b.d&&a.t===b.t){b.t=b.t*2;b.d=b.d*2;}
  const text=`🐇 A は ${a.d}m を ${a.t}びょう、🐢 B は ${b.d}m を ${b.t}びょう で はしりました。<br>どちらが はやいかな？`;
  const ans=Math.abs(a.v-b.v)<1e-9?'=':(a.v>b.v?'A':'B');
  return {kind:'race',a,b,text,ans};
}
// ---- drawing ----
const X0=70,X1=930;
function drawCalc(showAll,progress){
  const q=Q,known=showAll?null:q.type;
  const tMax=Math.max(q.t,1),scale=(X1-X0)/tMax;
  const p=progress==null?1:progress; // 0..1 of full time
  let h='';
  // road/tape: segments per unit time
  h+=`<text x="10" y="40" font-size="20" font-weight="700" fill="#6b6358">みちのり</text>`;
  for(let i=0;i<q.t;i++){
    if(known==='t'&&i>0)break;
    const x=X0+i*scale,w=scale;const filled=p*q.t>i;
    const frac=Math.max(0,Math.min(1,p*q.t-i));
    h+=`<rect x="${x}" y="60" width="${w}" height="44" fill="#fff" stroke="#c9bfa9" stroke-width="2"/>`;
    if(filled)h+=`<rect x="${x}" y="60" width="${w*frac}" height="44" fill="${i%2?'#f7b27a':'#f4a261'}"/>`;
    const lab=(known==='v'&&!showAll)?'?':q.v+q.k.dU;
    if(frac>=1||showAll||progress==null)h+=`<text x="${x+w/2}" y="90" text-anchor="middle" font-size="${q.t>5?18:22}" font-weight="800" fill="#5b2c06">${(known==='t')?(i===0?lab:''):lab}</text>`;
  }
  if(known==='t'&&!showAll){ // unknown count of segments: show dashed rest
    h+=`<rect x="${X0}" y="60" width="${X1-X0}" height="44" fill="none" stroke="#e07a3f" stroke-width="3" stroke-dasharray="10 6"/>`;
  }
  // brace for total distance
  h+=`<path d="M${X0},125 v10 H${X1} v-10" fill="none" stroke="#1f3a5f" stroke-width="3"/>`;
  h+=`<text x="${(X0+X1)/2}" y="160" text-anchor="middle" font-size="26" font-weight="800" fill="#1f3a5f">ぜんぶで ${known==='d'?'□':q.d}${q.k.dU}</text>`;
  // double number line
  h+=`<line x1="${X0}" y1="215" x2="${X1+30}" y2="215" stroke="#2b2b2b" stroke-width="3"/><line x1="${X0}" y1="275" x2="${X1+30}" y2="275" stroke="#2b2b2b" stroke-width="3"/>`;
  h+=`<text x="10" y="222" font-size="18" font-weight="700" fill="#6b6358">みちのり</text><text x="10" y="282" font-size="18" font-weight="700" fill="#6b6358">じかん</text>`;
  const T=(x,top,bot,col)=>`<line x1="${x}" y1="203" x2="${x}" y2="287" stroke="${col}" stroke-width="3"/><text x="${x}" y="196" text-anchor="middle" font-size="22" font-weight="800" fill="${col}">${top}</text><text x="${x}" y="312" text-anchor="middle" font-size="22" font-weight="800" fill="${col}">${bot}</text>`;
  h+=T(X0,'0','0','#2b2b2b');
  const x1=X0+scale;
  h+=T(x1,known==='v'?'□':q.v,'1','#c9641b');
  if(q.t>1)h+=T(X1,known==='d'?'□':q.d,known==='t'?'□':q.t,'#1f3a5f');
  h+=`<text x="${X1+10}" y="312" font-size="18" fill="#6b6358">${q.k.tS}</text>`;
  // mover
  const mx=X0+p*(X1-X0);
  h+=`<text x="${mx}" y="52" text-anchor="middle" font-size="34">${q.k.who.split(' ')[0]}</text>`;
  $('svg').innerHTML=h;
}
function drawRace(pt){
  // pt: elapsed seconds
  const q=Q,maxD=Math.max(q.a.d,q.b.d),sc=(X1-X0)/maxD;
  let h='';
  const lane=(y,r,emoji,name)=>{
    const dist=pt==null?0:Math.min(r.d,r.v*pt);
    let s=`<rect x="${X0}" y="${y}" width="${r.d*sc}" height="60" rx="8" fill="#eef2f7" stroke="#b8c7d8"/>`;
    s+=`<line x1="${X0+r.d*sc}" y1="${y-6}" x2="${X0+r.d*sc}" y2="${y+66}" stroke="#c0392b" stroke-width="4"/>`;
    s+=`<text x="${X0+r.d*sc}" y="${y-12}" text-anchor="middle" font-size="20" font-weight="800" fill="#c0392b">${r.d}m</text>`;
    s+=`<text x="${X0-8}" y="${y+40}" text-anchor="end" font-size="26" font-weight="800">${name}</text>`;
    s+=`<text x="${X0+dist*sc}" y="${y+44}" text-anchor="middle" font-size="40">${emoji}</text>`;
    if(pt!=null){s+=`<text x="${X0+r.d*sc+10}" y="${y+40}" font-size="20" font-weight="700" fill="#1f3a5f">${Math.min(pt,r.t).toFixed(0)}秒</text>`;}
    return s;
  };
  h+=lane(40,q.a,'🐇','A');h+=lane(170,q.b,'🐢','B');
  if(pt!=null)h+=`<text x="500" y="310" text-anchor="middle" font-size="24" font-weight="800" fill="#1f3a5f">スタートから ${Math.min(pt,Math.max(q.a.t,q.b.t)).toFixed(0)}びょう</text>`;
  $('svg').innerHTML=h;
}
function stopAnim(){if(anim){cancelAnimationFrame(anim);anim=null;}}
function play(){
  stopAnim();const start=performance.now();
  if(Q.kind==='calc'){
    const dur=Math.min(6000,1200*Q.t);
    const step=now=>{const p=Math.min(1,(now-start)/dur);drawCalc(answered,p);if(p<1)anim=requestAnimationFrame(step);else anim=null;};
    anim=requestAnimationFrame(step);
  }else{
    const total=Math.max(Q.a.t,Q.b.t),dur=5000;
    const step=now=>{const pt=Math.min(total,(now-start)/dur*total);drawRace(pt);if(pt<total)anim=requestAnimationFrame(step);else anim=null;};
    anim=requestAnimationFrame(step);
  }
}
function newQ(){
  stopAnim();answered=false;$('fb').textContent='';$('formula').classList.add('hide');$('ans').value='';
  Q=S.mode==='calc'?genCalc():genRace();
  $('prob').innerHTML=Q.text;
  if(Q.kind==='calc'){$('ansPre').textContent=Q.pre;$('ansUnit').textContent=Q.unit;drawCalc(false,null);}
  else drawRace(null);
  showStat();
}
function judgeCalc(){
  if(answered)return;
  const raw=$('ans').value.trim().replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));if(!raw)return;
  const v=parseFloat(raw);if(isNaN(v))return;
  answered=true;stat.all++;const ok=Math.abs(v-Q.ans)<1e-6;if(ok)stat.ok++;save();
  $('fb').innerHTML=ok?'<span style="color:#2e8b57">⭕ せいかい！</span>':`<span style="color:#c0392b">❌ こたえは ${Q.pre}${Q.ans}${Q.unit}</span>`;
  const k=Q.k;let f;
  if(Q.type==='v')f=`1${k.tS}あたりの みちのりを もとめる<br>${Q.d}${k.dU} を ${Q.t}こに わける → ${Q.d} ÷ ${Q.t} ＝ ${Q.v}　（${vText(k,Q.v)}）`;
  else if(Q.type==='d')f=`1${k.tS}で ${Q.v}${k.dU} すすむのが ${Q.t}${k.tS}分<br>${Q.v} × ${Q.t} ＝ ${Q.d}（${k.dU}）`;
  else f=`${Q.d}${k.dU} の 中に、1${k.tS}分の ${Q.v}${k.dU} が いくつ 入るか<br>${Q.d} ÷ ${Q.v} ＝ ${Q.t}（${k.tS}）`;
  $('formula').innerHTML=f;$('formula').classList.remove('hide');
  drawCalc(true,null);showStat();
}
function judgeRace(c){
  if(answered)return;answered=true;stat.all++;const ok=c===Q.ans;if(ok)stat.ok++;save();
  const A=Q.a,B=Q.b;
  const nm={A:'🐇 A',B:'🐢 B','=':'おなじ'}[Q.ans];
  $('fb').innerHTML=(ok?'<span style="color:#2e8b57">⭕ せいかい！</span>':'<span style="color:#c0392b">❌ ざんねん</span>')+`　こたえ：${nm}`;
  $('formula').innerHTML=`1びょうあたりで くらべると<br>A：${A.d} ÷ ${A.t} ＝ 秒速${num(A.v)}m　／　B：${B.d} ÷ ${B.t} ＝ 秒速${num(B.v)}m<br><small>みちのりも じかんも ちがう ときは「1びょうで どれだけ すすむか」に そろえると くらべられるよ。▶で たしかめよう。</small>`;
  $('formula').classList.remove('hide');showStat();play();
}
function showStat(){$('stat').textContent=`せいかい ${stat.ok} / ${stat.all}`;}
$('okBtn').onclick=judgeCalc;$('ans').addEventListener('keydown',e=>{if(e.key==='Enter'){if(answered)newQ();else judgeCalc();}});
document.querySelectorAll('.cmpBtns button').forEach(b=>b.onclick=()=>judgeRace(b.dataset.c));
$('playBtn').onclick=play;$('nextBtn').onclick=newQ;
function tabs(id,attr,fn){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b.dataset[attr]);});}
tabs('modeTabs','m',v=>{S.mode=v;$('calcBox').classList.toggle('hide',v!=='calc');$('raceBox').classList.toggle('hide',v!=='race');$('typeRow').classList.toggle('hide',v!=='calc');newQ();});
tabs('typeTabs','t',v=>{S.type=v;newQ();});
newQ();
</script>
</body>
</html>
