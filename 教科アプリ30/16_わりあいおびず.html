<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わりあい おびず</title>
<style>
:root{--bg:#f6f1e7;--navy:#1f3a5f;--ink:#2b2b2b;--sub:#6b6358;--line:#e3dccd;--acc:#e07a3f;--ok:#2e8b57;--ng:#c0392b;--base:#7fb3e0;--cmp:#f4a261;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:system-ui,"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.6}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
header a.back{color:var(--navy);text-decoration:none;font-weight:700;font-size:.9rem;padding:8px 12px;border-radius:var(--r);background:#eef2f7}
header h1{font-size:1.35rem;color:var(--navy)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
button{font-family:inherit;font-size:1.05rem;min-height:48px;padding:8px 14px;border-radius:var(--r);border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;cursor:pointer}
button.pri{background:var(--navy);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs button.on{background:var(--navy);color:#fff}
.lbl{font-size:.9rem;color:var(--sub);font-weight:700;margin-right:4px}
footer{text-align:center;color:var(--sub);font-size:.8rem;padding:24px 16px}
footer a{color:var(--navy)}
svg{width:100%;height:auto;display:block}
#prob{font-size:clamp(1.2rem,3vw,1.7rem);font-weight:700;line-height:1.7;margin-bottom:10px}
#prob b.q{color:var(--acc)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag{padding:4px 12px;border-radius:999px;font-weight:700;font-size:.95rem}
.t-base{background:#dcebf8;color:#1f3a5f}.t-cmp{background:#fde6d2;color:#8a4a15}.t-rate{background:#e7e1f5;color:#4b3a7a}
.ansRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:1.3rem;font-weight:700}
input.ans{font-size:1.8rem;width:7em;padding:6px 10px;border-radius:12px;border:3px solid var(--line);font-family:inherit;font-weight:800;text-align:right}
#fb{font-size:1.15rem;font-weight:700;min-height:2.4em;margin-top:10px}
.formula{background:#f3efe6;border-radius:12px;padding:10px 14px;font-size:1.05rem;margin-top:10px}
input[type=range]{width:100%;height:40px}
.sl{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;font-weight:700;margin-bottom:6px}
@media(max-width:600px){.sl{grid-template-columns:1fr 90px}.sl input{grid-column:1/-1;grid-row:2}}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-top:10px}
.big3 div{background:#f3efe6;border-radius:12px;padding:10px}
.big3 b{display:block;font-size:2rem;color:var(--navy)}
.hide{display:none!important}
.stat{font-size:.9rem;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<header><a class="back" href="../index.html">← MINATO WORKS</a><h1>わりあい おびず</h1></header>
<main>
  <div class="card">
    <div class="row" style="margin-bottom:8px"><span class="lbl">あそびかた</span>
      <span class="tabs row" id="modeTabs"><button data-m="quiz" class="on">もんだい</button><button data-m="lab">ずで しらべる</button></span></div>
    <div class="row" id="typeRow"><span class="lbl">もとめるもの</span>
      <span class="tabs row" id="typeTabs"><button data-t="mix" class="on">まぜる</button><button data-t="rate">わりあい</button><button data-t="cmp">くらべる りょう</button><button data-t="base">もとにする りょう</button></span></div>
  </div>

  <div id="quizBox">
    <div class="card">
      <div id="prob"></div>
      <div class="tags" id="tags"></div>
      <button id="figBtn">ずを かく（ヒント）</button>
      <div id="fig" class="hide" style="margin-top:10px"><svg id="svg" viewBox="0 0 1000 300"></svg></div>
      <div class="ansRow"><span id="ansPre"></span><input class="ans" id="ans" inputmode="decimal" autocomplete="off"><span id="ansUnit"></span><button class="pri" id="okBtn">こたえる</button></div>
      <div id="fb"></div>
      <div id="formula" class="formula hide"></div>
      <div class="row" style="margin-top:10px"><button id="nextBtn">つぎの もんだい</button></div>
      <div class="stat" id="stat"></div>
    </div>
  </div>

  <div id="labBox" class="hide">
    <div class="card">
      <div class="sl"><span>もとにする りょう</span><input type="range" id="sB" min="10" max="200" step="10" value="80"><span id="vB"></span></div>
      <div class="sl"><span>わりあい</span><input type="range" id="sR" min="0" max="200" step="5" value="75"><span id="vR"></span></div>
      <svg id="svg2" viewBox="0 0 1000 300"></svg>
      <div class="big3"><div>小数<b id="d1"></b></div><div>百分率<b id="d2"></b></div><div>歩合<b id="d3"></b></div></div>
      <div class="formula" id="labF"></div>
    </div>
  </div>

  <div class="card" style="font-size:.95rem;color:var(--sub)">
    <b style="color:var(--navy)">おぼえかた</b>　<b>くらべる りょう ＝ もとにする りょう × わりあい</b>。もとにする りょうを「1（100%）」と見て、くらべる りょうが どれだけに あたるかが わりあい。<br>
    ずの 下の せんは わりあい、上の せんは りょう。0 と 0、1 と もとにする りょうが そろって いるよ。
  </div>
</main>
<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525">https://note.com/minato_smile2525</a></footer>
<script>
const KEY='mw_教科_16_stat';
let stat={ok:0,all:0};try{const s=JSON.parse(localStorage.getItem(KEY));if(s)stat=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(stat));}catch(e){}}
const $=id=>document.getElementById(id);
const S={mode:'quiz',type:'mix'};
let Q=null,answered=false;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function num(x){return String(Math.round(x*1000)/1000);}
function pct(r){return num(r*100)+'%';}
function buai(r){ // 歩合
  let n=Math.round(r*1000);const w=Math.floor(n/100),b=Math.floor(n%100/10),ri=n%10;
  let s='';if(w)s+=w+'割';if(b)s+=b+'分';if(ri)s+=ri+'厘';return s||'0割';
}
// contexts: base (もとにする量), cmp (くらべる量), unit, max ratio
const CTX=[
  {max:1,u:'回',t:(B,C)=>({base:`シュートを ${B}回 して`,cmp:`${C}回 入りました`,baseW:'シュートした 回数',cmpW:'入った 回数'})},
  {max:1,u:'ページ',t:(B,C)=>({base:`${B}ページの 本の うち`,cmp:`${C}ページ 読みました`,baseW:'本の ページ数',cmpW:'読んだ ページ数'})},
  {max:1.5,u:'人',t:(B,C)=>({base:`ていいん ${B}人の バスに`,cmp:`${C}人 のって います`,baseW:'ていいん',cmpW:'のって いる 人数'})},
  {max:1,u:'mL',t:(B,C)=>({base:`${B}mLの ジュースの うち`,cmp:`${C}mL のみました`,baseW:'ジュース ぜんぶ',cmpW:'のんだ りょう'})},
  {max:2,u:'人',t:(B,C)=>({base:`きのうの 見学者は ${B}人、`,cmp:`きょうは ${C}人 でした`,baseW:'きのうの 人数',cmpW:'きょうの 人数'})},
  {max:1,u:'m²',t:(B,C)=>({base:`${B}m²の 花だんの うち`,cmp:`${C}m² に チューリップを うえました`,baseW:'花だん ぜんぶ',cmpW:'チューリップの ところ'})},
];
const RATES=[0.1,0.2,0.25,0.3,0.4,0.45,0.5,0.6,0.65,0.7,0.75,0.8,0.85,0.9,0.35,0.15,1.2,1.25,1.5,1.4,1.6,1.8];
function gen(){
  const type=S.type==='mix'?pick(['rate','cmp','base']):S.type;
  const ctx=pick(CTX);
  const rates=RATES.filter(r=>r<=ctx.max);
  let r,B,C,tries=0;
  do{r=pick(rates);B=pick([20,25,40,50,60,80,120,150,200,240,300,400,500]);C=B*r;tries++;}
  while((Math.abs(C-Math.round(C))>1e-9||C===0)&&tries<200);
  C=Math.round(C);
  const w=ctx.t(B,C);
  const asPct=Math.random()<.5;
  let text,ans,pre='',unit='';
  const rs=asPct?pct(r):num(r);
  if(type==='rate'){
    text=`${w.base} ${w.cmp}。<br>${w.baseW}を もとに した、${w.cmpW}の わりあいを <b class="q">${asPct?'百分率':'小数'}</b>で もとめましょう。`;
    ans=asPct?r*100:r;unit=asPct?'%':'';pre='わりあい ＝';
  }else if(type==='cmp'){
    text=`${w.baseW}は ${B}${ctx.u} です。${w.cmpW}は、${w.baseW}の <b>${rs}</b> に あたります。<br>${w.cmpW}は 何${ctx.u}ですか。`;
    ans=C;unit=ctx.u;pre=w.cmpW+' ＝';
  }else{
    text=`${w.cmpW}は ${C}${ctx.u} で、これは ${w.baseW}の <b>${rs}</b> に あたります。<br>${w.baseW}は 何${ctx.u}ですか。`;
    ans=B;unit=ctx.u;pre=w.baseW+' ＝';
  }
  return {type,r,B,C,u:ctx.u,w,asPct,text,ans,pre,unit};
}
function fig(svg,B,C,r,unknown,u,labels){
  // double number line + tape
  const X0=80,X1=920;const maxR=Math.max(1,r)*1.08;const xr=v=>X0+v/maxR*(X1-X0);
  const x1=xr(1),xc=xr(r);
  const q=k=>unknown===k?'<tspan fill="#e07a3f">□</tspan>':'';
  let h='';
  // tapes
  h+=`<rect x="${X0}" y="40" width="${x1-X0}" height="46" rx="6" fill="#7fb3e0"/>`;
  h+=`<text x="${(X0+x1)/2}" y="71" text-anchor="middle" font-size="22" font-weight="800" fill="#10304f">${labels.baseW}</text>`;
  h+=`<rect x="${X0}" y="100" width="${Math.max(2,xc-X0)}" height="46" rx="6" fill="#f4a261"/>`;
  h+=`<text x="${X0+8}" y="131" font-size="22" font-weight="800" fill="#5b2c06">${labels.cmpW}</text>`;
  // top line (quantity)
  h+=`<line x1="${X0}" y1="190" x2="${X1+30}" y2="190" stroke="#2b2b2b" stroke-width="3"/>`;
  // bottom line (rate)
  h+=`<line x1="${X0}" y1="250" x2="${X1+30}" y2="250" stroke="#2b2b2b" stroke-width="3"/>`;
  h+=`<text x="10" y="197" font-size="20" fill="#6b6358" font-weight="700">りょう</text><text x="10" y="257" font-size="20" fill="#6b6358" font-weight="700">わりあい</text>`;
  const tick=(x,top,bot,col)=>`<line x1="${x}" y1="175" x2="${x}" y2="265" stroke="${col}" stroke-width="3" stroke-dasharray="${col==='#2b2b2b'?'':'6 5'}"/>`+
    `<text x="${x}" y="168" text-anchor="middle" font-size="24" font-weight="800" fill="${col}">${top}</text>`+
    `<text x="${x}" y="292" text-anchor="middle" font-size="24" font-weight="800" fill="${col}">${bot}</text>`;
  h+=tick(X0,'0','0','#2b2b2b');
  const bTop=unknown==='base'?'□':B+u,cTop=unknown==='cmp'?'□':C+u,rBot=unknown==='rate'?'□':num(r);
  if(Math.abs(xc-x1)<60){ // close: offset labels
    h+=tick(x1,bTop,'1','#1f5f99');h+=`<line x1="${xc}" y1="175" x2="${xc}" y2="265" stroke="#c9641b" stroke-width="3" stroke-dasharray="6 5"/>`;
    h+=`<text x="${xc+(xc>=x1?40:-40)}" y="220" text-anchor="middle" font-size="22" font-weight="800" fill="#c9641b">${cTop} / ${rBot}</text>`;
  }else{
    h+=tick(x1,bTop,'1','#1f5f99');h+=tick(xc,cTop,rBot,'#c9641b');
  }
  svg.innerHTML=h;
}
function newQ(){
  Q=gen();answered=false;$('ans').value='';$('fb').textContent='';$('formula').classList.add('hide');$('fig').classList.add('hide');
  $('prob').innerHTML=Q.text;$('ansPre').textContent=Q.pre;$('ansUnit').textContent=Q.unit;
  $('tags').innerHTML=`<span class="tag t-base">もとにする りょう：${Q.w.baseW}</span><span class="tag t-cmp">くらべる りょう：${Q.w.cmpW}</span>`;
  $('tags').classList.add('hide');
  fig($('svg'),Q.B,Q.C,Q.r,Q.type,Q.u,Q.w);showStat();
}
function judge(){
  if(answered||!Q)return;
  const raw=$('ans').value.trim().replace(/[％%]/g,'').replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  if(raw==='')return;
  const v=parseFloat(raw);if(isNaN(v)){$('fb').textContent='すうじで こたえてね';return;}
  answered=true;stat.all++;
  const ok=Math.abs(v-Q.ans)<1e-6;if(ok)stat.ok++;save();
  let t=ok?'<span style="color:#2e8b57">⭕ せいかい！</span>':`<span style="color:#c0392b">❌ こたえは ${num(Q.ans)}${Q.unit}</span>`;
  if(!ok&&Q.type==='rate'){if(Q.asPct&&Math.abs(v-Q.r)<1e-6)t+='　← 小数の ままだよ。100倍して %に。';if(!Q.asPct&&Math.abs(v-Q.r*100)<1e-6)t+='　← それは 百分率。小数に なおそう。';}
  const rev=(Q.type==='cmp'&&Math.abs(v-Q.B/Q.r)<1e-6)||(Q.type==='base'&&Math.abs(v-Q.C*Q.r)<1e-6)||(Q.type==='rate'&&(Math.abs(v-Q.B/Q.C)<1e-6||Math.abs(v-Q.B/Q.C*100)<1e-6));
  if(!ok&&rev)t+='　← かけ算と わり算、または もとにする りょうと くらべる りょうが ぎゃくかも？ ずで たしかめよう。';
  $('fb').innerHTML=t;
  const R=num(Q.r);
  let f='';
  if(Q.type==='rate')f=`わりあい ＝ くらべる りょう ÷ もとにする りょう<br>${Q.C} ÷ ${Q.B} ＝ ${R}`+(Q.asPct?`　→　${R} × 100 ＝ ${num(Q.r*100)}%`:'');
  else if(Q.type==='cmp')f=`くらべる りょう ＝ もとにする りょう × わりあい<br>${Q.B} × ${R} ＝ ${Q.C}`;
  else f=`もとにする りょう ＝ くらべる りょう ÷ わりあい<br>${Q.C} ÷ ${R} ＝ ${Q.B}`;
  f+=`<br><small>${R} ＝ ${pct(Q.r)} ＝ ${buai(Q.r)}</small>`;
  $('formula').innerHTML=f;$('formula').classList.remove('hide');$('fig').classList.remove('hide');$('tags').classList.remove('hide');
  fig($('svg'),Q.B,Q.C,Q.r,null,Q.u,Q.w);showStat();
}
function showStat(){$('stat').textContent=`せいかい ${stat.ok} / ${stat.all}`;}
$('okBtn').onclick=judge;$('ans').addEventListener('keydown',e=>{if(e.key==='Enter'){if(answered)newQ();else judge();}});
$('figBtn').onclick=()=>{$('fig').classList.remove('hide');$('tags').classList.remove('hide');};
$('nextBtn').onclick=newQ;
function lab(){
  const B=+$('sB').value,r=+$('sR').value/100,C=B*r;
  $('vB').textContent=B;$('vR').textContent=pct(r);
  fig($('svg2'),B,num(C),r,null,'',{baseW:'もとにする りょう',cmpW:'くらべる りょう'});
  $('d1').textContent=num(r);$('d2').textContent=pct(r);$('d3').textContent=buai(r);
  $('labF').innerHTML=`くらべる りょう ＝ ${B} × ${num(r)} ＝ <b>${num(C)}</b>`;
}
$('sB').oninput=lab;$('sR').oninput=lab;
function tabs(id,attr,fn){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b.dataset[attr]);});}
tabs('modeTabs','m',v=>{S.mode=v;$('quizBox').classList.toggle('hide',v!=='quiz');$('labBox').classList.toggle('hide',v!=='lab');$('typeRow').classList.toggle('hide',v!=='quiz');if(v==='lab')lab();});
tabs('typeTabs','t',v=>{S.type=v;newQ();});
newQ();
</script>
</body>
</html>
