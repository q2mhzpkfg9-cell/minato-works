<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>どうおんいぎご・どうくんいじ クイズ</title>
<style>
:root{--bg:#f6f1e7;--card:#fff;--navy:#1f3a5f;--ink:#2b2b2b;--sub:#6b665c;--line:#e3dccd;--r:14px;--ok:#2e8b57;--ng:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.7}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--navy);color:#fff}
header a{color:#fff;text-decoration:none;font-weight:bold;font-size:.95rem;padding:6px 12px;border:1px solid rgba(255,255,255,.5);border-radius:10px}
header h1{font-size:1.25rem;margin:0}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
h2{font-size:1.1rem;color:var(--navy);margin:0 0 10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs+.tabs{margin-top:8px}
.tabs button,.btn{font-family:inherit;font-size:1.05rem;font-weight:bold;min-height:52px;padding:8px 14px;border-radius:var(--r);border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.tabs button{flex:1;min-width:110px}
.tabs button.on,.btn.main{background:var(--navy);color:#fff}
.btn:disabled{opacity:.4}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:bold;color:var(--sub)}
.yomi{text-align:center;font-size:1.1rem;color:var(--sub);margin-top:10px}
.yomi b{font-size:1.6rem;color:var(--navy)}
.q{font-size:clamp(1.4rem,4.5vw,2.4rem);text-align:center;margin:8px 0 16px;line-height:1.8}
.blank{display:inline-block;min-width:3em;border-bottom:4px solid var(--navy);color:var(--navy);font-weight:bold}
.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.choices button{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(1.6rem,6vw,2.6rem);min-width:120px;min-height:80px;padding:6px 16px;border-radius:var(--r);border:3px solid var(--line);background:#fffdf8;cursor:pointer;color:var(--ink)}
.choices button.ok{border-color:var(--ok);background:#e5f5ec}
.choices button.ng{border-color:var(--ng);background:#fbe9e7}
.msg{min-height:3em;text-align:center;font-size:1.05rem;margin-top:12px}
.msg.ng{color:var(--ng);font-weight:bold}
.expl{display:inline-block;text-align:left;background:#f4f8f1;border-radius:10px;padding:8px 14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.grp{border:2px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fffdf8}
.grp h3{margin:0 0 4px;color:var(--navy)}
.grp .miss{color:var(--ng);font-size:.85rem}
.result{font-size:1.8rem;text-align:center;font-weight:bold;color:var(--navy)}
footer{text-align:center;font-size:.85rem;color:var(--sub);padding:20px 12px 30px}
footer a{color:var(--navy)}
</style>
</head>
<body>
<header><a href="../index.html">← MINATO WORKS</a><h1>どうおんいぎご・どうくんいじ クイズ</h1></header>
<main>
  <div class="card">
    <div class="tabs" id="grades">
      <button data-g="3" class="on">3・4年生</button>
      <button data-g="5">5・6年生</button>
      <button data-g="0">ぜんぶ</button>
    </div>
    <div class="tabs" id="modes">
      <button data-m="quiz" class="on">クイズ（10もん）</button>
      <button data-m="review">にがて ふくしゅう</button>
      <button data-m="list">いちらん</button>
    </div>
  </div>
  <div class="card" id="quiz">
    <div class="bar"><span id="count"></span><span id="score"></span></div>
    <div class="yomi" id="yomi"></div>
    <div class="q" id="q"></div>
    <div class="choices" id="choices"></div>
    <div class="msg" id="msg"></div>
    <div class="row"><button class="btn main" id="next" disabled>つぎへ ▶</button></div>
  </div>
  <div class="card" id="listCard" hidden>
    <h2>読みが同じで、意味がちがう言葉</h2>
    <p style="margin-top:0;font-size:.95rem">「同音異義語」…読みが同じ熟語（例：機会・機械）。「同訓異字」…訓読みが同じ漢字（例：暑い・熱い・厚い）。<br>まちがえた回数は この端末の中だけに ほぞんされます。</p>
    <div class="list" id="list"></div>
  </div>
</main>
<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525" target="_blank" rel="noopener">https://note.com/minato_smile2525</a></footer>
<script>
const KEY='mw_教科_06_';
function load(k,d){try{const v=localStorage.getItem(KEY+k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
// r:読み g:学年帯 w:{漢字:意味} q:[[文（＿が空らん）,答え]]
const G=[
 {r:"あつい",g:3,w:{"暑い":"気温が高い","熱い":"物の温度が高い","厚い":"はばが大きい・うすいの反対"},q:[["今日はとても＿ので、ぼうしをかぶる。","暑い"],["＿お茶をふうふうしてのむ。","熱い"],["＿本を二さつかりた。","厚い"]]},
 {r:"あける",g:3,w:{"開ける":"とじているものをひらく","明ける":"夜が終わって朝になる・年があらたまる","空ける":"中をからにする・間をつくる"},q:[["まどを＿て空気を入れかえる。","開け"],["夜が＿て、空が明るくなってきた。","明け"],["おとしよりのために席を＿。","空ける"]]},
 {r:"はかる",g:3,w:{"計る":"時間や数をかぞえる","測る":"長さ・高さ・深さなどをしらべる","量る":"重さやかさをしらべる"},q:[["五十メートル走のタイムを＿。","計る"],["ものさしで線の長さを＿。","測る"],["はかりで小麦粉の重さを＿。","量る"]]},
 {r:"はやい",g:3,w:{"早い":"時こくや時期がまえ","速い":"スピードがある"},q:[["朝＿時間に目がさめた。","早い"],["チーターは走るのがとても＿。","速い"]]},
 {r:"あう",g:3,w:{"会う":"人と人が顔をあわせる","合う":"ぴったりする・一つになる"},q:[["えきで友だちに＿。","会う"],["計算の答えが＿。","合う"]]},
 {r:"かえる",g:3,w:{"帰る":"もとの場所にもどる","返る":"もとのじょうたいにもどる・かえってくる","変える":"ちがうようすにする"},q:[["学校から家に＿。","帰る"],["わすれていたハンカチが手もとに＿。","返る"],["せきのならびかたを＿。","変える"]]},
 {r:"きかい",g:3,w:{"機会":"ちょうどよいとき・チャンス","機械":"動力で動くしかけ"},q:[["みんなの前で話す＿がある。","機会"],["工場の大きな＿が動いている。","機械"]]},
 {r:"いがい",g:3,w:{"以外":"それをのぞいたほか","意外":"思っていたこととちがう"},q:[["ぼく＿は、みんな犬が好きだ。","以外"],["テストの結果は＿なものだった。","意外"]]},
 {r:"かんしん",g:3,w:{"関心":"きょうみをもつこと","感心":"りっぱだと心を動かされること"},q:[["かんきょう問題に＿をもつ。","関心"],["弟のがんばりに＿した。","感心"]]},
 {r:"じしん",g:3,w:{"自信":"自分の力をしんじること","地震":"地面がゆれること","自身":"自分・そのもの"},q:[["練習したので、発表に＿がある。","自信"],["大きな＿にそなえてひなんくんれんをする。","地震"],["それは、わたし＿が決めたことだ。","自身"]]},
 {r:"しゅうかん",g:3,w:{"習慣":"いつもくりかえしていること","週間":"七日間を単位とした期間"},q:[["早ね早おきの＿をつける。","習慣"],["読書＿に本をたくさん読んだ。","週間"]]},
 {r:"ほけん",g:3,w:{"保健":"けんこうをたもつこと","保険":"事故などにそなえてお金をかけるしくみ"},q:[["けがをしたので＿室へ行く。","保健"],["家族で自動車の＿に入る。","保険"]]},
 {r:"きょうそう",g:3,w:{"競走":"走る速さをきそうこと","競争":"たがいに勝ち負けや優れていることをきそうこと"},q:[["運動会の徒＿で一位になった。","競走"],["二つのお店が安売り＿をしている。","競争"]]},
 {r:"とる",g:5,w:{"取る":"手にもつ・自分のものにする","採る":"えらんで集める・さいようする","捕る":"つかまえる","撮る":"写真やえいがをうつす"},q:[["たなの上の本を＿。","取る"],["森でこん虫の標本を＿。","採る"],["あみでセミを＿。","捕る"],["記念写真を＿。","撮る"]]},
 {r:"おさめる",g:5,w:{"納める":"お金や品物を受け取るところにわたす","収める":"中に入れる・よい結果をえる","治める":"国や世の中をしずめる","修める":"学問などを身につける"},q:[["決められた税金を＿。","納める"],["試合で勝利を＿。","収める"],["むかし、この国を＿た王様がいた。","治め"],["大学で学問を＿。","修める"]]},
 {r:"つとめる",g:5,w:{"努める":"力をつくす","勤める":"会社などではたらく","務める":"役目を受けもつ"},q:[["ろう下を走らないように＿。","努める"],["父は市役所に＿ている。","勤め"],["学級会の司会を＿。","務める"]]},
 {r:"うつす",g:5,w:{"写す":"文字や絵をそのとおりに書く・写真にとる","映す":"光で形をあらわす・スクリーンや鏡にうつす","移す":"場所や位置をかえる"},q:[["黒板の文をノートに＿。","写す"],["プロジェクターで画像をかべに＿。","映す"],["つくえをまどぎわに＿。","移す"]]},
 {r:"たいしょう",g:5,w:{"対象":"はたらきかける相手・目当て","対照":"くらべ合わせること・ちがいがはっきりしていること","対称":"つり合っていること（線対称など）"},q:[["小学生を＿にしたアンケート。","対象"],["明るい姉とおとなしい妹は＿的だ。","対照"],["この図形は左右＿だ。","対称"]]},
 {r:"かいとう",g:5,w:{"回答":"しつもんやアンケートに答えること","解答":"問題をといて答えること・その答え"},q:[["アンケートに＿する。","回答"],["算数の問題の＿を書く。","解答"]]},
 {r:"せいかく",g:5,w:{"正確":"正しくてまちがいがないこと","性格":"その人の心のもちかた・人がら"},q:[["時計が＿な時こくをさしている。","正確"],["兄はやさしい＿だ。","性格"]]},
 {r:"えいせい",g:5,w:{"衛星":"わく星のまわりを回る天体・人工衛星","衛生":"けんこうのために清けつにすること"},q:[["月は地球の＿だ。","衛星"],["手をあらって＿に気をつける。","衛生"]]},
 {r:"しめい",g:5,w:{"氏名":"名字と名前","指名":"名前をあげて指定すること","使命":"あたえられた大切な役目"},q:[["用紙に＿を書く。","氏名"],["先生に＿されて答えた。","指名"],["命を守ることが医者の＿だ。","使命"]]},
 {r:"こうせい",g:5,w:{"構成":"組み立てること・組み立て","公正":"かたよりがなく正しいこと","厚生":"くらしを健康でゆたかにすること"},q:[["作文の＿を考えてから書く。","構成"],["しんぱんは＿な判定をした。","公正"],["国の＿労働省の仕事を調べる。","厚生"]]},
 {r:"あらわす",g:5,w:{"表す":"気持ちや考えを外に出す・しめす","現す":"かくれていたものが見えるようにする","著す":"本を書いて世に出す"},q:[["感しゃの気持ちを言葉で＿。","表す"],["雲の間から月が姿を＿。","現す"],["研究の成果を本に＿。","著す"]]}
];
const ITEMS=[];G.forEach((g,gi)=>g.q.forEach(([s,a])=>ITEMS.push({gi,s,a})));
let grade=3,mode='quiz',qs=[],qi=0,score=0,answered=false,miss=false;
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const inGrade=it=>grade===0||G[it.gi].g===grade;
const keyOf=it=>G[it.gi].r+'|'+it.s;
// 答え（語幹）→ 選択肢の同じ形を作る：答えの語尾を各漢字の語尾に合わせる
function options(it){
  const g=G[it.gi],words=Object.keys(g.w);
  const base=words.find(w=>it.a.startsWith(w.replace(/[ぁ-ん]+$/,'')));
  let cp=0;while(cp<base.length&&base[cp]===it.a[cp])cp++;
  const cut=base.length-cp,add=it.a.slice(cp);
  return words.map(w=>({label:w.slice(0,w.length-cut)+add,word:w,ok:w===base}));
}
function start(){
  qi=0;score=0;$('quiz').hidden=mode==='list';$('listCard').hidden=mode!=='list';
  if(mode==='list'){renderList();return}
  let pool=ITEMS.filter(inGrade);
  if(mode==='review'){const m=load('miss',{});pool=pool.filter(it=>m[keyOf(it)]>0);
    if(!pool.length){$('count').textContent='';$('score').textContent='';$('yomi').textContent='';$('q').innerHTML='にがてな もんだいは ありません！<br><small>クイズで まちがえた もんだいが ここに たまるよ。</small>';$('choices').innerHTML='';$('msg').textContent='';$('next').disabled=true;return}}
  qs=shuffle(pool).slice(0,10);show();
}
function show(){
  answered=false;miss=false;$('next').disabled=true;$('msg').textContent='';$('msg').className='msg';
  $('count').textContent=(qi+1)+' / '+qs.length+'もん';$('score').textContent='せいかい '+score;
  const it=qs[qi],g=G[it.gi];
  $('yomi').innerHTML='よみ：<b>'+g.r+'</b>';
  $('q').innerHTML=it.s.replace('＿','<span class="blank">（　）</span>');
  $('choices').innerHTML='';
  shuffle(options(it)).forEach(o=>{const b=document.createElement('button');b.textContent=o.label;b.onclick=()=>judge(b,o);$('choices').appendChild(b)});
}
function judge(b,o){
  if(answered)return;const it=qs[qi],g=G[it.gi],m=load('miss',{}),k=keyOf(it);
  if(o.ok){answered=true;b.classList.add('ok');
    if(!miss){score++;if(m[k]){m[k]--;save('miss',m)}}
    $('score').textContent='せいかい '+score;
    $('q').innerHTML=it.s.replace('＿','<b style="color:var(--ok)">'+it.a+'</b>');
    $('msg').innerHTML='<div class="expl">'+Object.entries(g.w).map(([w,d])=>'<b>'+w+'</b>…'+d).join('<br>')+'</div>';
    $('next').disabled=false;
  }else{if(!miss){m[k]=(m[k]||0)+1;save('miss',m)}miss=true;b.classList.add('ng');$('msg').className='msg ng';$('msg').textContent='「'+o.word+'」は「'+g.w[o.word]+'」という いみ。ぶんに あうかな？'}
}
$('next').onclick=()=>{qi++;if(qi<qs.length)show();else{
  $('yomi').textContent='';$('q').innerHTML='<div class="result">'+qs.length+'もんちゅう '+score+'もん いっぱつ せいかい！</div>';
  $('choices').innerHTML='';const r=document.createElement('button');r.style.fontFamily='inherit';r.style.fontSize='1.3rem';r.textContent='もういちど';r.onclick=start;$('choices').appendChild(r);$('msg').textContent='';$('next').disabled=true}};
function renderList(){
  const m=load('miss',{});
  $('list').innerHTML=G.filter(g=>grade===0||g.g===grade).map(g=>{
    const miss=g.q.reduce((a,[s])=>a+(m[g.r+'|'+s]||0),0);
    return '<div class="grp"><h3>'+g.r+'</h3>'+Object.entries(g.w).map(([w,d])=>'<b>'+w+'</b>…'+d).join('<br>')+(miss?'<div class="miss">にがて ×'+miss+'</div>':'')+'</div>'}).join('');
}
function tabs(id,fn){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b);start()})}
tabs('grades',b=>grade=+b.dataset.g);tabs('modes',b=>mode=b.dataset.m);
start();
</script>
</body>
</html>
