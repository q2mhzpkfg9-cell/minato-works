<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おんどくカード</title>
<style>
:root{--bg:#f6f1e7;--card:#fff;--navy:#1f3a5f;--ink:#2b2b2b;--sub:#6b665c;--line:#e3dccd;--r:14px;--ok:#2e8b57;--ng:#c0392b;--pink:#e27a8f;--gold:#d9a21b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.7}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--navy);color:#fff}
header a{color:#fff;text-decoration:none;font-weight:bold;font-size:.95rem;padding:6px 12px;border:1px solid rgba(255,255,255,.5);border-radius:10px}
header h1{font-size:1.25rem;margin:0}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
h2{font-size:1.15rem;color:var(--navy);margin:0 0 10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button,.btn{font-family:inherit;font-size:1.05rem;font-weight:bold;min-height:52px;padding:8px 16px;border-radius:var(--r);border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.tabs button{flex:1;min-width:100px}
.tabs button.on,.btn.main{background:var(--navy);color:#fff}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.small{min-height:40px;font-size:.9rem;padding:4px 10px}
.btn:disabled{opacity:.4}
input,select{font-family:inherit;font-size:1.1rem;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fffdf8;min-height:48px;width:100%}
label{font-weight:bold;display:block;margin:8px 0 4px}
.grid2{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;align-items:end}
.watch{font-size:clamp(3rem,14vw,6rem);font-weight:bold;text-align:center;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.row .btn{min-width:140px;font-size:1.3rem;min-height:64px}
.check{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.ci{border:2px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.ci .opts{display:flex;gap:6px;justify-content:center;margin-top:6px}
.ci .opts button{font-size:1.5rem;width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;font-family:inherit}
.ci .opts button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.sign{display:flex;align-items:center;gap:10px;justify-content:center;font-size:1.15rem;margin:12px 0;font-weight:bold}
.sign input{width:32px;height:32px;min-height:0}
.msg{text-align:center;font-weight:bold;color:var(--ok);min-height:1.6em;font-size:1.1rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{min-height:58px;border-radius:10px;background:#faf6ee;padding:2px;font-size:.85rem}
.cal .h{min-height:auto;background:none;font-weight:bold;color:var(--sub)}
.cal .d{font-weight:bold}
.cal .st{font-size:1.3rem;line-height:1.1}
.cal .today{outline:3px solid var(--navy)}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.book{border:2px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.book h3{margin:0 0 4px;font-size:1.15rem;color:var(--navy);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.prog{height:16px;background:#eee6d6;border-radius:8px;overflow:hidden;margin:6px 0}
.prog div{height:100%;background:var(--pink)}
.hist{font-size:.9rem;color:var(--sub);max-height:180px;overflow:auto}
.hist table{border-collapse:collapse;width:100%}
.hist td{border-bottom:1px solid var(--line);padding:4px}
svg{width:100%;height:160px;background:#fffdf8;border-radius:10px}
.note{font-size:.85rem;color:var(--sub)}
footer{text-align:center;font-size:.85rem;color:var(--sub);padding:20px 12px 30px}
footer a{color:var(--navy)}
@media(max-width:560px){.grid2{grid-template-columns:1fr 1fr}.grid2>div:first-child{grid-column:1/3}}
@media print{header,.tabs,footer,.noprint{display:none}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<header><a href="../index.html">← MINATO WORKS</a><h1>おんどくカード</h1></header>
<main>
  <div class="card noprint">
    <div class="tabs" id="tabs">
      <button data-v="read" class="on">📖 よむ</button>
      <button data-v="cal">📅 カレンダー</button>
      <button data-v="rec">📈 きろく</button>
      <button data-v="set">⚙️ きょうざい</button>
    </div>
  </div>

  <section id="v-read">
    <div class="card">
      <label for="sel">よむ きょうざい</label>
      <select id="sel"></select>
      <div class="watch" id="watch">0:00</div>
      <div class="row">
        <button class="btn main" id="startBtn">▶ よみはじめ</button>
        <button class="btn pink" id="stopBtn" disabled>■ よみおわり</button>
      </div>
      <div class="row"><button class="btn small" id="quickBtn">じかんを はからずに「よんだ」だけ きろくする</button></div>
      <div class="check" id="check"></div>
      <label class="sign"><input type="checkbox" id="family"> おうちの人に きいてもらった</label>
      <div class="row"><button class="btn main" id="saveBtn" disabled>きろくする ✔</button></div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="card"><h2>きょうの おんどく</h2><div id="today"></div></div>
  </section>

  <section id="v-cal" hidden>
    <div class="card">
      <div class="calnav"><button class="btn small" id="prevM">◀</button><h2 id="calT" style="margin:0"></h2><button class="btn small" id="nextM">▶</button></div>
      <div class="cal" id="cal"></div>
      <p class="note">🌸＝よんだ日（かずは かいすう）　🏠＝おうちの人に きいてもらった</p>
      <div class="row noprint"><button class="btn small" onclick="print()">いんさつする</button></div>
    </div>
  </section>

  <section id="v-rec" hidden><div id="recList"></div></section>

  <section id="v-set" hidden>
    <div class="card">
      <h2>きょうざいを ふやす</h2>
      <div class="grid2">
        <div><label for="bt">だいめい</label><input id="bt" placeholder="れい：スイミー"></div>
        <div><label for="bc">もじすう<small>（わかれば）</small></label><input id="bc" type="number" min="0" inputmode="numeric"></div>
        <div><label for="bg">もくひょう かいすう</label><input id="bg" type="number" min="1" value="10" inputmode="numeric"></div>
      </div>
      <div class="row"><button class="btn main" id="addBtn">ついか</button></div>
      <p class="note">もじすうを いれると「1ぷんで なんもじ よめたか」も でるよ。<br>きろくは この たんまつの なかだけに ほぞんされます（そとには おくられません）。</p>
      <label for="nm">なまえ（なくても OK）</label><input id="nm" placeholder="なまえ">
    </div>
    <div class="card"><h2>きょうざい いちらん</h2><div id="bookList"></div></div>
  </section>
</main>
<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525" target="_blank" rel="noopener">https://note.com/minato_smile2525</a></footer>
<script>
const KEY='mw_教科_04_';
function load(k,d){try{const v=localStorage.getItem(KEY+k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
const $=id=>document.getElementById(id);
let books=load('books',[{id:'b1',t:'こくごの きょうかしょ',c:0,g:10}]);
let recs=load('recs',[]); // {d:'2026-09-22',b:id,s:秒 or null,chk:[..],f:bool,ts}
const CHK=[['こえの おおきさ','📢'],['はやさ','🐢'],['はっきり','👄']];
const MARK=['◎','○','△'];
let chk=[null,null,null],t0=0,timer=null,sec=null;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){save('books',books);save('recs',recs)}

function renderSel(){const cur=$('sel').value;$('sel').innerHTML=books.map(b=>'<option value="'+b.id+'">'+esc(b.t)+'</option>').join('');if(books.some(b=>b.id===cur))$('sel').value=cur}
function renderCheck(){
  $('check').innerHTML=CHK.map((c,i)=>'<div class="ci"><div>'+c[1]+' '+c[0]+'</div><div class="opts">'+MARK.map((m,j)=>'<button data-i="'+i+'" data-j="'+j+'" class="'+(chk[i]===j?'on':'')+'">'+m+'</button>').join('')+'</div></div>').join('');
  $('check').querySelectorAll('button').forEach(b=>b.onclick=()=>{chk[+b.dataset.i]=+b.dataset.j;renderCheck()});
}
$('startBtn').onclick=()=>{t0=Date.now();sec=null;$('startBtn').disabled=true;$('stopBtn').disabled=false;$('saveBtn').disabled=true;$('msg').textContent='';
  timer=setInterval(()=>{$('watch').textContent=fmt(Math.floor((Date.now()-t0)/1000))},250)};
$('stopBtn').onclick=()=>{clearInterval(timer);sec=Math.max(1,Math.round((Date.now()-t0)/1000));$('watch').textContent=fmt(sec);$('startBtn').disabled=false;$('stopBtn').disabled=true;$('saveBtn').disabled=false;
  const b=books.find(x=>x.id===$('sel').value);$('msg').textContent=(b&&b.c>0)?'1ぷんで やく '+Math.round(b.c/sec*60)+'もじ よめたよ':'よくできました！きろくしよう';};
$('quickBtn').onclick=()=>{sec=null;$('watch').textContent='—';$('saveBtn').disabled=false;$('msg').textContent='「きろくする」を おしてね'};
$('saveBtn').onclick=()=>{
  if(!books.length){alert('さきに きょうざいを ついかしてね');return}
  recs.push({d:today(),b:$('sel').value,s:sec,chk:chk.slice(),f:$('family').checked,ts:Date.now()});persist();
  const n=recs.filter(r=>r.b===$('sel').value).length;
  $('msg').textContent='🌸 きろくしたよ！ この きょうざいは '+n+'かいめ';
  chk=[null,null,null];$('family').checked=false;sec=null;$('saveBtn').disabled=true;$('watch').textContent='0:00';renderCheck();renderToday();
};
function bookName(id){const b=books.find(x=>x.id===id);return b?b.t:'（けした きょうざい）'}
function renderToday(){
  const list=recs.filter(r=>r.d===today());
  $('today').innerHTML=list.length?'<div class="hist"><table>'+list.map(r=>'<tr><td>'+esc(bookName(r.b))+'</td><td>'+(r.s?fmt(r.s):'—')+'</td><td>'+r.chk.map(x=>x==null?'':MARK[x]).join(' ')+'</td><td>'+(r.f?'🏠':'')+'</td></tr>').join('')+'</table></div><p><b>きょうは '+list.length+'かい よんだよ！</b></p>':'<p class="note">まだ よんでいないよ。</p>';
}
// カレンダー
let cy=new Date().getFullYear(),cm=new Date().getMonth();
function renderCal(){
  $('calT').textContent=cy+'ねん '+(cm+1)+'がつ';
  const first=new Date(cy,cm,1).getDay(),days=new Date(cy,cm+1,0).getDate();
  let h=['にち','げつ','か','すい','もく','きん','ど'].map(w=>'<div class="h">'+w+'</div>').join('');
  for(let i=0;i<first;i++)h+='<div></div>';
  const td=today();
  for(let d=1;d<=days;d++){
    const ds=cy+'-'+String(cm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const rs=recs.filter(r=>r.d===ds);
    h+='<div class="'+(ds===td?'today':'')+'"><div class="d">'+d+'</div>'+(rs.length?'<div class="st">🌸'+(rs.length>1?'<small>×'+rs.length+'</small>':'')+(rs.some(r=>r.f)?'🏠':'')+'</div>':'')+'</div>';
  }
  $('cal').innerHTML=h;
}
$('prevM').onclick=()=>{cm--;if(cm<0){cm=11;cy--}renderCal()};
$('nextM').onclick=()=>{cm++;if(cm>11){cm=0;cy++}renderCal()};
// きろく
function chart(rs){
  const pts=rs.filter(r=>r.s).slice(-15);if(pts.length<2)return '<p class="note">じかんを はかって 2かい いじょう よむと グラフが でるよ。</p>';
  const W=600,H=160,P=28,max=Math.max(...pts.map(r=>r.s)),min=Math.min(...pts.map(r=>r.s));
  const rng=Math.max(1,max-min),x=i=>P+i*(W-2*P)/(pts.length-1),y=s=>P/2+(s-min)/rng*(H-P*1.5);
  const path=pts.map((r,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(r.s).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="よんだ じかんの グラフ"><path d="'+path+'" fill="none" stroke="#e27a8f" stroke-width="3"/>'+pts.map((r,i)=>'<circle cx="'+x(i)+'" cy="'+y(r.s)+'" r="5" fill="#1f3a5f"/><text x="'+x(i)+'" y="'+(y(r.s)-9)+'" font-size="12" text-anchor="middle" fill="#6b665c">'+fmt(r.s)+'</text>').join('')+'</svg><p class="note">グラフが したに いくほど はやく よめているよ（はやければ よい わけでは ないので、はっきり よむことも たいせつ）。</p>';
}
function renderRec(){
  const nm=load('name','');
  $('recList').innerHTML=(nm?'<div class="card"><h2>'+esc(nm)+' さんの おんどく</h2>ぜんぶで '+recs.length+'かい よみました</div>':'<div class="card"><h2>ぜんぶで '+recs.length+'かい よみました</h2></div>')+books.map(b=>{
    const rs=recs.filter(r=>r.b===b.id),timed=rs.filter(r=>r.s),best=timed.length?Math.min(...timed.map(r=>r.s)):null;
    return '<div class="card book"><h3><span>'+esc(b.t)+'</span><span>'+rs.length+' / '+b.g+'かい</span></h3><div class="prog"><div style="width:'+Math.min(100,rs.length/b.g*100)+'%"></div></div>'+
      (rs.length>=b.g?'<b style="color:var(--pink)">🎉 もくひょう たっせい！</b>':'')+
      '<div>いちばん はやい きろく：'+(best?fmt(best)+(b.c?'（1ぷん やく'+Math.round(b.c/best*60)+'もじ）':''):'—')+'</div>'+chart(rs)+
      '<div class="hist"><table>'+rs.slice().reverse().map(r=>'<tr><td>'+r.d.slice(5).replace('-','/')+'</td><td>'+(r.s?fmt(r.s):'—')+'</td><td>'+r.chk.map(x=>x==null?'':MARK[x]).join(' ')+'</td><td>'+(r.f?'🏠':'')+'</td><td><button class="btn small" data-del="'+r.ts+'">けす</button></td></tr>').join('')+'</table></div></div>';
  }).join('');
  $('recList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('この きろくを けしますか？')){recs=recs.filter(r=>r.ts!=b.dataset.del);persist();renderRec()}});
}
// きょうざい
function renderBooks(){
  $('bookList').innerHTML=books.length?books.map(b=>'<div class="book"><h3><span>'+esc(b.t)+'</span><button class="btn small" data-rm="'+b.id+'">けす</button></h3><div class="note">もじすう '+(b.c||'—')+'　もくひょう '+b.g+'かい</div></div>').join(''):'<p class="note">きょうざいが ありません。</p>';
  $('bookList').querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{if(confirm('きょうざいを けしますか？（きろくは のこります）')){books=books.filter(b=>b.id!==x.dataset.rm);persist();renderBooks();renderSel()}});
}
$('addBtn').onclick=()=>{const t=$('bt').value.trim();if(!t){$('bt').focus();return}
  books.push({id:'b'+Date.now(),t,c:Math.max(0,parseInt($('bc').value)||0),g:Math.max(1,parseInt($('bg').value)||10)});persist();
  $('bt').value='';$('bc').value='';renderBooks();renderSel();$('sel').value=books[books.length-1].id};
$('nm').value=load('name','');$('nm').oninput=()=>save('name',$('nm').value.trim());
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  ['read','cal','rec','set'].forEach(v=>$('v-'+v).hidden=v!==b.dataset.v);
  if(b.dataset.v==='cal')renderCal();if(b.dataset.v==='rec')renderRec();if(b.dataset.v==='set')renderBooks();
});
renderSel();renderCheck();renderToday();
</script>
</body>
</html>
