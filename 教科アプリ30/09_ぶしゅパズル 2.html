<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぶしゅパズル</title>
<style>
:root{--bg:#f6f1e7;--card:#fff;--navy:#1f3a5f;--ink:#2b2b2b;--sub:#6b665c;--line:#e3dccd;--r:14px;--ok:#2e8b57;--ng:#c0392b;--bu:#d9822b;--gold:#d9a21b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.7}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--navy);color:#fff}
header a{color:#fff;text-decoration:none;font-weight:bold;font-size:.95rem;padding:6px 12px;border:1px solid rgba(255,255,255,.5);border-radius:10px}
header h1{font-size:1.25rem;margin:0}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
h2{font-size:1.1rem;color:var(--navy);margin:0 0 10px}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.stages button{font-family:inherit;border-radius:var(--r);border:2px solid var(--line);background:#fffdf8;padding:8px;cursor:pointer;min-height:76px;color:var(--ink)}
.stages button b{font-size:1.8rem;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;display:block;line-height:1.2}
.stages button.on{border-color:var(--navy);background:#e7eef8}
.stages button .c{font-size:.8rem;color:var(--sub)}
.stages button.clear .c{color:var(--gold);font-weight:bold}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:bold;color:var(--sub)}
.stage{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:10px 0}
.pile{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pc{width:clamp(56px,13vw,84px);height:clamp(56px,13vw,84px);font-size:clamp(2rem,7vw,3.2rem);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;border-radius:var(--r);border:3px solid var(--line);background:#fffdf8;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.pc.bu{color:var(--bu);border-color:#f0c9a0}
.pc.sel{border-color:var(--navy);background:#dde8f6;transform:scale(1.06)}
.pc.used{opacity:.35}
.pc.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mid{text-align:center}
.box{width:clamp(90px,22vw,150px);height:clamp(90px,22vw,150px);border:4px dashed var(--navy);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:clamp(3.4rem,13vw,6rem);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--navy);background:#fff}
.box.hit{border-style:solid;border-color:var(--ok);color:var(--ok);background:#e5f5ec}
.lbl{font-size:.85rem;color:var(--sub);font-weight:bold;text-align:center;margin-bottom:4px}
.msg{min-height:2.6em;text-align:center;font-size:1.15rem;font-weight:bold}
.msg.ok{color:var(--ok)}.msg.ng{color:var(--ng)}
.found{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fk{border:2px solid var(--line);border-radius:12px;padding:4px 10px;text-align:center;min-width:76px;background:#fffdf8}
.fk b{font-size:2rem;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;display:block;line-height:1.2}
.fk small{font-size:.75rem;color:var(--sub)}
.fk.q b{color:#ccc}
.btn{font-family:inherit;font-size:1rem;font-weight:bold;min-height:48px;padding:6px 16px;border-radius:var(--r);border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
footer{text-align:center;font-size:.85rem;color:var(--sub);padding:20px 12px 30px}
footer a{color:var(--navy)}
@media(max-width:600px){.stage{grid-template-columns:1fr}.mid{order:-1;display:flex;justify-content:center}}
</style>
</head>
<body>
<header><a href="../index.html">← MINATO WORKS</a><h1>ぶしゅパズル</h1></header>
<main>
  <div class="card">
    <h2>ぶしゅを えらぼう</h2>
    <div class="stages" id="stages"></div>
  </div>
  <div class="card">
    <div class="bar"><span id="title"></span><span id="prog"></span></div>
    <div class="stage">
      <div><div class="lbl">ぶしゅ</div><div class="pile" id="buPile"></div></div>
      <div class="mid"><div class="box" id="box">？</div></div>
      <div><div class="lbl">もう ひとつの ぶぶん</div><div class="pile" id="ptPile"></div></div>
    </div>
    <div class="msg" id="msg">ぶしゅと ぶぶんを 1つずつ タップして、かんじを つくろう！</div>
    <h2 style="margin-top:10px">みつけた かんじ</h2>
    <div class="found" id="found"></div>
    <div class="row"><button class="btn" id="hintBtn">ヒント</button><button class="btn" id="resetBtn">この ステージを リセット</button></div>
  </div>
</main>
<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525" target="_blank" rel="noopener">https://note.com/minato_smile2525</a></footer>
<script>
const KEY='mw_教科_09_';
function load(k,d){try{const v=localStorage.getItem(KEY+k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
const $=id=>document.getElementById(id);
// 部首：記号, 名前, 位置, [漢字, もう一つの部分, 読み, 配当学年]
const BU={
 "氵":{n:"さんずい",m:"水に かんけい",k:[["海","毎","うみ",2],["池","也","いけ",2],["活","舌","カツ",2],["湖","胡","みずうみ",3],["洋","羊","ヨウ",3],["波","皮","なみ",3],["注","主","そそぐ",3],["油","由","あぶら",3],["泳","永","およぐ",3],["清","青","きよい",4]]},
 "亻":{n:"にんべん",m:"人に かんけい",k:[["休","木","やすむ",1],["体","本","からだ",2],["何","可","なに",2],["住","主","すむ",3],["仕","士","シ",3],["使","吏","つかう",3],["係","系","かかり",3],["化","匕","ばける",3],["位","立","くらい",4],["信","言","シン",4]]},
 "木":{n:"きへん",m:"木に かんけい",k:[["林","木","はやし",1],["村","寸","むら",1],["校","交","コウ",1],["板","反","いた",3],["柱","主","はしら",3],["横","黄","よこ",3],["植","直","うえる",3],["松","公","まつ",4]]},
 "日":{n:"ひへん",m:"太陽・時間に かんけい",k:[["明","月","あかるい",2],["時","寺","とき",2],["晴","青","はれる",2],["暗","音","くらい",3],["映","央","うつる",6]]},
 "言":{n:"ごんべん",m:"ことばに かんけい",k:[["話","舌","はなす",2],["語","吾","ゴ",2],["読","売","よむ",2],["記","己","キ",2],["計","十","はかる",2],["詩","寺","シ",3],["談","炎","ダン",3],["調","周","しらべる",3],["課","果","カ",4]]},
 "糸":{n:"いとへん",m:"糸・ぬのに かんけい",k:[["紙","氏","かみ",2],["組","且","くむ",2],["絵","会","エ",2],["線","泉","セン",2],["細","田","ほそい",2],["級","及","キュウ",3],["結","吉","むすぶ",4],["給","合","キュウ",4],["紀","己","キ",5]]},
 "扌":{n:"てへん",m:"手の うごきに かんけい",k:[["持","寺","もつ",3],["指","旨","ゆび",3],["打","丁","うつ",3],["投","殳","なげる",3],["拾","合","ひろう",3],["技","支","わざ",5]]},
 "金":{n:"かねへん",m:"金ぞくに かんけい",k:[["銀","艮","ギン",3],["鉄","失","テツ",3],["鏡","竟","かがみ",4],["鉱","広","コウ",5]]},
 "艹":{n:"くさかんむり",m:"草・植物に かんけい",top:1,k:[["花","化","はな",1],["草","早","くさ",1],["薬","楽","くすり",3],["苦","古","くるしい",3],["英","央","エイ",4],["芽","牙","め",4]]},
 "宀":{n:"うかんむり",m:"家・たてものに かんけい",top:1,k:[["字","子","ジ",1],["家","豕","いえ",2],["室","至","シツ",2],["安","女","やすい",3],["守","寸","まもる",3],["客","各","キャク",3],["宮","呂","みや",3],["宝","玉","たから",6]]},
 "⺮":{n:"たけかんむり",m:"竹に かんけい",top:1,k:[["答","合","こたえ",2],["箱","相","はこ",3],["笛","由","ふえ",3],["等","寺","ひとしい",3],["筆","聿","ふで",3],["管","官","くだ",4],["節","即","ふし",4]]}
};
// 全組み合わせ辞書（ミックスで ほかの部首との組み合わせも せいかいに）
const DICT={};for(const b in BU)BU[b].k.forEach(([kj,p,y,g])=>DICT[b+'|'+p]={kj,y,g,b});
// ほかにも できる かんじ（ステージの もくひょう外。まちがいに しない）
const EXTRA={};"氵可河 亻也他 木艮根 亻反仮 氵十汁 扌及扱 氵及汲 木支枝 氵殳没 言殳設 氵立泣 氵炎淡 言青請 糸交絞 言永詠 木由柚 言主註 扌皮披 亻直値 艹田苗 言吉詰 言公訟 艹果菓 木寺持".split(' ').forEach(w=>{if(w[2]!=='持')EXTRA[w[0]+'|'+w[1]]=w[2]});
const STAGES=[...Object.keys(BU).map(b=>({id:b,bus:[b]})),{id:'mixA',bus:["氵","木","言"],name:"ミックス①"},{id:'mixB',bus:["亻","糸","扌"],name:"ミックス②"},{id:'mixC',bus:["艹","宀","⺮"],name:"ミックス③"}];
let st=STAGES[0],selB=null,selP=null,found=load('found',{});
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const targets=s=>s.bus.flatMap(b=>BU[b].k.map(k=>({b,kj:k[0],p:k[1],y:k[2],g:k[3]})));
let parts=[];
function renderStages(){
  $('stages').innerHTML=STAGES.map(s=>{const t=targets(s),f=t.filter(x=>found[x.kj]).length;
    return '<button data-id="'+s.id+'" class="'+(s===st?'on ':'')+(f===t.length?'clear':'')+'"><b>'+(s.name?s.bus.join(''):s.id)+'</b>'+(s.name||BU[s.id].n)+'<div class="c">'+(f===t.length?'★ クリア':f+' / '+t.length)+'</div></button>'}).join('');
  $('stages').querySelectorAll('button').forEach(b=>b.onclick=()=>{st=STAGES.find(s=>s.id===b.dataset.id);open()});
}
function open(){
  selB=selP=null;
  // 部分カード：正解の部分（重複なし）＋ ダミー2まい
  const need=[...new Set(targets(st).map(t=>t.p))];
  const pool=[...new Set(Object.values(BU).flatMap(x=>x.k.map(k=>k[1])))].filter(p=>!need.includes(p)&&!st.bus.some(b=>DICT[b+'|'+p]||EXTRA[b+'|'+p]));
  parts=shuffle(need.concat(shuffle(pool).slice(0,2)));
  $('title').textContent=st.name?st.name+'（'+st.bus.map(b=>BU[b].n).join('・')+'）':BU[st.id].n+'（'+BU[st.id].m+'）';
  $('box').textContent='？';$('box').className='box';$('msg').className='msg';$('msg').textContent='ぶしゅと ぶぶんを 1つずつ タップして、かんじを つくろう！';
  renderPiles();renderFound();renderStages();
}
function renderPiles(){
  $('buPile').innerHTML=st.bus.map(b=>'<button class="pc bu'+(selB===b?' sel':'')+'" data-b="'+b+'" aria-label="'+BU[b].n+'">'+b+'</button>').join('');
  $('ptPile').innerHTML=parts.map((p,i)=>{const done=st.bus.every(b=>!DICT[b+'|'+p]||found[DICT[b+'|'+p].kj]);return '<button class="pc'+(selP===i?' sel':'')+(done&&st.bus.some(b=>DICT[b+'|'+p])?' used':'')+'" data-i="'+i+'">'+p+'</button>'}).join('');
  $('buPile').querySelectorAll('button').forEach(x=>x.onclick=()=>{selB=x.dataset.b;renderPiles();tryMake()});
  $('ptPile').querySelectorAll('button').forEach(x=>x.onclick=()=>{selP=+x.dataset.i;renderPiles();tryMake()});
}
function tryMake(){
  if(selB==null||selP==null){$('box').textContent=selB||parts[selP]||'？';return}
  const p=parts[selP],hit=DICT[selB+'|'+p];
  if(hit){
    const isNew=!found[hit.kj];found[hit.kj]=1;save('found',found);
    $('box').textContent=hit.kj;$('box').className='box hit';
    $('msg').className='msg ok';$('msg').textContent=(isNew?'できた！':'もう みつけたよ。')+'「'+hit.kj+'」（'+hit.y+'）'+hit.g+'年生で ならう かんじ';
    const t=targets(st);if(isNew&&t.every(x=>found[x.kj]))$('msg').textContent+='　🎉 ステージ クリア！';
  }else if(EXTRA[selB+'|'+p]){
    $('box').textContent=EXTRA[selB+'|'+p];$('box').className='box';
    $('msg').className='msg';$('msg').textContent='「'+EXTRA[selB+'|'+p]+'」も かんじだね！ でも この ステージの もくひょうでは ないよ。';
  }else{
    $('box').textContent='？';$('box').className='box';
    $('msg').className='msg ng';$('msg').textContent=selB+' と '+p+' では かんじに ならないよ。';
    const el=$('ptPile').querySelector('[data-i="'+selP+'"]');el&&el.classList.add('shake');
  }
  selB=selP=null;setTimeout(()=>{renderPiles()},350);renderFound();renderStages();
}
function renderFound(){
  const t=targets(st);$('prog').textContent=t.filter(x=>found[x.kj]).length+' / '+t.length+' こ';
  $('found').innerHTML=t.map(x=>found[x.kj]?'<div class="fk"><b>'+x.kj+'</b><small>'+x.y+'（'+x.g+'年）</small></div>':'<div class="fk q"><b>？</b><small>'+BU[x.b].n+'</small></div>').join('');
}
$('hintBtn').onclick=()=>{const t=targets(st).filter(x=>!found[x.kj]);if(!t.length){$('msg').textContent='ぜんぶ みつけたよ！';return}const x=t[Math.floor(Math.random()*t.length)];$('msg').className='msg';$('msg').textContent='ヒント：「'+x.y+'」と よむ かんじ。'+(BU[x.b].top?'うえ':'ひだり')+'に '+BU[x.b].n+'。'};
$('resetBtn').onclick=()=>{if(!confirm('この ステージの きろくを けしますか？'))return;targets(st).forEach(x=>delete found[x.kj]);save('found',found);open()};
open();
</script>
</body>
</html>
