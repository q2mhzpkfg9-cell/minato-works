<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しょくぶつの かんさつカード</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f6f1e7;color:#1f2a37;font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","BIZ UDPGothic","Meiryo",sans-serif;font-size:19px;line-height:1.6}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#1f3a5f;color:#fff}
header a.back{color:#fff;text-decoration:none;font-size:15px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:14px}
header h1{margin:0;font-size:clamp(20px,3.4vw,30px);letter-spacing:.05em}
main{max-width:1180px;margin:0 auto;padding:14px 16px 30px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(31,58,95,.08);margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab,.btn{border:2px solid #1f3a5f;background:#fff;color:#1f3a5f;border-radius:14px;padding:8px 16px;font-size:18px;font-family:inherit;cursor:pointer;min-height:48px}
.tab.on,.btn.on{background:#1f3a5f;color:#fff}
.btn.main{background:#e0a526;border-color:#e0a526;color:#fff;font-weight:bold}
.btn.warn{border-color:#c8553d;color:#c8553d}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
label.f{font-weight:bold;color:#1f3a5f;display:block;margin-top:10px}
input[type=text],input[type=date],input[type=number],textarea,select{font-family:inherit;font-size:19px;border:2px solid #cfd8e6;border-radius:14px;padding:8px 12px;background:#fff;max-width:100%}
textarea{width:100%;min-height:110px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.pad{border:3px solid #cfd8e6;border-radius:14px;background:#fff;touch-action:none;width:100%;height:auto;display:block}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.col{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cfd8e6;cursor:pointer}
.col.on{box-shadow:0 0 0 4px #1f3a5f}
.weather button{font-size:28px;min-width:60px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px dashed #e0a526;background:#fff6df;color:#7a4b00;border-radius:999px;padding:4px 12px;font-size:16px;font-family:inherit;cursor:pointer}
.plants{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rec{border:2px solid #cfd8e6;border-radius:14px;padding:10px;background:#fffdf8}
.rec img{width:100%;border-radius:10px;border:1px solid #eee;background:#fff}
.rec .d{font-weight:bold;color:#1f3a5f}
.rec .memo{white-space:pre-wrap;font-size:16px}
.note{font-size:14px;color:#6b7280}
svg{width:100%;height:auto;background:#fbf7ee;border-radius:14px}
.hide{display:none}
footer{text-align:center;font-size:13px;color:#6b7280;padding:16px}
footer a{color:#1f3a5f}
@media print{header,.tabs,footer,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}.rec{break-inside:avoid}}
</style>
</head>
<body>
<header><a class="back" href="../index.html">← MINATO WORKS</a><h1>🌱 しょくぶつの かんさつカード</h1></header>
<main>
  <div class="card noprint">
    <div class="row"><b>なまえ</b><input type="text" id="who" placeholder="なまえ（かかなくても よい）" style="width:220px">
      <b>そだてる しょくぶつ</b><select id="plant"></select><button class="btn" id="addPlant">＋ ほかの しょくぶつ</button></div>
    <div class="note">きろくは この たんまつの 中だけに ほぞんされます（インターネットには おくりません）。</div>
  </div>
  <div class="tabs">
    <button class="tab on" data-t="write">かく</button>
    <button class="tab" data-t="book">カードを 見る</button>
    <button class="tab" data-t="graph">せの たかさ グラフ</button>
  </div>

  <section id="write">
    <div class="grid2">
      <div class="card">
        <div class="row"><b>え を かこう</b></div>
        <canvas id="pad" class="pad" width="480" height="360"></canvas>
        <div class="row colors" id="colors"></div>
        <div class="row"><button class="btn on" id="thin">ほそい</button><button class="btn" id="thick">ふとい</button><button class="btn" id="eraser">けしゴム</button><button class="btn warn" id="clearPad">ぜんぶ けす</button></div>
      </div>
      <div class="card">
        <div class="row"><b>ひにち</b><input type="date" id="date"></div>
        <div class="row weather" id="weather"></div>
        <div class="row"><b>せの たかさ</b><input type="number" id="h" min="0" max="500" step="0.5" style="width:110px"> cm
          <b>はっぱ</b><input type="number" id="leaf" min="0" max="999" style="width:90px"> まい</div>
        <div class="row"><b>ようす</b><span class="chips" id="stage"></span></div>
        <label class="f" for="memo">きづいたこと</label>
        <div class="note">みる・さわる・においを かぐ・くらべる。ことばを タップすると かきだしが はいるよ。</div>
        <div class="chips" id="hints" style="margin:6px 0"></div>
        <textarea id="memo" placeholder="はっぱが まえより 大きくなって いた。さわると ざらざら して いた。"></textarea>
        <div class="row"><button class="btn main" id="saveBtn">カードを ほぞん</button><span id="saved" class="note"></span></div>
      </div>
    </div>
  </section>

  <section id="book" class="hide">
    <div class="card">
      <div class="row noprint"><button class="btn" id="printBtn">いんさつ</button><span class="note">カードを タップすると けせます。</span></div>
      <h2 id="bookTitle" style="margin:4px 0;color:#1f3a5f"></h2>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <section id="graph" class="hide">
    <div class="card">
      <div id="gTitle" style="font-weight:bold;color:#1f3a5f"></div>
      <svg id="gsv" viewBox="0 0 700 360"></svg>
      <div class="note" id="gNote"></div>
    </div>
  </section>
</main>
<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525">https://note.com/minato_smile2525</a></footer>

<script>
(function(){
const $=id=>document.getElementById(id);
const KEY='mw_教科_24_data';
const DEF_PLANTS=['あさがお','ミニトマト','ひまわり','ホウセンカ','ピーマン','オクラ','えだまめ','チューリップ','ヒヤシンス'];
let data={who:'',plant:'あさがお',plants:DEF_PLANTS.slice(),recs:[]};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d)data=Object.assign(data,d)}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('ほぞんできる りょうが いっぱいです。ふるい カードを けしてね。');return false}}

// しょくぶつ
function drawPlants(){
  $('plant').innerHTML=data.plants.map(p=>`<option${p===data.plant?' selected':''}>${p}</option>`).join('');
}
$('plant').onchange=()=>{data.plant=$('plant').value;persist();refresh()};
$('addPlant').onclick=()=>{const n=prompt('しょくぶつの なまえ');if(n&&n.trim()){const t=n.trim().slice(0,20);if(!data.plants.includes(t))data.plants.push(t);data.plant=t;persist();drawPlants();refresh()}};
$('who').value=data.who;$('who').oninput=()=>{data.who=$('who').value.slice(0,20);persist()};

// おえかき
const pad=$('pad'),ctx=pad.getContext('2d');
function blank(){ctx.fillStyle='#fff';ctx.fillRect(0,0,pad.width,pad.height)}
blank();
const COLORS=['#222','#7a4b1e','#2e8b57','#8bc34a','#e53935','#ff9800','#fdd835','#1e88e5','#8e24aa','#ec407a'];
let color='#222',size=4,erase=false;
$('colors').innerHTML=COLORS.map(c=>`<span class="col${c===color?' on':''}" data-c="${c}" style="background:${c}"></span>`).join('');
$('colors').querySelectorAll('.col').forEach(el=>el.onclick=()=>{color=el.dataset.c;erase=false;$('eraser').classList.remove('on');$('colors').querySelectorAll('.col').forEach(x=>x.classList.toggle('on',x===el))});
$('thin').onclick=()=>{size=4;$('thin').classList.add('on');$('thick').classList.remove('on')};
$('thick').onclick=()=>{size=12;$('thick').classList.add('on');$('thin').classList.remove('on')};
$('eraser').onclick=()=>{erase=!erase;$('eraser').classList.toggle('on',erase)};
$('clearPad').onclick=()=>{if(confirm('えを ぜんぶ けしますか？'))blank()};
let drawing=false,last=null,dirty=false;
function pos(e){const r=pad.getBoundingClientRect();return[(e.clientX-r.left)*pad.width/r.width,(e.clientY-r.top)*pad.height/r.height]}
pad.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);pad.setPointerCapture(e.pointerId);dot(last)});
pad.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);line(last,p);last=p});
['pointerup','pointercancel','pointerleave'].forEach(t=>pad.addEventListener(t,()=>{drawing=false}));
function style(){ctx.strokeStyle=erase?'#fff':color;ctx.fillStyle=erase?'#fff':color;ctx.lineWidth=erase?24:size;ctx.lineCap='round';ctx.lineJoin='round'}
function dot(p){style();ctx.beginPath();ctx.arc(p[0],p[1],ctx.lineWidth/2,0,Math.PI*2);ctx.fill();dirty=true}
function line(a,b){style();ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();dirty=true}

// てんき・ようす・ヒント
const W=[['☀️','はれ'],['⛅','くもり'],['☔','あめ']];
let weather='はれ';
function drawW(){$('weather').innerHTML='<b>てんき</b>'+W.map(([i,t])=>`<button class="btn${t===weather?' on':''}" data-w="${t}" title="${t}">${i}</button>`).join('');
  $('weather').querySelectorAll('button').forEach(b=>b.onclick=()=>{weather=b.dataset.w;drawW()})}
drawW();
const STAGES=['たねまき','め が でた','ふたば','ほんば','つる・くき が のびた','つぼみ','はな が さいた','み が できた','たね が できた','かれた'];
let stage='';
function drawS(){$('stage').innerHTML=STAGES.map(s=>`<button class="chip" style="${s===stage?'background:#1f3a5f;color:#fff;border-style:solid':''}" data-s="${s}">${s}</button>`).join('');
  $('stage').querySelectorAll('button').forEach(b=>b.onclick=()=>{stage=stage===b.dataset.s?'':b.dataset.s;drawS()})}
drawS();
const HINTS=['いろは','かたちは','大きさは','さわると','においは','まえと くらべて','ふしぎに おもったのは','これから'];
$('hints').innerHTML=HINTS.map(h=>`<button class="chip">${h}</button>`).join('');
$('hints').querySelectorAll('button').forEach(b=>b.onclick=()=>{const m=$('memo');m.value+=(m.value&&!m.value.endsWith('\n')?'\n':'')+b.textContent+'、';m.focus()});

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
$('date').value=today();

$('saveBtn').onclick=()=>{
  const memo=$('memo').value.trim();
  if(!memo&&!dirty&&!$('h').value){$('saved').textContent='え か きづいたことを かいてね';return}
  // ちいさく して ほぞん
  const sm=document.createElement('canvas');sm.width=320;sm.height=240;sm.getContext('2d').drawImage(pad,0,0,320,240);
  const img=dirty?sm.toDataURL('image/jpeg',0.7):'';
  const r={id:Date.now(),plant:data.plant,date:$('date').value||today(),weather,stage,h:$('h').value===''?null:+$('h').value,leaf:$('leaf').value===''?null:+$('leaf').value,memo,img};
  data.recs.push(r);
  if(!persist()){data.recs.pop();return}
  $('saved').textContent='✅ ほぞん しました（'+data.recs.filter(x=>x.plant===data.plant).length+'まいめ）';
  $('memo').value='';$('h').value='';$('leaf').value='';stage='';drawS();blank();dirty=false;refresh();
};

function wIcon(t){const f=W.find(x=>x[1]===t);return f?f[0]:''}
function fmt(d){const p=d.split('-');return p.length===3?(+p[1])+'月'+(+p[2])+'日':d}
function refresh(){
  const list=data.recs.filter(r=>r.plant===data.plant).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
  $('bookTitle').textContent=(data.who?data.who+'さんの ':'')+data.plant+' かんさつカード（'+list.length+'まい）';
  $('cards').innerHTML=list.map(r=>`<div class="rec" data-id="${r.id}"><div class="d">${fmt(r.date)} ${wIcon(r.weather)} ${r.stage?'<span class="chip">'+r.stage+'</span>':''}</div>`+
    (r.img?`<img src="${r.img}" alt="え">`:'')+
    `<div class="note">${r.h!==null?'せの たかさ '+r.h+'cm　':''}${r.leaf!==null?'はっぱ '+r.leaf+'まい':''}</div><div class="memo">${esc(r.memo)}</div></div>`).join('')||'<div class="note">まだ カードが ありません。「かく」から つくろう。</div>';
  $('cards').querySelectorAll('.rec').forEach(el=>el.onclick=()=>{if(confirm('この カードを けしますか？')){data.recs=data.recs.filter(x=>x.id!==+el.dataset.id);persist();refresh()}});
  drawGraph(list);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function drawGraph(list){
  const pts=list.filter(r=>r.h!==null);
  $('gTitle').textContent=data.plant+' の せの たかさ';
  if(pts.length===0){$('gsv').innerHTML='<text x="350" y="180" text-anchor="middle" font-size="22" fill="#6b7280">せの たかさを いれると グラフに なるよ</text>';$('gNote').textContent='';return}
  const t0=new Date(pts[0].date).getTime(),t1=new Date(pts[pts.length-1].date).getTime();
  const span=Math.max(t1-t0,86400000);
  const maxH=Math.max(10,...pts.map(p=>p.h));const top=Math.ceil(maxH/10)*10;
  const L=70,R=670,T=20,B=310;
  let s='';
  for(let i=0;i<=5;i++){const v=top*i/5,y=B-(B-T)*i/5;s+=`<line x1="${L}" y1="${y}" x2="${R}" y2="${y}" stroke="#e5e7eb"/><text x="${L-8}" y="${y+6}" text-anchor="end" font-size="16" fill="#555">${Math.round(v*10)/10}</text>`}
  s+=`<text x="16" y="${T+4}" font-size="15" fill="#555">cm</text>`;
  const X=p=>pts.length===1?(L+R)/2:L+(R-L)*(new Date(p.date).getTime()-t0)/span;
  const Y=p=>B-(B-T)*p.h/top;
  s+=`<polyline points="${pts.map(p=>X(p)+','+Y(p)).join(' ')}" fill="none" stroke="#2e8b57" stroke-width="4"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${X(p)}" cy="${Y(p)}" r="7" fill="#2e8b57"/><text x="${X(p)}" y="${Y(p)-12}" text-anchor="middle" font-size="15" fill="#1f3a5f">${p.h}</text>`;
    if(i===0||i===pts.length-1||pts.length<=8)s+=`<text x="${X(p)}" y="${B+26}" text-anchor="middle" font-size="15" fill="#555">${fmt(p.date)}</text>`});
  $('gsv').innerHTML=s;
  const grow=pts[pts.length-1].h-pts[0].h,days=Math.round(span/86400000);
  $('gNote').textContent=pts.length>1?`${fmt(pts[0].date)}から ${days}日で ${Math.round(grow*10)/10}cm のびたよ。`:'つぎの きろくを いれると のびかたが わかるよ。';
}
$('printBtn').onclick=()=>window.print();

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  ['write','book','graph'].forEach(id=>$(id).classList.toggle('hide',t.dataset.t!==id));
}));
drawPlants();refresh();
})();
</script>
</body>
</html>
