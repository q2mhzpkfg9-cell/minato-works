<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>なわとびカード</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f6f1e7;color:#1f2a37;font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","BIZ UDPGothic","Meiryo",sans-serif;font-size:19px;line-height:1.6}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#1f3a5f;color:#fff}
header a.back{color:#fff;text-decoration:none;font-size:15px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:14px}
header h1{margin:0;font-size:clamp(20px,3.4vw,30px);letter-spacing:.05em}
main{max-width:1180px;margin:0 auto;padding:14px 16px 30px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(31,58,95,.08);margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab,.btn{border:2px solid #1f3a5f;background:#fff;color:#1f3a5f;border-radius:14px;padding:8px 16px;font-size:18px;font-family:inherit;cursor:pointer;min-height:48px}
.tab.on,.btn.on{background:#1f3a5f;color:#fff}
.btn.main{background:#e0a526;border-color:#e0a526;color:#fff;font-weight:bold}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
input[type=text],input[type=number],select{font-family:inherit;font-size:19px;border:2px solid #cfd8e6;border-radius:14px;padding:8px 12px;background:#fff;max-width:100%}
.lv{font-size:14px;border-radius:999px;padding:0 10px;color:#fff;display:inline-block}
.l1{background:#6d8f3c}.l2{background:#2f7d8f}.l3{background:#a0522d}.l4{background:#8f3c3c}
.techs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tech{border:2px solid #cfd8e6;border-radius:14px;padding:12px;background:#fffdf8}
.tech h3{margin:0 0 4px;font-size:21px;color:#1f3a5f}
.stamps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.st{width:50px;height:50px;border-radius:50%;border:2px dashed #cfd8e6;display:flex;align-items:center;justify-content:center;font-size:14px;color:#9aa3ad;text-align:center;line-height:1.1}
.st.got{border:3px solid #c8553d;color:#c8553d;background:#fff0ec;font-weight:bold;transform:rotate(-8deg)}
.best{font-size:16px;color:#6b7280}
.best b{color:#a4541a;font-size:22px}
.how{font-size:15px;color:#555}
.counter{width:min(340px,80vw);height:min(340px,80vw);border-radius:50%;border:none;background:#e0a526;color:#fff;font-size:clamp(70px,18vw,130px);font-weight:bold;font-family:inherit;cursor:pointer;display:block;margin:10px auto;box-shadow:0 8px 0 #b7841a;user-select:none;touch-action:manipulation}
.counter:active{transform:translateY(6px);box-shadow:0 2px 0 #b7841a}
.msg{font-size:24px;font-weight:bold;text-align:center;min-height:1.5em}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border-bottom:1px solid #e5e7eb;padding:6px;text-align:left}
th{background:#eef2f7;color:#1f3a5f}
.small{font-size:14px;color:#6b7280}
.hide{display:none}
footer{text-align:center;font-size:13px;color:#6b7280;padding:16px}
footer a{color:#1f3a5f}
@media print{header,.tabs,footer,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}.tech{break-inside:avoid}}
</style>
</head>
<body>
<header><a class="back" href="../index.html">← MINATO WORKS</a><h1>🪢 なわとびカード</h1></header>
<main>
  <div class="card noprint">
    <div class="row"><b>なまえ</b><input type="text" id="who" placeholder="なまえ（かかなくても よい）" style="width:240px"></div>
    <div class="small">きろくは この たんまつの 中だけに ほぞんされます。</div>
  </div>
  <div class="tabs">
    <button class="tab on" data-t="card">わざカード</button>
    <button class="tab" data-t="count">かぞえる</button>
    <button class="tab" data-t="log">きろく</button>
  </div>

  <section id="card">
    <div class="card">
      <div class="row" style="justify-content:space-between"><b id="title"></b><span><span id="total"></span> <button class="btn noprint" id="printBtn">いんさつ</button></span></div>
      <div class="techs" id="techs"></div>
    </div>
  </section>

  <section id="count" class="hide">
    <div class="card">
      <div class="row"><b>わざ</b><select id="ctech"></select></div>
      <div class="small">ともだちが とんでいる あいだ、1回とぶごとに 大きな ボタンを タップ。ひっかかったら「おわり」。</div>
      <button class="counter" id="tap">0</button>
      <div class="row" style="justify-content:center"><button class="btn" id="minus">−1</button><button class="btn" id="zero">0に もどす</button><button class="btn main" id="finish">おわり（きろく する）</button></div>
      <div class="msg" id="cmsg"></div>
    </div>
  </section>

  <section id="log" class="hide">
    <div class="card">
      <div class="row"><b>てで いれる</b><select id="ltech"></select><input type="number" id="lnum" min="0" max="9999" style="width:120px" placeholder="回">回<button class="btn main" id="ladd">きろく</button></div>
      <table><thead><tr><th>ひにち</th><th>わざ</th><th>回数</th><th></th></tr></thead><tbody id="ltbl"></tbody></table>
    </div>
  </section>
</main>
<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525">https://note.com/minato_smile2525</a></footer>

<script>
(function(){
const $=id=>document.getElementById(id);
const KEY='mw_教科_27_data';
const GOAL={1:[10,30,50,100,200],2:[5,10,20,30,50],3:[3,5,10,20,30],4:[1,3,5,10,20]};
const TECH=[
 {id:'mae',n:'前りょう足とび',l:1,h:'前まわしで、りょう足を そろえて とぶ。'},
 {id:'kake',n:'前かけ足とび',l:1,h:'かけ足のように 足を かわりばんこに 出して とぶ。'},
 {id:'ushiro',n:'後ろりょう足とび',l:1,h:'なわを 後ろに まわして とぶ。'},
 {id:'aya',n:'前あやとび',l:2,h:'1回ずつ、うでを こうさする とびと ふつうの とびを くりかえす。'},
 {id:'kosa',n:'前こうさとび',l:2,h:'うでを こうさしたまま つづけて とぶ。'},
 {id:'uaya',n:'後ろあやとび',l:3,h:'後ろまわしで あやとび。'},
 {id:'ukosa',n:'後ろこうさとび',l:3,h:'後ろまわしで、うでを こうさしたまま とぶ。'},
 {id:'nijyu',n:'二重とび',l:3,h:'1回 とぶ間に、なわを 2回 まわす。高く とんで 手首を はやく。'},
 {id:'hayabusa',n:'はやぶさ（あや二重とび）',l:4,h:'1回の ジャンプで、ふつうの まわしと こうさの まわしを する。'},
 {id:'unijyu',n:'後ろ二重とび',l:4,h:'後ろまわしで 二重とび。'},
 {id:'tsubame',n:'つばめ（こうさ二重とび）',l:4,h:'うでを こうさしたまま 二重とび。'}
];
let data={who:'',log:[]};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d)data=Object.assign(data,d)}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
$('who').value=data.who;$('who').oninput=()=>{data.who=$('who').value.slice(0,20);persist();drawCard()};
function best(id){return data.log.filter(x=>x.t===id).reduce((m,x)=>Math.max(m,x.c),0)}
function today(){const d=new Date();return (d.getMonth()+1)+'/'+d.getDate()}
function add(t,c){data.log.push({t,c,d:today(),ts:Date.now()});persist();drawAll()}
function drawCard(){
  $('title').textContent=(data.who?data.who+'さんの ':'')+'なわとびカード';
  let stamps=0;
  $('techs').innerHTML=TECH.map(t=>{
    const b=best(t.id),g=GOAL[t.l];const got=g.filter(v=>b>=v).length;stamps+=got;
    const next=g.find(v=>b<v);
    return `<div class="tech"><h3>${t.n}</h3><span class="lv l${t.l}">レベル${t.l}</span><div class="how">${t.h}</div>
      <div class="stamps">${g.map(v=>`<div class="st${b>=v?' got':''}">${b>=v?'合格<br>':''}${v}回</div>`).join('')}</div>
      <div class="best">さいこう <b>${b}</b> 回　${next?'つぎの めあて '+next+'回':'🏆 ぜんぶ 合格！'}</div></div>`}).join('');
  $('total').textContent='あつめた スタンプ '+stamps+' / '+TECH.length*5;
}
function opts(){return TECH.map(t=>`<option value="${t.id}">${t.n}</option>`).join('')}
$('ctech').innerHTML=opts();$('ltech').innerHTML=opts();
let cnt=0;
function showCnt(){$('tap').textContent=cnt}
$('tap').onclick=()=>{cnt++;showCnt();try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}};
$('minus').onclick=()=>{cnt=Math.max(0,cnt-1);showCnt()};
$('zero').onclick=()=>{cnt=0;showCnt();$('cmsg').textContent=''};
$('finish').onclick=()=>{
  if(!cnt)return;const id=$('ctech').value,t=TECH.find(x=>x.id===id);
  const before=best(id);add(id,cnt);
  const g=GOAL[t.l].filter(v=>cnt>=v&&before<v);
  $('cmsg').textContent=(cnt>before?'🎉 じこベスト！ ':'')+t.n+' '+cnt+'回'+(g.length?'　スタンプ '+g.map(v=>v+'回').join('・')+' 合格！':'');
  cnt=0;showCnt();
};
$('ladd').onclick=()=>{const n=parseInt($('lnum').value,10);if(!(n>=0))return;add($('ltech').value,Math.min(n,9999));$('lnum').value=''};
function drawLog(){
  const rows=data.log.slice().reverse().slice(0,100);
  $('ltbl').innerHTML=rows.map(x=>`<tr><td>${x.d}</td><td>${(TECH.find(t=>t.id===x.t)||{n:'?'}).n}</td><td>${x.c}回</td><td><button class="btn" data-ts="${x.ts}" style="min-height:36px;padding:2px 10px;font-size:15px">けす</button></td></tr>`).join('')||'<tr><td colspan="4" class="small">まだ きろくが ありません</td></tr>';
  $('ltbl').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(confirm('この きろくを けしますか？')){data.log=data.log.filter(x=>x.ts!==+b.dataset.ts);persist();drawAll()}});
}
function drawAll(){drawCard();drawLog()}
$('printBtn').onclick=()=>window.print();
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  ['card','count','log'].forEach(id=>$(id).classList.toggle('hide',t.dataset.t!==id));
}));
drawAll();
})();
</script>
</body>
</html>
