<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ことわざ・かんようく どうじょう</title>
<style>
:root{--bg:#f6f1e7;--card:#fff;--navy:#1f3a5f;--ink:#2b2b2b;--sub:#6b665c;--line:#e3dccd;--r:14px;--ok:#2e8b57;--ng:#c0392b;--gold:#d9a21b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.7}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--navy);color:#fff}
header a{color:#fff;text-decoration:none;font-weight:bold;font-size:.95rem;padding:6px 12px;border:1px solid rgba(255,255,255,.5);border-radius:10px}
header h1{font-size:1.25rem;margin:0}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
h2{font-size:1.1rem;color:var(--navy);margin:0 0 10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs+.tabs{margin-top:8px}
.tabs button,.btn{font-family:inherit;font-size:1.05rem;font-weight:bold;min-height:52px;padding:8px 14px;border-radius:var(--r);border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.tabs button{flex:1;min-width:110px}
.tabs button.on,.btn.main{background:var(--navy);color:#fff}
.btn:disabled{opacity:.4}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:bold;color:var(--sub)}
.q{font-size:clamp(1.3rem,4vw,2.2rem);text-align:center;margin:14px 0;line-height:1.8}
.q small{display:block;font-size:.55em;color:var(--sub)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{font-family:inherit;font-size:clamp(1rem,2.6vw,1.3rem);min-height:70px;padding:8px 12px;border-radius:var(--r);border:3px solid var(--line);background:#fffdf8;cursor:pointer;color:var(--ink);text-align:left}
.choices.short button{text-align:center;font-size:clamp(1.3rem,4vw,1.9rem)}
.choices button.ok{border-color:var(--ok);background:#e5f5ec}
.choices button.ng{border-color:var(--ng);background:#fbe9e7}
.msg{min-height:3em;text-align:center;font-size:1.1rem;font-weight:bold;margin-top:12px}
.msg.ok{color:var(--ok)}.msg.ng{color:var(--ng)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.zukan{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.item{border:2px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fffdf8}
.item.got{border-color:var(--gold)}
.item b{font-size:1.15rem;color:var(--navy)}
.item .y{font-size:.8rem;color:var(--sub)}
.item .ex{font-size:.9rem;color:var(--sub);margin-top:4px}
.star{color:var(--gold)}
.prog{height:14px;background:#eee6d6;border-radius:8px;overflow:hidden;margin:6px 0 12px}
.prog div{height:100%;background:var(--gold)}
.result{font-size:1.8rem;text-align:center;font-weight:bold;color:var(--navy)}
footer{text-align:center;font-size:.85rem;color:var(--sub);padding:20px 12px 30px}
footer a{color:var(--navy)}
@media(max-width:560px){.choices{grid-template-columns:1fr}}
</style>
</head>

</main>

    $('q').innerHTML='「'+it.w+'」<small>'+it.y+'</small>の いみは？';
    const others=shuffle(DATA[kind].filter(o=>o!==it)).slice(0,3).map(o=>o.m);
    opts=shuffle([it.m,...others]);ans=it.m;c.className='choices';
  }else{
    $('q').innerHTML=it.f.replace(/＿+/,'<b style="color:var(--navy)">（　？　）</b>')+'<small>いみ：'+it.m+'</small>';
    opts=shuffle([it.a,...it.x]);ans=it.a;c.className='choices short';
  }
  opts.forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>judge(b,o===ans);c.appendChild(b)});
}
function judge(b,ok){
  if(answered)return;const it=qs[qi];
  if(ok){answered=true;b.classList.add('ok');
    if(!miss){score++;const s=stars();s[it.w]=1;save('stars',s)}
    $('score').textContent='せいかい '+score;
    $('msg').className='msg ok';$('msg').innerHTML='せいかい！「'+it.w+'」<br><small>れい：'+it.e+'</small>';$('next').disabled=false;
  }else{miss=true;b.classList.add('ng');$('msg').className='msg ng';$('msg').textContent='ざんねん。もういちど かんがえてみよう。'}
}
$('next').onclick=()=>{qi++;if(qi<qs.length)show();else{
  $('q').innerHTML='<div class="result">'+qs.length+'もんちゅう '+score+'もん いっぱつ せいかい！</div>';
  $('choices').innerHTML='';const r=document.createElement('button');r.textContent='もういちど';r.onclick=start;$('choices').appendChild(r);$('msg').textContent='';$('next').disabled=true}};
function renderZukan(){
  const s=stars(),list=DATA[kind],got=list.filter(i=>s[i.w]).length;
  $('zt').textContent=(kind==='kotowaza'?'ことわざ':'かんようく')+' ずかん　'+got+' / '+list.length;
  $('pg').style.width=(got/list.length*100)+'%';
  $('zl').innerHTML=list.map(i=>'<div class="item'+(s[i.w]?' got':'')+'"><b>'+(s[i.w]?'<span class="star">★</span>':'')+i.w+'</b><div class="y">'+i.y+'</div><div>'+i.m+'</div><div class="ex">れい：'+i.e+'</div></div>').join('');
}
function tabs(id,fn){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b);start()})}
tabs('kinds',b=>kind=b.dataset.k);tabs('modes',b=>mode=b.dataset.m);
start();
</script>
