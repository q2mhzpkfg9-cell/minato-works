<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おんぷよみ けんばん</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f6f1e7;color:#1f2a37;font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","BIZ UDPGothic","Meiryo",sans-serif;font-size:19px;line-height:1.6}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#1f3a5f;color:#fff}
header a.back{color:#fff;text-decoration:none;font-size:15px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:14px}
header h1{margin:0;font-size:clamp(20px,3.4vw,30px);letter-spacing:.05em}
main{max-width:1180px;margin:0 auto;padding:14px 16px 30px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(31,58,95,.08);margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab,.btn{border:2px solid #1f3a5f;background:#fff;color:#1f3a5f;border-radius:14px;padding:8px 16px;font-size:18px;font-family:inherit;cursor:pointer;min-height:48px}
.tab.on,.btn.on{background:#1f3a5f;color:#fff}
.btn.main{background:#e0a526;border-color:#e0a526;color:#fff;font-weight:bold}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
svg.staff{width:100%;max-width:640px;height:auto;display:block;margin:0 auto;background:#fffdf8;border-radius:14px}
.kb{position:relative;display:flex;height:clamp(150px,28vw,230px);margin-top:10px;user-select:none;touch-action:manipulation}
.wk{flex:1;min-width:0;overflow:hidden;border:2px solid #333;border-left-width:1px;border-right-width:1px;background:#fff;border-radius:0 0 10px 10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:8px;cursor:pointer;font-weight:bold;color:#1f3a5f;font-size:clamp(13px,2.4vw,20px)}
.wk.down{background:#ffe9a8}
.wk.ok{background:#bfe6c9}.wk.ng{background:#f6c9bf}
.wk .oct{font-size:11px;color:#6b7280}
.bk{position:absolute;top:0;height:58%;background:#222;border-radius:0 0 6px 6px;pointer-events:none}
.msg{font-size:26px;font-weight:bold;text-align:center;min-height:1.5em}
.stat{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-weight:bold;color:#1f3a5f}
.small{font-size:14px;color:#6b7280}
.hide{display:none}
footer{text-align:center;font-size:13px;color:#6b7280;padding:16px}
footer a{color:#1f3a5f}
</style>
</head>
<body>
<header><a class="back" href="../index.html">← MINATO WORKS</a><h1>🎼 おんぷよみ けんばん</h1></header>
<main>
  <div class="tabs">
    <button class="tab on" data-t="quiz">よんで ひく</button>
    <button class="tab" data-t="free">じゆうに ひく</button>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="row"><b>はんい</b><span id="ranges" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
      <div class="row"><b>よびかた</b><button class="btn on" id="nmDo">ドレミ</button><button class="btn" id="nmHa">ハニホ</button>
        <button class="btn on" id="lblBtn">けんばんに 名前</button></div>
    </div>
    <div class="stat" id="stat"></div>
    <svg class="staff" id="staff" viewBox="0 0 600 240"></svg>
    <div class="msg" id="msg"></div>
    <div class="kb" id="kb"></div>
    <div class="row" style="justify-content:center"><button class="btn" id="again">🔊 もういちど きく</button><button class="btn main" id="start">10もん チャレンジ</button></div>
    <div class="small">ト音記号の 五線。いちばん下の 線が「ミ」、下に 線を 1本 たした（かせん）ところが「ド」。けんばんハーモニカ・リコーダーの 前に。</div>
  </div>
</main>
<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525">https://note.com/minato_smile2525</a></footer>

<script>
(function(){
const $=id=>document.getElementById(id);
const KEY='mw_教科_30_best';
// ド(C4)〜ソ(G5)：白けん12こ。step＝五線の いちばん下の線(E4)からの 位置
const DO=['ド','レ','ミ','ファ','ソ','ラ','シ'],HA=['ハ','ニ','ホ','ヘ','ト','イ','ロ'];
const MIDI=[0,2,4,5,7,9,11];
const NOTES=[];for(let i=0;i<12;i++){const k=i%7,o=Math.floor(i/7);NOTES.push({i,k,o,step:i-2,midi:60+12*o+MIDI[k]})}
const RANGES=[['a','ド〜ソ',0,4],['b','ド〜高いド',0,7],['c','ぜんぶ',0,11]];
let range='b',names='do',showLbl=true,mode='quiz',cur=null,q=0,ok=0,t0=0,inChallenge=false,best=null;
try{best=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const nm=n=>(names==='do'?DO:HA)[n.k]+(n.o?'（高）':'');
// 音
let ac=null;
function tone(midi){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const f=440*Math.pow(2,(midi-69)/12),t=ac.currentTime;
    const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();
    o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
    const g2=ac.createGain();g2.gain.value=0.15;o2.connect(g2).connect(g);o.connect(g).connect(ac.destination);
    o.start(t);o2.start(t);o.stop(t+1);o2.stop(t+1);}catch(e){}
}
// 五線
const Y0=170,SP=16; // E4の線のy、線の間の半分=SP/2... 線と線の間=SP
function yOf(step){return Y0-step*SP/2}
function drawStaff(note,color,label){
  let s='';
  for(let l=0;l<5;l++){const y=Y0-l*SP;s+=`<line x1="30" y1="${y}" x2="570" y2="${y}" stroke="#333" stroke-width="2"/>`}
  s+=`<text x="40" y="${Y0+22}" font-size="120" font-family="'Apple Symbols','Segoe UI Symbol','Noto Music','Noto Sans Symbols 2',serif" fill="#333">𝄞</text>`;
  if(note){
    const x=330,y=yOf(note.step);
    // かせん
    if(note.step<=-2)for(let st=-2;st>=note.step;st-=2)s+=`<line x1="${x-26}" y1="${yOf(st)}" x2="${x+26}" y2="${yOf(st)}" stroke="#333" stroke-width="2"/>`;
    if(note.step>=10)for(let st=10;st<=note.step;st+=2)s+=`<line x1="${x-26}" y1="${yOf(st)}" x2="${x+26}" y2="${yOf(st)}" stroke="#333" stroke-width="2"/>`;
    s+=`<ellipse cx="${x}" cy="${y}" rx="12" ry="8.5" transform="rotate(-20 ${x} ${y})" fill="${color||'#1f3a5f'}"/>`;
    // ぼう（第3線より上は下向き）
    s+=note.step>=4?`<line x1="${x-11}" y1="${y+2}" x2="${x-11}" y2="${y+56}" stroke="${color||'#1f3a5f'}" stroke-width="2.5"/>`:`<line x1="${x+11}" y1="${y-2}" x2="${x+11}" y2="${y-56}" stroke="${color||'#1f3a5f'}" stroke-width="2.5"/>`;
    if(label)s+=`<text x="${x+50}" y="${y+10}" font-size="30" font-weight="bold" fill="${color||'#1f3a5f'}">${label}</text>`;
  }
  $('staff').innerHTML=s;
}
// けんばん
function drawKb(){
  let h='';NOTES.forEach(n=>{h+=`<div class="wk" data-i="${n.i}">${showLbl?nm(n).replace('（高）','<span class="oct">（高）</span>'):''}</div>`});
  // 黒けん（ド#,レ#,ファ#,ソ#,ラ#）
  const w=100/12;[0,1,3,4,5,7,8,10].forEach(i=>{if(i>=11)return;h+=`<div class="bk" style="left:${(i+1)*w-w*0.3}%;width:${w*0.6}%"></div>`});
  $('kb').innerHTML=h;
  $('kb').querySelectorAll('.wk').forEach(k=>k.addEventListener('pointerdown',e=>{e.preventDefault();press(+k.dataset.i,k)}));
}
function flash(k,cls){k.classList.add(cls);setTimeout(()=>k.classList.remove(cls),350)}
function press(i,k){
  const n=NOTES[i];tone(n.midi);
  if(mode==='free'){drawStaff(n,'#1f3a5f',nm(n));$('msg').textContent=nm(n);flash(k,'down');return}
  if(!cur)return;
  if(i===cur.i){
    flash(k,'ok');drawStaff(cur,'#2e8b57',nm(cur));$('msg').textContent='⭕ '+nm(cur)+'！';$('msg').style.color='#2e8b57';
    if(inChallenge){ok++;q++;}
    const was=cur;cur=null;
    setTimeout(()=>{if(inChallenge&&q>=10)finish();else next(was)},650);
  }else{
    flash(k,'ng');$('msg').textContent='❌ それは '+nm(n)+'。もういちど';$('msg').style.color='#c8553d';
    if(inChallenge){q++;const was=cur;cur=null;drawStaff(was,'#c8553d',nm(was));setTimeout(()=>{if(q>=10)finish();else next(was)},1100)}
  }
  stat();
}
function pool(){const r=RANGES.find(x=>x[0]===range);return NOTES.filter(n=>n.i>=r[2]&&n.i<=r[3])}
function next(prev){
  const p=pool().filter(n=>!prev||n.i!==prev.i);cur=p[Math.floor(Math.random()*p.length)];
  drawStaff(cur);$('msg').textContent='この おんぷは どれ？';$('msg').style.color='#1f3a5f';stat();
}
function stat(){
  const b=best&&best[range]?`　さいこう：${best[range].ok}もん ${best[range].sec}びょう`:'';
  $('stat').textContent=inChallenge?`チャレンジ ${Math.min(q+1,10)}／10もん　せいかい ${ok}`:'れんしゅう'+b;
}
function finish(){
  inChallenge=false;const sec=Math.round((Date.now()-t0)/1000);
  best=best||{};const b=best[range];
  const nb=!b||ok>b.ok||(ok===b.ok&&sec<b.sec);
  if(nb){best[range]={ok,sec};try{localStorage.setItem(KEY,JSON.stringify(best))}catch(e){}}
  $('msg').textContent=`🏁 10もん中 ${ok}もん せいかい（${sec}びょう）${nb?' しんきろく！':''}`;$('msg').style.color='#a4541a';
  cur=null;stat();setTimeout(()=>{if(!inChallenge&&mode==='quiz')next()},2500);
}
$('start').onclick=()=>{mode='quiz';setTab();inChallenge=true;q=0;ok=0;t0=Date.now();next()};
$('again').onclick=()=>{if(cur)tone(cur.midi)};
function btnRanges(){$('ranges').innerHTML=RANGES.map(r=>`<button class="btn${r[0]===range?' on':''}" data-r="${r[0]}">${r[1]}</button>`).join(' ');
  $('ranges').querySelectorAll('button').forEach(b=>b.onclick=()=>{range=b.dataset.r;inChallenge=false;btnRanges();if(mode==='quiz')next();else stat()})}
$('nmDo').onclick=()=>{names='do';$('nmDo').classList.add('on');$('nmHa').classList.remove('on');drawKb()};
$('nmHa').onclick=()=>{names='ha';$('nmHa').classList.add('on');$('nmDo').classList.remove('on');drawKb()};
$('lblBtn').onclick=()=>{showLbl=!showLbl;$('lblBtn').classList.toggle('on',showLbl);drawKb()};
function setTab(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===mode))}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  mode=t.dataset.t;inChallenge=false;setTab();
  if(mode==='free'){cur=null;drawStaff(null);$('msg').textContent='けんばんを おすと 五線に おんぷが でるよ';$('msg').style.color='#1f3a5f';$('stat').textContent='じゆうに ひく'}
  else next();
}));
btnRanges();drawKb();next();
})();
</script>
</body>
</html>
