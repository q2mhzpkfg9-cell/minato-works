<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道徳 心情メーター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f6f1e7;color:#1f2a37;font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","BIZ UDPGothic","Meiryo",sans-serif;font-size:18px;line-height:1.6}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#1f3a5f;color:#fff}
header a.back{color:#fff;text-decoration:none;font-size:15px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:14px}
header h1{margin:0;font-size:clamp(20px,3.4vw,30px);letter-spacing:.05em}
main{max-width:1500px;margin:0 auto;padding:14px 16px 30px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(31,58,95,.08);margin-bottom:14px}
.btn{border:2px solid #1f3a5f;background:#fff;color:#1f3a5f;border-radius:14px;padding:6px 14px;font-size:17px;font-family:inherit;cursor:pointer;min-height:44px}
.btn.on{background:#1f3a5f;color:#fff}
.btn.main{background:#e0a526;border-color:#e0a526;color:#fff;font-weight:bold}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
input[type=text],input[type=number],textarea,select{font-family:inherit;font-size:17px;border:2px solid #cfd8e6;border-radius:14px;padding:6px 10px;background:#fff;max-width:100%}
textarea{width:100%;min-height:80px}
details summary{cursor:pointer;font-weight:bold;color:#1f3a5f}
.scenes{display:flex;gap:6px;flex-wrap:wrap}
.q{font-size:clamp(22px,2.6vw,34px);font-weight:bold;color:#1f3a5f;text-align:center;margin:4px 0}
.board{position:relative;background:#fffdf8;border-radius:14px;border:2px solid #e5dccb;padding:10px;user-select:none;touch-action:none}
.axis{position:relative;height:340px;margin:0 8px}
.axis .bg{position:absolute;left:0;right:0;top:150px;height:14px;border-radius:7px;background:linear-gradient(90deg,#5b7fb5,#e7e0cf,#e07a4e)}
.axis .tick{position:absolute;top:140px;width:2px;height:34px;background:#b9ad95}
.ends{display:flex;justify-content:space-between;font-size:clamp(20px,2.4vw,30px);font-weight:bold;margin:0 4px}
.ends .l{color:#3d5f94}.ends .r{color:#b8532b}
.mag{position:absolute;min-width:46px;height:46px;border-radius:23px;background:#1f3a5f;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;padding:0 8px;font-size:18px;cursor:grab;box-shadow:0 3px 6px rgba(0,0,0,.25);transform:translate(-50%,-50%);white-space:nowrap;touch-action:none}
.mag.memo:after{content:"💬";position:absolute;right:-10px;top:-12px;font-size:16px}
.mag.drag{cursor:grabbing;z-index:10;background:#e0a526}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:8px;border-radius:14px;background:#eef2f7;margin-top:8px}
.tray .mag{position:static;transform:none}
.hist{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;align-items:end;height:90px;margin:6px 8px 0}
.hist div{background:#cfd8e6;border-radius:4px 4px 0 0;min-height:2px}
.cmp{width:100%;border-collapse:collapse;font-size:15px}
.cmp td{padding:4px 6px;border-bottom:1px solid #eee;vertical-align:middle}
.dotline{position:relative;height:26px;background:#f3efe6;border-radius:13px}
.dotline span{position:absolute;top:5px;width:16px;height:16px;border-radius:50%;background:#1f3a5f;opacity:.55;transform:translateX(-50%)}
.dotline i{position:absolute;top:0;bottom:0;width:3px;background:#c8553d;transform:translateX(-50%)}
.small{font-size:14px;color:#6b7280}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{width:min(520px,100%)}
.hide{display:none!important}
footer{text-align:center;font-size:13px;color:#6b7280;padding:16px}
footer a{color:#1f3a5f}
</style>
</head>
<body>
<header><a class="back" href="../index.html">← MINATO WORKS</a><h1>🧭 道徳 心情メーター</h1></header>
<main>
  <div class="card">
    <div class="row"><b>授業</b><select id="lesson"></select><button class="btn" id="newLesson">＋ 新しい授業</button><button class="btn" id="delLesson">この授業を削除</button></div>
    <details id="setup">
      <summary>設定（教材名・人数・場面と両端のことば）</summary>
      <div class="row"><span>教材名</span><input type="text" id="title" style="width:320px"></div>
      <div class="row"><span>人数</span><input type="number" id="num" min="1" max="45" style="width:90px"> 人
        <span>名札の表示</span><select id="labelMode"><option value="num">出席番号</option><option value="name">名前（下に入力）</option></select></div>
      <textarea id="names" placeholder="名前を1行に1人（出席番号順）。空欄なら番号で表示します。"></textarea>
      <div class="small">名前は この端末の中だけに保存されます（外部には送信しません）。投影するときは番号表示がおすすめです。</div>
      <div id="sceneEdit" style="margin-top:10px"></div>
      <div class="row"><button class="btn" id="addScene">＋ 場面を追加</button><button class="btn main" id="applySetup">設定を反映</button></div>
    </details>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between"><div class="scenes" id="scenes"></div>
      <div class="row"><button class="btn" id="hideNames">名札をかくす</button><button class="btn" id="resetScene">この場面をリセット</button></div></div>
    <div class="q" id="question"></div>
    <div class="board" id="board">
      <div class="ends"><span class="l" id="endL"></span><span class="r" id="endR"></span></div>
      <div class="axis" id="axis"><div class="bg"></div></div>
      <div class="hist" id="hist"></div>
    </div>
    <div class="small">名札をドラッグしてメーターの上に置きます。名札をダブルクリック（長押し）すると、理由のメモが書けます。</div>
    <div class="tray" id="tray"></div>
  </div>

  <div class="card">
    <b>場面ごとの比較</b> <span class="small">（点＝一人一人、赤線＝平均。左 0 〜 右 100）</span>
    <table class="cmp" id="cmp"></table>
    <div class="row"><button class="btn" id="csv">CSVを書き出す</button><span class="small">評価の記録（所見）の参考に。</span></div>
  </div>
</main>

<div class="modal hide" id="memoBox"><div class="card">
  <b id="memoWho"></b>
  <textarea id="memoText" placeholder="理由・つぶやき（例：ほんとうは言いたかったけど、こわかったから）"></textarea>
  <div class="row"><button class="btn main" id="memoOk">保存</button><button class="btn" id="memoBack">名札をトレイに戻す</button><button class="btn" id="memoCancel">閉じる</button></div>
</div></div>

<footer>元小学校教員がつくった教室のためのアプリ ／ note「教室ノオト」 <a href="https://note.com/minato_smile2525">https://note.com/minato_smile2525</a></footer>

<script>
(function(){
const $=id=>document.getElementById(id);
const KEY='mw_教科_29_data';
function newLessonObj(){return{id:Date.now(),title:'（教材名）',num:30,labelMode:'num',names:'',
  scenes:[{q:'場面1　主人公は どんな気持ち？',l:'やりたくない',r:'やりたい',pos:{},memo:{}},{q:'場面2　主人公は どんな気持ち？',l:'迷っている',r:'決めた',pos:{},memo:{}}],cur:0}}
let db={lessons:[],cur:0};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.lessons&&d.lessons.length)db=d}catch(e){}
if(!db.lessons.length)db.lessons.push(newLessonObj());
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const L=()=>db.lessons[db.cur];
const S=()=>L().scenes[L().cur];
let hideNames=false;
function label(i){const l=L();if(hideNames)return'●';if(l.labelMode==='name'){const n=(l.names.split('\n')[i]||'').trim();if(n)return n}return String(i+1)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function drawLessons(){
  $('lesson').innerHTML=db.lessons.map((l,i)=>`<option value="${i}"${i===db.cur?' selected':''}>${esc(l.title)}</option>`).join('');
}
$('lesson').onchange=()=>{db.cur=+$('lesson').value;persist();loadSetup();drawAll()};
$('newLesson').onclick=()=>{const n=newLessonObj();n.num=L().num;n.names=L().names;n.labelMode=L().labelMode;db.lessons.push(n);db.cur=db.lessons.length-1;persist();loadSetup();drawAll();$('setup').open=true};
$('delLesson').onclick=()=>{if(!confirm('この授業の記録を削除しますか？'))return;db.lessons.splice(db.cur,1);if(!db.lessons.length)db.lessons.push(newLessonObj());db.cur=0;persist();loadSetup();drawAll()};

// 設定
let editScenes=[];
function loadSetup(){const l=L();$('title').value=l.title;$('num').value=l.num;$('labelMode').value=l.labelMode;$('names').value=l.names;editScenes=l.scenes.map(s=>({q:s.q,l:s.l,r:s.r}));drawSceneEdit()}
function drawSceneEdit(){
  $('sceneEdit').innerHTML=editScenes.map((s,i)=>`<div class="row" data-i="${i}"><b>場面${i+1}</b><input type="text" class="eq" value="${esc(s.q)}" style="flex:1;min-width:220px" placeholder="発問"><input type="text" class="el" value="${esc(s.l)}" style="width:150px" placeholder="左のことば"><span>←→</span><input type="text" class="er" value="${esc(s.r)}" style="width:150px" placeholder="右のことば"><button class="btn" data-del="${i}">削除</button></div>`).join('');
  $('sceneEdit').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{readEdit();if(editScenes.length>1){editScenes.splice(+b.dataset.del,1);drawSceneEdit()}});
}
function readEdit(){$('sceneEdit').querySelectorAll('.row').forEach(r=>{const i=+r.dataset.i;editScenes[i]={q:r.querySelector('.eq').value,l:r.querySelector('.el').value,r:r.querySelector('.er').value}})}
$('addScene').onclick=()=>{readEdit();editScenes.push({q:'場面'+(editScenes.length+1)+'　',l:'かなしい',r:'うれしい'});drawSceneEdit()};
$('applySetup').onclick=()=>{
  readEdit();const l=L();
  l.title=$('title').value.trim()||'（教材名）';l.num=Math.max(1,Math.min(45,parseInt($('num').value,10)||30));
  l.labelMode=$('labelMode').value;l.names=$('names').value;
  l.scenes=editScenes.map((s,i)=>{const old=l.scenes[i]||{pos:{},memo:{}};return{q:s.q,l:s.l,r:s.r,pos:old.pos||{},memo:old.memo||{}}});
  if(l.cur>=l.scenes.length)l.cur=0;
  persist();drawAll();$('setup').open=false;
};
$('hideNames').onclick=()=>{hideNames=!hideNames;$('hideNames').classList.toggle('on',hideNames);drawBoard()};
$('resetScene').onclick=()=>{if(confirm('この場面の名札をすべてトレイに戻しますか？')){S().pos={};S().memo={};persist();drawAll()}};

// ボード
function drawScenes(){
  $('scenes').innerHTML=L().scenes.map((s,i)=>`<button class="btn${i===L().cur?' on':''}" data-i="${i}">場面${i+1}</button>`).join('');
  $('scenes').querySelectorAll('button').forEach(b=>b.onclick=()=>{L().cur=+b.dataset.i;persist();drawAll()});
}
function drawBoard(){
  const s=S(),l=L();
  $('question').textContent=s.q;$('endL').textContent='← '+s.l;$('endR').textContent=s.r+' →';
  const ax=$('axis');ax.querySelectorAll('.mag,.tick').forEach(e=>e.remove());
  for(let t=0;t<=10;t++){const d=document.createElement('div');d.className='tick';d.style.left=t*10+'%';ax.appendChild(d)}
  $('tray').innerHTML='';
  for(let i=0;i<l.num;i++){
    const m=document.createElement('div');m.className='mag'+(s.memo[i]?' memo':'');m.textContent=label(i);m.dataset.i=i;
    const p=s.pos[i];
    if(p){m.style.left=p.x+'%';m.style.top=p.y+'px';ax.appendChild(m)}else $('tray').appendChild(m);
    bindDrag(m);
  }
  // ヒストグラム
  const bins=new Array(10).fill(0);Object.values(s.pos).forEach(p=>bins[Math.min(9,Math.floor(p.x/10))]++);
  const mx=Math.max(1,...bins);
  $('hist').innerHTML=bins.map((b,i)=>`<div style="height:${b/mx*100}%;background:${i<5?'#8fa7cc':'#e8a07f'}" title="${b}人"></div>`).join('');
}
let drag=null;
function bindDrag(m){
  let pressT=null,moved=false;
  m.addEventListener('pointerdown',e=>{
    e.preventDefault();moved=false;
    const r=m.getBoundingClientRect();
    drag={m,i:+m.dataset.i,ox:e.clientX-(r.left+r.width/2),oy:e.clientY-(r.top+r.height/2)};
    m.setPointerCapture(e.pointerId);
    pressT=setTimeout(()=>{if(!moved){openMemo(drag?drag.i:+m.dataset.i);drag=null}},650);
  });
  m.addEventListener('pointermove',e=>{
    if(!drag||drag.m!==m)return;
    if(!moved&&Math.hypot(e.movementX,e.movementY)<1)return;
    moved=true;clearTimeout(pressT);
    if(m.parentElement!==document.body){m.style.position='fixed';document.body.appendChild(m)}
    m.classList.add('drag');m.style.transform='translate(-50%,-50%)';
    m.style.left=(e.clientX-drag.ox)+'px';m.style.top=(e.clientY-drag.oy)+'px';
  });
  const end=e=>{
    clearTimeout(pressT);
    if(!drag||drag.m!==m)return;
    const i=drag.i;drag=null;
    if(!moved)return;
    const ar=$('axis').getBoundingClientRect(),br=$('board').getBoundingClientRect();
    const cx=parseFloat(m.style.left),cy=parseFloat(m.style.top);
    if(cx>=br.left&&cx<=br.right&&cy>=br.top&&cy<=br.bottom){
      const x=Math.max(0,Math.min(100,(cx-ar.left)/ar.width*100));
      const y=Math.max(20,Math.min(ar.height-20,cy-ar.top));
      S().pos[i]={x:Math.round(x*10)/10,y:Math.round(y)};
    }else delete S().pos[i];
    persist();m.remove();drawBoard();drawCmp();
  };
  m.addEventListener('pointerup',end);m.addEventListener('pointercancel',end);
  m.addEventListener('dblclick',()=>openMemo(+m.dataset.i));
}
let memoI=null;
function openMemo(i){memoI=i;$('memoWho').textContent=(L().labelMode==='name'&&(L().names.split('\n')[i]||'').trim()?(L().names.split('\n')[i]).trim():(i+1)+'番')+'　'+S().q;$('memoText').value=S().memo[i]||'';$('memoBox').classList.remove('hide');$('memoText').focus()}
$('memoOk').onclick=()=>{const t=$('memoText').value.trim();if(t)S().memo[memoI]=t;else delete S().memo[memoI];persist();$('memoBox').classList.add('hide');drawBoard()};
$('memoBack').onclick=()=>{delete S().pos[memoI];persist();$('memoBox').classList.add('hide');drawBoard();drawCmp()};
$('memoCancel').onclick=()=>$('memoBox').classList.add('hide');

function drawCmp(){
  const l=L();
  $('cmp').innerHTML=l.scenes.map((s,i)=>{
    const xs=Object.values(s.pos).map(p=>p.x);const avg=xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null;
    return `<tr><td style="width:34%"><b>場面${i+1}</b> ${esc(s.q)}<br><span class="small">${esc(s.l)} ←→ ${esc(s.r)}</span></td><td><div class="dotline">${xs.map(x=>`<span style="left:${x}%"></span>`).join('')}${avg!==null?`<i style="left:${avg}%"></i>`:''}</div></td><td style="width:90px;text-align:right">${xs.length}人<br>${avg!==null?'平均'+Math.round(avg):''}</td></tr>`}).join('');
}
$('csv').onclick=()=>{
  const l=L();const rows=[['番号','名前'].concat(l.scenes.flatMap((s,i)=>['場面'+(i+1)+'('+s.l+'0-'+s.r+'100)','場面'+(i+1)+'メモ']))];
  for(let i=0;i<l.num;i++){const nm=(l.names.split('\n')[i]||'').trim();rows.push([i+1,nm].concat(l.scenes.flatMap(s=>[s.pos[i]?Math.round(s.pos[i].x):'',s.memo[i]||''])))}
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=l.title+'_心情メーター.csv';a.click();
};
function drawAll(){drawLessons();drawScenes();drawBoard();drawCmp()}
window.addEventListener('resize',()=>drawBoard());
loadSetup();drawAll();
})();
</script>
</body>
</html>
